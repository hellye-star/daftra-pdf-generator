      ? '<table class="pdf-table"><thead><tr>'
        + '<th>Date<small class="ar" dir="rtl">التاريخ</small></th>'
        + '<th>Ref / Invoice No.<small class="ar" dir="rtl">رقم المرجع أو الفاتورة</small></th>'
        + '<th>Supplier<small class="ar" dir="rtl">المورد</small></th>'
        + '<th class="val">Net<small class="ar" dir="rtl">المبلغ قبل الضريبة</small></th>'
        + '<th class="val">VAT<small class="ar" dir="rtl">مبلغ الضريبة إن وجد</small></th>'
        + '<th class="val">Gross<small class="ar" dir="rtl">الإجمالي</small></th>'
        + '<th>Status<small class="ar" dir="rtl">الحالة</small></th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="pdf-empty">No Personal Transfer records in the selected period. <span class="ar" dir="rtl">لا توجد تحويلات شخصية في الفترة المحددة.</span></div>')

    + (zeroVatCount > 0
      ? '<div class="pdf-meta-line">Zero-VAT Personal Transfer records (informational only): ' + zeroVatCount
        + '<span class="ar" dir="rtl"> — عدد التحويلات الشخصية بدون ضريبة (للعلم فقط): ' + zeroVatCount + '</span></div>'
      : '')

    + '<div class="pdf-foot">'
    + '<div>Internal management report only — not for ZATCA VAT-return submission. Draft records are shown for reference and excluded from all totals above. '
    + 'Displayed totals are rounded to 2 decimal places for presentation; all calculations use full source precision before final rounding.</div>'
    + '<div class="ar" dir="rtl">تقرير إداري داخلي فقط — غير مخصص للتقديم ضمن إقرار ضريبة القيمة المضافة. تُعرض السجلات غير النهائية (المسودات) للمرجعية فقط وتُستبعد من جميع الإجماليات أعلاه. '
    + 'المبالغ المعروضة مقربة إلى منزلتين عشريتين لأغراض العرض؛ تُجرى جميع الحسابات باستخدام الدقة الكاملة للمصدر قبل التقريب النهائي.</div>'
    + '</div>';
}

function buildPersonalTransfersPdfDocument(model) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8" />'
    + '<title>' + esc(vatExportFilename(model, 'pdf', 'personal')) + '</title>'
    + '<style>' + buildVatPdfStyles() + '</style>'
    + '</head><body>'
    + buildPersonalTransfersPdfHtml(model)
    + '</body></html>';
}

// Lighter validation than exportVatPreflight — this report only depends on purchase
// invoices (the source of Personal Transfer records), not sales/expenses/net VAT.
function personalTransfersPreflight() {
  var model = buildVatExportModel();
  if (!model) {
    alert('No data loaded. Press Fetch Data first.');
    return null;
  }
  if (model.purError) {
    alert('Cannot export Personal Transfers report:\n\n- Purchase invoices endpoint failed: ' + model.purError + '\n\nResolve the data issue and press Fetch Data again.');
    return null;
  }
  var warnings = [];
  if (model.rawPurMeta && (model.rawPurMeta.capHit || model.rawPurMeta.incomplete)) {
    warnings.push('Purchase invoices: pagination incomplete — Personal Transfer totals may be understated.');
  }
  if (warnings.length) {
    var proceed = confirm('Data-quality warnings for this export:\n\n- ' + warnings.join('\n- ') + '\n\nContinue?');
    if (!proceed) return null;
  }
  model.warningsForExport = warnings;
  return model;
}

function exportPersonalTransfersPdf() {
  var model = personalTransfersPreflight();
  if (!model) return;

  var printWin = window.open('', '_blank', 'width=900,height=1000');
  if (!printWin) {
    alert('The print window was blocked by your browser.\n\nPlease allow popups for this page and click the export button again.');
    return;
  }

  printWin.document.open();
  printWin.document.write(buildPersonalTransfersPdfDocument(model));
  printWin.document.close();

  printWin.onload = function() {
    setTimeout(function() {
      printWin.focus();
      printWin.print();
    }, 300);
  };
}

function renderReceivablesPanel(sales, label) {
  var allRecs = sales.allUnpaidRecords;
  var perRecs = sales.perUnpaidRecords;

  function recvList(recs) {
    if (!recs.length) {
      return '<div class="recv-empty">No outstanding invoices.</div>';
    }
    var shown = recs.slice(0, 10);
    var more  = recs.length - shown.length;
    var rows  = shown.map(function(r) {
      var client = esc(r.client_name || r.client_business_name || '—');
      var date   = esc(r.date || '—');
      var amt    = esc(fmtCurrency(toNum(r.summary_unpaid)));
      return '<div class="recv-row">'
        + '<span class="recv-date">' + date + '</span>'
        + '<span class="recv-client">' + client + '</span>'
        + '<span class="recv-amount">' + amt + '</span>'
        + '</div>';
    }).join('');
    var moreHtml = more > 0 ? '<div class="recv-more">and ' + more + ' more</div>' : '';
    return '<div class="recv-rows">' + rows + '</div>' + moreHtml;
  }

  return '<div class="panel">'
    + '<div class="panel-title">Receivables</div>'
    + '<div class="recv-section">'
    + '<div class="recv-section-title">All-time outstanding (all unpaid invoices, regardless of selected period)</div>'
    + '<div class="recv-summary">'
    + allRecs.length + ' unpaid invoice' + (allRecs.length !== 1 ? 's' : '') + ' · '
    + '<strong>' + esc(fmtCurrency(sales.allUnpaidTotal)) + '</strong> total outstanding'
    + '</div>'
    + recvList(allRecs)
    + '</div>'
    + '<hr class="recv-divider" />'
    + '<div class="recv-section">'
    + '<div class="recv-section-title">Outstanding in selected period — ' + esc(label) + '</div>'
    + '<div class="recv-summary">'
    + perRecs.length + ' unpaid invoice' + (perRecs.length !== 1 ? 's' : '') + ' · '
    + '<strong>' + esc(fmtCurrency(sales.perUnpaidTotal)) + '</strong> outstanding in period'
    + '</div>'
    + recvList(perRecs)
    + '</div>'
    + '</div>';
}

// ── Personal Transfers section ─────────────────────────────────────────────
// Shows all purchase invoices classified as personal transfers.
// These records are EXCLUDED from every business metric on this dashboard.

function renderPersonalTransfersSection(personalRecords, purError) {
  var sectionHtml;

  if (purError) {
    sectionHtml = '<div class="personal-empty">Purchase invoices endpoint failed — cannot display personal transfers.</div>';
  } else {
    // Active (non-draft) records only, sorted newest first
    var active = personalRecords.filter(function(r) { return r.draft !== '1'; });
    var sorted = active.slice().sort(function(a, b) {
      return (b.date || '').localeCompare(a.date || '');
    });

    if (!sorted.length) {
      sectionHtml = '<div class="personal-empty">No personal transfer records found in the loaded data.</div>';
    } else {
      var totalExVAT  = sorted.reduce(function(s, r) { return s + toNum(r.summary_subtotal); }, 0);
      var totalIncVAT = sorted.reduce(function(s, r) { return s + toNum(r.summary_total);    }, 0);
      var totalVAT    = totalIncVAT - totalExVAT;

      var rows = sorted.map(function(r) {
        return '<tr>'
          + '<td>' + esc(r.no || r.number || r.id || '—') + '</td>'
          + '<td>' + esc(r.date   || '—') + '</td>'
          + '<td>' + esc(fmtCurrency(toNum(r.summary_subtotal))) + '</td>'
          + '<td>' + esc(fmtCurrency(toNum(r.summary_total)))    + '</td>'
          + '</tr>';
      }).join('');

      var vatLine = totalVAT > 0.005
        ? 'Total derived VAT: ' + esc(fmtCurrency(totalVAT)) + '.'
        : 'Derived VAT: SAR 0.00 on all records (total = subtotal).';

      sectionHtml = '<table class="personal-table">'
        + '<thead><tr>'
        + '<th>Ref No.</th><th>Date</th>'
        + '<th>Amount (ex-VAT)</th><th>Amount (inc-VAT)</th>'
        + '</tr></thead>'
        + '<tbody>'
        + rows
        + '<tr class="personal-total-row">'
        + '<td colspan="2">Total (' + sorted.length + ' record' + (sorted.length !== 1 ? 's' : '') + ')</td>'
        + '<td>' + esc(fmtCurrency(totalExVAT))  + '</td>'
        + '<td>' + esc(fmtCurrency(totalIncVAT)) + '</td>'
        + '</tr>'
        + '</tbody></table>'
        + '<div class="personal-note">'
        + esc(vatLine)
        + ' These records are visible here for reference only and are not included in '
        + 'business profit, VAT reconciliation, monthly charts, or any other calculation on this dashboard.'
        + '</div>';
    }
  }

  var subLine = purError
    ? 'Purchase invoices classified as Personal Transfers.'
    : (personalRecords.filter(function(r){return r.draft!=='1';}).length)
      + ' record(s) identified by supplier name “Personal Transfer” · '
      + 'Excluded from all business calculations.';

  return '<div class="personal-section">'
    + '<div class="personal-section-title">Personal Transfers</div>'
    + '<div class="personal-section-sub">' + esc(subLine) + '</div>'
    + sectionHtml
    + '</div>';
}

function renderHealthPanel(invRecords, invError, invRange, purRecords, purError, purRange, expRecords, expError, expRange, sales, purch, exp) {
  function cell(label, records, error, range, missingDate, meta) {
    if (error) {
      return '<div class="health-cell error">'
        + '<div class="health-cell-label">' + esc(label) + '</div>'
        + '<div class="error-msg">' + esc(error) + '</div>'
        + '</div>';
    }

    var isIncomplete = meta && (meta.capHit || meta.incomplete);
    var cls = isIncomplete ? 'warn' : records.length === 0 ? 'warn' : 'ok';

    var totalStr  = (meta && meta.totalResults) ? (' of ' + meta.totalResults) : '';
    var note      = records.length === 0
      ? 'No records returned'
      : records.length + totalStr + ' record' + (records.length !== 1 ? 's' : '') + ' loaded';
    var pagesNote = meta ? meta.pagesLoaded + ' page' + (meta.pagesLoaded !== 1 ? 's' : '') + ' fetched' : '';
    var detail    = range ? 'Date range: ' + esc(range.min) + ' → ' + esc(range.max) : '';
    var active    = records.filter(function(r) { return r.draft !== '1'; }).length;
    var drafts    = records.length - active;
    var draftNote = drafts > 0 ? drafts + ' draft' + (drafts !== 1 ? 's' : '') + ' excluded from calculations.' : '';
    var missNote  = missingDate > 0 ? missingDate + ' record' + (missingDate !== 1 ? 's' : '') + ' excluded — no parseable date.' : '';
    var warnNote  = '';
    if (meta && meta.capHit) {
      warnNote = 'Record limit reached. Totals may be incomplete.';
    } else if (meta && meta.incomplete) {
      warnNote = 'Fetch incomplete — totals may be understated.'
        + (meta.incompleteError ? ' (' + esc(meta.incompleteError) + ')' : '');
    }

    return '<div class="health-cell ' + cls + '">'
      + '<div class="health-cell-label">' + esc(label) + '</div>'
      + '<div class="health-cell-value">' + esc(note) + '</div>'
      + (pagesNote ? '<div class="health-cell-detail">' + esc(pagesNote) + '</div>' : '')
      + (detail    ? '<div class="health-cell-detail">' + detail + '</div>' : '')
      + (draftNote ? '<div class="health-cell-detail">' + esc(draftNote) + '</div>' : '')
      + (missNote  ? '<div class="health-cell-detail" style="color:var(--warn)">' + esc(missNote) + '</div>' : '')
      + (warnNote  ? '<div class="health-cell-detail" style="color:var(--warn);font-weight:500">' + warnNote + '</div>' : '')
      + '</div>';
  }

  return '<div class="panel">'
    + '<div class="panel-title">Data Health</div>'
    + '<div class="health-grid">'
    + cell('Invoices',          invRecords, invError, invRange, sales ? sales.missingDate : 0, rawInvMeta)
    + cell('Purchase Invoices', purRecords, purError, purRange, purch ? purch.missingDate : 0, rawPurMeta)
    + cell('Expenses',          expRecords, expError, expRange, exp   ? exp.missingDate   : 0, rawExpMeta)
    + '</div>'
    + '</div>';
}

// ── Monthly report helpers ─────────────────────────────────────────────────

var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function expExVATForRecord(r) {
  var amt = toNum(r.amount);
  var tax = toNum(r.tax1_amount);
  return r.tax1_included === '0' ? amt : amt - tax;
}

function groupByMonth(records, year, amountFn) {
  var result = {};
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    if (r.draft === '1') continue;
    var d = parseDate(r.date);
    if (!d || d.getFullYear() !== year) continue;
    var key = year + '-' + String(d.getMonth() + 1).padStart(2, '0');
    result[key] = (result[key] || 0) + amountFn(r);
  }
  return result;
}

// purRecords must be business-only (personal transfers excluded by caller).
function buildMonthlyTable(year, invRecords, invError, purRecords, purError, expRecords, expError) {
  var salesByM  = invError ? null : groupByMonth(invRecords, year, function(r) { return toNum(r.summary_subtotal); });
  var outVByM   = invError ? null : groupByMonth(invRecords, year, function(r) { return toNum(r.summary_total) - toNum(r.summary_subtotal); });
  var purchByM  = purError ? null : groupByMonth(purRecords, year, function(r) { return toNum(r.summary_subtotal); });
  var inVPurByM = purError ? null : groupByMonth(purRecords, year, function(r) { return toNum(r.summary_total) - toNum(r.summary_subtotal); });
  var expByM    = expError ? null : groupByMonth(expRecords, year, expExVATForRecord);
  var inVExpByM = expError ? null : groupByMonth(expRecords, year, function(r) { return toNum(r.tax1_amount); });

  var rows = [];
  for (var m = 0; m < 12; m++) {
    var key     = year + '-' + String(m + 1).padStart(2, '0');
    var salesEx = salesByM  ? (salesByM[key]  || 0) : null;
    var outVAT  = outVByM   ? (outVByM[key]   || 0) : null;
    var purchEx = purchByM  ? (purchByM[key]  || 0) : null;
    var inVPur  = inVPurByM ? (inVPurByM[key] || 0) : null;
    var expEx   = expByM    ? (expByM[key]    || 0) : null;
    var inVExp  = inVExpByM ? (inVExpByM[key] || 0) : null;

    var profit = (salesEx !== null && purchEx !== null && expEx !== null)
                 ? (salesEx - purchEx - expEx) : null;
    var vatPos = (outVAT !== null && inVPur !== null && inVExp !== null)
                 ? (outVAT - inVPur - inVExp) : null;

    var hasData = (salesEx !== null && salesEx > 0.001)
               || (purchEx !== null && purchEx > 0.001)
               || (expEx   !== null && Math.abs(expEx) > 0.001);

    rows.push({
      month: MONTH_ABBR[m], monthKey: key,
      salesEx: salesEx, purchEx: purchEx, expEx: expEx,
      profit: profit, vatPos: vatPos, hasData: hasData,
    });
  }
  return rows;
}

function maxValMonthly(rows, fields) {
  var max = 0;
  for (var i = 0; i < rows.length; i++) {
    for (var j = 0; j < fields.length; j++) {
      var v = rows[i][fields[j]];
      if (v !== null && v > max) max = v;
    }
  }
  return max > 0 ? max : 1;
}

// ── Monthly render functions ───────────────────────────────────────────────

function renderMonthlyChartPanel(rows, invError, purError, expError, year) {
  var scaleFields = [];
  if (!invError) scaleFields.push('salesEx');
  if (!purError) scaleFields.push('purchEx');
  if (!expError) scaleFields.push('expEx');

  var maxv = scaleFields.length ? maxValMonthly(rows, scaleFields) : 1;

  function barPct(val) {
    if (val === null || val <= 0) return 0;
    return Math.round((val / maxv) * 100);
  }

  var cols = rows.map(function(row) {
    var salesBar = invError ? '' :
      '<div class="bar sales" style="height:' + barPct(row.salesEx) + '%"'
      + ' title="Sales ' + row.month + ': ' + fmtCurrency(row.salesEx || 0) + '"></div>';
    var purchBar = purError ? '' :
      '<div class="bar purch" style="height:' + barPct(row.purchEx) + '%"'
      + ' title="Business Purchases ' + row.month + ': ' + fmtCurrency(row.purchEx || 0) + '"></div>';
    var expBar = expError ? '' :
      '<div class="bar exp" style="height:' + barPct(row.expEx) + '%"'
      + ' title="Expenses ' + row.month + ': ' + fmtCurrency(row.expEx || 0) + '"></div>';
    return '<div class="chart-col">'
      + '<div class="chart-bars">' + salesBar + purchBar + expBar + '</div>'
      + '<div class="chart-label">' + esc(row.month) + '</div>'
      + '</div>';
  }).join('');

  var legendItems = [];
  if (!invError) legendItems.push('<span class="chart-legend-item"><span class="chart-legend-dot sales"></span>Sales</span>');
  if (!purError) legendItems.push('<span class="chart-legend-item"><span class="chart-legend-dot purch"></span>Business Purchases</span>');
  if (!expError) legendItems.push('<span class="chart-legend-item"><span class="chart-legend-dot exp"></span>Expenses</span>');

  var failedNotes = [];
  if (invError) failedNotes.push('Invoices endpoint failed — Sales unavailable.');
  if (purError) failedNotes.push('Purchases endpoint failed — Purchases unavailable.');
  if (expError) failedNotes.push('Expenses endpoint failed — Expenses unavailable.');

  return '<div class="panel">'
    + '<div class="panel-title">Monthly Comparison — ' + esc(String(year)) + '</div>'
    + '<div class="chart-note">Full year view · ex-VAT · business purchases only (personal transfers excluded) · not filtered by selected period</div>'
    + '<div class="chart-wrap"><div class="chart-grid">' + cols + '</div></div>'
    + '<div class="chart-legend">' + legendItems.join('') + '</div>'
    + (failedNotes.length ? '<div class="chart-failed-note">' + failedNotes.map(esc).join(' ') + '</div>' : '')
    + '</div>';
}

function renderMonthlyTablePanel(rows, invError, purError, expError, year) {
  function valCell(val, error, hasData) {
    if (!hasData) return '<td class="dash-cell">&#8212;</td>';
    if (error)    return '<td class="na-cell">N/A</td>';
    return '<td>' + esc(fmtCurrency(val || 0)) + '</td>';
  }
  function profitCell(row) {
    if (!row.hasData)        return '<td class="dash-cell">&#8212;</td>';
    if (row.profit === null) return '<td class="na-cell">N/A</td>';
    var cls = row.profit >= 0 ? 'val-positive' : 'val-negative';
    return '<td class="' + cls + '">' + esc(fmtCurrency(row.profit)) + '</td>';
  }
  function vatCell(row) {
    if (!row.hasData)        return '<td class="dash-cell">&#8212;</td>';
    if (row.vatPos === null) return '<td class="na-cell">N/A</td>';
    var cls = row.vatPos > 0.005 ? 'val-payable' : row.vatPos < -0.005 ? 'val-reclaimable' : '';
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(fmtCurrency(row.vatPos)) + '</td>';
  }

  var dataRows = rows.map(function(row) {
    return '<tr>'
      + '<td>' + esc(row.month) + '</td>'
      + valCell(row.salesEx, invError, row.hasData)
      + valCell(row.purchEx, purError, row.hasData)
      + valCell(row.expEx,   expError, row.hasData)
      + profitCell(row)
      + vatCell(row)
      + '</tr>';
  }).join('');

  var totSales  = invError ? null : rows.reduce(function(s, r) { return s + (r.salesEx || 0); }, 0);
  var totPurch  = purError ? null : rows.reduce(function(s, r) { return s + (r.purchEx || 0); }, 0);
  var totExp    = expError ? null : rows.reduce(function(s, r) { return s + (r.expEx   || 0); }, 0);
  var totProfit = (totSales !== null && totPurch !== null && totExp !== null) ? totSales - totPurch - totExp : null;
  var totVAT    = (invError || purError || expError) ? null : rows.reduce(function(s, r) { return s + (r.vatPos || 0); }, 0);

  function totCell(val, error) {
    if (error || val === null) return '<td class="na-cell">N/A</td>';
    return '<td>' + esc(fmtCurrency(val)) + '</td>';
  }
  function totProfitCell() {
    if (totProfit === null) return '<td class="na-cell">N/A</td>';
    var cls = totProfit >= 0 ? 'val-positive' : 'val-negative';
    return '<td class="' + cls + '">' + esc(fmtCurrency(totProfit)) + '</td>';
  }
  function totVATCell() {
    if (totVAT === null) return '<td class="na-cell">N/A</td>';
    var cls = totVAT > 0.005 ? 'val-payable' : totVAT < -0.005 ? 'val-reclaimable' : '';
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(fmtCurrency(totVAT)) + '</td>';
  }

  var totalRow = '<tr class="total-row">'
    + '<td>Total ' + esc(String(year)) + '</td>'
    + totCell(totSales, invError) + totCell(totPurch, purError) + totCell(totExp, expError)
    + totProfitCell() + totVATCell()
    + '</tr>';

  return '<div class="panel">'
    + '<div class="panel-title">Monthly Breakdown — ' + esc(String(year)) + '</div>'
    + '<div class="chart-note">Full year view · ex-VAT · business purchases only (personal transfers excluded) · not filtered by selected period</div>'
    + '<table class="monthly-table">'
    + '<thead><tr>'
    + '<th>Month</th>'
    + '<th>Sales (ex-VAT)</th>'
    + '<th>Bus. Purchases (ex-VAT)</th>'
    + '<th>Expenses (ex-VAT)</th>'
    + '<th>Profit Estimate</th>'
    + '<th>VAT Position</th>'
    + '</tr></thead>'
    + '<tbody>' + dataRows + totalRow + '</tbody>'
    + '</table>'
    + '<div class="disclaimer">Profit = sales − business purchases − expenses, ex-VAT. '
    + 'VAT position = output VAT − purchase input VAT − expense input VAT. '
    + 'Personal transfers excluded from all figures. Management reference only.</div>'
    + '</div>';
}

// ── DOM helpers ────────────────────────────────────────────────────────────

function dot(key, state) {
  const el = document.getElementById('dot-' + key);
  if (el) el.className = 'ep-dot' + (state ? ' ' + state : '');
}

function setCount(key, val) {
  const el = document.getElementById('count-' + key);
  if (el) el.textContent = val;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
