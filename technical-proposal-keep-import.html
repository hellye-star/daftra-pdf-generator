async function runImport(file){
  renderProcessing('Reading ' + file.name + ' …');
  const buf = await file.arrayBuffer();
  let doc;
  try{
    doc = await extractDocument(buf, file.name, (p,N)=> renderProcessing('Extracting page ' + p + ' of ' + N + ' …'));
  }catch(e){
    shell('<div class="card"><div class="banner stop"><b>Could not read this PDF.</b> '+esc(String(e && e.message || e))+'</div>'
      + '<button class="btn btn-ghost mt10" data-back-upload>Back</button></div>');
    return;
  }
  const groups = segment(doc);
  const drafts = groups
    .filter(g=> g.photos.length || g.bodyLines.some(has) || g.titleText)
    .map((g,i)=> groupToDraft(g, doc.fileName, i));
  STATE.doc = doc;
  STATE.drafts = drafts;
  STATE._approved = null;
  try{ STATE.projects = (await dbGetAll('projects')).sort((a,b)=>b.updatedAt-a.updatedAt); }catch(e){ STATE.projects = []; }
  STATE.view = 'review';
  renderReview();
  console.log('[keep-import] pages', doc.pageCount, 'drafts', drafts.length,
    'photos', drafts.reduce((a,x)=>a+x.photos.length,0), 'errors', doc.errors.length);
  window.__keepImport = { doc, drafts };
  try{ await deleteReviewDraft(); await saveReviewDraft(true); }catch(e){}   // fresh import replaces any prior saved review
}

/* ============================================================
   12b · Lightbox
   ============================================================ */
function openLightbox(di, pi){ STATE.lb = { di, pi }; renderLightbox(); }
function closeLightbox(){ STATE.lb = null; $('#lb-root').innerHTML = ''; }
function lbStep(delta){
  if(!STATE.lb) return;
  const d = STATE.drafts[STATE.lb.di]; if(!d) return closeLightbox();
  STATE.lb.pi = (STATE.lb.pi + delta + d.photos.length) % d.photos.length;
  renderLightbox();
}
function renderLightbox(){
  const root = $('#lb-root');
  if(!STATE.lb){ root.innerHTML=''; return; }
  const d = STATE.drafts[STATE.lb.di]; const p = d && d.photos[STATE.lb.pi];
  if(!p){ closeLightbox(); return; }
  const n = d.photos.length;
  root.innerHTML = '<div class="lightbox" data-lb>'
    + '<div class="lbtop">'
    +   '<span class="role">'+ROLE_LABEL[p.role]+'</span>'
    +   '<span>'+(p.keep===false ? 'Added photo' : 'Keep source — page '+p.sourcePage)+' · '+(STATE.lb.pi+1)+' / '+n+'</span>'
    +   '<span>'+esc(d.name||'')+'</span>'
    +   '<span class="grow"></span>'
    +   '<button data-lbclose>Close ✕</button>'
    + '</div>'
    + '<div class="lbstage">'
    +   (n>1 ? '<button class="nav prev" data-lbprev>‹</button>' : '')
    +   '<img src="'+p.url+'" alt="">'
    +   (n>1 ? '<button class="nav next" data-lbnext>›</button>' : '')
    + '</div></div>';
}

/* ============================================================
   13 · Events
   ============================================================ */
let PHOTO_TARGET = null;   // { di, role }
function sheetMenu(title, actions){
  return new Promise(res=>{
    const o = document.createElement('div'); o.className='sheetmenu';
    o.innerHTML = '<div class="inner">'+(title?'<div class="mtitle">'+esc(title)+'</div>':'')
      + actions.map((a,i)=>'<button data-i="'+i+'" class="'+(a.danger?'danger':'')+'">'+esc(a.label)+'</button>').join('')+'</div>';
    o.addEventListener('click', e=>{
      if(e.target===o){ o.remove(); res(null); return; }
      const b = e.target.closest('[data-i]'); if(b){ o.remove(); res(actions[+b.dataset.i]); }
    });
    document.body.appendChild(o);
  });
}

document.addEventListener('click', async e=>{
  const t = e.target;

  // lightbox
  if(t.closest('[data-lbclose]')){ closeLightbox(); return; }
  if(t.closest('[data-lbprev]')){ lbStep(-1); return; }
  if(t.closest('[data-lbnext]')){ lbStep(1); return; }
  if(t.closest('[data-lb]') && !t.closest('.lbtop') && !t.closest('.lbstage img') && !t.closest('.nav')){ closeLightbox(); return; }
  const zi = t.closest('[data-zoom]');
  if(zi){ openLightbox(+zi.dataset.d, +zi.dataset.p); return; }

  const ni = t.closest('[data-newitem]');
  if(ni){ newManualDraft(+ni.dataset.newitem); return; }
  const mv = t.closest('[data-move]');
  if(mv){ moveDraft(+mv.dataset.move, +mv.dataset.dir); return; }
  const dla = t.closest('[data-dlall]');
  if(dla){ downloadAllItemPhotos(+dla.dataset.dlall); return; }

  if(t.closest('[data-back-upload]')){
    document.querySelectorAll('.approvebar').forEach(b=>b.remove());
    await refreshSavedMeta();
    renderUpload();
    return;
  }
  if(t.closest('[data-choose]')){ $('#pick').value=''; $('#pick').click(); return; }

  // add photo (card button or sample-photo button)
  const ap = t.closest('[data-addphoto]');
  if(ap){ PHOTO_TARGET = { di:+ap.dataset.d, role: ap.dataset.role || null };
    $('#photopick').value=''; $('#photopick').click(); return; }

  const pm = t.closest('[data-pmenu]');
  if(pm){
    const di = +pm.dataset.d, pi = +pm.dataset.p;
    const ph = STATE.drafts[di].photos[pi];
    const others = STATE.drafts.map((d,idx)=>({d,idx})).filter(o=>o.idx!==di);
    const acts = [
      { label:'Download Photo', v:['download'] },
      { label:'Set as Existing', v:['role','existing'] },
      { label:'Set as Simulation / Proposed', v:['role','simulation'] },
      { label:'Set as Sample', v:['role','sample'] },
      { label:'Keep as Reference', v:['role','reference'] },
      { label:'Split — new item from here', v:['split'] },
      ...others.slice(0,10).map(o=>({ label:'Move to → '+(o.d.name || (o.d.manual?'Manual item '+(o.idx+1):'item '+(o.idx+1))), v:['move',o.idx] })),
      { label:'Remove from draft', v:['remove'], danger:true },
    ];
    const a = await sheetMenu('Photo — '+(ph.keep===false?'added':'page '+ph.sourcePage), acts);
    if(!a) return;
    if(a.v[0]==='download') downloadPhoto(di, pi);
    else if(a.v[0]==='role') setPhotoRole(di, pi, a.v[1]);
    else if(a.v[0]==='move') movePhoto(di, pi, a.v[1]);
    else if(a.v[0]==='split') splitDraft(di, pi);
    else if(a.v[0]==='remove') removePhoto(di, pi);
    return;
  }

  const mg = t.closest('[data-merge]');
  if(mg){ mergeDraft(+mg.dataset.merge, +mg.dataset.dir); return; }

  const sm = t.closest('[data-splitmenu]');
  if(sm){
    const di = +sm.dataset.splitmenu; const x = STATE.drafts[di];
    if(x.photos.length < 2){ toast('Needs 2+ photos to split'); return; }
    const a = await sheetMenu('Split “'+(x.name||'item')+'” before photo…',
      x.photos.slice(1).map((p,k)=>({ label:'Photo '+(k+2)+' ('+(p.keep===false?'added':'page '+p.sourcePage)+')', v:k+1 })));
    if(a) splitDraft(di, a.v);
    return;
  }

  const dc = t.closest('[data-discard]');
  if(dc){ discardDraft(+dc.dataset.discard); return; }

  // --- preset chips ---
  const chip = t.closest('[data-chip], [data-chipsub]');
  if(chip){
    const di = +chip.dataset.d, gkey = chip.dataset.g, opt = chip.dataset.o;
    const x = STATE.drafts[di]; const store = pgv(x, gkey);
    const parentGrp = PRESET_GROUPS.find(g=>g.key===gkey) || {};
    const idx = store.values.indexOf(opt);
    if(idx>=0) store.values.splice(idx,1);
    else if((parentGrp.exclusive||[]).includes(opt)) store.values=[opt];
    else { store.values = store.values.filter(v=>!(parentGrp.exclusive||[]).includes(v)); store.values.push(opt); }
    if(parentGrp.key) pruneHidden(x, parentGrp);
    x.confidence = scoreConfidence(x); reRenderCard(di); return;
  }
  const co = t.closest('[data-chipother]');
  if(co){
    const di = +co.dataset.d, gkey = co.dataset.g, x = STATE.drafts[di];
    const k = gkey+'@'+x.id;
    if(STATE.otherOpen.has(k)){ STATE.otherOpen.delete(k); pgv(x,gkey).other=''; }
    else STATE.otherOpen.add(k);
    reRenderCard(di); return;
  }
  // --- status segmented ---
  const seg = t.closest('[data-seg] button');
  if(seg){
    const box = seg.closest('[data-seg]'); const di = +box.dataset.d, name = box.dataset.seg, x = STATE.drafts[di];
    x.status[name] = seg.dataset.v;
    x.confidence = scoreConfidence(x); reRenderCard(di); return;
  }
  // --- client inputs ---
  const ciAdd = t.closest('[data-ciadd]');
  if(ciAdd){ const di = +ciAdd.dataset.d; STATE.drafts[di].clientInputs.push({ priority:'required', text:'' }); reRenderCard(di);
    const f = document.querySelectorAll('.draft[data-draft="'+di+'"] [data-citext]'); if(f.length) f[f.length-1].focus(); return; }
  const ciDel = t.closest('[data-cidel]');
  if(ciDel){ const di = +ciDel.dataset.d; STATE.drafts[di].clientInputs.splice(+ciDel.dataset.ri,1); reRenderCard(di); return; }
  const ciP = t.closest('[data-ciprio] button');
  if(ciP){ const box = ciP.closest('[data-ciprio]');
    STATE.drafts[+box.dataset.d].clientInputs[+box.dataset.ri].priority = ciP.dataset.v; reRenderCard(+box.dataset.d); return; }

  if(t.closest('[data-approve]')){
    const errEl = $('#apt-err');
    if(errEl) errEl.textContent = '';
    const nameEl = $('#apt-newname');
    if(APT_MODE === 'new'){
      const name = ((nameEl && nameEl.value) || APT_NEWNAME || '').trim();
      if(!name){ if(errEl) errEl.textContent = 'Enter a project name'; if(nameEl){ nameEl.focus(); nameEl.style.borderColor = 'var(--stop)'; } return; }
      await approveImport('new', name);
    } else {
      const id = ($('#apt-existing') && $('#apt-existing').value) || APT_EXISTING_ID;
      if(!id){ if(errEl) errEl.textContent = 'Pick a project'; return; }
      await approveImport('existing', id);
    }
    return;
  }

  // --- review-draft recovery / persistence ---
  if(t.closest('[data-savedraft]')){ await saveReviewDraft(false); toast('Review draft saved'); return; }
  if(t.closest('[data-resume]')){ await resumeReview(); return; }
  if(t.closest('[data-restorejson]')){ $('#jsonpick').value=''; $('#jsonpick').click(); return; }
  if(t.closest('[data-deletedraft]') || t.closest('[data-deletedraft-approved]')){
    if(await confirmSheet('Delete the saved review?', 'This permanently removes the saved review session and its photos from this browser. Imported projects are not affected.')){
      await deleteReviewDraft();
      document.querySelectorAll('.approvebar').forEach(b=>b.remove());
      renderUpload();
    }
    return;
  }
  if(t.closest('[data-backupjson]')){ downloadReviewBackupJSON(); return; }
  const od = t.closest('[data-open-dashboard]');
  if(od){ location.href = 'technical-proposal-dashboard.html#/p/' + od.dataset.openDashboard; return; }
});

/* simple confirm using the existing sheetMenu look */
function confirmSheet(title, body){
  return new Promise(res=>{
    const o = document.createElement('div'); o.className='sheetmenu';
    o.innerHTML = '<div class="inner"><div class="mtitle">'+esc(title)+'</div>'
      + '<div style="padding:10px 12px;font-size:12.5px;color:var(--grey);line-height:1.5">'+esc(body)+'</div>'
      + '<button data-yes class="danger">Delete</button><button data-no>Cancel</button></div>';
    o.addEventListener('click', e=>{
      if(e.target===o || e.target.closest('[data-no]')){ o.remove(); res(false); }
      else if(e.target.closest('[data-yes]')){ o.remove(); res(true); }
    });
    document.body.appendChild(o);
  });
}

// remember Proposal Details open/closed per draft; build the body lazily on first open
let _pdBusy = false;
document.addEventListener('toggle', e=>{
  const d = e.target && e.target.matches && e.target.matches('details[data-pd]') ? e.target : null;
  if(!d || _pdBusy) return;
  const i = +d.dataset.pd, x = STATE.drafts[i]; if(!x) return;
  const was = x.detailsOpen;
  x.detailsOpen = d.open;
  if(d.open && !was){ _pdBusy = true; reRenderCard(i); _pdBusy = false; }
}, true);

document.addEventListener('keydown', e=>{
  if(!STATE.lb) return;
  if(e.key==='Escape') closeLightbox();
  else if(e.key==='ArrowLeft') lbStep(-1);
  else if(e.key==='ArrowRight') lbStep(1);
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.pp != null && t.dataset.d != null){ setPresetPath(+t.dataset.d, t.dataset.pp, t.value); markDirty(); return; }
  if(t.dataset.f != null && t.dataset.d != null){
    setField(+t.dataset.d, t.dataset.f, t.value);
    if(t.dataset.f==='unit') reRenderCard(+t.dataset.d);
    else markDirty();
    return;
  }
  if(t.dataset.citext != null){
    STATE.drafts[+t.dataset.d].clientInputs[+t.dataset.ri].text = t.value; markDirty(); return;
  }
  if(t.id === 'apt-newname'){ APT_NEWNAME = t.value; const er=$('#apt-err'); if(er) er.textContent=''; t.style.borderColor=''; return; }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.name === 'apt'){
    APT_MODE = t.value;
    const se = $('#apt-existing'), ne = $('#apt-newname'), er = $('#apt-err');
    if(se) se.disabled = (APT_MODE!=='existing');
    if(ne){ ne.disabled = (APT_MODE!=='new'); ne.style.borderColor=''; if(APT_MODE==='new') ne.focus(); }
    if(er) er.textContent = '';
    return;
  }
  if(t.id === 'apt-existing'){ APT_EXISTING_ID = t.value; return; }
  if(t.dataset.sel != null){ STATE.drafts[+t.dataset.sel].selected = t.checked;
    const c = document.querySelector('.approvebar .count'); if(c) c.innerHTML = '<b>'+STATE.drafts.filter(x=>x.selected).length+'</b> of '+STATE.drafts.length+' selected';
    markDirty(); return; }
  if(t.dataset.f === 'unit'){ setField(+t.dataset.d, 'unit', t.value); reRenderCard(+t.dataset.d); return; }
  if(t.dataset.f === 'qtyUnit'){ setField(+t.dataset.d, 'qtyUnit', t.value); markDirty(); return; }
  if(t.dataset.f === 'currency'){ setField(+t.dataset.d, 'currency', t.value); reRenderCard(+t.dataset.d); return; }
  if(t.dataset.f === 'unitPrice'){ setField(+t.dataset.d, 'unitPrice', t.value);
    const el = document.querySelector('.draft[data-draft="'+t.dataset.d+'"] .pdetails .rawdim');
    const tot = draftLineTotal(STATE.drafts[+t.dataset.d]);
    if(el && tot!=null) el.textContent = 'line total: '+fmtMoney(tot, STATE.drafts[+t.dataset.d].currency||'SAR')+'  (qty '+STATE.drafts[+t.dataset.d].qty+' × unit price)';
    else reRenderCard(+t.dataset.d);
    markDirty(); return; }
});
$('#photopick').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0];
  if(f && PHOTO_TARGET){ await addPhotoToDraft(PHOTO_TARGET.di, f, PHOTO_TARGET.role); }
  PHOTO_TARGET = null; e.target.value='';
});
$('#jsonpick').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    await restoreBackupJSON(obj);
  }catch(err){
    console.error(err);
    shell('<div class="card"><div class="banner stop"><b>Could not restore that file.</b> '+esc(String(err && err.message || err))+'</div>'
      + '<button class="btn btn-ghost mt10" data-back-upload>Back</button></div>');
  }
});

// drag & drop
document.addEventListener('dragover', e=>{ e.preventDefault(); const d=$('#drop'); if(d) d.classList.add('hot'); });
document.addEventListener('dragleave', e=>{ const d=$('#drop'); if(d) d.classList.remove('hot'); });
document.addEventListener('drop', e=>{
  e.preventDefault(); const d=$('#drop'); if(d) d.classList.remove('hot');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f && f.type==='application/pdf') runImport(f);
});
$('#pick').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(f) runImport(f);
});

/* ============================================================
   14 · Init
   ============================================================ */
(async function init(){
  renderUpload();                 // paint immediately
  try{ await refreshSavedMeta(); }catch(e){}
  if(STATE.view === 'upload') renderUpload();   // re-paint with the Resume card if a saved review exists
})();

// autosave on tab hide / close so nothing is lost
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && STATE.view==='review') saveReviewDraft(true); });
window.addEventListener('pagehide', ()=>{ if(STATE.view==='review') saveReviewDraft(true); });
</script>
