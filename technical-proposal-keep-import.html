<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista — Google Keep / Site Notes Import (M-Keep-1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  /* ============================================================
     Vista — Keep / Site Notes Import (Milestone M-Keep-1)
     Standalone. Vendors pdf.js from CDN (same version the rest of
     the project already uses). NOT coupled to the Sarawat importer.
     Produces DRAFT items only — nothing is written to a project
     until the reviewer clicks Approve.
     ============================================================ */
  :root{
    --paper:#FFFFFF; --cream:#FAF8F4; --cream-2:#FBF9F6; --cream-edge:#ECE5D8;
    --emerald:#1A5C46; --emerald-soft:#3A7A62; --emerald-wash:#EEF4F0; --forest:#0E3D2E;
    --gold:#B8A47C; --gold-ink:#8C7643; --gold-wash:#F7F1E6;
    --ink:#1E1E1B; --grey:#5A5A54; --grey-soft:#8A897F; --faint:#B6B4AA;
    --rule:#E3E1D9; --rule-strong:#CBC8BE;
    --stop:#9C3A34; --stop-wash:#F6EAE8; --amber:#8A5E1E; --amber-wash:#F7F0E1;
    --r:11px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--cream-2); }
  body{ font-family:'Inter','Helvetica Neue',Arial,sans-serif; color:var(--ink); line-height:1.45; font-size:14px; -webkit-font-smoothing:antialiased; }
  button{ font:inherit; cursor:pointer; color:inherit; }
  input,textarea,select{ font:inherit; border:1px solid var(--rule-strong); border-radius:7px; padding:7px 9px; background:var(--paper); color:var(--ink); outline:none; width:100%; }
  input:focus,textarea:focus,select:focus{ border-color:var(--emerald); }
  textarea{ resize:vertical; min-height:46px; line-height:1.5; }

  .appbar{ position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--emerald);
    display:flex; align-items:center; gap:12px; padding:11px 16px; }
  .appbar .mk{ width:20px; height:20px; }
  .appbar .mk svg{ width:100%; height:100%; display:block; }
  .appbar .title{ font-family:'Playfair Display',Georgia,serif; font-weight:600; color:var(--emerald); font-size:16px; flex:1; }
  .appbar .sub{ font-size:11px; color:var(--grey-soft); letter-spacing:.03em; }

  .wrap{ max-width:1040px; margin:0 auto; padding:18px 16px 160px; }
  .card{ background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:15px; margin-bottom:13px; }
  .eyebrow{ font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:9px; }
  .hint{ font-size:11.5px; color:var(--grey-soft); }
  .muted{ color:var(--grey-soft); }
  .mt6{margin-top:7px} .mt10{margin-top:11px} .mt14{margin-top:15px}
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  h2.big{ font-family:'Playfair Display',Georgia,serif; font-weight:600; color:var(--emerald); font-size:19px; margin:0 0 4px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:9px; padding:10px 16px; font-weight:600; font-size:13.5px; border:1px solid transparent; }
  .btn-primary{ background:var(--emerald); color:#fff; }
  .btn-ghost{ background:var(--paper); border-color:var(--emerald); color:var(--emerald); }
  .btn-sm{ padding:7px 11px; font-size:12px; border-radius:7px; }
  .btn-danger{ background:var(--stop); color:#fff; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .drop{ border:2px dashed var(--rule-strong); border-radius:14px; background:var(--cream);
    padding:46px 20px; text-align:center; }
  .drop.hot{ border-color:var(--emerald); background:var(--emerald-wash); }
  .drop .big2{ font-family:'Playfair Display',serif; font-size:20px; color:var(--emerald); margin-bottom:6px; }

  .banner{ border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:13px; }
  .banner.warn{ background:var(--amber-wash); border:1px solid #E4CFA0; color:var(--amber); }
  .banner.stop{ background:var(--stop-wash); border:1px solid #E0C4C1; color:var(--stop); }
  .banner.ok{ background:var(--emerald-wash); border:1px solid #BFD4C9; color:var(--emerald); }

  /* ---- validation summary ---- */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px; }
  .stat{ background:var(--cream); border:1px solid var(--cream-edge); border-radius:9px; padding:9px 11px; }
  .stat .n{ font-family:'Playfair Display',serif; font-weight:600; font-size:20px; color:var(--forest); }
  .stat .l{ font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-ink); margin-top:2px; }

  /* ---- draft card ---- */
  .draft{ background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); margin-bottom:14px; overflow:hidden; }
  .draft.review{ border-color:#E4CFA0; }
  .draft.low{ border-color:#E0C4C1; }
  .draft > .dh{ display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--rule); background:var(--cream-2); flex-wrap:wrap; }
  .draft > .dh .sel{ width:16px; height:16px; }
  .draft > .dh .src{ font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--grey); }
  .conf{ font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:5px; }
  .conf.high{ background:var(--emerald); color:#fff; }
  .conf.med{ background:var(--gold-wash); color:var(--gold-ink); border:1px solid var(--cream-edge); }
  .conf.low{ background:var(--stop-wash); color:var(--stop); }
  .conf.manual{ background:var(--forest); color:#fff; }
  .draft.manual{ border-color:var(--gold); }
  .draft.manual > .dh{ background:var(--gold-wash); }
  .linkbtn{ background:none; border:0; color:var(--emerald); font-size:11px; font-weight:600; text-decoration:underline; padding:0 2px; cursor:pointer; }
  .newitem-bar{ display:flex; justify-content:center; margin:4px 0 16px; }
  .newitem-bar button{ background:var(--emerald-wash); border:1px dashed var(--emerald); color:var(--emerald); border-radius:9px; padding:9px 18px; font-weight:600; font-size:13px; cursor:pointer; }
  .flagchip{ font-size:9px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:4px; background:var(--amber-wash); color:var(--amber); border:1px solid #E4CFA0; }
  .draft > .dh .dh-actions{ margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .draft > .dh .dh-actions button{ border:1px solid var(--rule-strong); background:var(--paper); border-radius:6px; padding:5px 8px; font-size:11px; color:var(--grey); }
  .draft > .dh .dh-actions button.danger{ color:var(--stop); }

  .draft > .db{ padding:13px; display:grid; grid-template-columns:1fr; gap:13px; }
  @media(min-width:820px){ .draft > .db{ grid-template-columns:340px 1fr; } }

  .photostrip{ display:flex; flex-wrap:wrap; gap:8px; }
  .pchip{ width:96px; border:1px solid var(--rule-strong); border-radius:8px; overflow:hidden; background:var(--cream); position:relative; }
  .pchip img{ display:block; width:100%; height:78px; object-fit:cover; background:var(--cream); }
  .pchip .role{ font-size:8px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; text-align:center; padding:3px 2px; }
  .pchip.existing .role{ background:var(--emerald); color:#fff; }
  .pchip.simulation .role{ background:var(--emerald-soft); color:#fff; }
  .pchip.reference .role{ background:var(--cream); color:var(--grey); border-top:1px solid var(--cream-edge); }
  .pchip .src{ position:absolute; top:3px; left:3px; background:rgba(255,255,255,.9); font-size:8px; font-weight:700; color:var(--forest); padding:1px 4px; border-radius:3px; }
  .pchip .pmenu{ position:absolute; top:3px; right:3px; background:rgba(255,255,255,.92); border:1px solid var(--rule-strong); border-radius:5px; width:20px; height:18px; font-size:11px; line-height:1; color:var(--grey); }
  .photos-none{ font-size:11.5px; color:var(--faint); padding:16px 0; text-align:center; border:1px dashed var(--rule-strong); border-radius:8px; }

  .fld{ margin-bottom:9px; }
  .fld > label{ display:block; font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:3px; }
  .fld .warn{ color:var(--amber); font-weight:600; font-size:10px; margin-left:6px; }
  .dimrow{ display:flex; gap:7px; align-items:flex-end; }
  .dimrow .fld{ margin:0; }
  .dimrow .fld.axis{ flex:1; }
  .dimrow .fld.unit{ flex:0 0 92px; }
  .rawdim{ font-size:11px; color:var(--grey); background:var(--cream); border:1px solid var(--cream-edge); border-radius:6px; padding:5px 8px; margin-top:5px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .rawtext{ font-size:11px; color:var(--grey-soft); white-space:pre-wrap; background:var(--cream-2); border:1px solid var(--rule); border-radius:7px; padding:8px 10px; max-height:120px; overflow:auto; }

  /* ---- sheet menu ---- */
  .sheetmenu{ position:fixed; inset:0; z-index:60; background:rgba(14,26,20,.4); display:flex; align-items:center; justify-content:center; padding:18px; }
  .sheetmenu .inner{ background:var(--paper); border-radius:12px; padding:8px; width:280px; max-width:100%; }
  .sheetmenu button{ display:block; width:100%; text-align:left; background:none; border:0; padding:12px 12px; font-size:13.5px; border-bottom:1px solid var(--rule); }
  .sheetmenu button:last-child{ border-bottom:0; }
  .sheetmenu button.danger{ color:var(--stop); font-weight:600; }
  .sheetmenu .mtitle{ font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-ink); padding:8px 12px 4px; }

  /* ---- approve bar ---- */
  .approvebar{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--emerald);
    padding:12px 16px; }
  .approvebar .inner{ max-width:1040px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .approvebar .count{ font-size:12.5px; color:var(--grey); }
  .approvebar select, .approvebar input{ width:auto; min-width:180px; }
  .approvebar .grow{ flex:1; }

  .overlay{ position:fixed; inset:0; z-index:70; background:rgba(14,26,20,.6); display:flex; align-items:center; justify-content:center; padding:20px; }
  .dialog{ background:var(--paper); border-radius:12px; padding:18px; max-width:400px; width:100%; }
  .dialog h3{ font-family:'Playfair Display',serif; color:var(--emerald); font-size:17px; margin-bottom:8px; }
  .dialog p{ font-size:13px; color:var(--grey); margin-bottom:14px; }
  .dialog .acts{ display:flex; gap:9px; } .dialog .acts .btn{ flex:1; }
  .toast{ position:fixed; left:50%; bottom:80px; transform:translateX(-50%); z-index:80; background:var(--forest); color:#fff; font-size:12.5px; padding:9px 15px; border-radius:20px; opacity:0; transition:opacity .18s; pointer-events:none; }
  .toast.show{ opacity:1; }

  /* ---- add-photo tile ---- */
  .pchip.add{ border:1px dashed var(--rule-strong); background:var(--cream-2); display:flex; flex-direction:column; align-items:center; justify-content:center; height:99px; color:var(--emerald); font-size:11px; font-weight:600; gap:3px; cursor:pointer; }
  .pchip.add .plus{ font-size:18px; line-height:1; }
  .pchip img{ cursor:zoom-in; }

  /* ---- lightbox ---- */
  .lightbox{ position:fixed; inset:0; z-index:75; background:rgba(10,20,15,.92); display:flex; flex-direction:column; }
  .lightbox .lbtop{ display:flex; align-items:center; gap:12px; padding:12px 16px; color:#fff; font-size:12.5px; }
  .lightbox .lbtop .role{ font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:10px; background:rgba(255,255,255,.16); padding:3px 8px; border-radius:5px; }
  .lightbox .lbtop .grow{ flex:1; }
  .lightbox .lbtop button{ background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:7px; padding:8px 13px; font-size:13px; }
  .lightbox .lbstage{ flex:1; display:flex; align-items:center; justify-content:center; padding:0 8px 16px; min-height:0; }
  .lightbox .lbstage img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; background:#000; }
  .lightbox .nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.16); color:#fff; border:0; width:44px; height:60px; font-size:22px; border-radius:8px; }
  .lightbox .nav.prev{ left:10px; } .lightbox .nav.next{ right:10px; }

  /* ---- Proposal Details (collapsed) ---- */
  .pdetails{ border-top:1px solid var(--rule); margin-top:11px; }
  .pdetails > summary{ list-style:none; cursor:pointer; padding:11px 2px 4px; font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--gold-ink); display:flex; align-items:center; gap:7px; }
  .pdetails > summary::-webkit-details-marker{ display:none; }
  .pdetails > summary .tw{ transition:transform .15s; } .pdetails[open] > summary .tw{ transform:rotate(90deg); }
  .pdetails > summary .setflag{ font-size:9px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--emerald); background:var(--emerald-wash); border:1px solid #BFD4C9; padding:1px 6px; border-radius:4px; }
  .pdbody{ padding:8px 0 4px; }
  .pgroup{ margin-bottom:12px; }
  .pglabel{ font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); margin-bottom:5px; }
  .pglabel .pgsumm{ color:var(--emerald); font-weight:600; letter-spacing:0; text-transform:none; margin-left:7px; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .chip{ border:1px solid var(--rule-strong); background:var(--paper); border-radius:20px; padding:5px 10px; font-size:11.5px; color:var(--grey); }
  .chip.on{ background:var(--emerald); border-color:var(--emerald); color:#fff; }
  .chip.sub{ border-radius:7px; } .chip.other{ font-style:italic; }
  .subgroup{ margin-top:6px; padding-left:10px; border-left:2px solid var(--rule); }
  .sglabel{ font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .seg{ display:inline-flex; border:1px solid var(--rule-strong); border-radius:8px; overflow:hidden; flex-wrap:wrap; }
  .seg button{ background:var(--paper); border:0; border-right:1px solid var(--rule-strong); padding:6px 10px; font-size:11.5px; color:var(--grey); }
  .seg button:last-child{ border-right:0; }
  .seg button.on{ background:var(--emerald); color:#fff; }
  .seg.warn button.on{ background:var(--stop); }
  .cirow{ display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .cirow input[type=text],.cirow input:not([data-v]){ flex:1; min-width:160px; }
  .cirow .del{ background:none; border:0; color:var(--stop); font-size:15px; padding:0 4px; }

  /* ---- save status + review-draft recovery ---- */
  .save-status{ font-size:11px; font-weight:600; letter-spacing:.02em; margin-left:auto; flex:0 0 auto; padding:2px 8px; border-radius:5px; }
  .save-status.dirty{ color:var(--amber); background:var(--amber-wash); }
  .save-status.saving{ color:var(--grey); }
  .save-status.saved{ color:var(--emerald); background:var(--emerald-wash); }
  .save-status.err{ color:var(--stop); background:var(--stop-wash); }
  .resume-card{ border:1px solid var(--emerald); background:var(--emerald-wash); border-radius:var(--r); padding:14px; margin-bottom:13px; }
  .resume-card .eyebrow{ color:var(--emerald); }
  .resume-card .rc-meta{ font-size:12px; color:var(--grey); margin:4px 0 12px; }
  .resume-card .rc-meta b{ color:var(--forest); }
  .resume-card .row{ gap:8px; }
  /* approve-bar project target */
  .apt{ display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; }
  .apt label{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .apt label input[type=radio]{ width:15px; height:15px; accent-color:var(--emerald); }
  .apt select, .apt input[type=text]{ width:auto; min-width:150px; font-size:12.5px; padding:6px 9px; }
  .apt select[disabled], .apt input[disabled]{ opacity:.4; }
  .apt-err{ font-size:11px; font-weight:600; color:var(--stop); }
  .savedok{ border:1px solid var(--emerald); background:var(--emerald-wash); border-radius:var(--r); padding:16px; }
  .savedok .big2{ font-family:'Playfair Display',serif; font-size:19px; color:var(--emerald); margin-bottom:4px; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="pick" accept="application/pdf" hidden>
<input type="file" id="photopick" accept="image/*" capture="environment" hidden>
<input type="file" id="jsonpick" accept="application/json,.json" hidden>
<div id="lb-root"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   0 · Vista mark
   ============================================================ */
const MARK_SVG = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
 + ['M25 15 50 85 75 15|1','M28 15 50 79 72 15|.85','M31 15 50 73 69 15|.7','M34 15 50 67 66 15|.55','M37 15 50 61 63 15|.4','M40 15 50 55 60 15|.28','M43 15 50 49 57 15|.18']
   .map(s=>{const[d,o]=s.split('|');return '<path d="'+d+'" fill="none" stroke="#1A5C46" stroke-width="1.4" opacity="'+o+'"/>';}).join('')
 + '</svg>';

/* ============================================================
   1 · Shared IndexedDB  (vista_tpb — identical schema to the dashboard)
      Written to ONLY on Approve.
   ============================================================ */
const DB_NAME='vista_tpb', DB_VER=1;
let _dbp=null;
function openDB(){
  if(_dbp) return _dbp;
  _dbp = new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
      if(!db.objectStoreNames.contains('photos')){
        const s = db.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('by_project','projectId'); s.createIndex('by_item','itemId');
      }
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return _dbp;
}
const rq = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function dbGet(s,k){ const d=await openDB(); return rq(d.transaction(s).objectStore(s).get(k)); }
async function dbGetAll(s){ const d=await openDB(); return rq(d.transaction(s).objectStore(s).getAll()); }
async function dbPut(s,v){ const d=await openDB(); return rq(d.transaction(s,'readwrite').objectStore(s).put(v)); }

/* ============================================================
   2 · pdf.js worker
   ============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================================================
   3 · Utilities
   ============================================================ */
const $  = s => document.querySelector(s);
const app = ()=> $('#app');
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,9);
const now = ()=> Date.now();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const has = s => s!=null && String(s).trim()!=='';
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function clean(s){ return String(s||'').replace(/​/g,'').replace(/ /g,' ').replace(/[ \t]+/g,' ').trim(); }

/* ============================================================
   4 · PDF extraction  (native text + page-render photo crop)
   ============================================================ */
const TITLE_MIN_SIZE = 13.5;   // GoogleSans-Bold title = 15pt · body = 11pt

function groupLines(items){
  const rows = [];
  items.forEach(it=>{
    if(!it.str) return;
    const tr = it.transform || [1,0,0,1,0,0];
    const size = Math.hypot(tr[2], tr[3]) || it.height || 11;
    const y = tr[5], x = tr[4];
    let row = rows.find(r => Math.abs(r.y - y) < 4);
    if(!row){ row = { y, size, parts:[] }; rows.push(row); }
    row.size = Math.max(row.size, size);
    row.parts.push({ x, str: it.str });
  });
  rows.sort((a,b)=> b.y - a.y);
  return rows.map(r=>({
    text: clean(r.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join('')),
    size: r.size,
    y: r.y,                       // PDF baseline y (higher = further up the page)
    isTitle: r.size >= TITLE_MIN_SIZE
  })).filter(l=>l.text);
}

function imageBoxesFromOps(opList){
  const OPS = pdfjsLib.OPS;
  const boxes = [];
  let ctm=[1,0,0,1,0,0]; const stack=[];
  const mul=(a,b)=>[ a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3],
                     a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5] ];
  const paintOps = [OPS.paintImageXObject, OPS.paintImageXObjectRepeat, OPS.paintInlineImageXObject, OPS.paintJpegXObject]
                    .filter(v=>v!==undefined);
  for(let i=0;i<opList.fnArray.length;i++){
    const fn=opList.fnArray[i], a=opList.argsArray[i];
    if(fn===OPS.save) stack.push(ctm.slice());
    else if(fn===OPS.restore) ctm = stack.pop() || [1,0,0,1,0,0];
    else if(fn===OPS.transform) ctm = mul(ctm, a);
    else if(paintOps.indexOf(fn)!==-1){
      const pts=[[0,0],[1,0],[1,1],[0,1]].map(([x,y])=>[ ctm[0]*x+ctm[2]*y+ctm[4], ctm[1]*x+ctm[3]*y+ctm[5] ]);
      const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
      boxes.push({ x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys) });
    }
  }
  return boxes;
}

async function canvasToJpeg(canvas, maxDim){
  maxDim = maxDim || 2000;
  let w = canvas.width, h = canvas.height;
  if(Math.max(w,h) > maxDim){
    const s = maxDim / Math.max(w,h);
    const c2 = document.createElement('canvas');
    c2.width = Math.round(w*s); c2.height = Math.round(h*s);
    c2.getContext('2d').drawImage(canvas, 0,0, c2.width, c2.height);
    canvas = c2;
  }
  return await new Promise(r=> canvas.toBlob(r, 'image/jpeg', 0.82));
}

async function extractPage(pdf, pageNum, progress){
  const page = await pdf.getPage(pageNum);
  const pageH = page.getViewport({ scale: 1 }).height;
  const tc = await page.getTextContent();
  const lines = groupLines(tc.items).map(l=>({ ...l, top: pageH - l.y }));   // top = distance from page top
  const textLen = lines.reduce((a,l)=>a+l.text.length, 0);

  let images = [];
  let renderFailed = false;
  let boxes = [];
  try{ boxes = imageBoxesFromOps(await page.getOperatorList()); }
  catch(e){ renderFailed = true; }

  if(boxes.length){
    const scale = 3;
    const vp = page.getViewport({ scale });
    const pc = document.createElement('canvas');
    pc.width = Math.ceil(vp.width); pc.height = Math.ceil(vp.height);
    try{
      await page.render({ canvasContext: pc.getContext('2d'), viewport: vp }).promise;
      // de-dup near-identical boxes (repeat ops)
      const uniq = [];
      boxes.forEach(b=>{ if(!uniq.some(u=> Math.abs(u.x0-b.x0)<2 && Math.abs(u.y0-b.y0)<2 && Math.abs(u.x1-b.x1)<2)) uniq.push(b); });
      for(const b of uniq){
        const p0 = vp.convertToViewportPoint(b.x0, b.y0);
        const p1 = vp.convertToViewportPoint(b.x1, b.y1);
        const cx = Math.min(p0[0],p1[0]), cy = Math.min(p0[1],p1[1]);
        const cw = Math.abs(p1[0]-p0[0]), ch = Math.abs(p1[1]-p0[1]);
        if(cw < 24 || ch < 24) continue;
        const crop = document.createElement('canvas');
        crop.width = Math.round(cw); crop.height = Math.round(ch);
        crop.getContext('2d').drawImage(pc, Math.round(cx), Math.round(cy), Math.round(cw), Math.round(ch), 0,0, crop.width, crop.height);
        const blob = await canvasToJpeg(crop);
        images.push({ blob, w: crop.width, h: crop.height, bbox: b,
                      top: pageH - b.y1, bot: pageH - b.y0, x: b.x0 });
      }
    }catch(e){ renderFailed = true; }
    pc.width = pc.height = 0;
  }

  // reading order: top-to-bottom, then left-to-right
  images.sort((a,b)=>{
    if(Math.abs(a.top - b.top) > 20) return a.top - b.top;
    return a.x - b.x;
  });

  if(progress) progress(pageNum);
  return { pageNum, pageH, lines, images, textLen, expectedImages: boxes.length, renderFailed };
}

async function extractDocument(arrayBuffer, fileName, onProgress){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const N = pdf.numPages;
  const pages = [];
  let totalText = 0, pagesWithText = 0, totalExpectedImgs = 0, totalGotImgs = 0;
  const errors = [];
  for(let i=1;i<=N;i++){
    let pg;
    try{ pg = await extractPage(pdf, i, onProgress ? p=>onProgress(p, N) : null); }
    catch(e){ errors.push({ page:i, error:String(e && e.message || e) }); continue; }
    pages.push(pg);
    totalText += pg.textLen;
    if(pg.textLen >= 12) pagesWithText++;
    totalExpectedImgs += pg.expectedImages;
    totalGotImgs += pg.images.length;
    if(pg.expectedImages > pg.images.length) errors.push({ page:i, error:(pg.expectedImages - pg.images.length)+' image(s) not extracted' });
    if(pg.renderFailed) errors.push({ page:i, error:'page render failed' });
  }
  const scanned = totalText < 200 || pagesWithText < Math.max(2, N*0.12);
  const titlesDetected = pages.reduce((a,p)=> a + (p.lines.some(l=>l.isTitle)?1:0), 0);
  return { fileName, pageCount:N, pages, totalText, pagesWithText, scanned, errors, totalExpectedImgs, totalGotImgs, titlesDetected };
}

/* ============================================================
   5 · Dimension parsing  (aggressive numbers, NEVER silent unit convert)
   ============================================================ */
const NUM = '(\\d+(?:[.,]\\s?\\d+)?)';
const UNIT = '(mm|cm|m)?';
const AX  = '(width|height|depth|w|h|d)?';
const DIM_RE = new RegExp(
  AX+'\\s*'+UNIT+'\\s*'+NUM+'\\s*'+UNIT+'\\s*'+AX+
  '\\s*[x*×X·]\\s*'+
  AX+'\\s*'+UNIT+'\\s*'+NUM+'\\s*'+UNIT+'\\s*'+AX+
  '(?:\\s*[x*×X·]\\s*'+AX+'\\s*'+UNIT+'\\s*'+NUM+'\\s*'+UNIT+'\\s*'+AX+')?'
, 'i');

function num(s){ if(s==null) return null; const v = parseFloat(String(s).replace(',', '.').replace(/\s/g,'')); return isFinite(v) ? v : null; }
function axLetter(a){ if(!a) return null; a=a.toLowerCase(); if(a[0]==='w') return 'w'; if(a[0]==='h') return 'h'; if(a[0]==='d') return 'd'; return null; }

function parseDimLine(line){
  const m = DIM_RE.exec(line);
  if(!m) return null;
  // groups per number: [preAxis, preUnit, NUM, postUnit, postAxis]  ×3
  const trips = [
    { ax:m[1], u1:m[2], n:m[3], u2:m[4], ax2:m[5] },
    { ax:m[6], u1:m[7], n:m[8], u2:m[9], ax2:m[10] },
    { ax:m[11], u1:m[12], n:m[13], u2:m[14], ax2:m[15] },
  ].filter(t => t.n != null);
  const explicitUnit = trips.map(t=> (t.u1||t.u2||'').toLowerCase()).find(u=>u) ||
                       (/\b(mm|cm|m)\b/i.exec(line)||[])[1];
  const dims = { w:null, h:null, d:null };
  const order = ['w','h','d'];
  trips.forEach((t,i)=>{
    let ax = axLetter(t.ax) || axLetter(t.ax2) || order[i];
    if(dims[ax] != null) ax = order.find(o=>dims[o]==null) || ax;
    dims[ax] = num(t.n);
  });
  // depth keyword anywhere → last number is depth
  if(/depth/i.test(line) && dims.d == null && trips.length>=2){
    const vals = trips.map(t=>num(t.n));
    dims.d = vals[vals.length-1];
    if(dims.h === dims.d) dims.h = vals[vals.length-2] ?? dims.h;
  }
  const vals = [dims.w, dims.h, dims.d].filter(v=>v!=null);
  let unit = explicitUnit ? explicitUnit.toLowerCase() : null;
  let unitInferred = false;
  if(!unit && vals.length){
    const anyDecimal = vals.some(v=> !Number.isInteger(v));
    const allSmall = vals.every(v=> v < 20);
    const anyBig = vals.some(v=> v >= 20);
    if(anyDecimal && allSmall){ unit = 'm'; unitInferred = true; }
    else if(anyBig && vals.every(v=>Number.isInteger(v))){ unit = 'cm'; unitInferred = true; }
    else { unit = 'cm'; unitInferred = true; }   // best guess, flagged
  }
  return {
    raw: clean(m[0]),
    w: dims.w, h: dims.h, d: dims.d,
    unit, unitExplicit: !!explicitUnit, unitInferred,
    needsUnitConfirmation: !explicitUnit
  };
}

/* ============================================================
   6 · Segmentation  — bold-15 title = item boundary
      Photos are never dropped. Everything is surfaced.
   ============================================================ */
const DIM_WORDS = /\b(w|h|d|l|width|height|depth|length|size|sizes|dim|dims|dimension|dimensions|by|approx|about|around|each|side|cm|mm|m|is|are|the|of|and|to|raised)\b/gi;
function isDimOnly(text){
  const d = parseDimLine(text);
  if(!d) return false;
  // "just a dimension" = removing the matched numbers + label words leaves almost nothing real
  const rest = clean(text.replace(d.raw,''))
    .replace(DIM_WORDS,'')
    .replace(/[0-9x×*·:.,\-\/()@]/g,'')
    .replace(/\s+/g,'').trim();
  return rest.length < 3;
}
function stripFiller(s){ return clean(String(s||'').replace(/[\s:_=.-]+(is|are|was|of|the)?\s*$/i,'').replace(/^[\s:_=.-]+/,'')); }
function looksLikeName(text){
  const t = clean(text);
  if(!t || t.length > 60) return false;
  if(isDimOnly(t)) return false;
  const words = t.split(/\s+/);
  const letters = (t.match(/[A-Za-z؀-ۿ]/g)||[]).length;
  return words.length <= 8 && letters >= Math.max(2, t.length*0.4);
}

/* Break one page into ordered blocks (reading order, top → bottom).
   Consecutive text lines with no image between them and a small vertical
   gap are merged into one paragraph block. */
function pageBlocks(pg){
  const items = [];
  pg.lines.forEach(l=> items.push({ kind:'text', top:l.top, bot:l.top + (l.size||11), line:l }));
  pg.images.forEach(im=> items.push({ kind:'img', top:im.top, bot:im.bot, im }));
  items.sort((a,b)=> a.top - b.top || (a.kind==='img'?-1:1));
  const blocks = [];
  let para = null;
  for(const it of items){
    if(it.kind === 'text'){
      const gap = para ? it.top - para.bot : Infinity;
      if(para && gap < Math.max(30, 2.6*(it.line.size||11))){
        para.lines.push(it.line); para.bot = it.bot;
      } else {
        para = { type:'text', page:pg.pageNum, lines:[it.line], top:it.top, bot:it.bot };
        blocks.push(para);
      }
    } else {
      para = null;
      blocks.push({ type:'photo', page:pg.pageNum, top:it.top, bot:it.bot, im:it.im });
    }
  }
  return blocks;
}

/* Geometry-first segmentation.
   Reading order rules:
     · a photo cluster attaches to the FIRST meaningful text block below it
       (across a page break when the photos sit with no description under them)
     · multiple photo/description pairs on one page => multiple groups
     · a text block with no photos above it either continues the current group
       (plain continuation notes) or opens its own photo-less group (title / dimension)
   Bold-title font size is kept only as a naming + confidence signal. */
function segment(doc){
  const stream = [];
  doc.pages.forEach(pg=> stream.push(...pageBlocks(pg)));

  const groups = [];
  let cur = null;
  let pending = [];      // photos waiting for their description
  let order = 0;

  const blockText = tb => tb.lines.map(l=>l.text).join(' ');
  const meaningful = tb => {
    if(!tb.lines.length) return false;
    if(tb.lines.some(l=>l.isTitle)) return true;
    if(parseDimLine(blockText(tb))) return true;
    return blockText(tb).split(/\s+/).filter(Boolean).length >= 2;
  };
  const newGroup = () => { cur = { titleText:null, titlePage:null, bodyLines:[], photos:[], pages:new Set(), untitled:true }; groups.push(cur); return cur; };
  const takePending = g => { pending.forEach(p=>{ g.photos.push(p); g.pages.add(p.sourcePage); }); pending = []; };
  const addText = (g, tb) => {
    g.pages.add(tb.page);
    tb.lines.forEach(l=>{
      if(l.isTitle && !g.titleText){ g.titleText = l.text; g.titlePage = tb.page; g.untitled = false; }
      else g.bodyLines.push(l.text);
    });
  };

  for(const b of stream){
    if(b.type === 'photo'){
      pending.push({ blob:b.im.blob, w:b.im.w, h:b.im.h, sourcePage:b.page, order:order++ });
      continue;
    }
    // text block
    if(!meaningful(b)){
      if(cur) addText(cur, b);          // trivial fragment → note on current group, photos stay pending
      else { newGroup(); addText(cur, b); }
      continue;
    }
    const hasTitle = b.lines.some(l=>l.isTitle);
    const dimOnly  = b.lines.every(l=> isDimOnly(l.text) || !clean(l.text));
    if(pending.length){
      newGroup(); takePending(cur); addText(cur, b);
    } else if(cur && !hasTitle && !dimOnly){
      addText(cur, b);                  // continuation prose for the current group
    } else {
      newGroup(); addText(cur, b);      // titled / dimension block that has no photos above it
    }
  }

  // trailing photos with no following description → last group (flagged)
  if(pending.length && groups.length){
    const g = groups[groups.length-1];
    pending.forEach(p=>{ g.photos.push(p); g.pages.add(p.sourcePage); });
    g._trailingPhotos = true;
  } else if(pending.length){
    newGroup(); takePending(cur); cur._trailingPhotos = true;
  }
  return groups;
}

/* ============================================================
   7 · Group → draft item
   ============================================================ */
function groupToDraft(g, fileName, idx){
  const flags = [];
  const body = g.bodyLines.slice();

  // ---- name ----
  let name = '', nameSource = '';
  if(g.titleText && !isDimOnly(g.titleText)){
    // title may embed a dimension → split at first dim token
    const mm = DIM_RE.exec(g.titleText);
    const before = mm ? stripFiller(g.titleText.slice(0, mm.index)) : '';
    if(mm && before.replace(/[^A-Za-z؀-ۿ]/g,'').length >= 3){
      name = before;
      body.unshift(g.titleText.slice(mm.index));   // keep the dim for parsing below
      nameSource = 'title p'+g.titlePage+' (dimension split off)';
    } else {
      name = clean(g.titleText);
      nameSource = 'title p'+g.titlePage;
    }
  } else if(g.titleText && isDimOnly(g.titleText)){
    body.unshift(g.titleText);
    flags.push('title is a dimension');
  }
  if(!name){
    const cand = body.find(t=> looksLikeName(t));
    if(cand){ name = stripFiller(cand); nameSource = 'guessed from note text'; flags.push('name guessed'); }
    else { name = 'Untitled — page ' + (g.titlePage || [...g.pages][0] || '?'); nameSource = 'no title in source'; flags.push('no title in source'); }
  }
  if(name && name === name.toLowerCase()) name = name.charAt(0).toUpperCase() + name.slice(1);

  // ---- dimensions ----
  const dimLines = body.map(t=>({ t, d: parseDimLine(t) })).filter(x=>x.d);
  let dims;
  if(dimLines.length){
    dims = { ...dimLines[0].d, extra: dimLines.slice(1).map(x=>x.d.raw) };
    if(dimLines.length > 1) flags.push('multiple dimension sets');
    if(dims.needsUnitConfirmation) flags.push('unit '+ (dims.unitInferred ? 'inferred ('+dims.unit+')' : 'missing'));
  } else {
    dims = { raw:'', w:null, h:null, d:null, unit:null, unitExplicit:false, unitInferred:false, needsUnitConfirmation:true, extra:[] };
    flags.push('no dimensions found');
  }

  // ---- notes = body lines that are not the name and not a parsed dimension ----
  const dimRawSet = new Set(dimLines.map(x=>x.d.raw));
  const notesLines = body.filter(t=>{
    if(t === name) return false;
    if(dimRawSet.has(clean(t))) return false;
    const dm = parseDimLine(t);
    if(dm && isDimOnly(t)) return false;
    return has(t);
  });
  const notesText = notesLines.join('\n');

  // ---- photos: all preserved, roles assigned ----
  const photos = g.photos.map((p,i)=>({
    id: uid(), blob: p.blob, url: URL.createObjectURL(p.blob), w: p.w, h: p.h,
    sourcePage: p.sourcePage, order: i,
    role: i === 0 ? 'existing' : 'reference'
  }));
  if(!photos.length) flags.push('no photos');
  if(g._trailingPhotos) flags.push('photos attached by proximity');
  if(g.untitled && !flags.includes('no title in source')) flags.push('no title in source');

  const qty = 1;
  flags.push('quantity not stated');

  const draft = {
    id: uid(), idx,
    name, nameSource,
    photos,
    dims,
    notesText,
    qty, qtyUnit:'no.', qtyStated:false,
    unitPrice:'', currency:'SAR',
    selected: true,
    _unitTouched: false,
    flags,
    // --- same shape as technical-proposal-dashboard.html item model ---
    presets: {},
    status: { design:'pending', sample:'na', production:'not_started',
              designComment:'', sampleRev:'', sampleDate:'', sampleBy:'', sampleComment:'' },
    clientInputs: [],
    detailsOpen: false,
    keepSource: {
      file: fileName,
      pages: [...new Set([...g.pages, ...g.photos.map(p=>p.sourcePage)])].sort((a,b)=>a-b),
      rawText: [ g.titleText, ...g.bodyLines ].filter(has).join('\n'),
      photoRefs: g.photos.map((p,i)=>({ page:p.sourcePage, order:i }))
    }
  };
  draft.confidence = scoreConfidence(draft);
  return draft;
}

function scoreConfidence(d){
  let s = 1;
  const f = d.flags;
  if(f.some(x=>x.startsWith('no title')||x.startsWith('name guessed'))) s -= 0.35;
  if(f.includes('title is a dimension')) s -= 0.12;
  if(f.some(x=>x.startsWith('unit'))) s -= 0.15;
  if(f.includes('multiple dimension sets')) s -= 0.15;
  if(f.includes('photos attached by proximity')) s -= 0.2;
  if(f.includes('no photos')) s -= 0.12;
  if(f.includes('no dimensions found')) s -= 0.12;
  return Math.max(0, Math.min(1, s));
}
const confBand = c => c >= 0.75 ? 'high' : c >= 0.5 ? 'med' : 'low';

            options:['Existing Power','New Power Required','Cabling Required','Driver / Access Required'] } ] },
  { key:'access', label:'Access', exclusive:['Normal'], options:[
      'Normal','Ladder','Scaffold','Scissor Lift','Boom Lift','Crane'],
    note:{ key:'accessNote', label:'Access note',
           showIf:v=>v.some(x=>['Scaffold','Scissor Lift','Boom Lift','Crane'].includes(x)) } },
  { key:'environment', label:'Environment / Protection', options:[
      'Indoor','Outdoor','Weather Resistant','Waterproof','UV Resistant'] },
];
const UNITS = ['no.','set','lot','panels','poles','units','m','m²'];
const CURRENCIES = ['SAR','USD','EUR','AED','GBP'];
function moneyNum(v){ if(v==null||String(v).trim()==='') return null; const n=parseFloat(String(v).replace(/[, ]/g,'')); return isFinite(n)?n:null; }
function fmtMoney(n, cur){ return (cur||'SAR')+' '+Number(n).toLocaleString('en-US',{maximumFractionDigits:2}); }
function draftLineTotal(d){ const u=moneyNum(d.unitPrice), q=moneyNum(d.qty); return (u==null||q==null)?null:u*q; }
const STATUS = {
  design:     [['pending','Pending'],['approved','Approved'],['revision_required','Revision Required'],['rejected','Rejected']],
  sample:     [['na','N/A'],['pending','Pending'],['approved','Approved'],['rejected','Rejected']],
  production: [['not_started','Not Started'],['ready_for_production','Ready for Production'],['in_production','In Production'],['ready_for_installation','Ready for Installation'],['installed','Installed']],
};
const PRIORITY = [['urgent','Urgent'],['required','Required'],['optional','Optional']];

function pgv(d,key){ if(!d.presets[key]) d.presets[key]={values:[],other:''}; return d.presets[key]; }
function presetSummary(d, g){
  const parts=[]; const gv=(d.presets[g.key]||{});
  (gv.values||[]).forEach(v=>parts.push(v));
  if(gv.other) parts.push('Other: '+gv.other);
  for(const s of (g.sub||[])){
    if(!s.showIf(gv.values||[])) continue;
    const sv=(d.presets[s.key]||{});
    (sv.values||[]).forEach(v=>parts.push(v));
    if(sv.other) parts.push('Other: '+sv.other);
  }
  return parts.join(' · ');
}
function pruneHidden(d, g){
  const gv = pgv(d, g.key);
  for(const s of (g.sub||[])){
    if(!s.showIf(gv.values)){ if(d.presets[s.key]){ d.presets[s.key].values=[]; d.presets[s.key].other=''; } STATE.otherOpen.delete(s.key); }
  }
  if(g.note && !g.note.showIf(gv.values)) d.presets[g.note.key] = '';
}
function presetsAnySet(d){
  return PRESET_GROUPS.some(g=> presetSummary(d,g)) ||
    d.status.design!=='pending' || d.status.sample!=='na' || d.status.production!=='not_started' ||
    (d.clientInputs||[]).length>0 || has(d.unitPrice);
}

   8 · State

const STATE = { view:'upload', doc:null, drafts:[], projects:[], otherOpen:new Set(), lb:null };

/* ============================================================
   8b · Review-draft persistence  (separate IndexedDB — never touches vista_tpb)
        Saves the unfinished review session + photo blobs so it can be resumed.
   ============================================================ */
const RDB_NAME = 'vista_review_drafts', RDB_VER = 1;
let _rdbp = null;
function reviewDB(){
  if(_rdbp) return _rdbp;
  _rdbp = new Promise((res,rej)=>{
    const r = indexedDB.open(RDB_NAME, RDB_VER);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('session')) db.createObjectStore('session',{keyPath:'id'});
      if(!db.objectStoreNames.contains('photos'))  db.createObjectStore('photos',{keyPath:'pid'});
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return _rdbp;
}
async function rGet(s,k){ const d=await reviewDB(); return rq(d.transaction(s).objectStore(s).get(k)); }
async function rGetAll(s){ const d=await reviewDB(); return rq(d.transaction(s).objectStore(s).getAll()); }
async function rGetAllKeys(s){ const d=await reviewDB(); return rq(d.transaction(s).objectStore(s).getAllKeys()); }
async function rPut(s,v){ const d=await reviewDB(); return rq(d.transaction(s,'readwrite').objectStore(s).put(v)); }
async function rDel(s,k){ const d=await reviewDB(); return rq(d.transaction(s,'readwrite').objectStore(s).delete(k)); }
async function rClear(s){ const d=await reviewDB(); return rq(d.transaction(s,'readwrite').objectStore(s).clear()); }

function dataUrlToBlob(u){
  const [meta,b64] = String(u).split(',');
  const mime = (meta.match(/:(.*?);/)||[])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}
function blobToDataUrl(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }

/* ---- serialize the live review (no blobs; photos carry a pid reference) ---- */
function serializeReviewState(){
  const drafts = STATE.drafts.map(d=>{
    const c = {};
    for(const k in d) if(k!=='photos') { try{ c[k] = JSON.parse(JSON.stringify(d[k])); }catch(_){ c[k] = d[k]; } }
    c.photos = (d.photos||[]).map(p=>({ id:p.id, role:p.role, sourcePage:p.sourcePage==null?null:p.sourcePage,
      order:p.order==null?null:p.order, keep:p.keep, w:p.w||null, h:p.h||null, pid:p._pid||null }));
    return c;
  });
  const doc = STATE.doc ? {
    fileName: STATE.doc.fileName, pageCount: STATE.doc.pageCount, scanned: STATE.doc.scanned,
    totalText: STATE.doc.totalText, errors: STATE.doc.errors || [],
    totalGotImgs: STATE.doc.totalGotImgs, totalExpectedImgs: STATE.doc.totalExpectedImgs,
    titlesDetected: STATE.doc.titlesDetected != null ? STATE.doc.titlesDetected : null
  } : null;
  return {
    id:'current', kind:'vista-review-session', version:1,
    savedAt: Date.now(),
    fileName: (STATE.doc && STATE.doc.fileName) || 'Manual review',
    itemCount: STATE.drafts.length,
    photoCount: STATE.drafts.reduce((n,d)=>n+(d.photos||[]).length,0),
    doc, otherOpen:[...STATE.otherOpen], drafts,
    approved: STATE._approved || null
  };
}

/* ---- save: writes session + any new photo blobs, prunes orphans ---- */
let _saving = false, _saveQueued = false;
async function saveReviewDraft(silent){
  if(_saving){ _saveQueued = true; return; }
  _saving = true;
  if(!silent) setSaveStatus('saving');
  try{
    // 1 · persist photo blobs that aren't stored yet (tag the live object with _pid)
    for(const d of STATE.drafts){
      for(const p of (d.photos||[])){
        if(!p._pid && p.blob){
          const pid = uid();
          await rPut('photos', { pid, blob:p.blob, w:p.w||null, h:p.h||null });
          p._pid = pid;
        }
      }
    }
    // 2 · write the session record
    const sess = serializeReviewState();
    await rPut('session', sess);
    // 3 · prune photo blobs no longer referenced
    const used = new Set();
    STATE.drafts.forEach(d=> (d.photos||[]).forEach(p=> p._pid && used.add(p._pid)));
    const keys = await rGetAllKeys('photos');
    for(const k of keys) if(!used.has(k)) await rDel('photos', k);
    SAVED_META = { fileName:sess.fileName, savedAt:sess.savedAt, itemCount:sess.itemCount, photoCount:sess.photoCount, approved:sess.approved };
    setSaveStatus('saved');
  }catch(e){
    console.error('saveReviewDraft failed', e);
    setSaveStatus('err');
  }
  _saving = false;
  if(_saveQueued){ _saveQueued = false; saveReviewDraft(true); }
}

let _dirtyTimer = null;

  setSaveStatus('dirty');

function paintSaveStatus(){
  const el = document.getElementById('save-status');
  if(!el) return;
  const map = { dirty:['dirty','Unsaved changes'], saving:['saving','Saving…'], saved:['saved','Saved'], err:['err','Save failed'] };
  const m = map[_saveStatus];
  el.className = 'save-status' + (m ? ' '+m[0] : '');
  el.textContent = (STATE.view==='review' && m) ? m[1] : '';
}

let SAVED_META = null;      // {fileName, savedAt, itemCount, photoCount, approved} | null
async function refreshSavedMeta(){
  try{
    const s = await rGet('session','current');
    SAVED_META = s ? { fileName:s.fileName, savedAt:s.savedAt, itemCount:s.itemCount, photoCount:s.photoCount, approved:s.approved||null } : null;
  }catch(e){ SAVED_META = null; }
  return SAVED_META;
}
async function hydrateFromSession(sess, photoBlobById){
  // photoBlobById: (pid|id) -> Blob
  STATE.doc = sess.doc || null;
  STATE.otherOpen = new Set(sess.otherOpen || []);
  STATE._approved = sess.approved || null;
  STATE.drafts = (sess.drafts || []).map(d=>{
    const nd = {};
    for(const k in d) if(k!=='photos') nd[k] = d[k];
    nd.photos = (d.photos || []).map(p=>{
      const blob = photoBlobById[p.pid] || photoBlobById[p.id] || null;
      return blob ? {
        id: p.id || uid(), _pid: p.pid || null, blob, url: URL.createObjectURL(blob),
        w: p.w || null, h: p.h || null, sourcePage: p.sourcePage, order: p.order, keep: p.keep, role: p.role || 'reference'
      } : null;
    }).filter(Boolean);
    if(!Array.isArray(nd.flags)) nd.flags = [];
    if(!nd.dims) nd.dims = { raw:'', w:null,h:null,d:null, unit:null, unitExplicit:false, unitInferred:false, needsUnitConfirmation:true, extra:[] };
    if(!nd.status) nd.status = { design:'pending', sample:'na', production:'not_started', designComment:'', sampleRev:'', sampleDate:'', sampleBy:'', sampleComment:'' };
    if(!nd.presets) nd.presets = {};
    if(!Array.isArray(nd.clientInputs)) nd.clientInputs = [];
    return nd;
  });
  try{ STATE.projects = (await dbGetAll('projects')).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); }catch(e){ STATE.projects = []; }
  STATE.view = 'review';
  renderReview();
  _saveStatus = 'saved'; paintSaveStatus();
  window.__keepImport = { doc: STATE.doc, drafts: STATE.drafts };
}
async function resumeReview(){
  const sess = await rGet('session','current');
  if(!sess){ toast('No saved review found'); return; }
  const photos = await rGetAll('photos');
  const byId = {};
  photos.forEach(r=> byId[r.pid] = r.blob);
  await hydrateFromSession(sess, byId);
  toast('Review resumed');
}
async function deleteReviewDraft(){
  try{ await rClear('session'); await rClear('photos'); }catch(e){ console.error(e); }
  SAVED_META = null;
  STATE._approved = null;
}
/* ---- restore an emergency backup JSON (the console-snippet format) ---- */
async function restoreBackupJSON(obj){
  if(!obj || obj.kind !== 'vista-technical-proposal-review-backup')
    throw new Error('Not a Vista review backup file (kind mismatch).');
  if(obj.version !== 1)
    throw new Error('Unsupported backup version: ' + obj.version);
  const byId = {};
  for(const d of (obj.drafts || [])){
    for(const p of (d.photos || [])){
      if(p.dataUrl && String(p.dataUrl).startsWith('data:')){
        try{ byId[p.id] = dataUrlToBlob(p.dataUrl); }catch(_){}
      }
    }
  }
  const sess = {
    id:'current', kind:'vista-review-session', version:1, savedAt: Date.now(),
    fileName: (obj.doc && obj.doc.fileName) || obj.fileName || 'Restored backup',
    itemCount: (obj.drafts || []).length,
    photoCount: (obj.drafts || []).reduce((n,d)=> n + (d.photos || []).length, 0),
    doc: obj.doc || null,
    otherOpen: obj.otherOpen || [],
    drafts: (obj.drafts || []).map(d=>{
      const c = {};
      for(const k in d) if(k!=='photos') c[k] = d[k];
      c.photos = (d.photos || []).map(p=>({ id:p.id, role:p.role, sourcePage:p.sourcePage, order:p.order, keep:p.keep, w:p.w||null, h:p.h||null, pid:null }));
      return c;
    }),
    approved: null
  };
  await hydrateFromSession(sess, byId);
  await saveReviewDraft(true);   // persist the restored session into the review DB
  toast('Backup restored — ' + sess.itemCount + ' items, ' + Object.keys(byId).length + ' photos');
}

function renderReview(){
  STATE.view = 'review';
  const d = STATE.doc || { fileName:'Manual review', pageCount:0, scanned:false, totalText:0,
    errors:[], totalGotImgs:0, totalExpectedImgs:0, titlesDetected:0 };
  const drafts = STATE.drafts;
  const clean_hi = drafts.filter(x=>confBand(x.confidence)==='high').length;
  const needs = drafts.filter(x=>confBand(x.confidence)!=='high').length;
  const orphans = drafts.filter(x=> x.flags.includes('no title in source') || x.flags.includes('photos attached by proximity')).length;
  const totalPhotos = drafts.reduce((a,x)=>a+x.photos.length,0);
  const unitCases = drafts.filter(x=> x.flags.some(f=>f.startsWith('unit'))).length;
  const titles = (d.titlesDetected != null) ? d.titlesDetected
    : (d.pages ? d.pages.reduce((a,p)=> a + (p.lines.some(l=>l.isTitle)?1:0), 0) : 0);

  let html = '';

  if(d.scanned){
    html += '<div class="banner stop"><b>This document appears image-based.</b> Only '+d.totalText+' characters of native text were found across '+d.pageCount+' pages. OCR import is not enabled yet — the drafts below are unreliable. (OCR is the next import enhancement.)</div>';

    +   statBox(orphans, 'Orphan / untitled')
    +   statBox(d.totalGotImgs + ' / ' + d.totalExpectedImgs, 'Photos extracted')

function reRender(){
  // strip any fixed approve bars before re-render
  document.querySelectorAll('.approvebar').forEach(b=>b.remove());
  const y = window.scrollY;
  renderReview();
  window.scrollTo(0, y);

/* refresh just one card in place — keeps chip/status edits snappy and
   avoids scrolling on every tap. Falls back to a full re-render. */
function reRenderCard(i){
  const el = document.querySelector('.draft[data-draft="'+i+'"]');
  if(!el){ reRender(); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = renderDraft(STATE.drafts[i], i);
  el.replaceWith(tmp.firstElementChild);
  markDirty();
}
function draftAt(i){ return STATE.drafts[i]; }

const STATUS_FIELDS = ['designComment','sampleRev','sampleDate','sampleBy','sampleComment'];
function setField(i, f, v){
  const x = draftAt(i); if(!x) return;
  if(f==='name') x.name = v;
  else if(f==='notes') x.notesText = v;
  else if(f==='qty'){ x.qty = v; x.qtyStated = has(v) && String(v)!=='1'; }
  else if(f==='qtyUnit') x.qtyUnit = v;
  else if(f==='unitPrice') x.unitPrice = v;
  else if(f==='currency') x.currency = v;
  else if(f==='dw') x.dims.w = num(v);
  else if(f==='dh') x.dims.h = num(v);
  else if(f==='dd') x.dims.d = num(v);
  else if(f==='unit'){ x.dims.unit = v; x._unitTouched = true; x.dims.needsUnitConfirmation = false;
    x.flags = x.flags.filter(fl=>!fl.startsWith('unit')); }
  else if(STATUS_FIELDS.includes(f)) x.status[f] = v;
  x.confidence = scoreConfidence(x);
}
function setPresetPath(i, path, v){
  const x = draftAt(i); if(!x) return;
  const parts = path.split('.');
  if(parts.length === 2){ pgv(x, parts[0])[parts[1]] = v; }      // "<key>.other"
  else { x.presets[parts[0]] = v; }                               // note key -> string
}
function setPhotoRole(di, pi, role){
  const x = draftAt(di); const ph = x.photos[pi]; if(!ph) return;
  // Existing Condition allows MANY photos; Simulation / Sample stay single-primary
  if(role==='simulation' || role==='sample'){
    x.photos.forEach(p=>{ if(p.role===role) p.role='reference'; });
  }
  ph.role = role;
  x.confidence = scoreConfidence(x);
  reRenderCard(di);
}
async function fileToPhoto(file){
  let bmp;
  try{ bmp = await createImageBitmap(file); }
  catch(e){ bmp = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  const blob = await canvasToJpeg(c);
  return { blob, w: c.width, h: c.height };
}
async function addPhotoToDraft(di, file, forcedRole){
  const x = draftAt(di); if(!x) return;
  let p;
  try{ p = await fileToPhoto(file); }
  catch(e){ toast('Could not read that image'); return; }
  const role = forcedRole ||
    (await sheetMenu('Role for this photo', [
      {label:'Existing', v:'existing'}, {label:'Simulation / Proposed', v:'simulation'},
      {label:'Sample', v:'sample'}, {label:'Reference', v:'reference'},
    ]) || {v:'reference'}).v;
  if(role==='simulation'||role==='sample') x.photos.forEach(q=>{ if(q.role===role) q.role='reference'; });
  x.photos.push({ id:uid(), blob:p.blob, url:URL.createObjectURL(p.blob), w:p.w, h:p.h,
    sourcePage:null, keep:false, order:x.photos.length, role });
  x.flags = x.flags.filter(f=>f!=='no photos');
  x.confidence = scoreConfidence(x);
  reRenderCard(di);
}
function movePhoto(di, pi, targetIdx){
  const x = draftAt(di); const [ph] = x.photos.splice(pi,1);
  ph.role = 'reference';
  draftAt(targetIdx).photos.push(ph);
  [x, draftAt(targetIdx)].forEach(d=>{
    if(!d.photos.some(p=>p.role==='existing') && d.photos[0]) d.photos[0].role='existing';
    d.confidence = scoreConfidence(d);
  });
  reRender();
}
function removePhoto(di, pi){
  const x = draftAt(di); const [ph] = x.photos.splice(pi,1);
  URL.revokeObjectURL(ph.url);
  if(!x.photos.some(p=>p.role==='existing') && x.photos[0]) x.photos[0].role='existing';
  x.confidence = scoreConfidence(x);
  reRenderCard(di);
}
function mergeDraft(i, dir){
  const j = i + dir;
  if(j < 0 || j >= STATE.drafts.length) return;
  const a = STATE.drafts[Math.min(i,j)], b = STATE.drafts[Math.max(i,j)];
  // a keeps name/dims/presets/status; b folds in.
  // Existing photos from b stay Existing (multi allowed); b's Simulation/Sample demote to reference.
  b.photos.forEach(p=>{ if(p.role==='simulation'||p.role==='sample') p.role='reference'; });
  a.photos.push(...b.photos);
  a.notesText = [a.notesText, b.notesText].filter(has).join('\n');
  a.clientInputs = (a.clientInputs||[]).concat(b.clientInputs||[]);
  if(b.dims.raw) a.dims.extra = (a.dims.extra||[]).concat([b.dims.raw]).concat(b.dims.extra||[]);
  a.keepSource.pages = [...new Set(a.keepSource.pages.concat(b.keepSource.pages))].sort((m,n)=>m-n);
  a.keepSource.rawText = [a.keepSource.rawText, b.keepSource.rawText].filter(has).join('\n---\n');
  a.flags = [...new Set(a.flags.concat(['merged from p'+b.keepSource.pages.join(',')]))].filter(f=>f!=='no photos');
  a.confidence = scoreConfidence(a);
  STATE.drafts.splice(Math.max(i,j), 1);
  reRender();
}
function splitDraft(i, atPhoto){
  const x = draftAt(i);
  if(atPhoto <= 0 || atPhoto >= x.photos.length) return;
  const moved = x.photos.splice(atPhoto);
  moved.forEach((p,k)=> p.role = k===0 ? 'existing' : 'reference');
  const nd = {
    id: uid(), idx: x.idx + 0.5,
    name: x.name + ' (2)', nameSource: 'split from previous',
    photos: moved,
    dims: { raw:'', w:null,h:null,d:null, unit:null, unitExplicit:false, unitInferred:false, needsUnitConfirmation:true, extra:[] },
    notesText:'', qty:1, qtyUnit:'no.', qtyStated:false, unitPrice:'', currency:'SAR', selected:true, _unitTouched:false,
    presets:{}, status:{ design:'pending', sample:'na', production:'not_started', designComment:'', sampleRev:'', sampleDate:'', sampleBy:'', sampleComment:'' },
    clientInputs:[], detailsOpen:false,
    flags:['from split','quantity not stated','no dimensions found'],
    keepSource:{ file:x.keepSource.file, pages:[...new Set(moved.map(p=>p.sourcePage).filter(Boolean))].sort((a,b)=>a-b), rawText:'(split — original text kept on the first item)', photoRefs: moved.map((p,k)=>({page:p.sourcePage,order:k})) }
  };
  nd.confidence = scoreConfidence(nd);
  if(!x.photos.some(p=>p.role==='existing') && x.photos[0]) x.photos[0].role='existing';
  x.confidence = scoreConfidence(x);
  STATE.drafts.splice(i+1, 0, nd);
  reRender();
}
function discardDraft(i){
  draftAt(i).photos.forEach(p=>URL.revokeObjectURL(p.url));
  STATE.drafts.splice(i,1); reRender();
}
function moveDraft(i, dir){
  const j = i + dir;
  if(j < 0 || j >= STATE.drafts.length) return;
  const [d] = STATE.drafts.splice(i,1);
  STATE.drafts.splice(j,0,d);
  reRender();
  const el = document.querySelector('.draft[data-draft="'+j+'"]');
  if(el) el.scrollIntoView({ block:'center' });
}

/* ---- photo download ---- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
}
function slugName(s){ return String(s||'').trim().replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24); }
function photoFilename(d, di, photo){
  let item = 'Item-' + String(di+1).padStart(2,'0');
  const nm = slugName(d.name);
  if(nm && !/^Untitled/i.test(d.name.trim())) item += '-' + nm;
  const sameRole = d.photos.filter(p=>p.role===photo.role);
  const roleCap = photo.role.charAt(0).toUpperCase()+photo.role.slice(1);
  const role = sameRole.length > 1 ? roleCap+'-'+String(sameRole.indexOf(photo)+1).padStart(2,'0') : roleCap;
  const src = photo.keep===false ? 'Manual' : ('Page-'+photo.sourcePage);
  return ['Keep', item, role, src].join('_') + '.jpg';
}
function downloadPhoto(di, pi){
  const d = STATE.drafts[di], p = d && d.photos[pi]; if(!p) return;
  downloadBlob(p.blob, photoFilename(d, di, p));
}
async function downloadAllItemPhotos(di){
  const d = STATE.drafts[di]; if(!d || !d.photos.length){ toast('No photos'); return; }
  toast('Downloading '+d.photos.length+' photo'+(d.photos.length>1?'s':'')+'…');
  for(const p of d.photos){
    downloadBlob(p.blob, photoFilename(d, di, p));
    await new Promise(r=>setTimeout(r, 400));   // stagger so the browser accepts each save
  }
}

function toMM(v, unit){
  if(v == null || v === '' || isNaN(v)) return '';
  const n = parseFloat(v);
  if(unit === 'mm') return String(Math.round(n));
  if(unit === 'cm') return String(Math.round(n*10));
  if(unit === 'm')  return String(Math.round(n*1000));
  return String(n);
}
function blankItem(){
  return { presets:{}, clientInputs:[], unitPrice:'', currency:'SAR', existingPhotoIds:[],
    status:{ design:'pending', sample:'na', production:'not_started', designComment:'', sampleRev:'', sampleDate:'', sampleBy:'', sampleComment:'' },
    ar:{ name:'', locationRef:'', scope:'', site:'', technical:'', criticalInstaller:'', clientInputs:{} } };
}
async function approveImport(mode, value){
  const chosen = STATE.drafts.filter(x=>x.selected);
  if(!chosen.length){ toast('Nothing selected'); return; }

  let project, isNew = false;
  if(mode === 'new'){
    isNew = true;
    const t = now();
    project = { id: uid(), name: value || 'Imported from Keep', client:'', location:'', revision:'R1',
      descriptor:'', preparedBy:'', dateOfIssue:'', docRef:'', showPricing:false, createdAt:t, updatedAt:t, items:[] };
  } else {
    project = await dbGet('projects', value);
    if(!project){ toast('Project not found'); return; }
  }
  if(!Array.isArray(project.items)) project.items = [];
  const beforeCount = project.items.length;

  for(const x of chosen){
    // deep-clone presets so the stored item is independent of the review state
    const presets = JSON.parse(JSON.stringify(x.presets || {}));
    const it = Object.assign(blankItem(), {
      id: uid(),
      number: String(project.items.length + 1).padStart(2,'0'),
      name: x.name || 'Untitled item',
      locationRef: '',
      qty: { value: (parseInt(x.qty,10) || 1), unit: x.qtyUnit || 'no.' },
      unitPrice: (x.unitPrice==null ? '' : String(x.unitPrice).trim()),
      currency: x.currency || 'SAR',
      dims: { w: toMM(x.dims.w, x.dims.unit), h: toMM(x.dims.h, x.dims.unit), d: toMM(x.dims.d, x.dims.unit),
              mountingHeight:'', projection:'' },
      photoIds: {},
      existingPhotoIds: [],
      referencePhotoIds: [],
      presets,
      status: JSON.parse(JSON.stringify(x.status)),
      clientInputs: (x.clientInputs||[]).filter(r=>has(r.text)).map(r=>({ priority:r.priority||'required', text:r.text })),
      notes: { scope:'', site: x.notesText || '', technical:'', criticalInstaller:'' },
      keepSource: {
        file: x.keepSource.file,
        manual: !!x.manual,
        pages: x.keepSource.pages,
        rawText: x.keepSource.rawText,
        dimsRaw: x.dims.raw,
        dimsExtra: x.dims.extra || [],
        unit: x.dims.unit,
        unitConfirmed: !!(x.dims.unitExplicit || x._unitTouched),
        photoRefs: x.photos.map(p=>({ page:p.sourcePage, order:p.order, role:p.role, added:p.keep===false }))
      },
      importFlags: x.flags,
      createdAt: now(), updatedAt: now()
    });

    for(const p of x.photos){   // x.photos order is preserved -> Existing order preserved
      const pid = uid();
      const isExisting = p.role==='existing';
      const isSingle = p.role==='simulation' || p.role==='sample';
      await dbPut('photos', { id: pid, projectId: project.id, itemId: it.id,
        slot: (isExisting || isSingle) ? p.role : 'reference',
        blob: p.blob, mime:'image/jpeg', w:p.w, h:p.h, bytes:p.blob.size, createdAt: now(),
        keepPage: p.sourcePage });
      if(isExisting) it.existingPhotoIds.push(pid);
      else if(isSingle) it.photoIds[p.role] = pid;
      else it.referencePhotoIds.push(pid);
    }
    project.items.push(it);
  }
  project.updatedAt = now();
  await dbPut('projects', project);

  // mark (do NOT delete) the saved review as approved, so it stays resumable
  STATE._approved = { at: now(), projectId: project.id, projectName: project.name, itemCount: chosen.length, isNew };
  STATE.view = 'approved';
  try{ await saveReviewDraft(true); }catch(e){}

  document.querySelectorAll('.approvebar').forEach(b=>b.remove());
  shell(
    '<div class="savedok">'
    + '<div class="big2">Project saved successfully</div>'
    + '<div class="hint" style="margin-bottom:14px"><b>'+chosen.length+'</b> item'+(chosen.length>1?'s':'')+' '
    +   (isNew ? 'imported into the new project' : 'added to') + ' “<b>'+esc(project.name)+'</b>”'
    +   (isNew ? '' : ' (now '+project.items.length+' items).')
    +   ' Every item is fully editable in the dashboard. Reference photos and keepSource metadata are stored on each item.</div>'
    + '<div class="row">'
    +   '<button class="btn btn-primary btn-sm" data-open-dashboard="'+esc(project.id)+'">Open Technical Proposal</button>'
    +   '<button class="btn btn-ghost btn-sm" data-backupjson>Keep Review Backup (download JSON)</button>'
    +   '<button class="btn btn-ghost btn-sm" data-deletedraft-approved>Delete Saved Review</button>'
    + '</div>'
    + '<div class="hint mt10">Your review is still saved — you can <b>Resume Saved Review</b> from the start screen (e.g. to import remaining items into another project).</div>'
    + '<div class="row mt14"><button class="btn btn-ghost btn-sm" data-back-upload>Import another PDF</button></div>'
    + '</div>'
  );
}
function downloadReviewBackupJSON(){
  (async ()=>{
    const drafts = [];
    for(const d of STATE.drafts){
      const photos = [];
      for(const p of (d.photos||[])){
        let dataUrl = null;
        try{ if(p.blob) dataUrl = await blobToDataUrl(p.blob); }catch(_){}
        photos.push({ id:p.id, role:p.role, sourcePage:p.sourcePage==null?null:p.sourcePage, order:p.order==null?null:p.order, keep:p.keep, w:p.w||null, h:p.h||null, dataUrl });
      }
      const c = {}; for(const k in d) if(k!=='photos'){ try{ c[k]=JSON.parse(JSON.stringify(d[k])); }catch(_){ c[k]=String(d[k]); } }
      c.photos = photos; drafts.push(c);
    }
    const backup = {
      kind:'vista-technical-proposal-review-backup', version:1, savedAt:new Date().toISOString(),
      doc: STATE.doc ? { fileName:STATE.doc.fileName, pageCount:STATE.doc.pageCount, scanned:STATE.doc.scanned,
        totalText:STATE.doc.totalText, errors:STATE.doc.errors, totalGotImgs:STATE.doc.totalGotImgs,
        totalExpectedImgs:STATE.doc.totalExpectedImgs, titlesDetected:STATE.doc.titlesDetected } : null,
      projects: (STATE.projects||[]).map(p=>({id:p.id,name:p.name})),
      otherOpen: [...STATE.otherOpen],
      approved: STATE._approved || null,
      counts: { drafts:drafts.length, photos:drafts.reduce((n,d)=>n+d.photos.length,0) },
      drafts
    };
    downloadBlob(new Blob([JSON.stringify(backup)],{type:'application/json'}), 'technical-proposal-review-emergency-backup.json');
    toast('Backup JSON downloaded');
  })();
}
