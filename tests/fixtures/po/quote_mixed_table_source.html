<!DOCTYPE html>
<!-- SYNTHETIC TEST FIXTURE — rendered to an image, then embedded as an image-only table
     inside a page whose header and totals are real (selectable) text. Fictional supplier. -->
<html lang="en"><head><meta charset="utf-8"><title>Mixed page — table image</title>
<style>
  html, body { margin: 0; background: #fff; }
  body { font-family: Arial, sans-serif; font-size: 22px; color: #111; padding: 10px; width: 1080px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 2px solid #555; padding: 10px 12px; text-align: left; }
  td.n { text-align: right; }
</style></head>
<body>
<table>
  <tr><th>#</th><th>Description</th><th>Unit</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr>
  <tr><td>1</td><td>Printed flag 90x150 cm</td><td>pcs</td><td class="n">5</td><td class="n">60.00</td><td class="n">300.00</td></tr>
  <tr><td>2</td><td>Printed flag 90x150 cm</td><td>pcs</td><td class="n">5</td><td class="n">60.00</td><td class="n">300.00</td></tr>
  <tr><td>3</td><td>Flag pole, aluminium 6 m</td><td>pcs</td><td class="n">2</td><td class="n">450.00</td><td class="n">900.00</td></tr>
</table>
</body></html>
