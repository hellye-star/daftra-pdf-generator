<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vista United — Technical Proposal Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Vista United — Technical Proposal Builder · Dashboard (Milestone 1)
     Data entry only. Persistence: IndexedDB. Render template (PDF) is
     the SEPARATE approved file and is not touched here.
     Brand: Deep Emerald #1A5C46 · Forest #0E3D2E · Warm Gold #B8A47C
            Warm Cream #FAF8F4 · Inter (UI) · Playfair Display (headings)
     ============================================================ */
  :root{
    --paper:#FFFFFF; --cream:#FAF8F4; --cream-2:#FBF9F6; --cream-edge:#ECE5D8;
    --emerald:#1A5C46; --emerald-soft:#3A7A62; --emerald-wash:#EEF4F0; --forest:#0E3D2E;
    --gold:#B8A47C; --gold-ink:#8C7643; --gold-wash:#F7F1E6;
    --ink:#1E1E1B; --grey:#5A5A54; --grey-soft:#8A897F; --faint:#B6B4AA;
    --rule:#E3E1D9; --rule-strong:#CBC8BE;
    --stop:#9C3A34; --stop-wash:#F6EAE8; --amber:#8A5E1E; --amber-wash:#F7F0E1;
    --r:11px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Inter','Helvetica Neue',Arial,sans-serif; color:var(--ink);
    background:var(--cream-2); line-height:1.45; font-size:14px;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  button{ font:inherit; cursor:pointer; color:inherit; }
  input,textarea,select{
    font:inherit; width:100%; border:1px solid var(--rule-strong); border-radius:8px;
    padding:9px 10px; background:var(--paper); color:var(--ink); outline:none;
  }
  input:focus,textarea:focus,select:focus{ border-color:var(--emerald); }
  textarea{ resize:vertical; min-height:58px; line-height:1.5; }
  ::placeholder{ color:var(--faint); }
  a{ color:var(--emerald); }

  /* ---------- app frame ---------- */
  .appbar{
    position:sticky; top:0; z-index:30; background:var(--paper);
    border-bottom:1px solid var(--emerald);
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  .appbar .mark{ width:20px; height:20px; flex:0 0 auto; }
  .appbar .mark svg{ width:100%; height:100%; display:block; }
  .appbar .back{
    border:1px solid var(--rule-strong); background:var(--paper); border-radius:8px;
    padding:6px 10px; font-size:13px; color:var(--emerald); font-weight:600; flex:0 0 auto;
  }
  .appbar .title{
    font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:16px;
    color:var(--emerald); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .appbar .save{ font-size:11px; color:var(--grey-soft); flex:0 0 auto; letter-spacing:.02em; min-width:56px; text-align:right; }
  .appbar .save.on{ color:var(--emerald-soft); }
  .appbar .menu{
    border:1px solid var(--rule-strong); background:var(--paper); border-radius:8px;
    width:34px; height:32px; font-size:16px; color:var(--grey); flex:0 0 auto;
  }
  .wrap{ max-width:780px; margin:0 auto; padding:14px 12px 130px; }

  h2.screen{ font-family:'Playfair Display',Georgia,serif; font-weight:600; color:var(--emerald); font-size:20px; margin:2px 2px 12px; }

  /* ---------- card ---------- */
  .card{ background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:13px; margin-bottom:11px; }
  .card > .eyebrow{
    font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-ink);
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .card > .eyebrow .rt{ margin-left:auto; font-weight:600; letter-spacing:.04em; color:var(--grey-soft); text-transform:none; font-size:10px; }
  .card.collapsed > .body{ display:none; }
  .card > .eyebrow.tog{ cursor:pointer; }
  .card > .eyebrow.tog::after{ content:"–"; margin-left:8px; color:var(--faint); font-weight:400; }
  .card.collapsed > .eyebrow.tog::after{ content:"+"; }

  .field{ margin-bottom:10px; }
  .field:last-child{ margin-bottom:0; }
  .field > label{ display:block; font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:4px; }
  .row{ display:flex; gap:9px; }
  .row > *{ flex:1; min-width:0; }
  .mt6{ margin-top:7px; } .mt10{ margin-top:10px; }
  .hint{ font-size:11px; color:var(--grey-soft); margin-top:3px; }
  .muted{ color:var(--grey-soft); }

  /* ---------- buttons ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:9px; padding:11px 16px; font-weight:600; font-size:14px; border:1px solid transparent; }
  .btn-primary{ background:var(--emerald); color:#fff; }
  .btn-ghost{ background:var(--paper); border-color:var(--emerald); color:var(--emerald); }
  .btn-sm{ padding:8px 12px; font-size:12.5px; border-radius:8px; }
  .btn.full{ width:100%; }
  .linkbtn{ background:none; border:0; color:var(--emerald); font-weight:600; font-size:13px; text-decoration:underline; padding:6px 2px; }
  .pricetotal{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:19px; color:var(--emerald); padding:4px 0 2px; }
  .pricetotal .muted{ font-family:'Inter',system-ui,sans-serif; font-size:14px; font-weight:400; }
  .checkrow{ display:flex; align-items:flex-start; gap:9px; cursor:pointer; padding:2px 0; }
  .checkrow input{ width:16px; height:16px; margin-top:1px; flex:0 0 auto; accent-color:var(--emerald); }
  .checkrow .cr-tx{ font-size:13px; color:var(--ink); font-weight:500; }
  .checkrow .cr-tx small{ display:block; font-weight:400; color:var(--grey-soft); font-size:11px; margin-top:2px; }

  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--paper);
    border-top:1px solid var(--rule); display:flex; gap:9px; flex-wrap:wrap;
    padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  .bottombar .btn{ flex:1 1 120px; white-space:nowrap; }

  /* ---------- projects list ---------- */
  .plist{ display:flex; flex-direction:column; gap:9px; }
  .pcard{ background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:13px; display:flex; align-items:flex-start; gap:10px; }
  .pcard .pmain{ flex:1; min-width:0; }
  .pcard .pn{ font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:16px; color:var(--forest); }
  .pcard .psub{ font-size:12px; color:var(--grey); margin-top:2px; }
  .pcard .pmeta{ font-size:11px; color:var(--grey-soft); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
  .pcard .revb{ font-size:10px; font-weight:700; color:var(--gold-ink); background:var(--gold-wash); border:1px solid var(--cream-edge); padding:2px 7px; border-radius:5px; letter-spacing:.05em; }
  .emptyish{ text-align:center; padding:40px 16px; color:var(--grey-soft); }
  .emptyish .big{ font-family:'Playfair Display',Georgia,serif; font-size:20px; color:var(--emerald); margin-bottom:6px; }

  /* ---------- item list (overview) ---------- */
  .itemrow{ display:flex; flex-wrap:wrap; gap:8px 9px; align-items:center; background:var(--paper); border:1px solid var(--rule);
    border-radius:10px; padding:9px 10px; margin-bottom:8px; }
  .itemrow .irtap{ display:flex; gap:9px; align-items:center; flex:1 1 150px; min-width:0; }
  .itemrow .thumb{ width:46px; height:36px; border-radius:6px; object-fit:cover; background:var(--cream); border:1px solid var(--rule); flex:0 0 auto; }
  .itemrow .thumb.empty{ display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--faint); }
  .itemrow .imain{ flex:1 1 auto; min-width:0; }
  .itemrow .inum{ font-family:'Playfair Display',Georgia,serif; font-weight:700; color:var(--gold-ink); font-size:12px; }
  .itemrow .inm{ font-weight:600; color:var(--forest); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .itemrow .isub{ font-size:11px; color:var(--grey-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .itemrow .flags{ display:flex; gap:5px; align-items:center; flex-wrap:wrap; flex:1 1 100%; margin-top:2px; order:3; }
  .sc{ font-size:8.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; padding:2px 5px; border-radius:4px; white-space:nowrap; }
  .sc.g{ background:var(--emerald); color:#fff; } .sc.gw{ background:var(--emerald-wash); color:var(--emerald); }
  .sc.p{ background:var(--cream); color:var(--grey); border:1px solid var(--cream-edge); }
  .sc.r{ background:var(--stop-wash); color:var(--stop); } .sc.a{ background:var(--gold-wash); color:var(--gold-ink); }
  .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .dot.urgent{ background:var(--stop); } .dot.sample{ background:var(--amber); }
  .itemrow .ord{ display:flex; gap:4px; flex:0 0 auto; }
  .itemrow .ord button, .itemrow .rowmenu{ width:30px; height:30px; border:1px solid var(--rule-strong); background:var(--paper); border-radius:6px; font-size:12px; color:var(--grey); line-height:1; }
  .itemrow .ord button:disabled{ opacity:.35; }

  /* ---------- chips / segmented ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ display:inline-flex; align-items:center; min-height:34px; padding:5px 11px; border-radius:18px;
    border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink); font-size:12.5px; }
  .chip.on{ background:var(--emerald); border-color:var(--emerald); color:#fff; font-weight:600; }
  .chip.other{ border-style:dashed; color:var(--gold-ink); }
  .chip.other.on{ background:var(--gold-ink); border-color:var(--gold-ink); color:#fff; border-style:solid; }
  .chip.sub{ min-height:30px; font-size:12px; padding:4px 10px; }
  .subgroup{ margin-top:9px; padding:9px 10px; background:var(--emerald-wash); border-radius:8px; }
  .subgroup .sglabel{ font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--emerald); margin-bottom:6px; }

  .pgroup{ padding:11px 0; border-bottom:1px solid var(--rule); }
  .pgroup:first-child{ padding-top:2px; } .pgroup:last-child{ border-bottom:0; padding-bottom:2px; }
  .pgroup .pglabel{ font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:7px; display:flex; gap:8px; align-items:baseline; }
  .pgroup .pgsumm{ font-size:11px; color:var(--emerald); font-weight:500; margin-left:auto; text-align:right; max-width:60%; text-transform:none; letter-spacing:0; }

  .seg{ display:flex; border:1px solid var(--rule-strong); border-radius:8px; overflow:hidden; }
  .seg button{ flex:1; min-height:40px; background:var(--paper); border:0; border-right:1px solid var(--rule);
    font-size:11.5px; color:var(--grey); padding:4px 5px; font-weight:500; }
  .seg button:last-child{ border-right:0; }
  .seg button.on{ background:var(--emerald); color:#fff; font-weight:700; }
  .seg.warn button.on{ background:var(--stop); }
  .seg.small button{ min-height:34px; font-size:11px; }

  /* ---------- photos ---------- */
  .photogrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .photoslot{ position:relative; border:1.5px dashed var(--rule-strong); border-radius:10px; background:var(--cream);
    aspect-ratio:4/3; overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; width:100%; }
  .photoslot.primary{ grid-column:1 / -1; aspect-ratio:16/9; border-color:var(--emerald); background:var(--emerald-wash); margin-bottom:9px; }
  .photoslot.filled{ border-style:solid; border-color:var(--rule-strong); background:var(--cream); }
  .photoslot img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photoslot .ph-label{ padding:12px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--emerald); }
  .photoslot .ph-label small{ display:block; font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--grey-soft); margin-top:4px; font-size:10.5px; }
  .photoslot .ph-label .cam{ font-size:20px; }
  .photoslot .ph-tag{ position:absolute; left:6px; bottom:6px; background:rgba(255,255,255,.92); color:var(--forest);
    font-size:8.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:3px 6px; border-radius:4px; }
  .photoslot .ph-actions{ position:absolute; right:6px; top:6px; display:flex; gap:5px; }
  .photoslot .ph-actions button{ background:rgba(255,255,255,.94); border:1px solid var(--rule-strong); border-radius:6px;
    font-size:10.5px; font-weight:600; color:var(--forest); padding:4px 7px; }
  .photoslot .ph-actions button.del{ color:var(--stop); }
  .photoslot .ph-size{ position:absolute; right:6px; bottom:6px; background:rgba(255,255,255,.9); color:var(--grey-soft);
    font-size:8.5px; padding:2px 5px; border-radius:4px; }
  .exlabel{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--emerald); margin-bottom:7px; }
  .exlabel .rt{ font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--grey-soft); font-size:10.5px; margin-left:6px; }
  .exgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; }
  .exphoto{ position:relative; border:1px solid var(--rule-strong); border-radius:9px; overflow:hidden; aspect-ratio:4/3; background:var(--cream); }
  .exphoto img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
  .exphoto .exnum{ position:absolute; left:6px; top:6px; background:var(--emerald); color:#fff; font-size:10px; font-weight:700;
    width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .exphoto .exphoto-acts{ position:absolute; left:0; right:0; bottom:0; display:flex; gap:0; background:rgba(255,255,255,.94); border-top:1px solid var(--rule); }
  .exphoto .exphoto-acts button{ flex:1; background:none; border:0; border-right:1px solid var(--rule); padding:6px 0; font-size:12px; font-weight:600; color:var(--forest); }
  .exphoto .exphoto-acts button:last-child{ border-right:0; }
  .exphoto .exphoto-acts button.del{ color:var(--stop); }
  .exphoto .exphoto-acts button[disabled]{ opacity:.3; }
  .exadd{ border:1.5px dashed var(--rule-strong); border-radius:9px; background:var(--cream); aspect-ratio:4/3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--emerald);
    font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; }
  .exadd span{ font-size:22px; line-height:1; }
  /* gallery lightbox nav */
  .lightbox .nav{ position:absolute; top:50%; transform:translateY(-50%); background:#fff; border:0; width:42px; height:56px;
    font-size:22px; font-weight:700; border-radius:8px; color:var(--forest); }
  .lightbox .nav.prev{ left:14px; } .lightbox .nav.next{ right:14px; }
  .lightbox .cnt{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:#fff; border-radius:14px;
    padding:5px 12px; font-size:12px; font-weight:600; color:var(--forest); }

  /* ---------- client inputs ---------- */
  .ci-item{ margin-bottom:12px; }
  .ci-item .cirow{ margin-bottom:6px; }
  .ci-action{ width:100%; box-sizing:border-box; font-size:11.5px; padding:7px 9px; color:var(--grey); }
  .ci-ar-row{ display:flex; gap:6px; align-items:stretch; margin-top:5px; }
  .ci-ar-row .ci-action-ar{ flex:1; margin-top:0; direction:rtl; text-align:right; font-size:12.5px;
    font-family:'Segoe UI','Noto Sans Arabic','Almarai','Inter',sans-serif; }
  .btn-xs{ padding:5px 9px; font-size:11px; border-radius:7px; flex:0 0 auto; }
  .ci-arabize{ align-self:stretch; }
  .cirow{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:10px;
    border:1px solid var(--rule); border-radius:9px; padding:8px; }
  .cirow .seg{ flex:1 1 170px; }
  .cirow .seg button{ min-height:36px; font-size:10.5px; }
  .cirow .seg.u button.on{ background:var(--stop); }
  .cirow .seg.q button.on{ background:var(--gold-ink); }
  .cirow input{ flex:1 1 100%; order:3; }
  .cirow .del{ flex:0 0 auto; width:34px; height:34px; border:1px solid var(--rule-strong); background:var(--paper); border-radius:7px; color:var(--stop); font-size:13px; }
  @media (min-width:620px){
    .cirow{ flex-wrap:nowrap; border:0; padding:0; }
    .cirow .seg{ flex:0 0 190px; }
    .cirow input{ flex:1 1 auto; order:0; }
  }

  /* ---------- overlays ---------- */
  .overlay{ position:fixed; inset:0; z-index:60; background:rgba(14,26,20,.66); display:flex; align-items:center; justify-content:center; padding:18px; }
  .lightbox img{ max-width:100%; max-height:82vh; border-radius:8px; display:block; }
  .lightbox .x{ position:absolute; top:14px; right:16px; background:#fff; border:0; border-radius:8px; padding:8px 12px; font-weight:700; }
  .dialog{ background:var(--paper); border-radius:12px; padding:18px; max-width:340px; width:100%; }
  .dialog h3{ font-family:'Playfair Display',serif; color:var(--emerald); font-size:17px; margin-bottom:6px; }
  .dialog p{ font-size:13px; color:var(--grey); margin-bottom:14px; }
  .dialog .acts{ display:flex; gap:9px; } .dialog .acts .btn{ flex:1; }
  .btn-danger{ background:var(--stop); color:#fff; }

  .toast{ position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:70;
    background:var(--forest); color:#fff; font-size:12.5px; font-weight:500; padding:9px 15px; border-radius:20px;
    opacity:0; transition:opacity .18s; pointer-events:none; }
  .toast.show{ opacity:1; }

  .banner{ background:var(--stop-wash); border:1px solid #E0C4C1; color:var(--stop); font-size:12px; border-radius:9px; padding:9px 11px; margin-bottom:11px; }

  .sheetmenu{ position:fixed; inset:0; z-index:60; background:rgba(14,26,20,.4); display:flex; align-items:flex-end; }
  .sheetmenu .inner{ background:var(--paper); width:100%; border-radius:14px 14px 0 0; padding:8px 8px calc(14px + env(safe-area-inset-bottom)); }
  .sheetmenu button{ display:block; width:100%; text-align:left; background:none; border:0; padding:14px 12px; font-size:14.5px; border-bottom:1px solid var(--rule); }
  .sheetmenu button:last-child{ border-bottom:0; }
  .sheetmenu button.danger{ color:var(--stop); font-weight:600; }

  @media (min-width:560px){
    .cirow .seg{ flex:0 0 190px; }
  }
  /* ---------- export / preview ---------- */
  .expv{ border:1px solid var(--rule-strong); border-radius:9px; overflow:hidden; background:#DDDBD5; }
  .expv iframe{ width:100%; height:68vh; min-height:420px; border:0; display:block; background:#DDDBD5; }
  .expitem{ display:flex; align-items:center; gap:9px; padding:8px 2px; border-bottom:1px solid var(--rule); font-size:13px; }
  .expitem:last-child{ border-bottom:0; }
  .expitem input{ width:16px; height:16px; flex:0 0 auto; }
  .expitem b{ color:var(--gold-ink); }
  .expitems{ margin-left:6px; }

  /* ---------- Create Vista Quotation (Phase 1 bridge) ---------- */
  .qitem{ border:1px solid var(--rule); border-radius:10px; padding:12px; margin-bottom:11px; background:var(--paper); }
  .qitem.off{ opacity:.5; }
  .qitem-head{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .qitem-head .qnum{ font-size:11px; font-weight:700; color:var(--gold-ink); }
  .qitem-head input[type=checkbox]{ width:16px; height:16px; flex:0 0 auto; accent-color:var(--emerald); }
  .qphotos{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .qph{ width:112px; border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--cream); }
  .qph.p{ border-color:var(--emerald); box-shadow:0 0 0 1px var(--emerald) inset; }
  .qph.s{ border-color:var(--gold-ink); box-shadow:0 0 0 1px var(--gold-ink) inset; }
  .qph img{ display:block; width:100%; height:78px; object-fit:cover; cursor:pointer; }
  .qph-tag{ font-size:8.5px; font-weight:700; letter-spacing:.08em; text-align:center; padding:2px 0; color:var(--grey-soft); min-height:14px; }
  .qph.p .qph-tag{ color:var(--emerald); }
  .qph.s .qph-tag{ color:var(--gold-ink); }
  .qph-btns{ display:flex; border-top:1px solid var(--rule); }
  .qph-btns button{ flex:1; font-size:9.5px; padding:4px 0; background:var(--paper); border:0; border-right:1px solid var(--rule); color:var(--grey-soft); }
  .qph-btns button:last-child{ border-right:0; }
  .qph-btns button.on{ background:var(--emerald); color:#fff; }
  .qph-none{ font-size:11px; color:var(--faint); padding:6px 0; }
  .qwarn{ background:#FBF3E0; border:1px solid #E7D5A8; color:var(--gold-ink); font-size:12px; border-radius:9px; padding:9px 11px; margin-bottom:11px; }
  .qc-picker{ border:1px solid var(--rule); border-radius:10px; padding:10px; margin-bottom:11px; background:var(--cream); }

/* ============================================================
   3 · IndexedDB — projects + photos (blobs). Used from the start
      so the PWA milestone needs no storage rewrite.
   ============================================================ */
const DB_NAME='vista_tpb', DB_VER=1;
let _dbp=null;
function openDB(){
  if(_dbp) return _dbp;
  _dbp = new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('projects')) db.createObjectStore('projects',{keyPath:'id'});
      if(!db.objectStoreNames.contains('photos')){
        const s = db.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('by_project','projectId');
        s.createIndex('by_item','itemId');
      }
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return _dbp;
}
function reqP(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

/* Optional volatile store — only for ?screens=1 review captures (no persistence).
   The shipping app always uses IndexedDB. */
const MEM = { on:false, projects:new Map(), photos:new Map() };
function memOut(store,v){
  if(v==null) return v;
  if(store==='photos') return v;               // keep Blob reference intact
  return JSON.parse(JSON.stringify(v));         // detach project docs
}
function memIn(store,v){ return store==='photos' ? v : JSON.parse(JSON.stringify(v)); }

/* ============================================================
   3b · Storage backend switch  (Phase 1 — central DB)
   ------------------------------------------------------------
   STORE_MODE: 'idb'     → browser IndexedDB (default, unchanged)
               'central' → proxy.py → ~/.vista-platform/technical-proposals/*.db
   The 5 db* helpers below dispatch on STORE_MODE. Every call site
   in the app is unchanged. Migration COPIES idb → central, VERIFIES,
   then flips the localStorage flag — it never writes/moves/clears idb.
   ============================================================ */
let STORE_MODE = 'idb';
const TP_API_BASE = '/api/tp';

/* raw IndexedDB implementation (also honours the ?screens=1 MEM shim) */
const IDB = {
  async get(store,key){
    if(MEM.on) return memOut(store, MEM[store].get(key)) || undefined;
    const d=await openDB(); return reqP(d.transaction(store).objectStore(store).get(key));
  },
  async getAll(store){
    if(MEM.on) return [...MEM[store].values()].map(v=>memOut(store,v));
    const d=await openDB(); return reqP(d.transaction(store).objectStore(store).getAll());
  },
  async put(store,val){
    if(MEM.on){ MEM[store].set(val.id, memIn(store,val)); return val.id; }
    const d=await openDB(); return reqP(d.transaction(store,'readwrite').objectStore(store).put(val));
  },
  async del(store,key){
    if(MEM.on){ MEM[store].delete(key); return; }
    const d=await openDB(); return reqP(d.transaction(store,'readwrite').objectStore(store).delete(key));
  },
  async indexAll(store,index,key){
    if(MEM.on){
      const f = index==='by_project' ? 'projectId' : 'itemId';
      return [...MEM[store].values()].filter(r=>r[f]===key).map(v=>memOut(store,v));
    }
    const d=await openDB(); return reqP(d.transaction(store).objectStore(store).index(index).getAll(key));
  }
};

async function tpFetch(path, opts){
  const r = await fetch(TP_API_BASE + path, opts);
  let j = null; try{ j = await r.json(); }catch(_){}
  if(!r.ok || !j || j.ok === false){
    const err = new Error((j && j.error) || ('HTTP ' + r.status));
    err.httpStatus = r.status;
    throw err;
  }
  return j.data;
}
async function blobToB64(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let s = '';
  for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(s);
}

/* central implementation — talks to proxy.py /api/tp/* */
const TP_API = {
  async get(store,key){
    try{
      if(store==='projects') return await tpFetch('/projects/'+encodeURIComponent(key));
      if(store==='photos')   return await tpFetch('/photos/'+encodeURIComponent(key)+'/meta');
    }catch(e){ if(e.httpStatus===404) return undefined; throw e; }
  },
  async getAll(store){
    if(store==='projects') return await tpFetch('/projects');
    if(store==='photos')   return await tpFetch('/photos');
    return [];
  },
  async put(store,val){
    if(store==='projects'){
      await tpFetch('/projects/'+encodeURIComponent(val.id),
        { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(val) });
      return val.id;
    }
    if(store==='photos'){
      const dataBase64 = val.blob ? await blobToB64(val.blob) : (val.dataBase64 || '');
      await tpFetch('/photos?overwrite=1', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id:val.id, projectId:val.projectId, itemId:val.itemId, slot:val.slot,
          mime:val.mime, w:val.w, h:val.h, keepPage:(val.keepPage!=null?val.keepPage:null), dataBase64 }) });
      return val.id;
    }
  },
  async del(store,key){
    const path = (store==='projects' ? '/projects/' : '/photos/') + encodeURIComponent(key);
    try{ await tpFetch(path, {method:'DELETE'}); }
    catch(e){ if(e.httpStatus !== 404) throw e; }   // deletion is idempotent
  },
  async indexAll(store,index,key){
    if(store==='photos'){
      if(index==='by_item'){
        const all = await tpFetch('/photos');
        return all.filter(p=> p.itemId===key);
      }
      return await tpFetch('/photos?projectId='+encodeURIComponent(key));
    }
    return [];
  }
};

function _store(){ return STORE_MODE==='central' ? TP_API : IDB; }
async function dbGet(store,key){          return _store().get(store,key); }
async function dbGetAll(store){           return _store().getAll(store); }
async function dbPut(store,val){          return _store().put(store,val); }
async function dbDel(store,key){          return _store().del(store,key); }
async function dbIndexAll(store,index,key){ return _store().indexAll(store,index,key); }

/* ============================================================
   4b · Execution Roadmap — model (M-Exec-1: manual only)
   ------------------------------------------------------------
   item.execution = { horizon:15, activities:[ {activity} ] }
   Created LAZILY — only when the user first edits the roadmap.
   No auto-planning, no dependencies yet (structure is forward-
   compatible so M-Exec-2 can add dependsOn without migration).
   ============================================================ */
const RM_HORIZON_MIN = 5, RM_HORIZON_MAX = 60, RM_HORIZON_DEFAULT = 15;
const EXECUTION_ACTIVITY_CATALOGUE = [
  ['site-verification','Site Verification'],
  ['client-artwork','Await Client Artwork'],
  ['design-adaptation','Design / Adaptation'],
  ['client-approval','Client Approval'],
  ['sample-mockup','Sample / Mockup'],
  ['remove-existing','Remove Existing'],
  ['surface-prep','Surface Preparation'],
  ['material-procurement','Material Procurement'],
  ['fabrication','Fabrication'],
  ['printing-branding','Printing / Branding'],
  ['painting-finishing','Painting / Finishing'],
  ['electrical-led','Electrical / LED'],
  ['assembly','Assembly'],
  ['qc','QC'],
  ['packing','Packing'],
  ['transportation','Transportation'],
  ['site-access-prep','Site Access Preparation'],
  ['installation','Installation'],
  ['testing','Testing'],
  ['snag-handover','Snag / Final Handover'],
];
const RM_PHASE = {
  'site-verification':'plan', 'client-artwork':'plan',
  'design-adaptation':'design', 'client-approval':'design', 'sample-mockup':'design',
  'remove-existing':'site', 'surface-prep':'site', 'site-access-prep':'site',
  'material-procurement':'prod', 'fabrication':'prod', 'printing-branding':'prod',
  'painting-finishing':'prod', 'electrical-led':'prod', 'assembly':'prod',
  'qc':'dispatch', 'packing':'dispatch', 'transportation':'dispatch',
  'installation':'install', 'testing':'install', 'snag-handover':'close',
};
function rmPhase(a){ return (a && a.isWait) ? 'wait' : (RM_PHASE[a && a.key] || 'custom'); }
const RM_PROGRESS = [['not_started','Not started'],['in_progress','In progress'],['done','Done']];

function rmClampHorizon(n){
  n = parseInt(n,10);
  if(!isFinite(n)) return RM_HORIZON_DEFAULT;
  return Math.max(RM_HORIZON_MIN, Math.min(RM_HORIZON_MAX, n));
}
// Lazily create the execution object the first time it is actually needed.
function rmEnsureExecution(item){
  if(!item.execution || typeof item.execution !== 'object') item.execution = { activities: [] };
  if(!Array.isArray(item.execution.activities)) item.execution.activities = [];
  if(item.execution.horizon == null) item.execution.horizon = RM_HORIZON_DEFAULT;
  if(!Array.isArray(item.execution.risks)) item.execution.risks = [];
  if(!Array.isArray(item.execution.dismissedRuleKeys)) item.execution.dismissedRuleKeys = [];
  if(!Array.isArray(item.clientInputs)) item.clientInputs = [];
  return item.execution;
}
/* ---- Risk Buffer (M-Exec-6): one combined contingency block after planned finish ---- */
const RM_BUFFER_NOTE = 'Risk Buffer covers potential delays related to site / security access, '
  + 'material availability, weather / installer conditions, and design complexity.';
function rmRiskBuffer(item){
  const b = item && item.execution ? Math.round(+item.execution.riskBuffer) : 0;
  return isFinite(b) && b > 0 ? Math.min(b, RM_HORIZON_MAX) : 0;
}
function rmPlannedFinish(item){
  const acts = (item && item.execution && item.execution.activities) || [];
  return acts.reduce((m,a)=> Math.max(m, +a.endDay||0, +a.startDay||0), 0);
}
function rmExpectedFinish(item){
  const pf = rmPlannedFinish(item);
  return pf ? pf + rmRiskBuffer(item) : 0;
}
function rmHorizonOf(item){
  const ex = item.execution;
  const base = ex && ex.horizon != null ? rmClampHorizon(ex.horizon) : RM_HORIZON_DEFAULT;
  const maxEnd = (ex && ex.activities || []).reduce((m,a)=> Math.max(m, +a.endDay||0, +a.startDay||0), 0);
  return Math.min(RM_HORIZON_MAX, Math.max(base, maxEnd + rmRiskBuffer(item)));   // grow to fit bars + buffer, never shrink below them
}
function rmNewActivity(key, label){
  const isCustom = key === 'custom';
  return {
    id: uid(),
    key: isCustom ? 'custom' : key,
    label: label || (EXECUTION_ACTIVITY_CATALOGUE.find(c=>c[0]===key) || [,'Custom activity'])[1],
    startDay: 1,
    endDay: 2,
    parallel: false,
    isWait: key === 'client-artwork',   // the one catalogue entry that IS a wait by name
    progress: 'not_started',
    note: '',
    dependsOn: [],       // M-Exec-2: [{on, kind:'FS'|'SS', lagDays, hard}]
    source: 'manual',    // 'manual' | 'suggested'
  };
}
function rmSanitizeDay(v, fallback){
  let n = parseInt(v,10);
  if(!isFinite(n)) n = fallback;
  return Math.max(1, Math.min(RM_HORIZON_MAX, n));
}
function rmSanitizeLag(v){ let n = parseInt(v,10); return isFinite(n) ? Math.max(-30, Math.min(30, n)) : 0; }

/* ============================================================
   4c · Execution Roadmap — SUGGESTION ENGINE (M-Exec-2)
   ------------------------------------------------------------
   Reads the item's REAL Technical Proposal data (presets / status
   / photos / notes) to propose a relevant, partly-parallel plan
   with soft/hard dependencies. Everything it produces is a plain
   activity object — fully editable afterwards. Nothing is applied
   without an explicit Apply in the preview.
   ============================================================ */
const RM_MILESTONES = [
  ['final-artwork','Final Artwork'],
  ['design-approval','Design Approval'],
  ['sample-approval','Sample Approval'],
  ['material-ready','Material Ready'],
  ['fabrication-complete','Fabrication Complete'],
  ['site-access-approved','Site Access Approved'],
  ['power-confirmed','Power Confirmed'],
];
const RM_MS_LABEL = {}; RM_MILESTONES.forEach(m=> RM_MS_LABEL[m[0]] = m[1]);

// dependency tuples: [on, kind, lagDays, hard]   (on = catalogue key or milestone key)
const RM_ACT_DEFAULTS = {
  'site-verification':    { dur:2, dep:[], parallelKey:true },
  'client-artwork':       { dur:4, dep:[], wait:true },
  'design-adaptation':    { dur:3, dep:[['final-artwork','FS',0,false]] },
  'client-approval':      { dur:2, dep:[['design-adaptation','FS',0,true]] },
  'sample-mockup':        { dur:3, dep:[['client-approval','FS',0,false]] },
  'remove-existing':      { dur:2, dep:[], parallelKey:true },
  'surface-prep':         { dur:1, dep:[['remove-existing','FS',0,false]], parallelKey:true },
  'material-procurement': { dur:5, dep:[], parallelKey:true },
  'fabrication':          { dur:6, dep:[['material-ready','SS',0,false],['design-approval','FS',0,false]] },
  'printing-branding':    { dur:2, dep:[['final-artwork','FS',0,true]] },
  'painting-finishing':   { dur:2, dep:[['fabrication','SS',2,false]] },
  'electrical-led':       { dur:2, dep:[['fabrication','SS',2,false]] },
  'assembly':             { dur:2, dep:[['fabrication','FS',0,false]] },
  'qc':                   { dur:1, dep:[['fabrication-complete','FS',0,true]] },
  'packing':              { dur:1, dep:[['qc','FS',0,true]] },
  'transportation':       { dur:1, dep:[['packing','FS',0,true]] },
  'site-access-prep':     { dur:2, dep:[], parallelKey:true },
  'installation':         { dur:1, dep:[['transportation','FS',0,true],['site-access-approved','FS',0,true],['remove-existing','FS',0,false]] },
  'testing':              { dur:1, dep:[['installation','FS',0,true]] },
  'snag-handover':        { dur:1, dep:[['installation','FS',0,true]] },
};
const RM_SOFT_FS_OVERLAP = 1;   // a soft finish-to-start dep may overlap its predecessor by this many days

// ---- activity relevance from the real item data (never invents scope) ----
function rmSuggestKeys(item){
  const P = item.presets || {};
  const S = item.status || {};
  const gv = k => (P[k] && Array.isArray(P[k].values)) ? P[k].values : [];
  const someIn = (a,b) => a.some(x=> b.indexOf(x) !== -1);

  const branding = gv('branding'), fabrication = gv('fabrication'), material = gv('material'),
        finish = gv('finish'), existingWork = gv('existingWork'),
        lighting = gv('lighting').filter(x=> x && x !== 'None'), access = gv('access');

  const designApproved = S.design === 'approved';
  const fabRelevant   = fabrication.length > 0 || (material.length > 0 && !(material.length === 1 && material[0] === 'Existing Surface'));
  const needArtwork   = branding.length > 0 || fabrication.indexOf('3D Letters') !== -1;
  const printRelevant = someIn(branding, ['UV Print','Screen Print','Sticker / Vinyl Branding','Cut Vinyl','Paint Branding'])
                        || (branding.length > 0 && !fabRelevant);
  const paintRelevant = finish.some(f => ['Sticker / Wrapped','Laminated'].indexOf(f) === -1) && finish.length > 0;
  const removeExisting = someIn(existingWork, ['Remove Existing','Modify Existing','Replace Branding Only']);
  const surfacePrep   = someIn(existingWork, ['Surface Preparation','Repaint']) || material.indexOf('Existing Surface') !== -1;
  const matProc       = material.length > 0 && !(material.length === 1 && material[0] === 'Existing Surface');
  const elec          = lighting.length > 0;
  const accessPrep    = someIn(access, ['Scaffold','Scissor Lift','Boom Lift','Crane']);
  const assembly      = someIn(fabrication, ['Box-Up','3D Letters','Welded Structure','Custom Fabrication']) || branding.indexOf('3D Letters') !== -1;
  const sampleRelevant = S.sample && S.sample !== 'na';
  const anyProduction = fabRelevant || printRelevant || paintRelevant || elec || assembly;

  const want = new Set();
  const add = (k, on) => { if(on) want.add(k); };
  add('site-verification', true);
  add('client-artwork',    needArtwork && !designApproved);
  add('design-adaptation', needArtwork && !designApproved);
  add('client-approval',   !designApproved);
  add('sample-mockup',     sampleRelevant);
  add('remove-existing',   removeExisting);
  add('surface-prep',      surfacePrep);
  add('material-procurement', matProc);
  add('fabrication',       fabRelevant);
  add('printing-branding', printRelevant);
  add('painting-finishing', paintRelevant);
  add('electrical-led',    elec);
  add('assembly',          assembly);
  add('qc',                anyProduction);
  add('packing',           anyProduction);
  add('transportation',    true);
  add('site-access-prep',  accessPrep);
  add('installation',      true);
  add('testing',           elec);
  add('snag-handover',     true);
  return EXECUTION_ACTIVITY_CATALOGUE.map(c => c[0]).filter(k => want.has(k));
}

// ---- forward-pass scheduler over activity stubs / real activities ----
function rmSchedule(acts){
  const byKey = {}; acts.forEach(a=>{ if(a.key && a.key !== 'custom') byKey[a.key] = a; });
  const sched = new Map();
  const ms = {};
  const dur = a => Math.max(1, (+a.dur || ((+a.endDay||1) - (+a.startDay||1) + 1)) || 1);

  const refreshMs = () => {
    const endOf = k => { const t = byKey[k]; return (t && sched.has(t)) ? sched.get(t).end : 0; };
    ms['final-artwork']        = endOf('client-artwork');
    ms['design-approval']      = endOf('client-approval') || endOf('design-adaptation');
    ms['sample-approval']      = endOf('sample-mockup');
    ms['material-ready']       = endOf('material-procurement');
    ms['fabrication-complete'] = endOf('fabrication');
    ms['site-access-approved'] = endOf('site-access-prep');
    ms['power-confirmed']      = 0;
  };

  for(let iter = 0; iter < acts.length + 5; iter++){
    let changed = false;
    for(const a of acts){
      let est = 1;
      for(const d of (a.dependsOn || [])){
        let ds = null, de = null;
        if(RM_MS_LABEL[d.on] != null){ const md = ms[d.on] || 0; ds = md; de = md; }
        else { const t = byKey[d.on] || acts.find(x=>x.id===d.on); if(t && sched.has(t)){ ds = sched.get(t).start; de = sched.get(t).end; } }
        if(ds == null) continue;
        const lag = +d.lagDays || 0;
        let need = (d.kind === 'SS') ? (ds + lag) : (de + lag + 1);
        if(d.hard){ est = Math.max(est, need); }
        else if(d.kind === 'SS'){ est = Math.max(est, ds); }
        else { est = Math.max(est, need - RM_SOFT_FS_OVERLAP); }
      }
      est = Math.max(1, est);
      const end = est + dur(a) - 1;
      const cur = sched.get(a);
      if(!cur || cur.start !== est || cur.end !== end){ sched.set(a, { start: est, end }); changed = true; }
    }
    refreshMs();
    if(!changed && iter > 1) break;
  }
  return { sched, ms };
}

// ---- build a full suggested plan (list of plain activity objects + milestone days) ----
function rmSuggestPlan(item){
  const keys = rmSuggestKeys(item);
  const stubs = keys.map(k=>{
    const def = RM_ACT_DEFAULTS[k] || { dur:2, dep:[] };
    const deps = (def.dep || [])
      .filter(t => RM_MS_LABEL[t[0]] != null || keys.indexOf(t[0]) !== -1)
      .map(t => ({ on:t[0], kind:t[1], lagDays:t[2], hard:t[3] }));
    return { key:k, id:'sug-'+k, dur:def.dur, dependsOn:deps, isWait:!!def.wait,
             label:(EXECUTION_ACTIVITY_CATALOGUE.find(c=>c[0]===k)||[,''])[1] };
  });
  const { sched, ms } = rmSchedule(stubs);
  const activities = stubs.map(s=>{
    const sc = sched.get(s) || { start:1, end:s.dur };
    const overlaps = stubs.some(o => o !== s && sched.has(o)
                      && sc.start <= sched.get(o).end && sched.get(o).start <= sc.end);
    return {
      key: s.key, label: s.label,
      startDay: sc.start, endDay: sc.end,
      parallel: !!(RM_ACT_DEFAULTS[s.key] && RM_ACT_DEFAULTS[s.key].parallelKey && overlaps),
      isWait: s.isWait,
      dependsOn: s.dependsOn.slice(),
    };
  });
  return { activities, milestones: ms };
}

// ---- signature to detect whether a suggested activity was later hand-edited ----
function rmActSig(a){
  return JSON.stringify({
    s:+a.startDay||0, e:+a.endDay||0, p:!!a.parallel, w:!!a.isWait, l:a.label||'',
    d:(a.dependsOn||[]).map(x=>[x.on, x.kind, +x.lagDays||0, !!x.hard]),
  });
}
function rmWasEdited(a){ return a && a.source === 'suggested' && a._genSig != null && rmActSig(a) !== a._genSig; }

// ---- resolve a milestone to a day from an item's CURRENT activities (for warnings/labels) ----
function rmMsDayFromActs(acts, key){
  const find = k => acts.find(a => a.key === k);
  const endOf = a => a ? (+a.endDay || +a.startDay || 0) : 0;
  switch(key){
    case 'final-artwork':        return endOf(find('client-artwork'));
    case 'design-approval':      return endOf(find('client-approval')) || endOf(find('design-adaptation'));
    case 'sample-approval':      return endOf(find('sample-mockup'));
    case 'material-ready':       return endOf(find('material-procurement'));
    case 'fabrication-complete': return endOf(find('fabrication'));
    case 'site-access-approved': return endOf(find('site-access-prep'));
    default: return 0;   // power-confirmed etc.
  }
}
// dep target label for the "↳ after X" line
function rmDepLabel(item, d){
  if(!d.on) return '(unset)';
  if(RM_MS_LABEL[d.on] != null) return RM_MS_LABEL[d.on];
  const t = (item.execution.activities || []).find(x => x.id === d.on || x.key === d.on);
  return t ? (t.label || 'activity') : '(removed)';
}
// hard-dependency violations for one activity, checked against the current manual days
function rmHardViolations(item, a){
  const acts = item.execution.activities || [];
  const out = [];
  for(const d of (a.dependsOn || [])){
    if(!d.hard || !d.on) continue;
    let ds, de, label;
    if(RM_MS_LABEL[d.on] != null){ const day = rmMsDayFromActs(acts, d.on); ds = day; de = day; label = RM_MS_LABEL[d.on]; }
    else { const t = acts.find(x => x.id === d.on || x.key === d.on); if(!t || t === a) continue; ds = +t.startDay||0; de = +t.endDay||ds; label = t.label; }
    if(!ds && !de) continue;
    const lag = +d.lagDays || 0;
    const start = +a.startDay || 1;
    if(d.kind === 'SS'){ if(start < ds + lag) out.push('starts before ' + label + ' begins (required dependency)'); }
    else { if(start < de + lag + 1) out.push('starts before ' + label + (RM_MS_LABEL[d.on] != null ? '' : ' completes') + ' (required dependency)'); }
  }
  return out;
}

/* ============================================================
   4d · Execution Roadmap — RISKS + CLIENT INPUTS engine (M-Exec-3)
   ------------------------------------------------------------
   Suggestions are read from the item's real presets/status/notes
   AND the current roadmap schedule. Nothing writes without an
   explicit Apply in the preview. Edited-from-auto and dismissed
   risks survive regeneration. Manual risks/inputs are never touched.
   ============================================================ */
const RM_STOP = new Set(['the','and','for','with','are','was','has','been','this','that','from','into','not','all','any',
  'must','need','needs','before','after','confirm','provide','approve','approved','item','items','client','required','final',
  'per','each','site','day','days','date','stays','total','still','yet','tbc']);
function rmNormWords(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=> w.length>2 && !RM_STOP.has(w));
}
function rmStemSet(s){
  const set = new Set();
  rmNormWords(s).forEach(w=>{ set.add(w); set.add(w.replace(/(ies|es|s)$/,'')); });
  return set;
}
// fuzzy: does candidate text look like an existing input? (distinct-word overlap)
function rmTextLooksLike(candidate, existing){
  const A = new Set(rmNormWords(candidate)), B = new Set(rmNormWords(existing));
  if(!A.size || !B.size) return false;
  let shared = 0; B.forEach(w=>{ if(A.has(w)) shared++; });
  return shared >= 3 || (shared >= 2 && shared / Math.min(A.size, B.size) >= 0.4);
}
// duplicate check for a suggested client input vs an existing one:
// a strong keyword match OR a fuzzy text match
function rmInputDupe(sugg, existingText){
  const E = rmStemSet(existingText);
  if((sugg.dupeWords || []).some(w => E.has(w) || E.has(w.replace(/(ies|es|s)$/,'')))) return true;
  return rmTextLooksLike(sugg.text, existingText);
}

// current (or would-be) schedule days for risk / required-by calculations
function rmPlanDays(item){
  const acts = (item.execution && Array.isArray(item.execution.activities)) ? item.execution.activities : [];
  const msKeys = ['final-artwork','design-approval','sample-approval','material-ready','fabrication-complete','site-access-approved','power-confirmed'];
  if(acts.length){
    const byKey = {};
    acts.forEach(a=>{ if(a.key && a.key !== 'custom') byKey[a.key] = { start:+a.startDay||1, end:+a.endDay||(+a.startDay||1) }; });
    const ms = {}; msKeys.forEach(k=> ms[k] = rmMsDayFromActs(acts, k));
    return { byKey, ms, hasPlan:true };
  }
  const plan = rmSuggestPlan(item);
  const byKey = {}; plan.activities.forEach(a=> byKey[a.key] = { start:a.startDay, end:a.endDay });
  return { byKey, ms:plan.milestones, hasPlan:false };
}
// earliest "must be ready by" day = day before the first present dependent activity starts
function rmNeededBy(days, keys, buffer){
  let m = null;
  keys.forEach(k=>{ const d = days.byKey[k]; if(d && (m == null || d.start < m)) m = d.start; });
  return m == null ? null : Math.max(1, m - 1 - (buffer || 0));
}
// "must be ready by completion of X" — end day of the first present key
function rmNeededByEnd(days, keys){
  let m = null;
  keys.forEach(k=>{ const d = days.byKey[k]; if(d && (m == null || d.end < m)) m = d.end; });
  return m == null ? null : Math.max(1, m);
}
function rmActLabel(key){ return (EXECUTION_ACTIVITY_CATALOGUE.find(c=>c[0]===key)||[,key])[1]; }

// ---- risk rules — only from actual item data + roadmap ----
function rmSuggestRisks(item){
  const P = item.presets || {}, S = item.status || {};
  const gv = k => (P[k] && Array.isArray(P[k].values)) ? P[k].values : [];
  const someIn = (a,b) => a.some(x=> b.indexOf(x) !== -1);
  const days = rmPlanDays(item);
  const acts = (item.execution && item.execution.activities) || [];

  const branding = gv('branding'), fabrication = gv('fabrication'), material = gv('material'),
        finish = gv('finish'), existingWork = gv('existingWork'),
        lighting = gv('lighting').filter(x=> x && x !== 'None'), power = gv('power'), access = gv('access');
  const designApproved = S.design === 'approved';
  const hasSim = !!(item.photoIds && item.photoIds.simulation);
  const instDay = days.byKey['installation'] ? days.byKey['installation'].start : null;
  const instTxt = instDay ? (' Installation Day ' + instDay + '.') : '';

  const out = [];
  const push = (ruleKey, severity, text, affectKeys) => out.push({ ruleKey, severity, text, affects: rmPresentLabels(days, affectKeys||[]) });

  if(branding.length && !designApproved){
    const by = rmNeededBy(days, ['printing-branding']) || rmNeededBy(days, ['design-adaptation']) || days.ms['final-artwork'] || null;
    push('artwork-approval', 'block',
      'Final artwork / approved design required' + (by ? ' by Day ' + by : '') + '.' +
      ' A later delivery pushes production and' + (instTxt || ' installation.'),
      ['printing-branding','design-adaptation','fabrication','installation']);
  }
  if(S.sample === 'pending' || S.sample === 'rejected'){
    const by = rmNeededBy(days, ['fabrication']) || rmNeededBy(days, ['assembly']);
    push('sample-approval', 'warn',
      'Client sample / mock-up approval outstanding — required before production release' + (by ? ' (by Day ' + by + ')' : '') + '.',
      ['sample-mockup','fabrication','installation']);
  }
  if(lighting.length && (!power.length || someIn(power, ['New Power Required','Cabling Required','Driver / Access Required']))){
    const by = rmNeededBy(days, ['electrical-led']);
    push('power-confirm', 'block',
      'Power availability / electrical point must be confirmed' + (by ? ' before Electrical / LED (Day ' + by + ')' : ' before illuminated-sign installation') + '.',
      ['electrical-led','testing','installation']);
  }
  const accEquip = access.filter(x=> ['Scaffold','Scissor Lift','Boom Lift','Crane'].indexOf(x) !== -1);
  if(accEquip.length){
    const by = (instDay ? Math.max(1, instDay - 2) : null) || rmNeededBy(days, ['site-access-prep']);
    push('access-booking', 'warn',
      accEquip.join(' / ') + ' access — approval, permit and booking required' + (by ? ' by Day ' + by : '') + '.' + instTxt,
      ['site-access-prep','installation']);
  }
  if(someIn(existingWork, ['Remove Existing','Modify Existing','Replace Branding Only'])){
    push('existing-work', 'warn',
      'Confirm removal scope, disposal responsibility and site readiness for the existing work before mobilising.',
      ['remove-existing','installation']);
  }
  const qtyN = parseInt(item.qty && item.qty.value, 10);
  if(qtyN > 1 && !(item.locationRef && String(item.locationRef).trim())){
    const by = rmNeededByEnd(days, ['site-verification']);
    push('qty-locations', 'warn',
      qtyN + ' ' + ((item.qty && item.qty.unit) || 'units') + ' — individual locations / positions are not recorded'
      + (by ? ' (confirm by Day ' + by + ', when Site Verification closes)' : '')
      + '. Installation sequencing and access planning need them. (Quantity is unaffected.)',
      ['site-verification','installation']);
  }
  const dW = item.dims && String(item.dims.w).trim(), dH = item.dims && String(item.dims.h).trim();
  if(!dW || !dH){
    push('dimensions', 'warn',
      'Overall dimensions (W / H) are not recorded — fabrication estimate and material take-off are at risk.',
      ['material-procurement','fabrication']);
  }
  if(!hasSim){
    const by = rmNeededBy(days, ['client-approval']) || rmNeededByEnd(days, ['design-adaptation']);
    push('simulation', 'info',
      'No approved final simulation on file — obtain the client visual approval' + (by ? ' before Day ' + by : ' before design sign-off') + '.',
      ['client-approval','design-adaptation']);
  }
  const tr = days.byKey['transportation'], ins = days.byKey['installation'];
  if(tr && ins && tr.end >= ins.start){
    push('no-buffer', 'info',
      'No buffer between delivery (Day ' + tr.end + ') and installation (Day ' + ins.start + ') — a transport delay moves the install date.',
      ['transportation','installation']);
  }
  // hard-dependency problems on the current plan
  acts.forEach(a=>{
    (a.dependsOn || []).forEach(d=>{
      if(!d.hard) return;
      if(!d.on || (RM_MS_LABEL[d.on] == null && !acts.some(x=> x.id === d.on || x.key === d.on))){
        push('hard-unresolved-' + a.id, 'block', '"' + (a.label || 'Activity') + '" has an unresolved required dependency — set or remove it.', [a.key]);
      }
    });
    if(rmHardViolations(item, a).length){
      push('hard-violated-' + a.id, 'block', '"' + (a.label || 'Activity') + '" is scheduled before a required predecessor — the dates will not hold as sequenced.', [a.key]);
    }
  });
  return out;
}

/* forward migration — drop retired preset groups from older stored projects.
   Non-destructive to everything else; persisted on the next save. */
const RETIRED_PRESET_KEYS = ['installation'];
function migrateProject(project){
  let changed = false;
  (project.items||[]).forEach(it=>{
    // Existing Condition: single slot -> ordered collection (keeps the old id)
    if(!Array.isArray(it.existingPhotoIds)) it.existingPhotoIds = [];
    if(it.photoIds && it.photoIds.existing){
      if(!it.existingPhotoIds.includes(it.photoIds.existing)) it.existingPhotoIds.unshift(it.photoIds.existing);
      delete it.photoIds.existing; changed = true;
    }
    if(!it.presets) return;
    for(const k of RETIRED_PRESET_KEYS){
      if(k in it.presets){ delete it.presets[k]; changed = true; }
    }
  });
  return changed;
}
function primaryExisting(it){
  if(it.existingPhotoIds && it.existingPhotoIds.length) return it.existingPhotoIds[0];
  return (it.photoIds && it.photoIds.existing) || null;   // pre-migration safety
}
function existingIds(it){
  if(it.existingPhotoIds && it.existingPhotoIds.length) return it.existingPhotoIds;
  return (it.photoIds && it.photoIds.existing) ? [it.photoIds.existing] : [];
}

function projDuplicateDialog(p){
  return new Promise(res=>{
    const o = document.createElement('div'); o.className = 'overlay';
    const defName = (p.name || 'Project') + ' — Copy';
    o.innerHTML =
      '<div class="dialog"><h3>Duplicate Technical Proposal</h3>'
      + '<p class="hint" style="margin-bottom:10px">Original: <b>'+esc(p.name||'Untitled')+'</b>'
      + '<br>Copied with new IDs and its own photo files. The original stays exactly as it is.</p>'
      + '<div class="field"><label>New project name</label>'
      +   '<input id="dup-name" value="'+esc(defName)+'"></div>'
      + '<div class="field"><label>Revision (optional)</label>'
      +   '<input id="dup-rev" value="'+esc(p.revision||'R1')+'" style="max-width:150px"></div>'
      + '<div class="acts"><button class="btn btn-ghost" data-x="0">Cancel</button>'
      +   '<button class="btn btn-primary" data-x="1">Create Duplicate</button></div></div>';
    o.addEventListener('click', e=>{
      if(e.target === o){ o.remove(); res(null); return; }
      const x = e.target.closest('[data-x]'); if(!x) return;
      if(x.dataset.x === '1'){
        const name = (o.querySelector('#dup-name').value || '').trim();
        const rev  = (o.querySelector('#dup-rev').value  || '').trim();
        o.remove(); res({ name: name || defName, revision: rev || null });
      } else { o.remove(); res(null); }
    });
    document.body.appendChild(o);
    setTimeout(()=>{ const el = o.querySelector('#dup-name'); if(el){ el.focus(); el.select(); } }, 0);
  });
}

/* IndexedDB-mode fallback — same guarantees, client-side */
async function duplicateProjectIdb(p, choice){
  const src    = await IDB.get('projects', p.id);
  const photos = await IDB.indexAll('photos', 'by_project', p.id);
  const newPid = uid();
  const doc = JSON.parse(JSON.stringify(src));
  doc.id = newPid;
  doc.name = choice.name;
  if(choice.revision) doc.revision = choice.revision;
  doc.createdAt = doc.updatedAt = now();
  doc.duplicatedFrom = p.id;

  const itemMap = {}, photoMap = {};
  const remap = old => { if(!old) return old; if(!photoMap[old]) photoMap[old] = uid(); return photoMap[old]; };

  (doc.items || []).forEach(it=>{
    const nid = uid(); itemMap[it.id] = nid; it.id = nid; it.createdAt = it.updatedAt = now();
    it.existingPhotoIds = (it.existingPhotoIds || []).map(remap);
    it.photoIds = Object.fromEntries(Object.entries(it.photoIds || {}).filter(([,v])=>v).map(([k,v])=>[k, remap(v)]));
    if(Array.isArray(it.referencePhotoIds)) it.referencePhotoIds = it.referencePhotoIds.map(remap);
  });
  photos.forEach(ph=> remap(ph.id));

  for(const ph of photos){
    const np = photoMap[ph.id]; if(!np) continue;
    const freshBlob = ph.blob ? ph.blob.slice(0, ph.blob.size, ph.blob.type) : ph.blob;
    await IDB.put('photos', { ...ph, id: np, projectId: newPid,
      itemId: itemMap[ph.itemId] || ph.itemId, createdAt: now(), blob: freshBlob });
  }
  await IDB.put('projects', doc);
  return doc;
}

/* ============================================================
   5 · Images — resized / compressed client-side before saving.
      Keeps enough resolution for the A4 technical PDF + the
      full-width installer simulation page (~2000 px long edge).
   ============================================================ */
const IMG_MAX_DIM = 2000;
const IMG_QUALITY = 0.82;
async function processImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(_){ bmp = await createImageBitmap(file); }
  const scale = Math.min(1, IMG_MAX_DIM / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width*scale));
  const h = Math.max(1, Math.round(bmp.height*scale));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(bmp,0,0,w,h);
  if(bmp.close) bmp.close();
  const blob = await new Promise(r=> c.toBlob(r,'image/jpeg',IMG_QUALITY));
  return { blob, w, h, bytes:blob.size, mime:'image/jpeg' };
}
async function setPhoto(project,item,slot,file){
  const proc = await processImage(file);
  const old = item.photoIds && item.photoIds[slot];
  if(old){ await dbDel('photos', old); }
  const id = uid();
  await dbPut('photos', { id, projectId:project.id, itemId:item.id, slot,
    blob:proc.blob, mime:proc.mime, w:proc.w, h:proc.h, bytes:proc.bytes, createdAt:now() });
  item.photoIds = item.photoIds || {};
  item.photoIds[slot] = id;
  await commitSave();
}

/* placeholder site imagery for the sample project (sync — no async encode) */
function dataUrlToBlob(u){
  const [meta,b64]=u.split(','); const mime=(meta.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function makePlaceholder(title, kind, variant){
  const P = { existing:['#EDEBE6','#8C8B84'], simulation:['#EEF4F0','#1A5C46'],
              sample:['#FAF6EE','#8C7643'], after:['#FBF9F6','#B6B4AA'] }[kind];
  const W=1600,H=1000, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'); const v = variant||0;
  x.fillStyle=P[0]; x.fillRect(0,0,W,H);
  x.strokeStyle=P[1]; x.lineWidth=3; x.strokeRect(46,46,W-92,H-92);
  // light "gateway" line-art — shifted per variant so multiple photos look distinct
  x.globalAlpha=.5; x.save(); x.translate(v*70 - 100, v*30);
  x.strokeRect(360,300,880,120); x.strokeRect(420,420,60,360); x.strokeRect(1120,420,60,360);
  x.beginPath(); x.moveTo(180,790); x.lineTo(W-180,790); x.stroke();
  x.restore(); x.globalAlpha=1;
  x.fillStyle=P[1]; x.textAlign='center';
  x.font='700 52px Inter, Arial, sans-serif'; x.fillText(title.toUpperCase(), W/2, 560);
  x.fillStyle='#8A897F'; x.font='500 26px Inter, Arial, sans-serif';
  x.fillText(v ? 'PLACEHOLDER — SITE VIEW '+(v+1) : 'PLACEHOLDER — REPLACE WITH REAL SITE PHOTO', W/2, 610);
  return dataUrlToBlob(c.toDataURL('image/jpeg', 0.85));
}

const $ = s=> document.querySelector(s);
const app = ()=> $('#app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setPath(o,p,v){ const k=p.split('.'), last=k.pop(); let t=o; for(const kk of k){ if(t[kk]==null) t[kk]={}; t=t[kk]; } t[last]=v; }
function getPath(o,p){ return p.split('.').reduce((a,k)=> a==null?a:a[k], o); }

/* ---- pricing (optional; identical shape in the Keep importer) ---- */
function moneyNum(v){ if(v==null||String(v).trim()==='') return null; const n=parseFloat(String(v).replace(/[, ]/g,'')); return isFinite(n)?n:null; }
function fmtMoney(n, cur){ return (cur||'SAR') + ' ' + Number(n).toLocaleString('en-US',{maximumFractionDigits:2}); }
function lineTotal(it){
  const u = moneyNum(it && it.unitPrice), q = moneyNum(it && it.qty && it.qty.value);
  return (u==null || q==null) ? null : u*q;
}
function relTime(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.max(1,Math.floor(s/60))+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<7*86400) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
function confirmDialog(title, msg, danger){
  return new Promise(res=>{
    const o=document.createElement('div'); o.className='overlay';
    o.innerHTML='<div class="dialog"><h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p><div class="acts">'
      +'<button class="btn btn-ghost" data-x="0">Cancel</button>'
      +'<button class="btn '+(danger?'btn-danger':'btn-primary')+'" data-x="1">Confirm</button></div></div>';
    o.addEventListener('click',e=>{
      if(e.target===o){ o.remove(); res(false); return; }
      const x=e.target.closest('[data-x]'); if(x){ o.remove(); res(x.dataset.x==='1'); }
    });
    document.body.appendChild(o);
  });
}
function sheetMenu(actions){
  return new Promise(res=>{
    const o=document.createElement('div'); o.className='sheetmenu';
    o.innerHTML='<div class="inner">'+actions.map((a,i)=>'<button data-i="'+i+'" class="'+(a.danger?'danger':'')+'">'+esc(a.label)+'</button>').join('')+'</div>';
    o.addEventListener('click',e=>{
      if(e.target===o){ o.remove(); res(null); return; }
      const b=e.target.closest('[data-i]'); if(b){ o.remove(); res(actions[+b.dataset.i]); }
    });
    document.body.appendChild(o);
  });
}
function lightbox(urls, start){
  const list = (Array.isArray(urls) ? urls : [urls]).filter(Boolean);
  if(!list.length) return;
  let i = Math.max(0, Math.min(start||0, list.length-1));
  const o=document.createElement('div'); o.className='overlay lightbox';
  const draw = ()=>{ o.innerHTML='<button class="x">Close</button>'
    + (list.length>1 ? '<button class="nav prev">‹</button>' : '')
    + '<img src="'+list[i]+'" alt="">'
    + (list.length>1 ? '<button class="nav next">›</button><div class="cnt">'+(i+1)+' / '+list.length+'</div>' : ''); };
  draw();
  o.addEventListener('click',e=>{
    if(e.target===o || e.target.classList.contains('x')){ o.remove(); return; }
    if(e.target.classList.contains('prev')){ i=(i-1+list.length)%list.length; draw(); }
    if(e.target.classList.contains('next')){ i=(i+1)%list.length; draw(); }
  });
  document.body.appendChild(o);
}

/* ---- photo url cache ---- */
function clearPhotoCache(){
  STATE.photoCache.forEach(v=> URL.revokeObjectURL(v.url));
  STATE.photoCache.clear();
}
async function loadProjectPhotos(projectId){
  clearPhotoCache();
  const recs = await dbIndexAll('photos','by_project', projectId);
  for(const r of recs){
    let blob = r.blob || null;
    if(!blob && STORE_MODE==='central'){
      try{ const resp = await fetch(TP_API_BASE+'/photos/'+encodeURIComponent(r.id)); if(resp.ok) blob = await resp.blob(); }catch(_){}
    }
    if(blob) STATE.photoCache.set(r.id, { rec:{ ...r, blob, bytes:(r.bytes||blob.size) }, url:URL.createObjectURL(blob) });
    else     STATE.photoCache.set(r.id, { rec:r, url:TP_API_BASE+'/photos/'+encodeURIComponent(r.id) });
  }
}
function photoUrl(id){ const v=STATE.photoCache.get(id); return v?v.url:null; }

function parseHash(){
  const parts = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(parts[0]==='p' && parts[2]==='i' && parts[4]==='roadmap') return { view:'roadmap', pid:parts[1], iid:parts[3] };
  if(parts[0]==='p' && parts[2]==='roadmap') return { view:'projroadmap', pid:parts[1] };
  if(parts[0]==='p' && parts[2]==='i') return { view:'item', pid:parts[1], iid:parts[3] };
  if(parts[0]==='p' && parts[2]==='export') return { view:'export', pid:parts[1] };
  if(parts[0]==='p' && parts[2]==='quote' && parts[3]) return { view:'quorev', pid:parts[1], sid:parts[3], rev: (parts[4]==='rev' && parts[5]!=null) ? +parts[5] : null };
  if(parts[0]==='p' && parts[2]==='quote') return { view:'quote', pid:parts[1] };
  if(parts[0]==='storage') return { view:'storage' };
  if(parts[0]==='p') return { view:'overview', pid:parts[1] };
  return { view:'projects' };
}
function go(hash){ location.hash = hash; }

async function render(){
  await commitSave();                 // flush pending edits before switching
  const r = parseHash();

  if(r.view==='projects'){ STATE.project=null; clearPhotoCache(); return renderProjects(); }
  if(r.view==='storage'){ STATE.project=null; clearPhotoCache(); return renderStorage(); }

  const p = await dbGet('projects', r.pid);
  if(!p){ go('#/'); return; }
  STATE.project = p;
  if(migrateProject(p)){ try{ await dbPut('projects', p); }catch(_){} }
  if(r.view !== 'quorev') STATE.quorev = null;   // drop unsaved revision edits on leave
  await loadProjectPhotos(p.id);

  if(r.view==='overview'){ STATE.otherOpen.clear(); return renderOverview(p); }
  if(r.view==='export'){ return renderExport(p); }
  if(r.view==='quote'){ return renderQuote(p); }
  if(r.view==='quorev'){ return renderQuoRev(p); }
  if(r.view==='projroadmap'){ return renderProjectRoadmap(p); }
  if(r.view==='roadmap'){
    const it = p.items.find(x=>x.id===r.iid);
    if(!it){ go('#/p/'+p.id); return; }
    return renderItemRoadmap(p, it);
  }
  if(r.view==='item'){
    const it = p.items.find(x=>x.id===r.iid);
    if(!it){ go('#/p/'+p.id); return; }
    STATE.otherOpen.clear();
    return renderItem(p, it);
  }
}

function presetSummary(item, g){
  const parts=[];
  const gv = (item.presets[g.key]||{});
  (gv.values||[]).forEach(v=>parts.push(v));
  if(gv.other) parts.push('Other: '+gv.other);
  for(const s of (g.sub||[])){
    if(!s.showIf(gv.values||[])) continue;
    const sv=(item.presets[s.key]||{});
    (sv.values||[]).forEach(v=>parts.push(v));
    if(sv.other) parts.push('Other: '+sv.other);
  }
  return parts.join(' · ');
}

/* Translate one clientAction -> clientActionAr. Reuses a configured translation
   service if one exists (TP_TRANSLATE_URL); otherwise keeps manual entry and
   explains that automatic Arabize needs a translation service. Never overwrites
   manually-typed Arabic without confirmation. */
async function arabizeClientAction(scope, idx, pid){
  let host = null;
  if(scope === 'ci')        host = currentItem();
  else if(scope === 'rmci') host = rmCurrentItem();
  else if(scope === 'pci')  host = STATE.project && STATE.project.items.find(x=> x.id === pid);
  const c = host && (host.clientInputs || [])[idx];
  if(!c) return;
  const src = (c.clientAction && c.clientAction.trim()) || (c.text && c.text.trim()) || '';
  if(!src){ toast('Enter a Client Action first, then Arabize'); return; }

  const svc = (typeof TP_TRANSLATE_URL === 'string' && TP_TRANSLATE_URL) ? TP_TRANSLATE_URL : null;
  if(!svc){
    await prChoiceDialog('Automatic Arabize is not available',
      'No translation service is connected to this Vista install.\n'
      + 'Type the Arabic Client Action manually in the field on the left — it flows straight into the Client PDF.\n\n'
      + 'One-click Arabize needs a translation API to be configured for the platform.',
      [{ v:'ok', label:'OK', primary:true }]);
    return;
  }

  // a service IS configured — protect manually-entered Arabic
  if(c.clientActionAr && c.clientActionAr.trim() && !c._arAuto){
    const ok = await confirmDialog('Replace the Arabic you typed?',
      'This Arabic Client Action was entered manually. Replace it with an automatic translation?', true);
    if(!ok) return;
  }
  try{
    const r = await fetch(svc, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: src, from:'en', to:'ar' }) });
    const j = await r.json();
    const out = (j && (j.translation || j.text || j.ar) || '').trim();
    if(!out) throw new Error('empty translation');
    c.clientActionAr = out; c._arAuto = true;
    scheduleSave();
    if(scope === 'ci' && currentItem()) refreshCard('ci', currentItem());
    else if(scope === 'rmci') rmRerender();
    else if(scope === 'pci' && STATE.project) renderProjectRoadmap(STATE.project);
    toast('Arabic Client Action added');
  }catch(err){
    toast('Arabize failed — enter the Arabic manually');
  }
}

async function duplicateInputsAndNext(p, it){
  await commitSave();
  const ni = rmNextItemIndex(p, it);
  if(ni < 0){ toast('No next item'); return; }
  const nextItem = p.items[ni];
  const src = (it.clientInputs || []).filter(c=> (c.text && c.text.trim()) || (c.clientAction && c.clientAction.trim()));
  if(!src.length){ toast('This item has no client inputs to copy'); go('#/p/'+p.id+'/i/'+nextItem.id); return; }
  const existing = Array.isArray(nextItem.clientInputs) ? nextItem.clientInputs : [];

  let mode = 'copy';
  if(existing.length){
    const choice = await prChoiceDialog(
      'Next item already has Client Inputs',
      '“' + (nextItem.name || ('Item ' + nextItem.number)) + '” already has ' + existing.length
        + ' client input' + (existing.length>1?'s':'') + '.\nAdd the copied inputs, or replace what is there?',
      [ { v:'add',     label:'Add Copied Inputs', primary:true },
        { v:'replace', label:'Replace Existing Inputs', danger:true },
        { v:'cancel',  label:'Cancel' } ]);
    if(!choice || choice === 'cancel') return;   // stay on current item, next item untouched
    mode = choice;
  }

  if(mode === 'replace'){
    nextItem.clientInputs = src.map(rmCopyClientInput);
  } else {
    const seen = new Set(existing.map(c=> rmCiNorm(c.text)));
    const additions = [];
    src.forEach(c=>{
      const key = rmCiNorm(c.text);
      if(key && seen.has(key)) return;   // skip exact duplicate text
      seen.add(key);
      additions.push(rmCopyClientInput(c));
    });
    nextItem.clientInputs = existing.concat(additions);
  }
  await commitSave();
  toast(mode === 'replace'
    ? 'Replaced with ' + nextItem.clientInputs.length + ' copied input' + (nextItem.clientInputs.length>1?'s':'')
    : 'Client inputs copied to next item');
  go('#/p/'+p.id+'/i/'+nextItem.id);
}

/* ============================================================
   11e · View — Project-wide Execution Roadmap (M-Exec-4)
   ------------------------------------------------------------
   Combined READ view over every item.execution.activities.
   No second schedule model. Editing activities happens in the
   item roadmap (a click jumps there); only client-input fields
   are editable here. The horizon is a viewing width only.
   ============================================================ */
let PR = { pid:null, view:'byitem', filter:'all', horizon:null, collapsed:new Set() };
function prReset(p){ if(PR.pid !== p.id) PR = { pid:p.id, view:'byitem', filter:'all', horizon:null, collapsed:new Set() }; }
function prItemActs(it){ return (it.execution && Array.isArray(it.execution.activities)) ? it.execution.activities : []; }
function prMaxEnd(p){ let m=0; p.items.forEach(it=>{ prItemActs(it).forEach(a=>{ m=Math.max(m,+a.endDay||0,+a.startDay||0); }); m=Math.max(m, rmExpectedFinish(it)); }); return m; }
function prHorizon(p){
  const floor = Math.max(15, prMaxEnd(p));
  const h = PR.horizon != null ? PR.horizon : floor;
  return Math.max(RM_HORIZON_MIN, Math.min(RM_HORIZON_MAX, Math.max(h, prMaxEnd(p))));
}
function prInstallDay(it){ const a = prItemActs(it).find(x=> x.key==='installation'); return a ? (+a.startDay||null) : null; }
function prActiveRisks(it){
  const ex = it.execution || {}; const dis = new Set(ex.dismissedRuleKeys||[]);
  return (ex.risks||[]).filter(r=> !dis.has(r.ruleKey));
}
function prBlockers(it){
  const out = [], seen = [];
  const add = txt => { if(!txt) return; if(seen.some(s=> rmTextLooksLike(s, txt))) return; seen.push(txt); out.push(txt); };
  const S = it.status || {};
  if(S.design !== 'approved') add('Client design approval pending');
  if(S.sample === 'pending' || S.sample === 'rejected') add('Physical sample approval pending');
  prActiveRisks(it).forEach(r=>{ if(r.severity === 'block') add(r.text); });
  (it.clientInputs||[]).forEach(c=>{
    if((c.priority === 'urgent' || c.priority === 'required') && c.text)
      add(c.text.replace(/\.\s*$/,'') + (c.requiredByDay != null ? ' — required by Day ' + c.requiredByDay : ''));
  });
  prItemActs(it).forEach(a=> rmHardViolations(it, a).forEach(v=> add('"' + (a.label||'Activity') + '" ' + v)));
  return out;
}
function prCounters(p){
  let acts=0, done=0, inProg=0, waiting=0, instPlanned=0, blockRisks=0;
  p.items.forEach(it=>{
    const A = prItemActs(it); acts += A.length;
    A.forEach(a=>{ if(a.progress==='done') done++; else if(a.progress==='in_progress') inProg++; if(a.isWait) waiting++; });
    if(A.some(a=> a.key==='installation')) instPlanned++;
    blockRisks += prActiveRisks(it).filter(r=> r.severity==='block').length;
  });
  return { items:p.items.length, acts, done, inProg, waiting, instPlanned, blockRisks };
}
const PR_FILTERS = [['all','All Items'],['install','Installation Only'],['waiting','Waiting / Client Inputs'],['inprog','In Progress'],['blocked','Blocked']];
function prActivityPasses(it, a){
  if(PR.filter === 'all') return true;
  if(PR.filter === 'install') return a.key === 'installation';
  if(PR.filter === 'waiting') return !!a.isWait;
  if(PR.filter === 'inprog') return a.progress === 'in_progress';
  if(PR.filter === 'blocked') return a.key === 'installation' ? prBlockers(it).length > 0 : rmHardViolations(it, a).length > 0;
  return true;
}
function prBarHtml(a, horizon){
  const s = Math.max(1, Math.min(horizon, +a.startDay||1));
  const e = Math.max(s, Math.min(horizon, +a.endDay||s));
  const dur = e - s + 1;
  const st = a.isWait ? ' st-wait' : (' st-'+(a.progress||'not_started'));
  const cls = 'rm-bar ' + (a.isWait ? 'wait' : ('ph-'+rmPhase(a))) + st + (a.parallel ? ' par' : '');
  const lead = a.isWait ? '⏳' : (a.parallel ? '⇄' : '');
  const txt = a.isWait ? (dur >= 6 ? '⏳ WAITING' : '⏳') : (dur >= 4 ? ((lead?lead+' ':'') + dur + 'd') : lead);
  return '<div class="'+cls+'" style="grid-column:'+s+' / '+(e+1)+'" title="'+esc(a.label)+' — Day '+s+'–'+e+'">'
    + (txt ? '<span class="rm-bar-x">'+esc(txt)+'</span>' : '') + '</div>';
}
function prByItemHtml(p, horizon){
  let days = ''; for(let d=1; d<=horizon; d++) days += '<div class="rm-daynum">'+d+'</div>';
  let out = '<div class="rm-scroll"><div class="rm-grid" style="--rm-name:232px">'
    + '<div class="rm-row head"><div class="rm-name">Item / Day</div>'
    + '<div class="rm-track" style="--rm-cols:'+horizon+'">'+days+'</div></div>';
  let shown = 0;
  p.items.forEach(it=>{
    const acts = prItemActs(it).filter(a=> prActivityPasses(it,a)).slice().sort((x,y)=> (+x.startDay||0)-(+y.startDay||0));
    if(PR.filter !== 'all' && !acts.length) return;
    shown++;
    const collapsed = PR.collapsed.has(it.id);
    const inst = prInstallDay(it);
    out += '<div class="rm-row pr-lane">'
      + '<div class="rm-name pr-lane-nm">'
      +   '<button class="pr-chev" data-prcollapse="'+it.id+'">'+(collapsed?'▸':'▾')+'</button>'
      +   '<span class="pr-lane-open" data-pritem="'+it.id+'">'+esc((it.number?it.number+' ':'')+(it.name||'Untitled item'))+'</span>'
      + '</div>'
      + '<div class="rm-track pr-lane-track" style="--rm-cols:'+horizon+'"><span class="pr-lane-meta">'
      +   (inst!=null?('install Day '+inst):'no install activity')+' · '+prItemActs(it).length+' activities</span></div>'
      + '</div>';
    if(collapsed) return;
    acts.forEach(a=>{
      const badges = '<span class="rm-badge day">D'+(+a.startDay||1)+(((+a.startDay||1)===(+a.endDay||1))?'':'–'+(+a.endDay||1))+'</span>'
        + (a.parallel?'<span class="rm-badge par">⇄</span>':'') + (a.isWait?'<span class="rm-badge wait">⏳</span>':'');
      const dep = (a.dependsOn && a.dependsOn.length)
        ? '<div class="rm-nm-dep">↳ '+a.dependsOn.map(d=> (d.kind==='SS'?'with ':'after ')+esc(rmDepLabel(it,d))).join(', ')+'</div>' : '';
      out += '<div class="rm-row pr-actrow">'
        + '<div class="rm-name pr-act-nm">'
        +   '<span class="rm-dot '+esc(a.progress||'not_started')+'"></span>'
        +   '<span class="pr-act-label" data-prgo="'+it.id+'">'+esc(a.label||'Activity')+'</span>'
        +   '<div class="rm-badges">'+badges+'</div>'+dep
        + '</div>'
        + '<div class="rm-track" style="--rm-cols:'+horizon+'" data-prgo="'+it.id+'">'+prBarHtml(a, horizon)+'</div>'
        + '</div>';
    });
  });
  out += '</div></div>';
  if(!shown) out += '<div class="rm-sec-empty">No items match this filter.</div>';
  return out;
}
function prByDayHtml(p, horizon){
  const rows = [];
  const wavesSorted = prWavesSorted(p);
  for(let d=1; d<=horizon; d++){
    // wave installation blocks for this day (installation activities in these waves are shown here, not in the list below)
    const dayWaves = wavesSorted.filter(w=> (+w.day||0) === d);
    const coveredInst = new Set();   // "<itemId>|installation" already shown via a wave block
    let waveHtml = '';
    dayWaves.forEach((w,wi)=>{
      const its = prWaveItems(p, w.id);
      its.forEach(it=> coveredInst.add(it.id + '|installation'));
      waveHtml += '<div class="pr-day-wave">◆ '+esc((w.name||('Wave '+(wi+1))).toUpperCase())+' — INSTALLATION</div>'
        + (its.length ? its.map(it=> '<div class="pr-day-wave-i pr-day-e" data-prgo="'+it.id+'">– '+esc(it.name||('Item '+it.number))+'</div>').join('')
                      : '<div class="pr-day-wave-i muted">no items assigned</div>');
    });
    const entries = [];
    p.items.forEach(it=> prItemActs(it).forEach(a=>{
      const s = +a.startDay||1, e = +a.endDay||s;
      if(d < s || d > e) return;
      if(a.key === 'installation' && coveredInst.has(it.id + '|installation')) return;
      const isStart = d === s && e > s;
      entries.push('<div class="pr-day-e" data-prgo="'+it.id+'">'
        + (a.isWait?'⏳ ':(a.parallel?'⇄ ':''))
        + '<b>'+esc(it.name||('Item '+it.number))+'</b> — '+esc(a.label||'Activity')
        + (a.isWait?' <span class="muted">(pending)</span>':(isStart?' <span class="muted">(starts)</span>':''))
        + '</div>');
    }));
    const count = entries.length + dayWaves.reduce((n,w)=> n + prWaveItems(p,w.id).length, 0);
    if(waveHtml || entries.length) rows.push('<div class="pr-day"><div class="pr-day-n">Day '+d
      + '<span class="pr-day-c">'+count+(count>1?' concurrent':'')+'</span></div>'+waveHtml+entries.join('')+'</div>');
  }
  return rows.length ? '<div class="pr-days">'+rows.join('')+'</div>' : '<div class="rm-sec-empty">No activities scheduled on any item.</div>';
}
function prInstallSummaryHtml(p){
  const rows = p.items.map(it=> ({ it, day: prInstallDay(it) })).sort((a,b)=>{
    if(a.day == null && b.day == null) return 0;
    if(a.day == null) return 1; if(b.day == null) return -1; return a.day - b.day;
  });
