/* ---- M-Exec-6: per-item project summary (Action / finish / missing client input) ---- */
const RM_PHASE_LABEL = { plan:'Site Check', design:'Design', site:'Site Prep', prod:'Fabrication',
  dispatch:'Delivery', install:'Installation', close:'Handover', custom:'Works' };
const RM_PHASE_RANK = { plan:0, design:1, site:2, prod:3, dispatch:4, install:5, close:6, custom:7 };
function prActionChain(it){
  // DISPLAY only — collapse activities to their distinct phases, in logical order.
  const acts = prItemActs(it).filter(a=> !a.isWait);
  if(!acts.length) return '—';
  const keys = [...new Set(acts.map(a=> rmPhase(a)))]
    .sort((a,b)=> (RM_PHASE_RANK[a] ?? 9) - (RM_PHASE_RANK[b] ?? 9));
  const phases = keys.map(k=> RM_PHASE_LABEL[k] || 'Works');
  if(phases.length <= 5) return phases.join(' → ');
  const KEEP = ['Site Check','Design','Fabrication','Installation','Handover'];
  const kept = phases.filter(p=> KEEP.indexOf(p) !== -1);
  return (kept.length >= 2 ? kept : phases.slice(0,5)).slice(0,5).join(' → ');
}
function prMissingCI(it){
  const cis = (it.clientInputs||[]);
  if(!cis.length) return { cleared:true, text:'Cleared' };
  const list = cis.map(c=> String((c.clientAction && c.clientAction.trim()) ? c.clientAction : (c.text||''))
    .replace(/[\s.,،؛;]+$/, '')).filter(Boolean);
  if(!list.length) return { cleared:true, text:'Cleared' };
  return { cleared:false, text: list.slice(0,2).join('; ') + (list.length>2 ? ' (+'+(list.length-2)+' more)' : '') };
}
function prItemWaiting(it){
  const acts = prItemActs(it);
  const anyStarted = acts.some(a=> (a.progress||'not_started') !== 'not_started');
  const hasWait = acts.some(a=> a.isWait);
  const hasUrgentCI = (it.clientInputs||[]).some(c=> c.priority === 'urgent');
  return !anyStarted && (it.clientInputs||[]).length > 0 && (hasWait || hasUrgentCI);
}

/* ============================================================
   11f · Project Roadmap — INSTALLATION WAVES (M-Exec-5)
   ------------------------------------------------------------
   project.execution.waves[] = { id, name, day, note, source }
   Installation activity gets .waveId. Read/derived everywhere
   else. Manual wave name/day/assignments survive regeneration.
   ============================================================ */
const PR_ACCESS_EQUIP = ['Scissor Lift','Boom Lift','Crane','Scaffold'];
function prEnsureWaves(p){
  if(!p.execution || typeof p.execution !== 'object') p.execution = {};
  if(!Array.isArray(p.execution.waves)) p.execution.waves = [];
  return p.execution.waves;
}
function prWaves(p){ return (p.execution && Array.isArray(p.execution.waves)) ? p.execution.waves : []; }
function prWavesSorted(p){
  const w = prWaves(p);
  return w.slice().sort((a,b)=> ((+a.day||0)-(+b.day||0)) || (w.indexOf(a)-w.indexOf(b)));
}
function prInstAct(it){ return prItemActs(it).find(a=> a.key === 'installation') || null; }
function prInstItems(p){ return p.items.filter(it=> !!prInstAct(it)); }
function prWaveOf(it){ const a = prInstAct(it); return a && a.waveId ? a.waveId : null; }
function prWaveObjOf(p, it){ const id = prWaveOf(it); return id ? prWaves(p).find(w=> w.id === id) || null : null; }
function prWaveNameOf(p, it){ const w = prWaveObjOf(p, it); return w ? (w.name || 'Wave') : null; }
function prWaveItems(p, waveId){ return prInstItems(p).filter(it=> prWaveOf(it) === waveId); }
function prUnassignedInst(p){
  const ids = new Set(prWaves(p).map(w=> w.id));
  return prInstItems(p).filter(it=>{ const w = prWaveOf(it); return !w || !ids.has(w); });
}
function prItemAccessEquip(it){
  const v = (it.presets && it.presets.access && Array.isArray(it.presets.access.values)) ? it.presets.access.values : [];
  return v.filter(x=> PR_ACCESS_EQUIP.indexOf(x) !== -1);
}
function prWaveEquip(p, waveId){
  const set = [];
  prWaveItems(p, waveId).forEach(it=> prItemAccessEquip(it).forEach(x=>{ if(set.indexOf(x) === -1) set.push(x); }));
  return set;
}
function prWaveBlockers(p, waveId){
  const out = [];
  prWaveItems(p, waveId).forEach(it=>{
    const nm = it.name || ('Item ' + it.number);
    const seen = [];
    const add = raw => { if(!raw) return; if(seen.some(s=> rmTextLooksLike(s, raw))) return; seen.push(raw); out.push(nm + ': ' + raw); };
    prBlockers(it).forEach(add);
    const a = prInstAct(it);
    if(a) rmHardViolations(it, a).forEach(v=> add('Installation ' + v));
  });
  return out;
}
/* ---- Suggest: cluster unassigned installation items by day (±1) + shared lift ---- */
function prClusterWaves(items){
  const list = items.map(it=> ({ it, day: prInstallDay(it), equip: prItemAccessEquip(it) }))
    .filter(x=> x.day != null).sort((a,b)=> a.day - b.day);
  const groups = [];
  list.forEach(x=>{
    let g = groups.find(gr=> (x.equip.length && gr.equip.some(e=> x.equip.indexOf(e) !== -1) && (x.day - gr.anchor) <= 1))
         || groups.find(gr=> (x.day - gr.anchor) <= 1);
    if(g){
      g.items.push(x.it);
      g.day = Math.min(g.day, x.day);
      x.equip.forEach(e=>{ if(g.equip.indexOf(e) === -1) g.equip.push(e); });
    } else {
      groups.push({ anchor: x.day, day: x.day, items:[x.it], equip:[...x.equip] });
    }
  });
  return groups;
}

  html += '<div class="rm-pv-acts"><button class="btn btn-ghost" data-prwpvcancel>Cancel</button>'

  });

function prApplyWaveSuggestion(p, groups){
  const waves = prEnsureWaves(p);

function prChoiceDialog(title, msg, opts){

async function prSetWaveDay(p, w, newDay){
  const old = +w.day || 0, oldSrc = w.source;
  newDay = Math.max(1, Math.min(RM_HORIZON_MAX, parseInt(newDay,10) || old || 1));
  if(newDay === old){ w.day = newDay; renderProjectRoadmap(STATE.project); return; }
  w.day = newDay; w.source = 'user';
  const its = prWaveItems(p, w.id);
  if(its.length){
    const choice = await prChoiceDialog(
      'Move assigned Installation activities to Day ' + newDay + '?',
      its.length + ' installation activit' + (its.length>1?'ies are':'y is') + ' assigned to this wave.',
      [ { v:'move',  label:'Move installations', primary:true },
        { v:'keep',  label:'Keep existing days' },
        { v:'cancel',label:'Cancel' } ]);
    if(choice === 'cancel' || choice == null){ w.day = old; w.source = oldSrc; scheduleSave(); renderProjectRoadmap(STATE.project); return; }
    if(choice === 'move'){
      its.forEach(it=>{
        const a = prInstAct(it); if(!a) return;
        const span = Math.max(0, (+a.endDay||+a.startDay||1) - (+a.startDay||1));
        a.startDay = newDay; a.endDay = newDay + span;
      });
      const viol = [];
      its.forEach(it=>{ const a = prInstAct(it); if(a) rmHardViolations(it, a).forEach(v=> viol.push((it.name||'Item') + ': ' + v)); });
      scheduleSave(); renderProjectRoadmap(STATE.project);
      if(viol.length) prChoiceDialog('Dependency warning',
        'Moving to Day ' + newDay + ' breaks a required dependency:\n\n' + viol.join('\n')
        + '\n\nThe installation days were still moved — adjust the upstream activities in each item roadmap.',
        [ { v:'ok', label:'Got it', primary:true } ]);
      return;
    }
  }
  scheduleSave(); renderProjectRoadmap(STATE.project);
}

function prWavesHtml(p){
  const instItems = prInstItems(p);
  if(!instItems.length) return '<div class="pr-wave-none">No item has an Installation activity yet — add one in an item roadmap, then group installs into waves here.</div>';

    const its = prWaveItems(p, w.id);
    const equip = prWaveEquip(p, w.id);
    const blk = prWaveBlockers(p, w.id);
    const idx = all.indexOf(w);

      ? '<select class="pr-wave-assign" data-prwassign="'+w.id+'"><option value="">＋ assign installation item…</option>'
        + others.map(it=>{ const inW = prWaveNameOf(p, it);
            return '<option value="'+it.id+'">'+esc(it.name||('Item '+it.number))+(inW?(' (in '+esc(inW)+')'):'')+'</option>'; }).join('')
        + '</select>'
      : '';
    return '<div class="pr-wave">'
      + '<div class="pr-wave-r1">'
      +   '<span class="pr-wave-mv">'
      +     '<button data-prwmove="'+w.id+'" data-dir="-1"'+(i===0?' disabled':'')+'>▲</button>'
      +     '<button data-prwmove="'+w.id+'" data-dir="1"'+(i===waves.length-1?' disabled':'')+'>▼</button>'
      +   '</span>'
      +   '<input class="pr-wave-nm" data-prwname="'+w.id+'" value="'+esc(w.name||('Wave '+(i+1)))+'">'
      +   '<span class="pr-wave-day">Day <input data-prwday="'+w.id+'" value="'+(w.day!=null?w.day:'')+'" inputmode="numeric"></span>'
      +   '<span class="pr-wave-src">'+(w.source==='user'?'manual':'auto')+'</span>'
      +   '<button class="rm-x" data-prwdel="'+w.id+'" title="Delete wave">✕</button>'
      + '</div>'
      + '<input class="pr-wave-note" data-prwnote="'+w.id+'" value="'+esc(w.note||'')+'" placeholder="Note (access, crew, logistics)…">'
      + (its.length
          ? '<div class="pr-wave-chips">'
            + its.map(it=> '<span class="pr-wave-chip" data-pritem="'+it.id+'">'+esc(it.name||('Item '+it.number))
                + '<button data-prwunassign="'+w.id+'" data-item="'+it.id+'" title="Remove from wave">✕</button></span>').join('')
            + '</div>'
          : '<div class="pr-wave-none">No installation items assigned.</div>')
      + assignOpts
      + '<div class="pr-wave-sum"><b>'+esc(w.name||('Wave '+(i+1)))+' · Day '+(w.day!=null?w.day:'—')+'</b><br>'
      +   'Items: '+(its.length ? esc(its.map(it=> it.name||('Item '+it.number)).join(', ')) : '—')+'<br>'
      +   'Access / Equipment: '+(equip.length ? esc(equip.join(', ')) : 'none recorded')
      +   (blk.length ? '<div class="pr-wave-blk">'+blk.map(b=> '⚠ '+esc(b)).join('<br>')+'</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
  const un = prUnassignedInst(p);
  if(un.length) html += '<div class="pr-wave-none">Not in a wave: <b>'
    + esc(un.map(it=> (it.name||('Item '+it.number)) + (prInstallDay(it)!=null?(' (Day '+prInstallDay(it)+')'):'')).join(', ')) + '</b></div>';
  return html;
}

/* ============================================================
   11c · Execution Roadmap — suggestion preview + apply (M-Exec-2)
   ============================================================ */
function rmSuggestBadges(a){
  return (a.isWait ? '<span class="rm-badge wait">⏳ Waiting</span>' : '')
       + (a.parallel ? '<span class="rm-badge par">⇄ Parallel</span>' : '');
}
function rmShowSuggestionPreview(item){
  const plan = rmSuggestPlan(item);
  const existing = (item.execution && Array.isArray(item.execution.activities)) ? item.execution.activities : [];
  const byKey = {}; existing.forEach(a=>{ if(a.key && a.key!=='custom' && !byKey[a.key]) byKey[a.key] = a; });

  const toAdd = [], toUpdate = [], kept = [];
  plan.activities.forEach(sp=>{
    const cur = byKey[sp.key];
    if(!cur){ toAdd.push(sp); return; }
    if(cur.source === 'suggested' && !rmWasEdited(cur)){
      const changed = (+cur.startDay!==sp.startDay) || (+cur.endDay!==sp.endDay)
        || (!!cur.parallel!==sp.parallel) || (!!cur.isWait!==sp.isWait)
        || rmActSig({dependsOn:cur.dependsOn}) !== rmActSig({dependsOn:sp.dependsOn});
      if(changed) toUpdate.push({ sp, cur });
    } else {
      kept.push({ cur, sp, why: cur.source!=='suggested' ? 'manual' : 'you edited it' });
    }
  });
  existing.forEach(a=>{
    if(a.key === 'custom' || !plan.activities.some(sp=> sp.key === a.key)){
      kept.push({ cur:a, sp:null, why: a.key==='custom' ? 'custom activity' : 'not suggested for this item' });
    }
  });

  const line = (label, sp) => '<div class="rm-pv-row"><span class="rm-pv-nm">'+esc(label)+'</span>'
    + '<span class="rm-pv-day">D'+sp.startDay+(sp.startDay===sp.endDay?'':'–'+sp.endDay)+'</span>'
    + rmSuggestBadges(sp) + '</div>';
  const depSummary = plan.activities.flatMap(sp=> (sp.dependsOn||[]).map(d=>{
    const onLbl = RM_MS_LABEL[d.on] || (plan.activities.find(x=>'sug-'+x.key===d.on || x.key===d.on)||{}).label || d.on;
    return '<div class="rm-pv-dep">'+esc(sp.label)+' ↳ '+(d.kind==='SS'?'with ':'after ')+esc(onLbl)
      + (d.hard?' <span class="rm-req">required</span>':'')+(+d.lagDays? (' '+(+d.lagDays>0?'+':'')+d.lagDays+'d'):'')+'</div>';
  })).join('');

  let html = '<div class="rm-pv">'
    + '<h3>Suggested Plan</h3>'
    + '<p class="rm-pv-sub">Built from this item&rsquo;s presets, status and notes. Review, then Apply — or Cancel and nothing changes.</p>';
  if(toAdd.length){
    html += '<div class="rm-pv-sec"><div class="rm-pv-h add">Will add ('+toAdd.length+')</div>'
      + toAdd.map(sp=> line('+ '+sp.label, sp)).join('') + '</div>';
  }
  if(toUpdate.length){
    html += '<div class="rm-pv-sec"><div class="rm-pv-h upd">Will update ('+toUpdate.length+')</div>'
      + toUpdate.map(u=> '<div class="rm-pv-row"><span class="rm-pv-nm">'+esc(u.sp.label)+'</span>'
          + '<span class="rm-pv-day was">D'+(+u.cur.startDay)+(+u.cur.startDay===+u.cur.endDay?'':'–'+(+u.cur.endDay))+'</span>'
          + '<span class="rm-pv-arrow">→</span>'
          + '<span class="rm-pv-day">D'+u.sp.startDay+(u.sp.startDay===u.sp.endDay?'':'–'+u.sp.endDay)+'</span>'
          + rmSuggestBadges(u.sp) + '</div>').join('')
      + '<div class="hint" style="margin-top:4px">Only suggestion-created activities you haven&rsquo;t hand-edited.</div></div>';
  }
  if(kept.length){
    html += '<div class="rm-pv-sec"><div class="rm-pv-h keep">Kept unchanged ('+kept.length+')</div>'
      + kept.map(k=> '<div class="rm-pv-row muted"><span class="rm-pv-nm">'+esc(k.cur.label||'Activity')+'</span>'
          + '<span class="rm-pv-why">'+esc(k.why)+'</span></div>').join('') + '</div>';
  }
  if(depSummary) html += '<div class="rm-pv-sec"><div class="rm-pv-h dep">Dependencies</div>'+depSummary+'</div>';
  if(!toAdd.length && !toUpdate.length){
    html += '<p class="rm-pv-sub">Nothing to add or update — the current plan already matches the suggestion (or you&rsquo;ve customised it).</p>';
  }
  html += '<div class="rm-pv-acts">'
    + '<button class="btn btn-ghost" data-rmpvcancel>Cancel</button>'
    + ((toAdd.length||toUpdate.length) ? '<button class="btn btn-primary" data-rmpvapply>Apply Suggested Plan</button>' : '')
    + '</div></div>';

  const o = document.createElement('div');
  o.className = 'overlay';
  o.id = 'rm-pv-overlay';
  o.innerHTML = html;
  o._plan = plan; o._toAdd = toAdd; o._toUpdate = toUpdate;
  o.addEventListener('click', ev=>{
    if(ev.target === o || ev.target.closest('[data-rmpvcancel]')){ o.remove(); return; }
    if(ev.target.closest('[data-rmpvapply]')){ rmApplySuggestion(item, o._toAdd, o._toUpdate); o.remove(); }
  });
  document.body.appendChild(o);
}
function rmApplySuggestion(item, toAdd, toUpdate){
  const ex = rmEnsureExecution(item);
  toUpdate.forEach(u=>{
    u.cur.startDay = u.sp.startDay;
    u.cur.endDay   = u.sp.endDay;
    u.cur.parallel = u.sp.parallel;
    u.cur.isWait   = u.sp.isWait;
    u.cur.dependsOn = u.sp.dependsOn.map(d=> ({...d}));
    u.cur._genSig = rmActSig(u.cur);
  });
  toAdd.forEach(sp=>{
    const a = {
      id: uid(), key: sp.key, label: sp.label,
      startDay: sp.startDay, endDay: sp.endDay,
      parallel: sp.parallel, isWait: sp.isWait,
      progress: 'not_started', note: '',
      dependsOn: sp.dependsOn.map(d=> ({...d})),
      source: 'suggested',
    };
    a._genSig = rmActSig(a);
    ex.activities.push(a);
  });
  // re-order into catalogue order for readability, custom/unknown keys keep their relative position at the end
  const order = EXECUTION_ACTIVITY_CATALOGUE.map(c=>c[0]);
  ex.activities.sort((x,y)=>{
    const ix = order.indexOf(x.key), iy = order.indexOf(y.key);
    if(ix === -1 && iy === -1) return 0;
    if(ix === -1) return 1;
    if(iy === -1) return -1;
    return ix - iy;
  });
  const maxEnd = ex.activities.reduce((m,a)=> Math.max(m, +a.endDay||0), 0);
  ex.horizon = Math.max(rmClampHorizon(ex.horizon), maxEnd);
  scheduleSave();
  rmRerender();
  toast('Suggested plan applied — adjust anything freely');
}

/* ---- risk suggestion preview + apply ---- */
function rmShowRiskPreview(item){
  const ex = rmEnsureExecution(item);
  const suggested = rmSuggestRisks(item);
  const dismissed = new Set(ex.dismissedRuleKeys || []);
  const current = ex.risks || [];
  const toAdd = [], toUpdate = [], skipped = [];
  suggested.forEach(s=>{
    if(dismissed.has(s.ruleKey)){ skipped.push({ s, why:'dismissed' }); return; }
    const cur = current.find(r=> r.ruleKey === s.ruleKey && r.source === 'auto');
    if(!cur){ toAdd.push(s); return; }
    if(cur.editedFromAuto){ skipped.push({ s, why:'you edited it' }); return; }
    if(cur.text !== s.text || cur.severity !== s.severity || (cur.affects||[]).join('|') !== (s.affects||[]).join('|')) toUpdate.push({ s, cur });
    else skipped.push({ s, why:'already listed' });
  });
  const sevTag = sv => '<span class="rm-sevtag sev-'+sv+'">'+RM_SEV_LABEL[sv]+'</span>';
  let html = '<div class="rm-pv"><h3>Suggested Risks</h3>'
    + '<p class="rm-pv-sub">From this item&rsquo;s data and the current roadmap. Review, then Apply — or Cancel.</p>';
  if(toAdd.length) html += '<div class="rm-pv-sec"><div class="rm-pv-h add">Will add ('+toAdd.length+')</div>'
    + toAdd.map(s=>'<div class="rm-pv-risk">'+sevTag(s.severity)+' '+esc(s.text)
      + ((s.affects&&s.affects.length)?'<div class="rm-pv-aff">Affects: '+esc(s.affects.join(' · '))+'</div>':'')+'</div>').join('') + '</div>';
  if(toUpdate.length) html += '<div class="rm-pv-sec"><div class="rm-pv-h upd">Will update ('+toUpdate.length+')</div>'
    + toUpdate.map(u=>'<div class="rm-pv-risk">'+sevTag(u.s.severity)+' '+esc(u.s.text)+'</div>').join('')
    + '<div class="hint" style="margin-top:4px">Only auto risks you haven&rsquo;t edited.</div></div>';
  if(skipped.length) html += '<div class="rm-pv-sec"><div class="rm-pv-h keep">Not changed ('+skipped.length+')</div>'
    + skipped.map(k=>'<div class="rm-pv-row muted"><span class="rm-pv-nm">'+esc((k.s.text||'').slice(0,54))+'…</span><span class="rm-pv-why">'+esc(k.why)+'</span></div>').join('') + '</div>';
  if(!toAdd.length && !toUpdate.length) html += '<p class="rm-pv-sub">Nothing to add or update.</p>';
  html += '<div class="rm-pv-acts"><button class="btn btn-ghost" data-rmpvcancel>Cancel</button>'
    + ((toAdd.length||toUpdate.length)?'<button class="btn btn-primary" data-rmpvapply>Apply</button>':'') + '</div></div>';
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'rm-pv-overlay'; o.innerHTML = html;
  o.addEventListener('click', ev=>{
    if(ev.target === o || ev.target.closest('[data-rmpvcancel]')){ o.remove(); return; }
    if(ev.target.closest('[data-rmpvapply]')){ rmApplyRisks(item, toAdd, toUpdate); o.remove(); }
  });
  document.body.appendChild(o);
}
function rmApplyRisks(item, toAdd, toUpdate){
  const ex = rmEnsureExecution(item);
  toUpdate.forEach(u=>{ u.cur.text = u.s.text; u.cur.severity = u.s.severity; u.cur.affects = u.s.affects; });
  toAdd.forEach(s=> ex.risks.push({
    id: uid(), text: s.text, severity: s.severity, source: 'auto',
    ruleKey: s.ruleKey, dismissed: false, editedFromAuto: false, affects: s.affects || [],
  }));
  scheduleSave(); rmRerender();
  toast('Risks updated — edit or dismiss any of them');
}

/* ---- client-input suggestion preview + apply ---- */

   12 · Events (delegated)
   ============================================================ */
function currentItem(){
  const r = parseHash();
  if(r.view!=='item' || !STATE.project) return null;
  return STATE.project.items.find(x=>x.id===r.iid) || null;
}

function syncPricingTotal(it){
  const el = document.getElementById('pricing-total');
  if(!el) return;
  const t = lineTotal(it);
  el.innerHTML = (t==null) ? '<span class="muted">—</span>' : esc(fmtMoney(t, it.currency||'SAR'));
}

document.addEventListener('input', e=>{
  const t = e.target;
  // project fields
  if(t.dataset.pf!=null && STATE.project){
    STATE.project[t.dataset.pf] = t.value;
    if(t.dataset.pf==='name'){ const ti=document.querySelector('.appbar .title'); if(ti) ti.textContent = t.value||'Untitled Project'; }
    scheduleSave(); return;
  }
  // execution roadmap — text fields: mutate + save, never re-render (keep focus)
  if(t.dataset.rmf === 'label' || t.dataset.rmf === 'note'){
    const f = rmFind(t.dataset.rmid);
    if(f){ f.a[t.dataset.rmf] = t.value; scheduleSave(); }
    return;
  }
  if(t.dataset.rmrisktext != null){
    const rit = rmCurrentItem();
    const r = rit && (rit.execution.risks || []).find(x=> x.id === t.dataset.rid);
    if(r){ if(r.source === 'auto' && r.text !== t.value) r.editedFromAuto = true; r.text = t.value; scheduleSave(); }
    return;
  }
  if(t.dataset.rmcitext != null || t.dataset.rmciimpact != null || t.dataset.rmciday != null || t.dataset.rmciaction != null || t.dataset.rmciactionar != null){
    const rit = rmCurrentItem();
    const c = rit && (rit.clientInputs || [])[+ (t.dataset.i)];
    if(c){
      if(t.dataset.rmcitext != null) c.text = t.value;
      else if(t.dataset.rmciactionar != null){ c.clientActionAr = t.value; c._arAuto = false; }
      else if(t.dataset.rmciaction != null) c.clientAction = t.value;
      else if(t.dataset.rmciimpact != null) c.impactIfLate = t.value;
      else { const n = parseInt(t.value, 10); c.requiredByDay = isFinite(n) ? Math.max(1, n) : null; }
      scheduleSave();
    }
    return;
  }
  if(t.dataset.pcitext != null || t.dataset.pciimpact != null || t.dataset.pciday != null || t.dataset.pciaction != null || t.dataset.pciactionar != null){
    const pit = STATE.project && STATE.project.items.find(x=> x.id === t.dataset.pid);
    const c = pit && (pit.clientInputs || [])[+ (t.dataset.i)];
    if(c){
      if(t.dataset.pcitext != null) c.text = t.value;
      else if(t.dataset.pciactionar != null){ c.clientActionAr = t.value; c._arAuto = false; }
      else if(t.dataset.pciaction != null) c.clientAction = t.value;
      else if(t.dataset.pciimpact != null) c.impactIfLate = t.value;
      else { const n = parseInt(t.value, 10); c.requiredByDay = isFinite(n) ? Math.max(1, n) : null; }
      scheduleSave();
    }
    return;
  }
  // installation waves — name / note text (mutate + save, keep focus)
  if(t.dataset.prwname != null || t.dataset.prwnote != null){
    const wid = t.dataset.prwname != null ? t.dataset.prwname : t.dataset.prwnote;
    const w = STATE.project && prWaves(STATE.project).find(x=> x.id === wid);
    if(w){
      if(t.dataset.prwname != null){ w.name = t.value; w.source = 'user'; }
      else w.note = t.value;
      scheduleSave();
    }
    return;
  }
  const it = currentItem();
  if(!it) return;
  if(t.dataset.p!=null){
    setPath(it, t.dataset.p, t.value);
    if(t.dataset.p==='unitPrice' || t.dataset.p==='qty.value') syncPricingTotal(it);
    scheduleSave(); return;
  }
  if(t.dataset.citext!=null){ it.clientInputs[+t.dataset.i].text = t.value; scheduleSave(); return; }
  if(t.dataset.ciaction!=null){ it.clientInputs[+t.dataset.i].clientAction = t.value; scheduleSave(); return; }
  if(t.dataset.ciactionar!=null){ const c = it.clientInputs[+t.dataset.i]; c.clientActionAr = t.value; c._arAuto = false; scheduleSave(); return; }
});

document.addEventListener('change', e=>{
  const t=e.target;

  /* project-level boolean toggle (e.g. Show pricing in Client Proposal) */
  if(t.dataset.pfbool!=null && STATE.project){
    STATE.project[t.dataset.pfbool] = t.checked;
    scheduleSave();
    const it = currentItem(); if(it) refreshCard('pricing', it);
    return;
  }

  /* export item selection */
  if(t.dataset.expall!=null && STATE.project){
    STATE.exportItems = t.checked ? null : new Set();
    renderExport(STATE.project); return;
  }
  if(t.dataset.expitem!=null && STATE.project){
    const p = STATE.project;
    if(!STATE.exportItems || STATE.exportItems.size===0) STATE.exportItems = new Set(p.items.map(x=>x.id));
    if(t.checked) STATE.exportItems.add(t.dataset.expitem); else STATE.exportItems.delete(t.dataset.expitem);
    renderExport(p); return;
  }

  /* create-vista-quotation prep screen */
  if(t.dataset.qinc!=null && STATE.quote){ quoteToggleInclude(t.dataset.qinc, t.checked); return; }
  if(t.dataset.qf!=null && STATE.quote){ quoteSetField(t.dataset.qf, t.value, t.dataset.qitem || null); return; }

  /* quotation revision editor — <select> unit (change, not input) */
  if(t.dataset.qri === 'unit' && STATE.quorev){
    const it = STATE.quorev.w.items[+t.dataset.i]; if(it) it.unit = t.value;
    return;
  }

  /* execution roadmap — horizon + day/flag fields (re-render to reposition bars) */
  if(t.dataset.rmhzval != null){
    const rit = rmCurrentItem();
    if(rit){ rmEnsureExecution(rit); rit.execution.horizon = rmClampHorizon(t.value); scheduleSave(); rmRerender(); }
    return;
  }
  if(t.dataset.rmbuf != null){
    const rit = rmCurrentItem();
    if(rit){ rmEnsureExecution(rit);
      const n = parseInt(t.value, 10);
      rit.execution.riskBuffer = (isFinite(n) && n > 0) ? Math.min(n, RM_HORIZON_MAX) : 0;
      scheduleSave(); rmRerender(); }
    return;
  }
  if(t.dataset.prhzval != null){
    PR.horizon = rmClampHorizon(t.value);
    if(STATE.project) renderProjectRoadmap(STATE.project);
    return;
  }
  if(t.dataset.pciprio != null){
    const pit = STATE.project && STATE.project.items.find(x=> x.id === t.dataset.pid);
    const c = pit && (pit.clientInputs || [])[+ (t.dataset.i)];
    if(c){ c.priority = t.value; scheduleSave(); renderProjectRoadmap(STATE.project); }
    return;
  }
  // installation waves — change day (asks about moving installs) / assign an item
  if(t.dataset.prwday != null && STATE.project){
    const w = prWaves(STATE.project).find(x=> x.id === t.dataset.prwday);
    if(w) prSetWaveDay(STATE.project, w, t.value);
    return;
  }
  if(t.dataset.prwassign != null && STATE.project){
    const iid = t.value; const wid = t.dataset.prwassign;
    const it = iid && STATE.project.items.find(x=> x.id === iid);
    const a = it && prInstAct(it);
    if(a){ a.waveId = wid; scheduleSave(); }
    renderProjectRoadmap(STATE.project);
    return;
  }
  if(t.dataset.rmf != null){
    const f = rmFind(t.dataset.rmid);
    if(f){
      const k = t.dataset.rmf;
      if(k === 'startDay'){ f.a.startDay = rmSanitizeDay(t.value, 1); if((+f.a.endDay||0) < f.a.startDay) f.a.endDay = f.a.startDay; }
      else if(k === 'endDay'){ f.a.endDay = rmSanitizeDay(t.value, +f.a.startDay||1); if(f.a.endDay < (+f.a.startDay||1)) f.a.endDay = +f.a.startDay||1; }
      else if(k === 'parallel' || k === 'isWait'){ f.a[k] = !!t.checked; }
      scheduleSave(); rmRerender();
    }
    return;
  }
  if(t.dataset.rmdep != null){
    const row = t.closest('.rm-deprow'); if(!row) return;
    const f = rmFind(row.dataset.rmid); if(!f) return;
    const d = (f.a.dependsOn || [])[+row.dataset.di]; if(!d) return;
    const k = t.dataset.rmdep;
    if(k === 'hard') d.hard = (t.value === 'hard');
    else if(k === 'lagDays') d.lagDays = rmSanitizeLag(t.value);
    else d[k] = t.value;          // 'on' | 'kind'
    scheduleSave(); rmRerender();
    return;
  }
  if(t.dataset.rmrisksev != null){
    const rit = rmCurrentItem();
    const r = rit && (rit.execution.risks || []).find(x=> x.id === t.dataset.rid);
    if(r){ if(r.source === 'auto' && r.severity !== t.value) r.editedFromAuto = true; r.severity = t.value; scheduleSave(); rmRerender(); }
    return;
  }
  if(t.dataset.rmciprio != null){
    const rit = rmCurrentItem();
    const c = rit && (rit.clientInputs || [])[+ (t.dataset.i)];
    if(c){ c.priority = t.value; scheduleSave(); }
    return;
  }

  const it=currentItem();
  if(it && t.dataset.p!=null){
    setPath(it, t.dataset.p, t.value);
    if(t.dataset.p==='currency' || t.dataset.p==='qty.unit') syncPricingTotal(it);
    scheduleSave();
  }
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.qcsearch != null){ QCLIENT.query = t.value; quotePaintClientResults(); return; }

  /* quotation revision editor — mutate the working copy; patch totals in place */
  if(STATE.quorev && (t.dataset.qri != null || t.dataset.qrc != null || t.dataset.qrf != null)){
    const w = STATE.quorev.w;
    if(t.dataset.qri != null){
      const it = w.items[+t.dataset.i]; if(!it) return;
      it[t.dataset.qri] = t.value;
      if(t.dataset.qri === 'qty' || t.dataset.qri === 'unitPrice'){
        const cell = document.querySelector('[data-qrline="'+t.dataset.i+'"]');
        if(cell) cell.textContent = fmtSar(quoLineTotal(it));
        const tot = quoRevTotals(w.items);
        const box = document.getElementById('qr-totals');
        if(box) box.innerHTML = '<span>Subtotal <b>'+fmtSar(tot.subtotal)+'</b></span>'
          + '<span>VAT 15% <b>'+fmtSar(tot.vat)+'</b></span>'
          + '<span class="qr-grand">Total <b>'+fmtSar(tot.total)+'</b></span>';
      }
    } else if(t.dataset.qrc != null){
      w.client = w.client || {}; w.client[t.dataset.qrc] = t.value;
    } else {
      w[t.dataset.qrf] = t.value;
    }
    return;
  }
});

document.addEventListener('click', async e=>{
  const t = e.target;
  const closest = s => t.closest(s);

  /* ----- navigation ----- */
  const back = closest('[data-back]'); if(back){ go(back.dataset.back); return; }

  /* ----- Arabize a Client Action (works in item editor + roadmap views) ----- */
  const arz = closest('[data-arabize]');
  if(arz){ await arabizeClientAction(arz.dataset.scope, +arz.dataset.i, arz.dataset.pid || null); return; }

  /* ----- storage / migration ----- */
  if(closest('[data-storage]')){ go('#/storage'); return; }
  if(closest('[data-usebrowser]')){ localStorage.removeItem('vista_tp_storage'); location.hash='#/'; location.reload(); return; }
  const dlbb = closest('[data-dlbrowserbackup]'); if(dlbb){ downloadBrowserBackup(dlbb); return; }
  const cbk  = closest('[data-centralbackup]'); if(cbk){ centralBackup(cbk); return; }
  if(closest('[data-migpreview]')){ migPreview(); return; }
  if(closest('[data-migcopy]')){ migCopy(); return; }
  if(closest('[data-migverify]')){ migVerify(); return; }
  if(closest('[data-migswitch]')){ migSwitch(); return; }

  if(closest('[data-newproject]')){
    const p = newProject(); await dbPut('projects', p); go('#/p/'+p.id); return;
  }
  if(closest('[data-loadsample]')){
    toast('Building sample…');
    const id = await seedSampleProject(); go('#/p/'+id); return;
  }
  const openP = closest('[data-open]'); if(openP && !closest('[data-pmenu]')){ go('#/p/'+openP.dataset.open); return; }
  const openI = closest('[data-openitem]'); if(openI){ go('#/p/'+STATE.project.id+'/i/'+openI.dataset.openitem); return; }

  /* ----- roadmap → direct PDF download (primary) / browser print (secondary) ----- */
  const rmpdfBtn = closest('[data-rmpdf]');
  if(rmpdfBtn){
    if(!STATE.project) return;
    const label = rmpdfBtn.textContent; rmpdfBtn.disabled = true; rmpdfBtn.textContent = 'Generating…';
    try{
      const r = parseHash();
      if(r.view === 'roadmap'){
        const it = STATE.project.items.find(x=> x.id === r.iid);
        if(it) await downloadItemRoadmapPdf(STATE.project, it);
      } else {
        await downloadProjectRoadmapPdf(STATE.project);
      }
    }catch(e){ toast('PDF failed: ' + e.message); console.error('[roadmap pdf]', e); }
    rmpdfBtn.disabled = false; rmpdfBtn.textContent = label;
    return;
  }
  if(closest('[data-rmprint]')){ window.print(); return; }

  /* ----- execution roadmap ----- */
  if(closest('[data-openroadmap]')){
    const cit = currentItem();
    if(cit) go('#/p/'+STATE.project.id+'/i/'+cit.id+'/roadmap');
    return;
  }
  /* ----- project-wide roadmap (M-Exec-4) ----- */
  if(closest('[data-projroadmap]')){ if(STATE.project) go('#/p/'+STATE.project.id+'/roadmap'); return; }
  const prGo = closest('[data-prgo], [data-pritem]');
  if(prGo && !closest('input, select, textarea, button')){
    const iid = prGo.dataset.prgo || prGo.dataset.pritem;
    if(iid && STATE.project) go('#/p/'+STATE.project.id+'/i/'+iid+'/roadmap');
    return;
  }
  const prv = closest('[data-prview] button');
  if(prv){ PR.view = prv.dataset.v; renderProjectRoadmap(STATE.project); return; }
  const prf = closest('[data-prfilter] button[data-v]');
  if(prf){ PR.filter = prf.dataset.v; renderProjectRoadmap(STATE.project); return; }
  const prc = closest('[data-prcollapse]');
  if(prc){
    const id = prc.dataset.prcollapse;
    if(PR.collapsed.has(id)) PR.collapsed.delete(id); else PR.collapsed.add(id);
    renderProjectRoadmap(STATE.project); return;
  }
  const prx = closest('[data-prexpand]');
  if(prx){
    if(prx.dataset.prexpand === '0') STATE.project.items.forEach(x=> PR.collapsed.add(x.id));
    else PR.collapsed.clear();
    renderProjectRoadmap(STATE.project); return;
  }
  const prhz = closest('[data-prhz]');
  if(prhz){
    PR.horizon = rmClampHorizon(prHorizon(STATE.project) + (+prhz.dataset.prhz));
    renderProjectRoadmap(STATE.project); return;
  }
  /* ----- installation waves (M-Exec-5) ----- */
  if(closest('[data-prwsuggest]')){ if(STATE.project) prShowWavePreview(STATE.project); return; }
  if(closest('[data-prwadd]')){
    if(!STATE.project) return;
    const waves = prEnsureWaves(STATE.project);
    const day = (prInstItems(STATE.project).map(prInstallDay).filter(d=> d!=null).sort((a,b)=>a-b)[0]) || 1;
    waves.push({ id: uid(), name: 'Wave ' + (waves.length + 1), day, note:'', source:'user' });
    scheduleSave(); renderProjectRoadmap(STATE.project); return;
  }
  const prwdel = closest('[data-prwdel]');
  if(prwdel && STATE.project){
    const w = prWaves(STATE.project).find(x=> x.id === prwdel.dataset.prwdel);
    if(w && await confirmDialog('Delete wave?', '"'+(w.name||'Wave')+'" will be removed. Assigned installation days are not changed; the items just become unassigned.', true)){
      STATE.project.items.forEach(it=>{ const a = prInstAct(it); if(a && a.waveId === w.id) delete a.waveId; });
      STATE.project.execution.waves = prWaves(STATE.project).filter(x=> x !== w);
      scheduleSave(); renderProjectRoadmap(STATE.project);
    }
    return;
  }
  const prwmv = closest('[data-prwmove]');
  if(prwmv && STATE.project){
    const arr = prWaves(STATE.project);
    const i = arr.findIndex(x=> x.id === prwmv.dataset.prwmove);
    const j = i + (+prwmv.dataset.dir);
    if(i>=0 && j>=0 && j<arr.length){ const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; scheduleSave(); renderProjectRoadmap(STATE.project); }
    return;
  }
  const prwun = closest('[data-prwunassign]');
  if(prwun && STATE.project){
    const it = STATE.project.items.find(x=> x.id === prwun.dataset.item);
    const a = it && prInstAct(it);
    if(a && a.waveId === prwun.dataset.prwunassign){ delete a.waveId; scheduleSave(); renderProjectRoadmap(STATE.project); }
    return;
  }
  if(closest('[data-rmsuggest]')){
    const rit = rmCurrentItem(); if(rit) rmShowSuggestionPreview(rit);
    return;
  }
  const rmdepadd = closest('[data-rmdepadd]');
  if(rmdepadd){
    const f = rmFind(rmdepadd.dataset.rmdepadd); if(!f) return;
    if(!Array.isArray(f.a.dependsOn)) f.a.dependsOn = [];
    f.a.dependsOn.push({ on:'', kind:'FS', lagDays:0, hard:false });
    scheduleSave(); rmRerender(); return;
  }
  const rmdepdel = closest('[data-rmdepdel]');
  if(rmdepdel){
    const f = rmFind(rmdepdel.dataset.rmdepdel); if(!f) return;
    (f.a.dependsOn || []).splice(+rmdepdel.dataset.di, 1);
    scheduleSave(); rmRerender(); return;
  }
  if(closest('[data-rmadd]')){
    const rit = rmCurrentItem(); if(!rit) return;
    const opts = EXECUTION_ACTIVITY_CATALOGUE.map(c=>({ label:c[1], v:c[0] }));
    opts.push({ label:'Custom Activity…', v:'custom' });
    const pick = await sheetMenu(opts);
    if(!pick) return;
    rmEnsureExecution(rit);
    const act = rmNewActivity(pick.v, pick.v==='custom' ? 'Custom activity' : pick.label);
    const arr = rit.execution.activities;
    if(arr.length){
      const maxEnd = arr.reduce((m,x)=> Math.max(m, +x.endDay||0, +x.startDay||0), 0);
      act.startDay = Math.max(1, maxEnd + 1);
      act.endDay   = act.startDay + 1;
    }
    arr.push(act);
    RM_OPEN.add(act.id);
    scheduleSave(); rmRerender();
    setTimeout(()=>{ const el = document.querySelector('[data-rmf="label"][data-rmid="'+act.id+'"]'); if(el){ el.focus(); el.select(); } }, 0);
    return;
  }
  const rmhz = closest('[data-rmhz]');
  if(rmhz){
    const rit = rmCurrentItem(); if(!rit) return;
    rmEnsureExecution(rit);
    rit.execution.horizon = rmClampHorizon(rmHorizonOf(rit) + (+rmhz.dataset.rmhz));
    scheduleSave(); rmRerender(); return;
  }
  const rmmv = closest('[data-rmmove]');
  if(rmmv){
    const f = rmFind(rmmv.dataset.rmmove); if(!f) return;
    const arr = f.ex.activities, i = arr.indexOf(f.a), j = i + (+rmmv.dataset.dir);
    if(j>=0 && j<arr.length){ const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; scheduleSave(); rmRerender(); }
    return;
  }
  const rmed = closest('[data-rmedit]');
  if(rmed){
    const id = rmed.dataset.rmedit;
    if(RM_OPEN.has(id)) RM_OPEN.delete(id); else RM_OPEN.add(id);
    rmRerender(); return;
  }
  const rmdel = closest('[data-rmdel]');
  if(rmdel){
    const f = rmFind(rmdel.dataset.rmdel); if(!f) return;
    if(await confirmDialog('Delete activity?', '"'+(f.a.label||'Activity')+'" will be removed from the roadmap.', true)){
      f.ex.activities = f.ex.activities.filter(x=>x!==f.a);
      RM_OPEN.delete(rmdel.dataset.rmdel);
      scheduleSave(); rmRerender();
    }
    return;
  }
  const rmpr = closest('[data-rmprogseg] button');
  if(rmpr){
    const f = rmFind(rmpr.parentElement.dataset.rmid); if(!f) return;
    f.a.progress = rmpr.dataset.v;
    scheduleSave(); rmRerender(); return;
  }
  /* ----- roadmap: risks ----- */
  if(closest('[data-rmrisksuggest]')){ const rit = rmCurrentItem(); if(rit) rmShowRiskPreview(rit); return; }
  if(closest('[data-rmriskadd]')){
    const rit = rmCurrentItem(); if(!rit) return;
    const ex = rmEnsureExecution(rit);
    const r = { id: uid(), text:'', severity:'warn', source:'user', ruleKey:'', dismissed:false, editedFromAuto:false, affects:[] };
    ex.risks.push(r); scheduleSave(); rmRerender();
    setTimeout(()=>{ const el = document.querySelector('[data-rmrisktext][data-rid="'+r.id+'"]'); if(el) el.focus(); }, 0);
    return;
  }
  const rrdel = closest('[data-rmriskdel]');
  if(rrdel){
    const rit = rmCurrentItem(); if(!rit) return;
    const ex = rmEnsureExecution(rit);
    const r = ex.risks.find(x=> x.id === rrdel.dataset.rid);
    if(r){
      if(r.source === 'auto' && r.ruleKey && ex.dismissedRuleKeys.indexOf(r.ruleKey) === -1) ex.dismissedRuleKeys.push(r.ruleKey);
      ex.risks = ex.risks.filter(x=> x !== r);
      scheduleSave(); rmRerender();
    }
    return;
  }
  if(closest('[data-rmriskreset]')){
    const rit = rmCurrentItem(); if(!rit) return;
    rmEnsureExecution(rit).dismissedRuleKeys = [];
    scheduleSave(); rmRerender();
    toast('Dismissed risk suggestions reset — Suggest Risks will offer them again');
    return;
  }
  /* ----- roadmap: client inputs ----- */
  if(closest('[data-rmcisuggest]')){ const rit = rmCurrentItem(); if(rit) rmShowClientInputPreview(rit); return; }
  if(closest('[data-rmciadd2]')){
    const rit = rmCurrentItem(); if(!rit) return;
    rmEnsureExecution(rit);
    rit.clientInputs.push({ priority:'required', text:'', requiredByDay:null, impactIfLate:'' });
    scheduleSave(); rmRerender();
    setTimeout(()=>{ const els = document.querySelectorAll('[data-rmcitext]'); if(els.length) els[els.length-1].focus(); }, 0);
    return;
  }
  const rcidel = closest('[data-rmcidel]');
  if(rcidel){
    const rit = rmCurrentItem(); if(!rit) return;
    (rit.clientInputs || []).splice(+rcidel.dataset.i, 1);
    scheduleSave(); rmRerender();
    return;
  }

  /* ----- projects list menu ----- */
  const pm = closest('[data-pmenu]');
  if(pm){
    const p = await dbGet('projects', pm.dataset.pmenu);
    const a = await sheetMenu([{label:'Open',v:'open'},{label:'Duplicate',v:'dup'},{label:'Delete project',v:'del',danger:true}]);
    if(a && a.v==='open') go('#/p/'+p.id);
    if(a && a.v==='dup') await duplicateProject(p);
    if(a && a.v==='del'){
      if(await confirmDialog('Delete project?', '"'+ (p.name||'Untitled') +'" and all its items and photos will be removed.', true)){
        await deleteProjectDeep(p.id); render();
      }
    }
    return;
  }

  /* ----- overview: project menu ----- */
  if(closest('[data-projmenu]')){
    const p = STATE.project;
    const a = await sheetMenu([{label:'Duplicate',v:'dup'},{label:'Delete project',v:'del',danger:true}]);
    if(a && a.v==='dup') await duplicateProject(p);
    if(a && a.v==='del' && await confirmDialog('Delete project?', 'This removes all items and photos.', true)){
      await deleteProjectDeep(p.id); go('#/');
    }
    return;
  }

  /* ----- create vista quotation ----- */
  if(closest('[data-quote]')){ go('#/p/'+STATE.project.id+'/quote'); return; }
  const qphb = closest('[data-qphrole]');
  if(qphb){ quoteSetPhoto(qphb.dataset.qitem, qphb.dataset.pid, qphb.dataset.qphrole); return; }
  const qzoom = closest('img[data-qzoom]');
  if(qzoom){ lightbox([qzoom.src], 0); return; }
  if(closest('[data-qopen]')){ await openInVistaQuotation(); return; }
  if(closest('[data-qcfetch]')){ await quoteFetchDaftraClients(); return; }
  if(closest('[data-qcclose]')){ quoteCloseClientPicker(); return; }
  const qcpick = closest('[data-qcpick]');
  if(qcpick){ quoteSelectDaftraClient(qcpick.dataset.qcpick); return; }

  /* ----- saved quotation revisions ----- */
  {
    const qOpen   = closest('[data-quoopen]');
    const qRevise = closest('[data-quorevise]');
    const qPdf    = closest('[data-quopdf]');
    if(qRevise){ go('#/p/'+STATE.project.id+'/quote/'+qRevise.dataset.quorevise); return; }
    if((qOpen || qPdf) && STATE.project){
      const id = (qOpen || qPdf).dataset[qOpen ? 'quoopen' : 'quopdf'];
      const s = quoEnsure(STATE.project).find(x=> x.id === id);
      if(s) await quoExportRevision(STATE.project, s, (s.revisions[s.revisions.length-1]||{}).rev);
      return;
    }
    const qOpenRev = closest('[data-quoopenrev]');
    if(qOpenRev){ const [sid, rv] = qOpenRev.dataset.quoopenrev.split('|');
      go('#/p/'+STATE.project.id+'/quote/'+sid+'/rev/'+rv); return; }
    const qPdfRev = closest('[data-quopdfrev]');
    if(qPdfRev && STATE.project){ const [sid, rv] = qPdfRev.dataset.quopdfrev.split('|');
      const s = quoEnsure(STATE.project).find(x=> x.id === sid);
      if(s) await quoExportRevision(STATE.project, s, +rv);
      return;
    }
  }
  /* ----- revision editor ----- */
  if(closest('[data-qradd]') && STATE.quorev){
    STATE.quorev.w.items.push({ itemId:null, name:'', description:'', qty:'1', unit:'no.', unitPrice:'', currency:'SAR', photoPrimary:null, photoSecondary:null });
    if(STATE.project) renderQuoRev(STATE.project);
    return;
  }
  const qrDel = closest('[data-qrdel]');
  if(qrDel && STATE.quorev){
    STATE.quorev.w.items.splice(+qrDel.dataset.qrdel, 1);
    if(STATE.project) renderQuoRev(STATE.project);
    return;
  }
  if(closest('[data-qrsave]') && STATE.project){ await quoSaveRevision(STATE.project, false); return; }
  if(closest('[data-qrsaveopen]') && STATE.project){ await quoSaveRevision(STATE.project, true); return; }

  /* ----- export / preview ----- */
  if(closest('[data-export]')){ go('#/p/'+STATE.project.id+'/export'); return; }
  const epk = closest('[data-exppack] button');
  if(epk){ STATE.exportPack = epk.dataset.v; renderExport(STATE.project); return; }
  if(closest('[data-expopen]')){ window.open(exportUrl(STATE.project), '_blank'); return; }

  const seg = closest('[data-seg] button');
  if(seg && it){

  const chip = closest('[data-chip], [data-chipsub]');
  if(chip && it){
    const gkey = chip.dataset.g, opt = chip.dataset.o;
    const store = pg(it, gkey);
    const parentGrp = PRESET_GROUPS.find(g=>g.key===gkey);           // top-level group?
    const grp = parentGrp || {};
    const i = store.values.indexOf(opt);
    if(i>=0){
      store.values.splice(i,1);
    } else if((grp.exclusive||[]).includes(opt)){
      store.values = [opt];
    } else {
      store.values = store.values.filter(v=> !(grp.exclusive||[]).includes(v));
      store.values.push(opt);
    }
    if(parentGrp) pruneHidden(it, parentGrp);
    scheduleSave(); refreshCard('presets', it); return;
  }
  const co = closest('[data-chipother]');
  if(co && it){
    const gkey = co.dataset.g;
    if(STATE.otherOpen.has(gkey)){ STATE.otherOpen.delete(gkey); pg(it,gkey).other=''; }

  }

  const cadd = closest('[data-ciadd]');
  if(cadd && it){
    it.clientInputs.push({ priority:'required', text:'' });
    scheduleSave(); refreshCard('ci', it);
    const fields = document.querySelectorAll('[data-citext]');

  }
  const cdel = closest('[data-cidel]');
  if(cdel && it){ it.clientInputs.splice(+cdel.dataset.i,1); scheduleSave(); refreshCard('ci', it); return; }
  const cprio = closest('[data-ciprioseg] button');
  if(cprio && it){
    it.clientInputs[+cprio.parentElement.dataset.i].priority = cprio.dataset.v;
    scheduleSave(); refreshCard('ci', it); return;
  }

  const tog = closest('[data-toggle]');
  if(tog){
    const k = tog.dataset.toggle;
    if(STATE.collapsed.has(k)) STATE.collapsed.delete(k); else STATE.collapsed.add(k);
    tog.parentElement.classList.toggle('collapsed');
    return;
  }

  /* ----- photos: single slots (simulation / sample / after) ----- */
  const addp = closest('[data-addphoto], [data-replacephoto]');
  if(addp && it){
    const fp = $('#filepick');
    fp.dataset.mode = 'slot';
    fp.dataset.slot = addp.dataset.slot || addp.dataset.replacephoto || addp.dataset.addphoto;
    fp.multiple = false; fp.value = ''; fp.click();
    return;
  }
  const rmp = closest('[data-removephoto]');
  if(rmp && it){
    if(await confirmDialog('Remove photo?', 'This deletes the stored image.', true)){
      await removePhoto(STATE.project, it, rmp.dataset.slot);
      await loadProjectPhotos(STATE.project.id);
      refreshCard('photos', it);
    }
    return;
  }
  const vp = closest('[data-viewphoto]');
  if(vp){ const u = photoUrl(vp.dataset.viewphoto); if(u) lightbox(u); return; }

  /* ----- photos: Existing Condition collection ----- */
  const exAdd = closest('[data-addexisting]');
  if(exAdd && it){
    const fp = $('#filepick');
    fp.dataset.mode = 'existing-add'; fp.multiple = true; fp.value = ''; fp.click();
    return;
  }
  const exRep = closest('[data-replaceexisting]');
  if(exRep && it){
    const fp = $('#filepick');
    fp.dataset.mode = 'existing-replace'; fp.dataset.exidx = exRep.dataset.replaceexisting;
    fp.multiple = false; fp.value = ''; fp.click();
    return;
  }
  const exRm = closest('[data-removeexisting]');
  if(exRm && it){
    if(await confirmDialog('Remove this Existing photo?', 'The other Existing photos are kept.', true)){
      await removeExistingPhoto(STATE.project, it, +exRm.dataset.removeexisting);
      await loadProjectPhotos(STATE.project.id);
      refreshCard('photos', it);
    }
    return;
  }
  const exMv = closest('[data-moveexisting]');
  if(exMv && it){
    if(moveExistingPhoto(it, +exMv.dataset.moveexisting, +exMv.dataset.dir)){
      await commitSave(); refreshCard('photos', it);
    }
    return;
  }
  const exView = closest('[data-viewexisting]');
  if(exView && it){
    lightbox(existingIds(it).map(id=>photoUrl(id)), +exView.dataset.viewexisting);
    return;
  }

  const dupIn = closest('[data-dupinputs]');
  if(dupIn && it){
    await duplicateInputsAndNext(STATE.project, it);
    return;
  }

  const nx = closest('[data-nextitem]');
  if(nx && it){
    await commitSave();
    // move to the NEXT item in the project's actual ordered items array —
    // never create a new item, never jump to the newest / highest-numbered one
    const items = STATE.project.items || [];
    const idx = items.findIndex(x => x.id === it.id);
    const next = (idx >= 0 && idx + 1 < items.length) ? items[idx + 1] : null;
    if(next) go('#/p/'+STATE.project.id+'/i/'+next.id);
    else go('#/p/'+STATE.project.id);   // last item → back to project overview (same as Done)
    return;
  }
});

/* ============================================================
   10c · View — Create Vista Quotation  (Phase 1 bridge)
   ------------------------------------------------------------
   Prepares a clean, fully editable payload and hands it to the
   EXISTING Vista quotation editor/PDF (daftra-pdf-generator_1.html).
   No quotation template is created here. Transfer goes through a
   dedicated single-use IndexedDB (vista_quotation_handoff) — the
   vista_tpb schema is never touched.
   ============================================================ */
const QUOTE_GENERATOR_FILE = 'daftra-pdf-generator_1.html';
const QUOTE_HANDOFF_DB = 'vista_quotation_handoff';
const QUOTE_VAT_RATE = 0.15;

function qGroupVals(it, key){
  const g = it.presets && it.presets[key];
  return (g && Array.isArray(g.values)) ? g.values.slice() : [];
}
function qDimsPhrase(it){
  const d = it.dims || {};
  const w = parseFloat(d.w), h = parseFloat(d.h);
  const m = n => (n/1000).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  if(isFinite(w) && w>0 && isFinite(h) && h>0) return 'approx. '+m(w)+' × '+m(h)+' m';
  if(isFinite(w) && w>0) return 'approx. '+m(w)+' m wide';
  if(isFinite(h) && h>0) return 'approx. '+m(h)+' m high';
  return '';
}
/* lower-case for prose, but keep ALL-CAPS acronyms (ACP, LED, PVC, MDF, UV, CNC) intact */
function qLc(s){
  return String(s||'').split(/(\s+|\/)/).map(tok=>{
    const w = tok.trim();
    if(!w) return tok;
    if(w.length<=4 && w===w.toUpperCase() && /[A-Z]/.test(w)) return tok;
    return tok.toLowerCase();
  }).join('');
}
const Q_EXISTWORK_PHRASE = {
  'Remove Existing':'removal of existing work',
  'Modify Existing':'modification of existing work',
  'Replace Branding Only':'replacement of existing branding',
  'Reuse Existing Base / Structure':'reuse of the existing base / structure',
  'Surface Preparation':'surface preparation',
  'Repaint':'repainting',
};
/* Compose a concise commercial line from data that ALREADY EXISTS on the item.
   Never invents a spec. Never dumps the full Technical Specifications table.
   Fully editable by the user before transfer. */
function composeQuoteDescription(it){
  const scope = String((it.notes && it.notes.scope) || '').trim().replace(/\s+/g,' ').replace(/[.;,\s]+$/,'');
  const material    = qGroupVals(it,'material').join(' / ');
  const fabrication = [...qGroupVals(it,'branding'), ...qGroupVals(it,'fabrication')]
                        .filter((v,i,a)=>a.indexOf(v)===i).join(', ');
  const finish   = qGroupVals(it,'finish').join(' / ');
  const lighting = qGroupVals(it,'lighting').filter(v=>v && v!=='None');
  const existWork = qGroupVals(it,'existingWork').filter(v=>v && v!=='Keep As Is');
  const existNote = String((it.presets && it.presets.existingWorkNote) || '').trim().replace(/[.;,\s]+$/,'');

  let lead = scope;
  if(!lead){
    const bits = [];
    if(lighting.length) bits.push('illuminated');
    if(material) bits.push(qLc(material));
    if(fabrication) bits.push(qLc(fabrication));
    lead = bits.join(' ').trim() || String(it.name || '').trim();
  }

  const parts = [];
  if(lead) parts.push(lead);
  const dim = qDimsPhrase(it); if(dim) parts.push(dim);
  if(finish) parts.push(qLc(finish)+' finish');
  if(lighting.length && !/illuminat|lit|led|light/i.test(parts.join(' ')))
    parts.push(qLc(lighting.join(' / '))+' lighting');

  let out = parts.filter(Boolean).join(', ');
  if(existWork.length || existNote){
    // Existing-work handling only — never appended with "and installation".
    // Installation is added ONLY if the item's own stored scope/technical text
    // actually mentions it (checked below); nothing is invented here.
    const ewPhrase = existNote
      ? existNote
      : existWork.map(v=> Q_EXISTWORK_PHRASE[v] || qLc(v)).join(' and ');
    out += (out ? ', ' : '') + 'including ' + ewPhrase;
  }
  const scopeText = ((it.notes && (it.notes.scope||'') + ' ' + (it.notes.technical||'')) || '').toLowerCase();
  if(/\binstall(ation|ing|ed|s)?\b/.test(scopeText) && !/install/i.test(out))
    out += (out ? ', ' : '') + 'including installation';
  out = out.replace(/\s+/g,' ').trim();
  if(out) out = out.charAt(0).toUpperCase() + out.slice(1) + '.';
  return out;
}

function buildQuoteState(p){
  return {
    pid: p.id,
    quoteNo: '',
    client: p.client || '',

/* ── Fetch client from Daftra ────────────────────────────────────────────────
   Uses the SAME read-only proxy the Financial Dashboard uses: GET /daftra/…
   The API key lives only in proxy.py / config.json — never in browser code.
   Requires the suite to be served by proxy.py (same origin). If it is not
   reachable (e.g. opened via a plain static server) the picker degrades to a
   clear message and manual entry still works. */
const QCLIENT = { open:false, loading:false, error:'', clients:null, query:'' };

async function quoteFetchDaftraClients(){
  if(QCLIENT.clients){ QCLIENT.open = true; renderQuote(STATE.project); return; }
  QCLIENT.open = true; QCLIENT.loading = true; QCLIENT.error = '';
  if(!QCLIENT.query) QCLIENT.query = (STATE.quote && STATE.quote.client) || '';
  renderQuote(STATE.project);
  try{
    const all = [];
    for(let page=1; page<=20; page++){
      const res = await fetch('/daftra/clients.json?limit=100&page='+page, { headers:{ 'Accept':'application/json' } });
      const ct = (res.headers.get('content-type') || '').toLowerCase();
      if(!res.ok || ct.indexOf('json') === -1){
        let msg = 'HTTP ' + res.status;
        try{ const j = await res.json(); msg = j.error || j.message || msg; }catch(_){}
        throw new Error(msg);
      }
      const j = await res.json();
      const rows = (j.data || []).map(r => r.Client || r).filter(Boolean);
      rows.forEach(c=>{
        const name = c.business_name
          || (String(c.first_name||'') + ' ' + String(c.last_name||'')).trim()
          || ('Client #' + c.id);
        all.push({
          id: String(c.id), name,
          vat: String(c.bn1 || '').trim(), cr: String(c.bn2 || '').trim(),
          address1: String(c.address1 || c.address || '').trim(),
          city: String(c.city || '').trim(),
          postal: String(c.postal_code || c.zip || '').trim(),
        });
      });
      const pc = parseInt((j.pagination||{}).page_count || 0, 10);
      if(rows.length < 100) break;
      if(pc && page >= pc) break;
    }
    all.sort((a,b)=> a.name.localeCompare(b.name));
    QCLIENT.clients = all;
  }catch(err){
    QCLIENT.error = 'Could not reach Daftra (' + (err.message || 'unknown') + '). '
      + 'Open the suite through proxy.py to use client lookup — you can still type the details in manually.';
  }
  QCLIENT.loading = false;
  renderQuote(STATE.project);
}
function quoteCloseClientPicker(){ QCLIENT.open = false; renderQuote(STATE.project); }
function quoteClientMatches(){
  const q = String(QCLIENT.query || '').trim().toLowerCase();
  const list = QCLIENT.clients || [];
  if(!q) return list.slice(0, 40);
  return list.filter(c =>
    c.name.toLowerCase().includes(q) || c.vat.includes(q) || c.cr.includes(q)

  if(!QCLIENT.open) return '';

/* Combine the selected 1–2 existing photos into ONE clean image so the existing
   single-photo quotation layout (doc._items[]._photoDataUrl) is reused unchanged.
   Aspect ratio preserved, no crop, small white gap, no labels. */
function quoteLoadImg(blob){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload  = ()=>{ im._url = url; res(im); };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('image decode failed')); };
    im.src = url;
  });
}
async function composeQuotePhoto(primaryId, secondaryId){
  const ids = [primaryId, secondaryId].filter(Boolean);
  if(!ids.length) return '';
  const blobs = ids.map(id=>{ const r = photoRec(id); return r && r.blob; }).filter(Boolean);
  if(!blobs.length) return '';

  let imgs = [];
  try { imgs = await Promise.all(blobs.map(quoteLoadImg)); }
  catch(e){ console.warn('[Quotation] photo compose failed:', e); return ''; }

  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const BG = '#ffffff';
  let out = '';

  if(imgs.length === 1){
    const im = imgs[0];
    const s = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight));
    cv.width  = Math.max(1, Math.round(im.naturalWidth * s));
    cv.height = Math.max(1, Math.round(im.naturalHeight * s));
    ctx.fillStyle = BG; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(im, 0,0, cv.width, cv.height);
  } else {
    const H = 560, GAP = 14;
    const panels = imgs.slice(0,2).map(im=>{
      const s = H / im.naturalHeight;
      return { im, w: Math.max(1, Math.round(im.naturalWidth * s)), h: H };
    });
    cv.width  = panels.reduce((a,p)=>a+p.w,0) + GAP;
    cv.height = H;
    ctx.fillStyle = BG; ctx.fillRect(0,0,cv.width,cv.height);
    let x = 0;
    for(const p of panels){
      ctx.drawImage(p.im, 0,0, p.im.naturalWidth, p.im.naturalHeight, x, 0, p.w, p.h);
      x += p.w + GAP;
    }
    if(cv.width > 1500){
      const s = 1500 / cv.width;
      const c2 = document.createElement('canvas');
      c2.width = 1500; c2.height = Math.round(cv.height * s);
      const g2 = c2.getContext('2d');
      g2.fillStyle = BG; g2.fillRect(0,0,c2.width,c2.height);
      g2.drawImage(cv, 0,0, c2.width, c2.height);
      out = c2.toDataURL('image/jpeg', 0.9);
    }
  }
  if(!out) out = cv.toDataURL('image/jpeg', 0.9);
  imgs.forEach(im=>{ if(im._url) URL.revokeObjectURL(im._url); });
  return out;
}

function quoteOpenHandoffDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(QUOTE_HANDOFF_DB, 1);
    r.onupgradeneeded = ()=>{
      const db = r.result;
      if(!db.objectStoreNames.contains('payload')) db.createObjectStore('payload',{keyPath:'id'});
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror   = ()=>rej(r.error);
  });
}
async function quoteWriteHandoff(doc, pid){
  const db = await quoteOpenHandoffDB();
  await new Promise((res,rej)=>{
    const tx = db.transaction('payload','readwrite');
    tx.objectStore('payload').put({
      id:'current', createdAt:Date.now(), source:'technical-proposal',
      pid: pid || (STATE.quote && STATE.quote.pid) || (STATE.project && STATE.project.id) || null, doc,
    });
    tx.oncomplete = ()=>res();
    tx.onerror    = ()=>rej(tx.error);
  });
}

/* ---- shared quotation-doc builders (used by both the Create flow and the
   Saved-Revision editor). Photo IDs are composed to data URLs here, fresh,
   from whatever photos currently exist on the project item. ---- */
async function quoComposeItems(rows){
  const round2 = n => Math.round((Number(n)+Number.EPSILON)*100)/100;
  let subtotal = 0; const _items = [];
  for(const x of rows){
    const price = moneyNum(x.unitPrice), qty = moneyNum(x.qty);
    const before = round2((price!=null && qty!=null) ? price*qty : 0);
    subtotal += before;
    let desc = String(x.description || '').trim();
    const unit = String(x.unit || '').trim();
    if(unit && unit.toLowerCase() !== 'no.'){
      const tag = '(per ' + unit + ')';
      desc = desc ? (/[.]\s*$/.test(desc) ? desc.replace(/\s*\.\s*$/, '') + ' ' + tag + '.' : desc + ' ' + tag) : tag;
    }
    const pP = x.photoPrimary, pS = x.photoSecondary;
    const variants = {};
    if(pP && photoUrl(pP))                        variants.primary   = await composeQuotePhoto(pP, null);
    if(pS && photoUrl(pS))                        variants.secondary = await composeQuotePhoto(pS, null);
    if(pP && pS && photoUrl(pP) && photoUrl(pS))  variants.both      = await composeQuotePhoto(pP, pS);
    const defKey = variants.both ? 'both' : (variants.primary ? 'primary' : (variants.secondary ? 'secondary' : null));
    _items.push({
      item: x.name || '—',
      description: desc,
      unit_price: (x.unitPrice==='' || price==null) ? '' : price,
      quantity:   (x.qty==='' || qty==null) ? '' : qty,
      item_subtotal: before,
      tax1_percent: '15%',
      tax1_value: round2(before * QUOTE_VAT_RATE),
      subtotal:   round2(before * (1 + QUOTE_VAT_RATE)),
      _photoDataUrl: defKey ? variants[defKey] : '',
      _photoSize: (defKey === 'both') ? 'large' : 'medium',
      ...(Object.keys(variants).length > 1 ? { _tpPhotoVariants: variants, _tpPhotoActive: defKey } : {}),
    });
  }
  return { _items, subtotal: round2(subtotal) };
}
function quoWrapDoc(no, client, deliveryDays, notes, composed){
  const round2 = n => Math.round((Number(n)+Number.EPSILON)*100)/100;
  const subtotal = composed.subtotal;
  return {
    no: String(no || '').trim(),
    date: quoteToday(),
    client_business_name: client.name || '',
    _clientVat: client.vat || '',
    _clientCr:  client.cr || '',
    client_address1:    String(client.address1 || '').trim(),
    client_city:        String(client.city || '').trim(),
    client_postal_code: String(client.postal || '').trim(),
    summary_subtotal: subtotal,
    summary_tax:      round2(subtotal * QUOTE_VAT_RATE),
    total_amount:     round2(subtotal * (1 + QUOTE_VAT_RATE)),
    _deliveryDays:    quoteSanitizeDays(deliveryDays),
    _quotationNotes:  String(notes || '').trim(),
    _items: composed._items,
  };
}

async function openInVistaQuotation(){
  const q = STATE.quote; if(!q) return;
  const inc = q.items.filter(x=>x.include);
  if(!inc.length){ toast('Select at least one item'); return; }

  // HARD BLOCK — this milestone's Vista quotation template is SAR-only.
  const nonSar = inc.filter(x=>x.currency && x.currency!=='SAR');
  if(nonSar.length){
    await confirmDialog('SAR only',
      'This Vista quotation template currently supports SAR only. '
      +'Change item currency to SAR before continuing.', false);
    return;
  }

  const p = STATE.project;

  // Blank quotation number — auto-assign a series number so the quotation can be
  // saved & revised later (the whole point of this feature).
  if(!String(q.quoteNo || '').trim() && p){
    q.quoteNo = quoNextNo(p);
    const el = document.querySelector('[data-qf="quoteNo"]'); if(el) el.value = q.quoteNo;
  }

  // Missing Unit Price — warn, never guess.
  const noPrice = inc.filter(x=>moneyNum(x.unitPrice)==null);
  if(noPrice.length){
    const ok = await quoteConfirm2('Missing Unit Price',
      noPrice.length+' selected item'+(noPrice.length>1?'s have':' has')+' no Unit Price. '
      +(noPrice.length>1?'They':'It')+' will appear as SAR 0.00 in the quotation.',
      'Continue Anyway', 'Go Back / Review Prices');
    if(!ok) return;
  }

  toast('Preparing quotation…');
  const composed = await quoComposeItems(inc.map(x=>({
    name:x.name, description:x.description, qty:x.qty, unit:x.unit, unitPrice:x.unitPrice,
    photoPrimary:x.photoPrimary, photoSecondary:x.photoSecondary,
  })));
  const client = { name:q.client, vat:q.clientVat, cr:q.clientCr,
    address1:q.clientAddress1, city:q.clientCity, postal:q.clientPostal };
  const doc = quoWrapDoc(q.quoteNo, client, q.deliveryDays, q.notes, composed);

  // Save this as a reopenable / revisable quotation series (Rev 0) in the central DB.
  if(p){
    try{
      const now = Date.now();
      quoAttach(p).push({
        id: uid(),
        no: String(q.quoteNo || '').trim() || quoNextNo(p),
        createdAt: now,
        revisions: [ quoRevisionFromQuoteState(q, 0, 'Original') ],
      });
      await dbPut('projects', p);
    }catch(e){ console.error('[quotations] save failed', e); }
  }

  try { await quoteWriteHandoff(doc, p && p.id); }
  catch(e){ console.error(e); toast('Could not prepare the handoff'); return; }

  window.open(QUOTE_GENERATOR_FILE + '?tpquo=' + Date.now() + '#tp-quo', '_blank');
}

/* ============================================================
   10d · Saved Quotation Revisions  (Central DB — project.quotations[])
   ------------------------------------------------------------
   project.quotations = [ { id, no, createdAt, revisions:[ {
     rev, label, createdAt, revisedAt,
     client:{name,vat,cr,address1,city,postal,daftraClientId},
     deliveryDays, notes,
     items:[ {itemId,name,description,qty,unit,unitPrice,currency,photoPrimary,photoSecondary} ],
     subtotal, vat, total } ] } ]
   Never overwrites a revision — Revise always appends. Stored in the same
   verbatim project JSON blob that already persists to the Vista Central DB,
   so no new endpoint / schema is needed and a second browser sees the history.
   The existing daftra quotation editor still produces the final PDF.
   ============================================================ */
/* read-only: never mutates the project (so merely viewing an overview can't
   add a `quotations` key and trigger a needless central-DB write). The array
   is created lazily only when a quotation is actually saved — see quoAttach(). */
function quoEnsure(p){ return Array.isArray(p.quotations) ? p.quotations : []; }
function quoAttach(p){ if(!Array.isArray(p.quotations)) p.quotations = []; return p.quotations; }
function quoNextNo(p){
  const nums = quoEnsure(p).map(s=>{ const m = /Q-(\d+)/i.exec(String(s.no||'')); return m ? +m[1] : 0; });
  const max = nums.length ? Math.max.apply(null, nums) : 1000;
  return 'Q-' + (Math.max(1000, max) + 1);
}
function quoRound2(n){ return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function quoRevTotals(items){
  let sub = 0;
  (items || []).forEach(it=>{
    const pr = moneyNum(it.unitPrice), qt = moneyNum(it.qty);
    sub += quoRound2((pr != null && qt != null) ? pr * qt : 0);
  });
  sub = quoRound2(sub);
  const vat = quoRound2(sub * QUOTE_VAT_RATE);
  return { subtotal: sub, vat: vat, total: quoRound2(sub + vat) };
}
function quoLineTotal(it){
  const pr = moneyNum(it.unitPrice), qt = moneyNum(it.qty);
  return (pr != null && qt != null) ? quoRound2(pr * qt) : 0;
}
function fmtSar(n){
  const v = Number(n);
  return 'SAR ' + (isFinite(v) ? v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) : '0.00');
}
function fmtQuoDate(ms){
  if(!ms) return '—';
  const d = new Date(ms);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-GB',{day:'2-digit', month:'short', year:'numeric'});
}
/* snapshot the Create-Quotation prep state into a revision object */
function quoRevisionFromQuoteState(q, rev, label){
  const items = q.items.filter(x=>x.include).map(x=>({
    itemId: x.id, name: x.name || '', description: x.description || '',
    qty: String(x.qty == null ? '' : x.qty), unit: x.unit || 'no.',
    unitPrice: String(x.unitPrice == null ? '' : x.unitPrice), currency: x.currency || 'SAR',
    photoPrimary: x.photoPrimary || null, photoSecondary: x.photoSecondary || null,
  }));
  const t = quoRevTotals(items);
  const now = Date.now();
  return {
    rev: rev,
    label: label || (rev === 0 ? 'Original' : 'Revision ' + rev),
    createdAt: now, revisedAt: now,
    client: { name:q.client||'', vat:q.clientVat||'', cr:q.clientCr||'',
      address1:q.clientAddress1||'', city:q.clientCity||'', postal:q.clientPostal||'',
      daftraClientId:q.daftraClientId||'' },
    deliveryDays: q.deliveryDays || '', notes: q.notes || '',
    items: items, subtotal: t.subtotal, vat: t.vat, total: t.total,
  };
}

async function quoSaveRevision(p, openAfter){
  const st = STATE.quorev; if(!st) return null;
  const series = quoEnsure(p).find(s=> s.id === st.sid); if(!series) return null;
  const revs = series.revisions || (series.revisions = []);
  const nextRev = (revs.length ? (revs[revs.length - 1].rev || 0) : -1) + 1;
  const w = st.w;
  const t = quoRevTotals(w.items);
  const now = Date.now();
  const newRev = {
    rev: nextRev,
    label: String(w.label || '').trim() || 'Revision ' + nextRev,
    createdAt: now, revisedAt: now,
    client: {
      name: w.client.name||'', vat: w.client.vat||'', cr: w.client.cr||'',
      address1: w.client.address1||'', city: w.client.city||'', postal: w.client.postal||'',
      daftraClientId: w.client.daftraClientId||'',
    },
    deliveryDays: w.deliveryDays || '', notes: w.notes || '',
    items: (w.items || []).map(it=>({
      itemId: it.itemId || null, name: it.name || '', description: it.description || '',
      qty: String(it.qty == null ? '' : it.qty), unit: it.unit || 'no.',
      unitPrice: String(it.unitPrice == null ? '' : it.unitPrice), currency: it.currency || 'SAR',
      photoPrimary: it.photoPrimary || null, photoSecondary: it.photoSecondary || null,
    })),
    subtotal: t.subtotal, vat: t.vat, total: t.total,
  };
  revs.push(newRev);
  try{ await dbPut('projects', p); }
  catch(e){ toast('Save failed: ' + (e.message || e)); revs.pop(); return null; }
  STATE.quorev = null;
  toast(series.no + ' Rev ' + nextRev + ' saved');
  if(openAfter){ await quoExportRevision(p, series, nextRev); }
  else go('#/p/'+p.id);
  return newRev;
}
