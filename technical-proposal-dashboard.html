/* ============================================================
   14 · Roadmap PDF — deterministic true A4 landscape (jsPDF)
   ------------------------------------------------------------
   Vector text via jsPDF (the PDF engine Vista already bundles
   through html2pdf in daftra-pdf-generator). NO window.print(),
   NO @page, NO browser orientation. jsPDF writes the MediaBox:
   every page is exactly 297 x 210 mm landscape, deterministic
   on any machine. Blocks (Gantt rows, cards, table rows) never
   split across a page break — they flow whole to the next page,
   so there are no half-rows and no forced blank areas.
   ============================================================ */
const RMPDF_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let _rmpdfLibP = null;
function rmpdfLib(){
  if(_rmpdfLibP) return _rmpdfLibP;
  _rmpdfLibP = new Promise((res,rej)=>{
    if(window.jspdf && window.jspdf.jsPDF) return res(window.jspdf.jsPDF);
    const s = document.createElement('script'); s.src = RMPDF_SRC;
    s.onload = ()=> (window.jspdf && window.jspdf.jsPDF) ? res(window.jspdf.jsPDF) : rej(new Error('PDF engine did not initialise'));
    s.onerror = ()=> rej(new Error('Could not load the PDF engine (offline?)'));
    document.head.appendChild(s);
  });
  return _rmpdfLibP;
}
/* jsPDF standard fonts are Latin-1 only — fold the few glyphs the roadmap uses */
function rmA(s){
  return String(s==null?'':s)
    .replace(/[–—‑]/g,'-').replace(/→/g,'->').replace(/↳/g,'>')
    .replace(/⇄/g,'<>').replace(/[⏳⌛]/g,'(wait)').replace(/◆/g,'*')
    .replace(/[⚠️]/g,'!').replace(/✓/g,'v')
    .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[^\x00-\xFF]/g,'');
}
const RMPDF_C = {
  ink:[30,30,27], grey:[90,90,84], faint:[150,148,140], rule:[214,212,204],
  emerald:[26,92,70], forest:[14,61,46], gold:[140,118,67], amber:[138,94,30], stop:[156,58,52],
  cream:[247,244,238], wash:[238,244,240],
  ph:{ plan:[92,107,114], design:[140,118,67], site:[138,94,30], prod:[26,92,70],
       dispatch:[58,122,98], install:[14,61,46], close:[138,137,127], custom:[122,110,82], wait:[150,148,140] },
  sev:{ block:[156,58,52], warn:[138,94,30], info:[58,122,98] }
};

/* flow-layout wrapper around one landscape jsPDF doc */
function rmpdfNew(jsPDF, brand, sub){
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'landscape', compress:true });
  const S = { doc, W:297, H:210, M:10, X0:10, X1:287, CW:277, y:0, page:0, brand, sub };
  S.header = ()=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor.apply(doc, RMPDF_C.forest);
    doc.text('VISTA UNITED', S.X0, S.M+3.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor.apply(doc, RMPDF_C.grey);
    doc.text(rmA(S.brand||''), S.X0+33, S.M+3.5, { maxWidth:S.CW-33 });
    if(S.sub){ doc.setFontSize(8); doc.setTextColor.apply(doc, RMPDF_C.faint);
      doc.text(rmA(S.sub), S.X0, S.M+8); }
    doc.setDrawColor.apply(doc, RMPDF_C.forest); doc.setLineWidth(0.5);
    doc.line(S.X0, S.M+10.5, S.X1, S.M+10.5);
    S.y = S.M + 15;
  };
  S.addPage = ()=>{ if(S.page>0) doc.addPage([S.W,S.H],'landscape'); S.page++; S.header(); };
  S.ensure = (h)=>{ if(S.y + h > S.H - S.M) S.addPage(); };
  S.rule = ()=>{ doc.setDrawColor.apply(doc, RMPDF_C.rule); doc.setLineWidth(0.2); doc.line(S.X0, S.y, S.X1, S.y); };
  S.gap = (h)=>{ S.y += (h==null?3:h); };
  S.sectionTitle = (t)=>{
    S.ensure(8);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor.apply(doc, RMPDF_C.gold);
    doc.text(rmA(String(t).toUpperCase()), S.X0, S.y); S.y += 5;
  };
  S.addPage();
  return S;
}
function rmpdfSetFill(doc, rgb){ doc.setFillColor(rgb[0],rgb[1],rgb[2]); }
function rmpdfSetText(doc, rgb){ doc.setTextColor(rgb[0],rgb[1],rgb[2]); }
function rmpdfSetDraw(doc, rgb){ doc.setDrawColor(rgb[0],rgb[1],rgb[2]); }

/* one Gantt block: activities as bars over a shared working-day axis */
function rmpdfGantt(S, item, acts, horizon, nameW){
  const doc = S.doc;
  nameW = nameW || 62;
  const tlX = S.X0 + nameW + 2;
  const tlW = S.X1 - tlX;
  const colW = Math.max(2.2, Math.min(7, tlW / Math.max(1,horizon)));
  const usedW = colW * horizon;
  const step = colW < 4 ? 5 : (colW < 6 ? 2 : 1);

  const axis = ()=>{
    S.ensure(6);
    doc.setFont('helvetica','normal'); doc.setFontSize(6); rmpdfSetText(doc, RMPDF_C.faint);
    for(let d=1; d<=horizon; d++){
      if(d===1 || d===horizon || d % step === 0)
        doc.text(String(d), tlX + (d-0.5)*colW, S.y, { align:'center' });
    }
    doc.setFontSize(6.5); rmpdfSetText(doc, RMPDF_C.gold);
    doc.text('DAY', S.X0, S.y);
    S.y += 2.4;
    rmpdfSetDraw(doc, RMPDF_C.rule); doc.setLineWidth(0.15);
    doc.line(tlX, S.y, tlX + usedW, S.y);
    S.y += 1.5;
  };
  axis();

  acts.forEach(a=>{
    const s = Math.max(1, Math.min(horizon, +a.startDay||1));
    const e = Math.max(s, Math.min(horizon, +a.endDay||s));
    const dur = e - s + 1;
    const deps = (Array.isArray(a.dependsOn) && a.dependsOn.length)
      ? a.dependsOn.map(d=> (d.kind==='SS'?'with ':'after ') + rmA(rmDepLabel(item, d)) + (d.hard?' (required)':'')) : [];
    let viol = [];
    try{ viol = rmHardViolations(item, a) || []; }catch(_){}
    const badgeTxt = [ a.parallel?'PARALLEL':'', a.isWait?'WAITING':'' ].filter(Boolean).join('  ');
    const nameLines = doc.splitTextToSize(rmA(a.label||'Activity'), nameW - 1);
    const depLines = deps.length ? doc.splitTextToSize(deps.map(d=>'> '+d).join('\n'), nameW - 1) : [];
    const violLines = viol.length ? doc.splitTextToSize('! '+rmA(viol[0]), nameW - 1) : [];
    const rowH = Math.max(7,
      nameLines.length*3.1 + 2.6 + (badgeTxt?2.8:0) + depLines.length*2.7 + violLines.length*2.7 + 2);
    S.ensure(rowH + 1);
    const top = S.y;

    // gridlines for this row
    rmpdfSetDraw(doc, [235,233,226]); doc.setLineWidth(0.1);
    for(let d=0; d<=horizon; d+=step) doc.line(tlX + d*colW, top-1, tlX + d*colW, top + rowH - 2);

    // bar
    const bx = tlX + (s-1)*colW, bw = dur*colW, by = top + 0.4, bh = 3.4;
    const col = RMPDF_C.ph[rmPhase(a)] || RMPDF_C.ph.custom;
    const prog = a.progress || 'not_started';
    if(a.isWait){
      // waiting for client — aggressive amber dashed outline
      rmpdfSetFill(doc, [247,240,225]); doc.roundedRect(bx, by, bw, bh, 0.6, 0.6, 'F');
      rmpdfSetDraw(doc, RMPDF_C.amber); doc.setLineWidth(0.5); doc.setLineDashPattern([0.9,0.7],0);
      doc.roundedRect(bx, by, bw, bh, 0.6, 0.6, 'S'); doc.setLineDashPattern([],0);
      if(bw > 12){ doc.setFont('helvetica','bold'); doc.setFontSize(5); rmpdfSetText(doc, RMPDF_C.amber);
        doc.text('WAITING', bx + 1.4, by + bh - 0.9); }
    } else if(prog === 'not_started'){
      // not started — hollow phase-colour outline (never a solid dark bar)
      rmpdfSetDraw(doc, col); doc.setLineWidth(0.45);
      doc.roundedRect(bx, by, bw, bh, 0.6, 0.6, 'S');
    } else {
      rmpdfSetFill(doc, col); doc.roundedRect(bx, by, bw, bh, 0.6, 0.6, prog==='done' ? 'F' : 'F');
      if(a.parallel){
        rmpdfSetDraw(doc, [255,255,255]); doc.setLineWidth(0.25);
        for(let hx = bx - bh; hx < bx + bw; hx += 1.4) doc.line(Math.max(bx,hx), by+bh, Math.min(bx+bw, hx+bh), by);
      }
      if(bw > 9){
        doc.setFont('helvetica','bold'); doc.setFontSize(5.6); rmpdfSetText(doc, [255,255,255]);
        doc.text(dur+'d', bx + 1.4, by + bh - 0.9);
      }
    }
    if(prog==='done' || prog==='in_progress'){
      rmpdfSetFill(doc, prog==='done' ? RMPDF_C.emerald : RMPDF_C.amber);
      doc.circle(tlX - 1.6, by + bh/2, 0.9, 'F');
    }

    // name column
    let ny = top + 1.2;
    doc.setFont('helvetica','bold'); doc.setFontSize(7.4); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(nameLines, S.X0, ny); ny += nameLines.length*3.1;
    doc.setFont('helvetica','normal'); doc.setFontSize(6.4); rmpdfSetText(doc, RMPDF_C.grey);
    doc.text((s===e?('D'+s):('D'+s+'-'+e)) + '  ' + dur + 'd', S.X0, ny); ny += 2.6;
    if(badgeTxt){ doc.setFontSize(6); rmpdfSetText(doc, RMPDF_C.gold); doc.text(badgeTxt, S.X0, ny); ny += 2.8; }
    if(depLines.length){ doc.setFontSize(6); rmpdfSetText(doc, RMPDF_C.emerald); doc.text(depLines, S.X0, ny); ny += depLines.length*2.7; }
    if(violLines.length){ doc.setFontSize(6); rmpdfSetText(doc, RMPDF_C.stop); doc.text(violLines, S.X0, ny); ny += violLines.length*2.7; }

    S.y = top + rowH;
    rmpdfSetDraw(doc, RMPDF_C.rule); doc.setLineWidth(0.12); doc.line(S.X0, S.y - 0.5, S.X1, S.y - 0.5);
  });

  // risk-buffer block — drawn AFTER planned finish, activities left as-is
  const pf = rmPlannedFinish(item), buf = rmRiskBuffer(item);
  if(pf && buf){
    S.ensure(8);
    const bs = Math.min(horizon, pf + 1), be = Math.min(horizon, pf + buf);
    const bx = tlX + (bs-1)*colW, bw = Math.max(colW, (be - bs + 1)*colW), by = S.y + 0.4, bh = 3.4;
    rmpdfSetFill(doc, [247,240,225]); doc.roundedRect(bx, by, bw, bh, 0.6, 0.6, 'F');
    rmpdfSetDraw(doc, RMPDF_C.amber); doc.setLineWidth(0.4); doc.setLineDashPattern([0.9,0.7],0);
    doc.roundedRect(bx, by, bw, bh, 0.6, 0.6, 'S'); doc.setLineDashPattern([],0);
    doc.setFont('helvetica','bold'); doc.setFontSize(6.6); rmpdfSetText(doc, RMPDF_C.amber);
    doc.text('Risk Buffer  +' + buf + 'd', S.X0, S.y + 2.6);
    if(bw > 14){ doc.setFontSize(5); doc.text('BUFFER', bx + 1.4, by + bh - 0.9); }
    S.y += 6.5;
  }
  S.gap(3.5);
}

function rmpdfRiskList(S, rows){
  const doc = S.doc;
  if(!rows.length){ S.ensure(5); doc.setFont('helvetica','italic'); doc.setFontSize(7.5); rmpdfSetText(doc, RMPDF_C.faint);
    doc.text('None recorded.', S.X0, S.y); doc.setFont('helvetica','normal'); S.y += 5; return; }
  rows.forEach(r=>{
    const sev = ['block','warn','info'].indexOf(r.severity)!==-1 ? r.severity : 'warn';
    const dm = (r.text||'').match(/Day (\d+)/);
    const head = (RM_SEV_LABEL[sev]||'WARN') + (r._item?('   '+rmA(r._item)):'') + (dm?('    by Day '+dm[1]):'');
    const body = doc.splitTextToSize(rmA(r.text||''), S.CW - 6);
    const aff  = (r.affects && r.affects.length) ? doc.splitTextToSize('Affects: '+rmA(r.affects.join(', ')), S.CW - 6) : [];
    const h = 3.6 + body.length*3.2 + (aff.length? aff.length*2.8 + 0.8 : 0) + 2.6;
    S.ensure(h);
    rmpdfSetFill(doc, RMPDF_C.sev[sev]); doc.rect(S.X0, S.y - 2.6, 1.3, h - 1.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.6); rmpdfSetText(doc, RMPDF_C.sev[sev]);
    doc.text(head, S.X0 + 3.5, S.y); S.y += 3.4;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(body, S.X0 + 3.5, S.y); S.y += body.length*3.2;
    if(aff.length){ doc.setFontSize(6.4); rmpdfSetText(doc, RMPDF_C.faint); doc.text(aff, S.X0 + 3.5, S.y); S.y += aff.length*2.8 + 0.8; }
    S.y += 2.6;
  });
}
function rmpdfInputList(S, rows){
  const doc = S.doc;
  if(!rows.length){ S.ensure(5); doc.setFont('helvetica','italic'); doc.setFontSize(7.5); rmpdfSetText(doc, RMPDF_C.faint);
    doc.text('None recorded.', S.X0, S.y); doc.setFont('helvetica','normal'); S.y += 5; return; }
  rows.forEach(c=>{
    const pr = ['urgent','required','optional'].indexOf(c.priority)!==-1 ? c.priority : 'required';
    const head = pr.toUpperCase() + (c._item?('   '+rmA(c._item)):'')
      + (c.requiredByDay!=null ? ('    Required by Day '+c.requiredByDay) : '');
    const q = doc.splitTextToSize(rmA(c.text||''), S.CW - 6);
    const imp = c.impactIfLate ? doc.splitTextToSize('Impact if late: '+rmA(c.impactIfLate), S.CW - 6) : [];
    const h = 3.6 + q.length*3.2 + (imp.length? imp.length*2.9 + 0.6 : 0) + 2.6;
    S.ensure(h);
    rmpdfSetFill(doc, pr==='urgent' ? RMPDF_C.stop : (pr==='required' ? RMPDF_C.gold : RMPDF_C.faint));
    doc.rect(S.X0, S.y - 2.6, 1.3, h - 1.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.6);
    rmpdfSetText(doc, pr==='urgent' ? RMPDF_C.stop : RMPDF_C.gold);
    doc.text(head, S.X0 + 3.5, S.y); S.y += 3.4;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(q, S.X0 + 3.5, S.y); S.y += q.length*3.2;
    if(imp.length){ doc.setFontSize(6.6); rmpdfSetText(doc, RMPDF_C.grey); doc.text(imp, S.X0 + 3.5, S.y); S.y += imp.length*2.9 + 0.6; }
    S.y += 2.6;
  });
}

function rmpdfFinishBox(S, it){
  const pf = rmPlannedFinish(it); if(!pf) return;
  const doc = S.doc, buf = rmRiskBuffer(it), ef = pf + buf;
  S.ensure(13);
  rmpdfSetFill(doc, RMPDF_C.wash); rmpdfSetDraw(doc, RMPDF_C.emerald); doc.setLineWidth(0.3);
  doc.roundedRect(S.X0, S.y, S.CW, 10, 1, 1, 'FD');
  const seg = S.CW/3;
  [['PLANNED FINISH','Day '+pf, RMPDF_C.emerald],
   ['RISK BUFFER','+'+buf+' day'+(buf===1?'':'s'), RMPDF_C.amber],
   ['EXPECTED FINISH','Day '+ef, RMPDF_C.emerald]].forEach((m,i)=>{
    const x = S.X0 + i*seg + seg/2;
    doc.setFont('helvetica','normal'); doc.setFontSize(5.6); rmpdfSetText(doc, RMPDF_C.grey);
    doc.text(m[0], x, S.y+3.6, {align:'center'});
    doc.setFont('helvetica','bold'); doc.setFontSize(9); rmpdfSetText(doc, m[2]);
    doc.text(m[1], x, S.y+8, {align:'center'});
  });
  S.y += 13;
}
function rmpdfNote(S, text){
  const doc = S.doc; S.ensure(9);
  const lines = doc.splitTextToSize(rmA(text), S.CW - 4);
  doc.setFont('helvetica','italic'); doc.setFontSize(6.6); rmpdfSetText(doc, RMPDF_C.grey);
  doc.text(lines, S.X0, S.y); doc.setFont('helvetica','normal'); S.y += lines.length*2.9 + 2;
}
async function buildItemRoadmapPdf(p, it){
  const jsPDF = await rmpdfLib();
  const acts = ((it.execution && it.execution.activities) || []).slice().sort((a,b)=> (+a.startDay||0)-(+b.startDay||0));
  const horizon = Math.max(5, Math.min(RM_HORIZON_MAX, rmHorizonOf(it)));
  const S = rmpdfNew(jsPDF, (p.name||'Project') + '  —  Execution Roadmap',
                     'Item ' + rmA(it.number||'') + '  ·  ' + rmA(it.name || ('Item '+it.number)));
  rmpdfFinishBox(S, it);
  S.sectionTitle('Action plan');
  if(acts.length) rmpdfGantt(S, it, acts, horizon, 62);
  else { S.doc.setFont('helvetica','italic'); S.doc.setFontSize(8); rmpdfSetText(S.doc, RMPDF_C.faint);
         S.doc.text('No activities planned yet.', S.X0, S.y); S.doc.setFont('helvetica','normal'); S.y += 6; }
  S.sectionTitle('Client inputs required');
  rmpdfInputList(S, (it.clientInputs || []).slice().sort((a,b)=>{
    const rk={urgent:0,required:1,optional:2}; const r=(rk[a.priority]??3)-(rk[b.priority]??3); if(r) return r;
    return (a.requiredByDay==null?9999:a.requiredByDay) - (b.requiredByDay==null?9999:b.requiredByDay); }));
  S.sectionTitle('Risks & internal scheduling detail');
  rmpdfRiskList(S, (it.execution && it.execution.risks || []).filter(r=> !((it.execution.dismissedRuleKeys||[]).indexOf(r.ruleKey)>-1)));
  S.gap(3); rmpdfNote(S, RM_BUFFER_NOTE);
  rmpdfFooter(S);
  return S.doc;
}

async function buildProjectRoadmapPdf(p){
  const jsPDF = await rmpdfLib();
  prEnsureWaves(p);
  const horizon = Math.max(5, Math.min(RM_HORIZON_MAX, prHorizon(p)));
  const c = prCounters(p);
  const S = rmpdfNew(jsPDF, (p.name||'Project') + '  —  Project Execution Roadmap',
                     rmA([p.client, p.location].filter(Boolean).join('  ·  ')));
  const doc = S.doc;

  // metrics
  S.ensure(15);
  const mets = [['Items',c.items],['Activities',c.acts],['Done',c.done],['In progress',c.inProg],
    ['Waiting',c.waiting],['Install planned',c.instPlanned],['Blocking risks',c.blockRisks]];
  const bw = S.CW / mets.length;
  mets.forEach((m,i)=>{
    const x = S.X0 + i*bw;
    rmpdfSetDraw(doc, RMPDF_C.rule); doc.setLineWidth(0.2); doc.roundedRect(x, S.y, bw-2, 12, 1, 1, 'S');
    doc.setFont('helvetica','bold'); doc.setFontSize(12); rmpdfSetText(doc, RMPDF_C.emerald);
    doc.text(String(m[1]), x + (bw-2)/2, S.y + 5.6, { align:'center' });
    doc.setFont('helvetica','normal'); doc.setFontSize(5.6); rmpdfSetText(doc, RMPDF_C.grey);
    doc.text(String(m[0]).toUpperCase(), x + (bw-2)/2, S.y + 9.6, { align:'center' });
  });
  S.y += 16;

  // item summary — Action plan / finish / missing client input (the priority view)
  S.sectionTitle('Item summary');
  p.items.forEach(it=>{
    const pf = rmPlannedFinish(it), buf = rmRiskBuffer(it), ef = pf ? pf + buf : 0;
    const m = prMissingCI(it);
    const waiting = prItemWaiting(it);
    const chain = doc.splitTextToSize('Action: ' + rmA(prActionChain(it)), S.CW - 6);
    const ciLine = doc.splitTextToSize((m.cleared ? 'Client Input: Cleared' : 'Waiting from Client: ' + rmA(m.text)), S.CW - 6);
    const h = 4 + chain.length*3 + 3.2 + ciLine.length*3 + (waiting?3.4:0) + 3.5;
    S.ensure(h);
    rmpdfSetFill(doc, waiting ? [247,240,225] : RMPDF_C.wash);
    doc.rect(S.X0, S.y - 2.6, 1.3, h - 1.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); rmpdfSetText(doc, waiting ? RMPDF_C.amber : RMPDF_C.forest);
    doc.text(rmA((it.number?it.number+' ':'') + (it.name||'Untitled item')), S.X0 + 3.5, S.y); S.y += 3.6;
    if(waiting){ doc.setFontSize(6.4); rmpdfSetText(doc, RMPDF_C.amber);
      doc.text('NOT STARTED - WAITING FOR CLIENT', S.X0 + 3.5, S.y); S.y += 3.4; }
    doc.setFont('helvetica','normal'); doc.setFontSize(7); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(chain, S.X0 + 3.5, S.y); S.y += chain.length*3;
    doc.setFontSize(7);
    if(pf){ rmpdfSetText(doc, RMPDF_C.grey);
      doc.text('Planned Finish Day ' + pf + '     Risk Buffer +' + buf + 'd     ', S.X0 + 3.5, S.y);
      doc.setFont('helvetica','bold'); rmpdfSetText(doc, RMPDF_C.emerald);
      doc.text('Expected Finish Day ' + ef, S.X0 + 78, S.y); doc.setFont('helvetica','normal');
    } else { rmpdfSetText(doc, RMPDF_C.faint); doc.text('No activities planned yet', S.X0 + 3.5, S.y); }
    S.y += 3.2;
    rmpdfSetText(doc, m.cleared ? RMPDF_C.emerald : RMPDF_C.amber);
    doc.text(ciLine, S.X0 + 3.5, S.y); S.y += ciLine.length*3 + 3.5;
  });
  S.gap(2);

  // installation plan
  S.sectionTitle('Installation plan');
  const rows = p.items.map(it=> ({ it, day: prInstallDay(it) })).sort((a,b)=>{
    if(a.day==null && b.day==null) return 0; if(a.day==null) return 1; if(b.day==null) return -1; return a.day-b.day; });
  S.ensure(6);
  doc.setFont('helvetica','bold'); doc.setFontSize(6.4); rmpdfSetText(doc, RMPDF_C.gold);
  doc.text('ITEM', S.X0, S.y); doc.text('INSTALL DAY', S.X0+150, S.y); doc.text('WAVE', S.X0+195, S.y);
  S.y += 1.5; S.rule(); S.y += 3.2;
  rows.forEach(r=>{
    S.ensure(5.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(rmA(r.it.name || ('Item '+r.it.number)), S.X0, S.y, { maxWidth:145 });
    doc.setFont('helvetica','bold');
    doc.text(r.day!=null ? ('Day '+r.day) : 'Not planned', S.X0+150, S.y);
    doc.setFont('helvetica','normal'); rmpdfSetText(doc, RMPDF_C.grey);
    doc.text(rmA(prWaveNameOf(p, r.it) || '-'), S.X0+195, S.y);
    S.y += 3.4; S.rule(); S.y += 2.1;
  });
  S.gap(3);

  // installation waves
  S.sectionTitle('Installation waves');
  const waves = prWavesSorted(p);
  if(!waves.length){ S.ensure(5); doc.setFont('helvetica','italic'); doc.setFontSize(7.5); rmpdfSetText(doc, RMPDF_C.faint);
    doc.text('No waves defined.', S.X0, S.y); doc.setFont('helvetica','normal'); S.y += 5; }
  waves.forEach(w=>{
    const its = prWaveItems(p, w.id).map(x=> rmA(x.name||('Item '+x.number)));
    const eq = prWaveEquip(p, w.id);
    const blk = prWaveBlockers(p, w.id);
    const itemLines = doc.splitTextToSize('Items: ' + (its.length? its.join(', ') : '-'), S.CW - 6);
    const blkLines = blk.length ? doc.splitTextToSize(blk.map(b=>'! '+rmA(b)).join('\n'), S.CW - 6) : [];
    const h = 3.4 + itemLines.length*3 + 3 + blkLines.length*2.8 + 3;
    S.ensure(h);
    rmpdfSetFill(doc, RMPDF_C.emerald); doc.rect(S.X0, S.y - 2.6, 1.3, h - 1.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.6); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(rmA(w.name||'Wave') + '   ·   Day ' + (w.day!=null?w.day:'-'), S.X0 + 3.5, S.y); S.y += 3.6;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.2); rmpdfSetText(doc, RMPDF_C.grey);
    doc.text(itemLines, S.X0 + 3.5, S.y); S.y += itemLines.length*3;
    doc.setFontSize(6.8);
    doc.text('Access / Equipment: ' + (eq.length? rmA(eq.join(', ')) : 'none recorded'), S.X0 + 3.5, S.y); S.y += 3;
    if(blkLines.length){ rmpdfSetText(doc, RMPDF_C.stop); doc.setFontSize(6.6); doc.text(blkLines, S.X0 + 3.5, S.y); S.y += blkLines.length*2.8; }
    S.y += 3;
  });
  S.gap(2);

  // blocking installation
  S.sectionTitle('Blocking installation');
  const blocks = p.items.map(it=> ({ it, day: prInstallDay(it), b: prBlockers(it) }))
    .filter(x=> x.day!=null && x.b.length).sort((a,b)=> a.day-b.day);
  if(!blocks.length){ S.ensure(5); doc.setFont('helvetica','italic'); doc.setFontSize(7.5); rmpdfSetText(doc, RMPDF_C.faint);
    doc.text('No installation blockers detected.', S.X0, S.y); doc.setFont('helvetica','normal'); S.y += 5; }
  blocks.forEach(x=>{
    const lines = doc.splitTextToSize(x.b.map(t=>'! '+rmA(t)).join('\n'), S.CW - 6);
    const h = 3.4 + lines.length*2.9 + 2.6;
    S.ensure(h);
    rmpdfSetFill(doc, RMPDF_C.stop); doc.rect(S.X0, S.y - 2.6, 1.3, h - 1.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.4); rmpdfSetText(doc, RMPDF_C.ink);
    doc.text(rmA(x.it.name||('Item '+x.it.number)) + '   ·   Installation Day ' + x.day, S.X0 + 3.5, S.y); S.y += 3.4;
    doc.setFont('helvetica','normal'); doc.setFontSize(6.8); rmpdfSetText(doc, RMPDF_C.stop);
    doc.text(lines, S.X0 + 3.5, S.y); S.y += lines.length*2.9 + 2.6;
  });
  S.gap(2);

  // roadmap — by item swimlanes
  S.sectionTitle('Roadmap — by item  (shared Day 1 to ' + horizon + ')');
  p.items.forEach(it=>{
    const acts = prItemActs(it).slice().sort((a,b)=> (+a.startDay||0)-(+b.startDay||0));
    const inst = prInstallDay(it);
    S.ensure(7);
    rmpdfSetFill(doc, RMPDF_C.wash); doc.rect(S.X0, S.y - 3, S.CW, 5, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.6); rmpdfSetText(doc, RMPDF_C.forest);
    doc.text(rmA((it.number?it.number+' ':'') + (it.name||'Untitled item')), S.X0 + 1, S.y);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.4); rmpdfSetText(doc, RMPDF_C.grey);
    doc.text((inst!=null?('install Day '+inst):'no install activity') + '  ·  ' + acts.length + ' activities', S.X0 + 90, S.y);
    S.y += 4;
    if(acts.length) rmpdfGantt(S, it, acts, horizon, 55);
    else { doc.setFont('helvetica','italic'); doc.setFontSize(6.8); rmpdfSetText(doc, RMPDF_C.faint);
           doc.text('no activities', S.X0 + 2, S.y); doc.setFont('helvetica','normal'); S.y += 5; }
  });

  // project risks roll-up
  S.sectionTitle('Project risks');
  const allRisks = [];
  p.items.forEach(it=> prActiveRisks(it).forEach(r=> allRisks.push({ ...r, _item: it.name||('Item '+it.number) })));
  const rk = { block:0, warn:1, info:2 };
  allRisks.sort((a,b)=> (rk[a.severity]??3)-(rk[b.severity]??3));
  rmpdfRiskList(S, allRisks);

  // client inputs roll-up
  S.sectionTitle('Client inputs required');
  const allCI = [];
  p.items.forEach(it=> (it.clientInputs||[]).forEach(c=> allCI.push({ ...c, _item: it.name||('Item '+it.number) })));
  const rkp = { urgent:0, required:1, optional:2 };
  allCI.sort((a,b)=>{ const r=(rkp[a.priority]??3)-(rkp[b.priority]??3); if(r) return r;
    return (a.requiredByDay==null?9999:a.requiredByDay)-(b.requiredByDay==null?9999:b.requiredByDay); });
  rmpdfInputList(S, allCI);

  S.gap(3); rmpdfNote(S, RM_BUFFER_NOTE);
  rmpdfFooter(S);
  return S.doc;
}

function rmpdfFooter(S){
  const doc = S.doc;
  const n = doc.getNumberOfPages();
  const stamp = 'Vista United  ·  generated ' + new Date().toISOString().slice(0,16).replace('T',' ');
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(6); rmpdfSetText(doc, RMPDF_C.faint);
    doc.text(stamp, S.X0, S.H - 4);
    doc.text('Page ' + i + ' / ' + n, S.X1, S.H - 4, { align:'right' });
  }
}
function rmpdfFilename(p, it){

  const d = new Date().toISOString().slice(0,10);

/* ============================================================
   13 · Storage settings + safe browser → central migration
   ------------------------------------------------------------
   COPY → VERIFY → SWITCH. Browser IndexedDB is only ever READ.
   Nothing is moved, deleted, overwritten or cleared on the
   browser side, before or after migration.
   ============================================================ */
let TP_API_UP = false;
let TP_PLATFORM_CENTRAL = false;   // the central DB has been adopted as this PC's store
let TP_UNMIGRATED = 0;             // projects in THIS browser's IndexedDB not yet in central
let MIG = null;

async function tpApiStatus(){
  try{
    const r = await fetch(TP_API_BASE+'/status', { cache:'no-store' });
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.ok) ? j.data : null;
  }catch(_){ return null; }
}

async function resolveStorageMode(){
  const want = localStorage.getItem('vista_tp_storage');   // 'central' | null
  const status = await tpApiStatus();
  TP_API_UP = !!status;
  TP_PLATFORM_CENTRAL = !!(status && status.platformStorage === 'central');

  // this browser was explicitly switched to central
  if(want === 'central'){
    if(status){ STORE_MODE = 'central'; return 'central'; }
    renderCentralUnavailable();                 // never silently fall back
    return 'blocked';
  }

  // not explicitly switched — we may still be able to open IndexedDB to inspect it
  let idbOK = true;
  try{ await openDB(); }
  catch(e){ idbOK = false; }

  // count this browser's local projects that aren't in the central DB yet
  if(status && idbOK){
    try{
      const local = await IDB.getAll('projects');
      const cenIds = new Set((await TP_API.getAll('projects')).map(p=>p.id));
      TP_UNMIGRATED = local.filter(p=> !cenIds.has(p.id)).length;
    }catch(_){ TP_UNMIGRATED = -1; }
  }

  // the platform has been adopted as central AND this browser has nothing un-migrated
  // → follow automatically (the data it would show is all present centrally)
  if(TP_PLATFORM_CENTRAL && status && TP_UNMIGRATED === 0){
    localStorage.setItem('vista_tp_storage','central');
    STORE_MODE = 'central';
    return 'central';
  }

  if(!idbOK){
    app().innerHTML = '<div class="wrap"><div class="banner">This browser is blocking local storage (IndexedDB). '
      + 'Open the file directly (not in a private window) to use the builder.</div></div>';
    return 'blocked';
  }
  STORE_MODE = 'idb';
  return 'idb';
}

function fmtMB(b){ return (Number(b||0)/1048576).toFixed(1)+' MB'; }
function canonJSON(v){
  return JSON.stringify(v, (k,val)=>{
    if(val && typeof val==='object' && !Array.isArray(val)){
      const o={}; Object.keys(val).sort().forEach(kk=> o[kk]=val[kk]); return o;
    }
    return val;
  });
}
async function sha256Hex(blob){
  const h = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
}
function tsName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}

async function downloadBrowserBackup(btn){

    const projects = await IDB.getAll('projects');
    const photos   = await IDB.getAll('photos');

      let dataBase64 = '';
      try{ dataBase64 = ph.blob ? await blobToB64(ph.blob) : (ph.dataBase64 || ''); }catch(_){}
      photosOut.push({ id:ph.id, projectId:ph.projectId, itemId:ph.itemId, slot:ph.slot, mime:ph.mime,
        w:ph.w, h:ph.h, bytes:(ph.bytes || (ph.blob&&ph.blob.size) || 0),
        keepPage:(ph.keepPage!=null?ph.keepPage:null), createdAt:ph.createdAt, dataBase64 });
    }
    const bundle = { kind:'vista-tpb-browser-backup', version:1, exportedAt:new Date().toISOString(),
      origin:location.origin, projects, photos:photosOut };
    downloadBlob(new Blob([JSON.stringify(bundle)], {type:'application/json'}),
      'vista-tpb-browser-backup-'+tsName()+'.json');

  }catch(e){ toast('Backup failed: '+e.message); }

/* ---- central DB backup ZIP ---- */
async function centralBackup(btn){
  if(btn) btn.disabled = true;
  toast('Building ZIP…');
  try{
    const r = await fetch(TP_API_BASE+'/backup');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const blob = await r.blob();
    const cd = r.headers.get('Content-Disposition')||'';
    const m = cd.match(/filename="([^"]+)"/);
    downloadBlob(blob, m ? m[1] : ('vista-tp-backup-'+tsName()+'.zip'));
    toast('Backup ZIP downloaded ('+fmtMB(blob.size)+')');
  }catch(e){ toast('Backup failed: '+e.message); }
  if(btn) btn.disabled = false;
  storageRefresh();
}

    + '</tbody></table>'
    + '<div class="hint" style="margin-bottom:4px">Projects that will be copied:</div>'
    + '<ul style="margin:0 0 10px 18px;font-size:13px;line-height:1.6">'
    +   (projects.length ? projects.map(p=>{ const ni=(p.items&&p.items.length)||0;
          return '<li>'+esc(p.name||'Untitled')+' — '+ni+' item'+(ni===1?'':'s')
          + (cenIds.has(p.id) ? ' <span class="muted">(already in central — skipped)</span>' : '') + '</li>'; }).join('')
        : '<li class="muted">none</li>')
    + '</ul>'
    + (projects.length
        ? '<button class="btn btn-primary full" data-migcopy>Copy '+projects.length+' project'+(projects.length>1?'s':'')
          + ' + '+photos.length+' photo'+(photos.length===1?'':'s')+'</button>'
        : '<div class="hint">Nothing to migrate from this browser.</div>')
    + '<div class="hint" style="margin-top:6px">Migration only reads your browser. Nothing is written to it.</div>';
}

/* ---- migration: Step 2 Copy (idempotent / resumable) ---- */
async function migCopy(){
  const box = document.getElementById('mig-steps'); if(!box) return;
  if(!MIG){ await migPreview(); return; }
  const { projects, photos } = MIG;
  const total = projects.length + photos.length;
  let done = 0;
  box.innerHTML = '<div class="hint">Copying… safe to close and re-run — anything already copied is skipped.</div>'
    + '<div style="height:9px;background:var(--cream);border-radius:5px;overflow:hidden;margin:8px 0">'
    +   '<div id="mig-bar" style="height:100%;width:0;background:var(--emerald);transition:width .15s"></div></div>'
    + '<div class="hint" id="mig-txt">0 / '+total+'</div>';
  const tick = (label)=>{
    done++;
    const bar=document.getElementById('mig-bar'); if(bar) bar.style.width = Math.round(done/total*100)+'%';
    const txt=document.getElementById('mig-txt'); if(txt) txt.textContent = done+' / '+total+(label?('  ·  '+label):'');
  };
  try{
    for(const p of projects){
      await tpFetch('/projects/'+encodeURIComponent(p.id)+'?mode=skip-existing',
        { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(p) });
      tick(esc(p.name||p.id));
    }
    for(const ph of photos){
      const dataBase64 = ph.blob ? await blobToB64(ph.blob) : (ph.dataBase64 || '');
      await tpFetch('/photos', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id:ph.id, projectId:ph.projectId, itemId:ph.itemId, slot:ph.slot,
          mime:ph.mime, w:ph.w, h:ph.h, keepPage:(ph.keepPage!=null?ph.keepPage:null), dataBase64 }) });
      tick('photo');
    }
    box.insertAdjacentHTML('beforeend',
      '<div class="hint" style="margin-top:8px;color:var(--emerald)">Copy complete — now verify.</div>'
      + '<button class="btn btn-primary full" data-migverify>Verify</button>');
  }catch(e){
    box.insertAdjacentHTML('beforeend',
      '<div class="banner" style="margin-top:8px">Copy interrupted: '+esc(e.message)+'</div>'
      + '<button class="btn btn-ghost full" data-migcopy>Resume copy</button>');
  }
}

/* ---- migration: Step 3 Verify (counts + JSON equality + byte size + SHA-256) ---- */
async function migVerify(){
  const box = document.getElementById('mig-steps'); if(!box) return;
  box.innerHTML = '<div class="hint">Verifying counts, JSON equality, photo bytes and SHA-256…</div>';
  const idbProjects = await IDB.getAll('projects');
  const idbPhotos   = await IDB.getAll('photos');
  let cen = [];
  try{ cen = await TP_API.getAll('projects'); }catch(_){}
  const cenById = new Map(cen.map(p=>[p.id,p]));
  let pOK=0, iOK=0, iTotal=0, phOK=0, intOK=0;
  const bad = [];
  for(const p of idbProjects){
    const n = (p.items && p.items.length) || 0; iTotal += n;
    const c = cenById.get(p.id);
    if(!c){ bad.push('Project not in central DB: '+(p.name||p.id)); continue; }
    if(canonJSON(p) === canonJSON(c)){ pOK++; iOK += n; }
    else bad.push('Project JSON differs: '+(p.name||p.id));
  }
  for(const ph of idbPhotos){
    let meta = null;
    try{ meta = await tpFetch('/photos/'+encodeURIComponent(ph.id)+'/meta'); }catch(_){}
    if(!meta){ bad.push('Photo not in central DB: '+ph.id); continue; }
    phOK++;
    const localSize = ph.bytes || (ph.blob && ph.blob.size) || 0;
    let shaOK = true;
    if(ph.blob){ shaOK = (meta.sha256 === await sha256Hex(ph.blob)); }
    if(meta.bytes === localSize && shaOK) intOK++;
    else bad.push('Photo integrity mismatch: '+ph.id);
  }
  const green = bad.length===0
    && pOK===idbProjects.length && iOK===iTotal
    && phOK===idbPhotos.length && intOK===idbPhotos.length;
  const row = (label,ok,tot)=> '<div style="font-size:14px;padding:3px 0;font-weight:600;color:'
    + (ok===tot ? 'var(--emerald)' : 'var(--stop)')+'">'+(ok===tot?'✓':'✗')+' '+esc(label)+' '+ok+'/'+tot+'</div>';
  box.innerHTML =
    row('Projects', pOK, idbProjects.length)
    + row('Items', iOK, iTotal)
    + row('Photos', phOK, idbPhotos.length)
    + row('Photo integrity', intOK, idbPhotos.length)
    + (bad.length ? '<div class="banner" style="margin-top:8px;font-size:12px">'+bad.map(esc).join('<br>')+'</div>' : '')
    + (green
        ? '<div class="hint" style="margin:10px 0 6px;color:var(--emerald)"><b>All checks passed.</b> You can switch this browser to the central database.</div>'
          + '<button class="btn btn-primary full" data-migswitch>Use Vista Local Database</button>'
        : '<div class="hint" style="margin:10px 0;color:var(--stop)"><b>Verification did not fully pass.</b> This browser stays on IndexedDB. Re-run the copy, then verify again.</div>'
          + '<button class="btn btn-ghost full" data-migcopy>Re-run copy</button>')
    + '<button class="btn btn-ghost full mt10" data-migverify>Re-verify</button>';
}

/* ---- migration: Step 4 Switch (only reachable when verify is fully green) ---- */
async function migSwitch(){
  const ok = await confirmDialog('Switch to Vista Local Database?',
    'This browser will read and write the central database from now on. '
    + 'Your browser IndexedDB is kept exactly as it is (not deleted). '
    + 'Other browsers on this PC will follow automatically once their own local projects are migrated.');
  if(!ok) return;
  try{ await tpFetch('/settings/platformStorage', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify('central') }); }catch(_){}
  localStorage.setItem('vista_tp_storage','central');
  location.hash = '#/';
  location.reload();
}

(async function init(){
  const qs = new URLSearchParams(location.search);
  const screens = qs.get('screens')==='1';       // volatile in-memory mode (review captures only)
  const demo    = qs.get('demo')==='1' || screens;

  if(screens){ MEM.on = true; document.body.classList.add('capture'); }
  else{
    const decided = await resolveStorageMode();
    if(decided === 'blocked') return;    // an explanatory screen is already shown
  }

  if(demo){
    try{
      const existing = await dbGet('projects','demo-project');
      if(!existing) await seedSampleProject(true);
      if(!location.hash) location.hash = '#/p/demo-project';
    }catch(_){}
  }
  if(!location.hash) location.hash = '#/';
  render();
})();
</script>
