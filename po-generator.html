// ── item photos ──────────────────────────────────────────────────────────────
// Photos are image regions of an ORIGINAL document (the original is never
// changed): embedded pictures as placed on the page, or a user-selected
// "source crop". Each is stored once in PO storage (po_photos, stable id per
// source + page + region). Which item a photo belongs to is part of the draft
// (draft.photos) and is saved with the draft.
const PH_STATUS = { suggested: 'Suggested', uncertain: 'Check association', confirmed: 'Confirmed', removed: 'Removed' };
const PH_REASON = { inside_item_block: 'inside this item’s block on the page', inside_parent_item_block: 'inside the parent item’s block (shared by its priced components)',
  overlaps_next_item: 'overlaps the next item', starts_above_item: 'starts above the item', before_first_item_on_page: 'at the top of a page, before any item',
  continues_from_previous_page: 'assumed to continue the last item of the previous page' };
const PH_EXCLUDE = { repeated_on_pages: 'repeated on several pages (logo / letterhead)', header_or_footer_area: 'header / footer area', too_small: 'too small (icon / decoration)',
  decorative_strip: 'decorative strip', page_background: 'page background / scan', above_item_table: 'above the item table (letterhead / logo)',
  after_item_table: 'after the item table (signature / stamp area)', outside_item_table: 'outside the item table' };
const phUrl = id => '/api/po/photos/' + encodeURIComponent(id) + '/file';
const phLazy = new Map();          // rendered previews of NOT yet stored regions (browser only, never saved)

async function loadPhotos() {
  const d = S.draft; if (!d) return;
  const list = [];
  for (const s of S.src.list) {
    const { status, json } = await api('GET', '/api/po/photos?sourceId=' + encodeURIComponent(s.id));
    if (status === 200 && json.ok) list.push(...json.data);
  }
  if (!S.draft || S.draft.id !== d.id) return;
  S.ph.list = list; S.ph.draftId = d.id;
  renderItems(); refreshDerived();      // re-rendered cards need their line amounts and issues filled again
  if (S.rv) renderReviewTab();
}
const storedPhotoFor = (sourceId, page, region, kind) => S.ph.list.find(p => p.sourceId === sourceId && p.page === page && (!kind || p.kind === kind) &&
  ['x', 'y', 'w', 'h'].every(k => Math.abs(p.region[k] - region[k]) <= 0.15));

// Render one page of a stored original to a canvas (print intent: completes in hidden tabs too).
async function renderSourcePage(src, pageNo, scale) {
  const doc = await sourceDoc(src);
  const c = document.createElement('canvas');
  if (doc.pdf) {
    const page = await doc.pdf.getPage(pageNo);
    const vp = page.getViewport({ scale });
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp, intent: 'print' }).promise;
  } else {
    c.width = Math.ceil(doc.img.width * scale); c.height = Math.ceil(doc.img.height * scale);
    c.getContext('2d').drawImage(doc.img, 0, 0, c.width, c.height);
  }
  return c;
}
function cropCanvas(pageCanvas, region, scale) {
  const c = document.createElement('canvas');
  const sx = Math.max(0, Math.floor(region.x * scale)), sy = Math.max(0, Math.floor(region.y * scale));
  const sw = Math.min(pageCanvas.width - sx, Math.ceil(region.w * scale)), sh = Math.min(pageCanvas.height - sy, Math.ceil(region.h * scale));
  c.width = Math.max(1, sw); c.height = Math.max(1, sh);
  c.getContext('2d').drawImage(pageCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
  return c;
}
// Render ONLY one region of a page, at a resolution suited to its size (small pictures get a higher scale).
const regionScale = region => Math.min(8, Math.max(3, 1000 / Math.max(region.w, region.h)));
async function renderRegion(src, pageNo, region) {
  const doc = await sourceDoc(src);
  const scale = regionScale(region);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(region.w * scale)); c.height = Math.max(1, Math.ceil(region.h * scale));
  if (doc.pdf) {
    const page = await doc.pdf.getPage(pageNo);
    const vp = page.getViewport({ scale, offsetX: -region.x * scale, offsetY: -region.y * scale });
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp, intent: 'print' }).promise;
  } else {
    c.getContext('2d').drawImage(doc.img, region.x, region.y, region.w, region.h, 0, 0, c.width, c.height);
  }
  return c;
}
const canvasPng = c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('image could not be encoded')), 'image/png'));
async function uploadPhoto(src, page, region, kind, blob, extractionId) {
  const q = new URLSearchParams({ sourceId: src.id, page: String(page), x: String(region.x), y: String(region.y), w: String(region.w), h: String(region.h), kind });
  if (extractionId) q.set('extractionId', extractionId);
  const r = await fetch('/api/po/photos?' + q.toString(), { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 409 && j.code === 'photo_conflict' && j.existing) {
    // a DIFFERENT image is already stored under this photo id: it was kept; nothing new was stored
    const e = new Error(j.error || 'a different image is already stored for this photo'); e.conflict = j.existing; throw e;
  }
  if (!(r.status === 201 || r.status === 200) || !j.ok) throw new Error(j.error || 'the photo could not be stored');
  return j.data;
}
// Explain a refused re-store: the existing photo stays exactly as stored and is NOT replaced.
function photoConflictNotice(existing, what) {
  if (!S.ph.list.some(x => x.id === existing.id)) S.ph.list.push(existing);
  showBanner('warn', `${esc(what)} was not stored: a different image is already stored for exactly this region of page ${esc(existing.page)}
    (photo ${esc(existing.id)}, stored ${esc(fmtTime(existing.createdAt))}). The existing photo was kept unchanged and nothing was attached.
    To use it, choose it under “Add photo” → stored photos. A replacement image would have to be stored as a new photo.`);
}
// After an extraction is stored: keep each candidate item picture as its own photo record.
async function storeExtractionPhotos(src, result, exId) {
  const cands = (result.photos || []).filter(p => p.status === 'candidate');
  let stored = 0, kept = 0;
  for (const p of cands) {
    if (storedPhotoFor(src.id, p.page, p.region, 'embedded')) continue;
    try {
      const meta = await uploadPhoto(src, p.page, p.region, 'embedded', await canvasPng(await renderRegion(src, p.page, p.region)), exId);
      S.ph.list.push(meta); stored++;
    } catch (err) {
      if (!err.conflict) throw err;
      if (!S.ph.list.some(x => x.id === err.conflict.id)) S.ph.list.push(err.conflict);
      kept++;                                       // existing photo kept as stored — not counted as stored
    }
  }
  if (kept) showBanner('warn', `${kept} item photo(s) were already stored with a different image for the same region. The existing photos were kept unchanged; the new renderings were not stored.`);
  return stored;
}
// Preview of a region that is not stored (excluded pictures in review): rendered in the browser only.
async function fillLazyThumbs() {
  const imgs = [...document.querySelectorAll('img[data-lazy]')];
  const byPage = new Map();
  for (const im of imgs) { const [sid, pg] = im.dataset.lazy.split('|'); const k = sid + '|' + pg; if (!byPage.has(k)) byPage.set(k, []); byPage.get(k).push(im); }
  for (const [k, list] of byPage) {
    const [sid, pg] = k.split('|');
    const src = S.src.list.find(s => s.id === sid); if (!src) continue;
    let canvas = null;
    for (const im of list) {
      const key = im.dataset.lazy;
      if (!phLazy.has(key)) {
        canvas = canvas || await renderSourcePage(src, +pg, 2);
        const [, , x, y, w, h] = key.split('|').map(Number);
        phLazy.set(key, cropCanvas(canvas, { x, y, w, h }, 2).toDataURL('image/png'));
      }

    }
  }

function phThumb(sourceId, page, region, attrs) {
  const st = storedPhotoFor(sourceId, page, region, 'embedded');

    : `<img alt="Picture on page ${esc(page)} (not stored)" data-lazy="${esc([sourceId, page, region.x, region.y, region.w, region.h].join('|'))}" ${attrs || ''}>`;

function itemLabel(it) {

  if (act === 'ph-crop-page') { const m = S.ph.modal; m.page = Math.min(Math.max(1, m.page + (+b.dataset.d)), m.total || 1); m.sel = null; renderPhotoModal(); return true; }
  if (act === 'ph-crop-save') {
    const m = S.ph.modal; if (!m || !m.sel) return true;
    const src = S.src.list.find(s => s.id === m.sourceId) || S.src.list[0];
    try {
      const meta = await uploadPhoto(src, m.page, m.sel, 'source_crop', await canvasPng(await renderRegion(src, m.page, m.sel)), null);
      if (!S.ph.list.some(x => x.id === meta.id)) S.ph.list.push(meta);
      if (attachPhoto(meta, m.itemId)) { closePhotoModal(); toast('Source crop stored and attached — press Save'); }
    } catch (err) {
      if (err.conflict) { closePhotoModal(); photoConflictNotice(err.conflict, 'The crop'); }
      else showBanner('bad', 'The crop could not be stored: ' + esc(err.message || err) + '. Nothing was attached.');
    }
    return true;
  }
  if (act === 'rv-photos-attach') {
    const rv = S.rv, d = S.draft;
    const add = POExtract.planPhotos(rv.ex, d, { extractionId: rv.id, sourceId: rv.src.id, items: d.items,
      stored: S.ph.list.filter(p => p.sourceId === rv.src.id), newId: () => rid('pa_', 16), now: new Date().toISOString() });
    d.photos = (d.photos || []).concat(add);
    markDirty(); renderItems(); refreshDerived(); renderReviewTab();
    toast(`${add.length} photo(s) attached${add.some(a => a.status === 'uncertain') ? ' — some need confirmation' : ''} — press Save`);
    return true;
  }
  if (act === 'rv-photo-show') {
    const p = S.rv && (S.rv.ex.photos || []).find(x => x.key === b.dataset.key);
    if (p) { S.rv.highlight = { page: p.page, region: p.region }; S.rv.page = p.page; drawViewer(); }
    return true;
  }
  return true;
}
document.addEventListener('change', e => {
  const t = e.target; if (!S.draft) return;
  if (t.dataset.phpdf) { const a = phAssoc(t.dataset.phpdf); if (a) { a.includeInPdf = t.checked; phTouch(a); } }
  else if (t.dataset.phmove) {
    const a = phAssoc(t.dataset.phmove); const v = t.value; if (!a || !v) return;
    if (v === 'none') { a.target = null; a.status = 'uncertain'; a.includeInPdf = false; }
    else if (v.startsWith('item:')) a.target = { kind: 'item', itemId: v.slice(5) };
    else { const [sid, ...rest] = v.slice(6).split('|'); a.target = { kind: 'group', sourceId: sid, parent: rest.join('|') }; }
    if (v !== 'none') { a.status = 'confirmed'; a.reasons = []; }
    a.origin = 'user'; phTouch(a); toast('Photo moved — press Save');
  } else if (t.dataset.phsrc && S.ph.modal) { S.ph.modal.sourceId = t.value; S.ph.modal.page = 1; S.ph.modal.sel = null; renderPhotoModal(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ph && S.ph.modal) closePhotoModal(); });

// ── viewer ───────────────────────────────────────────────────────────────────
async function drawViewer() {
  const rv = S.rv, cv = $('rvCanvas'), wrap = $('rvCanvasWrap');
  if (!rv || !cv || !wrap) return;
  const token = ++viewerToken;
  try {
    const doc = await sourceDoc(rv.src);
    rv.total = doc.pages;
    rv.page = Math.min(Math.max(1, rv.page), doc.pages);
    const avail = Math.max(240, wrap.clientWidth - 12);
    const dpr = window.devicePixelRatio || 1;
    let w, h;
    if (doc.pdf) {
      const page = await doc.pdf.getPage(rv.page);
      const vp1 = page.getViewport({ scale: 1 });
      rv.scale = (avail / vp1.width) * rv.zoom;
      const vp = page.getViewport({ scale: rv.scale * dpr });
      if (token !== viewerToken) return;
      if (rv.task) { try { rv.task.cancel(); } catch (e) {} }
      cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
      w = vp1.width * rv.scale; h = vp1.height * rv.scale;
      rv.task = page.render({ canvasContext: cv.getContext('2d'), viewport: vp });
      await rv.task.promise.catch(() => {});
    } else {
      rv.scale = (avail / doc.img.width) * rv.zoom;
      w = doc.img.width * rv.scale; h = doc.img.height * rv.scale;
      cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
      cv.getContext('2d').drawImage(doc.img, 0, 0, cv.width, cv.height);
    }
    if (token !== viewerToken) return;
    cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(h) + 'px';
    const lbl = $('rvPageLbl'); if (lbl) lbl.textContent = `Page ${rv.page} of ${rv.total}`;
    const pm = rv.ex.pages.find(p => p.page === rv.page), m = $('rvMethod');
    if (m) m.textContent = pm ? (pm.method === 'ocr' ? '· read by OCR' : pm.method === 'mixed' ? '· text layer + OCR of image content' : pm.method === 'text' ? '· text layer' : '· not readable')
                              : '· NOT READ (beyond the page limit)';
    positionHighlight();
    if (rv.tab === 'text') renderReviewTab();
  } catch (e) {
    if (token === viewerToken) wrap.innerHTML = `<div class="banner banner-bad" style="margin:10px">The original could not be displayed: ${esc(e && e.message || e)}.</div>`;
  }
}
function positionHighlight() {
  const rv = S.rv, hl = $('rvHl'), cv = $('rvCanvas');
  if (!rv || !hl || !cv) return;
  const hit = rv.highlight;
  if (!hit || hit.page !== rv.page || !hit.region) { hl.hidden = true; return; }
  const r = hit.region, s = rv.scale;
  hl.hidden = false;
  hl.style.left = (cv.offsetLeft + r.x * s - 3) + 'px'; hl.style.top = (cv.offsetTop + r.y * s - 3) + 'px';
  hl.style.width = (r.w * s + 6) + 'px'; hl.style.height = (r.h * s + 6) + 'px';
  const wrap = $('rvCanvasWrap');
  wrap.scrollTo({ top: Math.max(0, cv.offsetTop + r.y * s - 80), left: Math.max(0, cv.offsetLeft + r.x * s - 40), behavior: 'smooth' });
}

// ── supplier hints from the quotation (never auto-selected) ────────────────
function quotationIdentity() {
  const q = S.draft && S.draft.quotation;
  if (q && (q.supplierName || q.supplierVat)) return { supplierName: { value: q.supplierName || null }, supplierVat: { value: q.supplierVat || null }, from: 'saved quotation details' };
  if (S.rv && S.rv.src.draftId === S.draft.id) {
    const h = S.rv.ex.header;
    if ((h.supplierName && h.supplierName.value) || (h.supplierVat && h.supplierVat.value))
      return { supplierName: h.supplierName, supplierVat: h.supplierVat, from: 'open extraction' };
  }
  return null;
}
function supplierHintsHtml() {
  if (!EXTRACT_OK) return '';
  const qi = quotationIdentity(); if (!qi) return '';
  const d = S.draft, name = qi.supplierName && qi.supplierName.value, vat = qi.supplierVat && qi.supplierVat.value;
  const who = `<span dir="auto">${esc(name || '—')}</span>${vat ? ' · VAT ' + esc(vat) : ''}`;
  if (d.supplier && !S.sup.changing) {
    const mm = POExtract.supplierMismatch(qi, { name: d.supplier.name, snapshot: d.supplier.snapshot });
    return mm.length ? `<div class="banner banner-warn" style="margin:0 0 10px">Quotation shows ${who} (${esc(qi.from)}).<ul>${mm.map(m => `<li dir="auto">${esc(m.message)}</li>`).join('')}</ul>Check that the selected Daftra supplier is right. Nothing is changed automatically.</div>`
      : `<div class="small muted" style="margin-bottom:8px"><span class="chip chip-ok">Matches quotation</span> ${who}</div>`;
  }
  if (S.sup.status !== 'ready') return `<div class="small muted" style="margin:6px 0">Quotation shows ${who}. Suggestions appear when the Daftra supplier list has loaded.</div>`;
  const sug = POExtract.suggestSuppliers(qi, S.sup.list);
  return `<div class="banner banner-info" style="margin:8px 0">Quotation shows ${who} (${esc(qi.from)}).
    ${sug.length ? `Possible Daftra matches — review and confirm one; nothing is selected automatically:<div class="acts">${sug.map(s =>
      `<button class="btn btn-sm btn-ghost" data-act="review-supplier" data-id="${esc(s.id)}" dir="auto">${esc(s.name)} · ${esc(s.reasons.join(', '))}</button>`).join('')}</div>`
      : 'No Daftra supplier matches this name or VAT number. Search below, or add the supplier in Daftra first — suppliers are not created from here.'}</div>`;
}

async function handlePhase2Action(act, b, e) {
  if (!act.startsWith('src-') && !act.startsWith('rv-') && act !== 'job-cancel' && act !== 'show-source-row') return false;
  if (act === 'src-reload') { loadSources(true); return true; }
  if (act === 'src-extract') { const s = S.src.list.find(x => x.id === b.dataset.id); if (s) runExtraction(s); return true; }
  if (act === 'src-extract-ocr') { const s = S.src.list.find(x => x.id === b.dataset.id); if (s) runExtraction(s, { ocrAll: true }); return true; }
  if (act === 'job-cancel') { await cancelJob(); return true; }
  if (act === 'rv-open') { openReview(b.dataset.id, b.dataset.src); return true; }
  if (act === 'rv-close') { S.rv = null; renderSources(); renderSupplier(); return true; }
  if (!S.rv && act !== 'show-source-row') return true;
  if (act === 'rv-tab') { S.rv.tab = b.dataset.tab; renderReview(); return true; }
  if (act === 'rv-page') { S.rv.page = Math.min(Math.max(1, S.rv.page + (+b.dataset.d)), S.rv.total || 1); drawViewer(); return true; }
  if (act === 'rv-zoom') { S.rv.zoom = Math.min(3, Math.max(0.5, S.rv.zoom + (+b.dataset.d) * 0.25)); drawViewer(); return true; }
  if (act === 'rv-show') { showRegion(b.dataset.id); return true; }
  if (act === 'rv-apply-preview') { previewApply(); return true; }
  if (act === 'rv-apply-cancel') { S.rv.confirm = null; renderApplyBar(); return true; }
  if (act === 'rv-apply-confirm') { confirmApply(); return true; }
  if (act === 'show-source-row') {
    const it = findItem(b.dataset.id); if (!it || !it.sourceRef) return true;
    if (S.rv && S.rv.id === it.sourceRef.extractionId) showRegion(it.sourceRef.rowId);
    else openReview(it.sourceRef.extractionId, it.sourceRef.sourceId, it.sourceRef.rowId);
    return true;
  }
  return true;
}
function updateItemFlags(it) { const el = $('flags-' + it.id); if (el) el.innerHTML = (it.reviewFlags || []).map(flagChip).join(''); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'srcFile') { const f = t.files && t.files[0]; t.value = ''; uploadFile(f); return; }
  if (!S.rv) return;
  const toggle = (set, id) => { t.checked ? set.add(id) : set.delete(id); const row = t.closest('.xrow'); if (row) row.classList.toggle('off', !t.checked); S.rv.confirm = null; renderApplyBar(); };
  if (t.dataset.rvrow) toggle(S.rv.selRows, t.dataset.rvrow);
  else if (t.dataset.rvother) toggle(S.rv.selOther, t.dataset.rvother);
  else if (t.dataset.rvhdr) toggle(S.rv.headerKeys, t.dataset.rvhdr);
  else if (t.dataset.rvopt === 'currency') { S.rv.applyCurrency = t.checked; S.rv.confirm = null; renderApplyBar(); }
  else if (t.dataset.rvopt === 'taxBasis') { S.rv.applyTaxBasis = t.checked; S.rv.confirm = null; renderApplyBar(); }
  else if (t.dataset.rvopt === 'ackIncomplete') { S.rv.ackIncomplete = t.checked; S.rv.confirm = null; renderApplyBar(); }
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#dropZone'); if (z) { e.preventDefault(); z.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const z = e.target.closest && e.target.closest('#dropZone'); if (z) { e.preventDefault(); z.classList.remove('over'); } }));
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#dropZone'); if (z && e.dataTransfer && e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]); });
window.addEventListener('resize', () => { if (S.rv) { clearTimeout(drawViewer._t); drawViewer._t = setTimeout(drawViewer, 200); } });

// ── events ─────────────────────────────────────────────────────────────────
function findItem(id) { return S.draft.items.find(i => i.id === id); }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'supSearch') { S.sup.query = t.value; S.sup._focus = true; renderSupplier(); return; }
  if (!S.draft) return;
  if (t.dataset.f) {
    const f = t.dataset.f, d = S.draft;
    if (f === 'paymentText') { d.paymentTerms.text = t.value; d.paymentTerms.isDraftDefault = false; }
    else if (f === 'balanceTrigger') d.paymentTerms.balanceTrigger = t.value;
    else d[f] = t.value;
    markDirty(); refreshDerived(); return;
  }
  if (t.dataset.item) {
    const it = findItem(t.dataset.item); if (!it) return;
    const f = t.dataset.if;
    if (f === 'treatment') {
      it.tax.treatment = t.value; it.tax.origin = 'user';
      if (t.value !== 'taxable') it.tax.rate = '';
      else if (!it.tax.rate && DEFAULT_ITEM_TAX.treatment === 'taxable') it.tax.rate = DEFAULT_ITEM_TAX.rate;   // pre-fill standard rate, still editable
      const r = document.querySelector(`[data-item="${CSS.escape(it.id)}"][data-if="rate"]`);
      if (r) { r.disabled = t.value !== 'taxable'; r.value = it.tax.rate; }
      dropFlag(it, DEFAULT_TAX_FLAG); updateTaxOrigin(it); updateItemFlags(it);
    }
    else if (f === 'rate') { it.tax.rate = t.value; it.tax.origin = 'user'; dropFlag(it, DEFAULT_TAX_FLAG); updateTaxOrigin(it); updateItemFlags(it); }
    else it[f] = t.value;
    markDirty(); refreshDerived(); return;
  }
  if (t.dataset.dim) {
    const it = findItem(t.dataset.dim); if (!it || !it.dimensions) return;
    const d = it.dimensions, dl = t.dataset.dl;
    if (dl === 'unit') d.unit = t.value;
    else if (dl.startsWith('des:')) {
      d.described = d.described || { main: '', additional: [] };
      if (dl === 'des:main') d.described.main = t.value; else d.described.additional[+dl.slice(4)] = t.value;
    } else d.values[dl] = normDigits(t.value);
    d.origin = 'user';
    // while the source conflict remains, ANY change needs a fresh confirmation; without a conflict an edit is the user's decision
    d.status = (d.conflicts || []).length ? 'needs_confirmation' : 'confirmed';
    const st = $('dimst-' + it.id); if (st) { st.textContent = DIM_STATUS_TEXT[d.status]; st.className = 'chip ' + (d.status === 'needs_confirmation' ? 'chip-bad' : 'chip-ok'); }
    const box = $('dims-' + it.id); if (box) box.classList.toggle('conflict', d.status === 'needs_confirmation');
    const cf = $('dimcf-' + it.id); if (cf) cf.hidden = d.status !== 'needs_confirmation';
    markDirty(); refreshDerived(); return;
  }
  if (t.dataset.ms) {
    const m = S.draft.paymentTerms.milestones.find(x => x.id === t.dataset.ms); if (!m) return;
    m[t.dataset.mf] = t.value; if (t.dataset.mf === 'label') autoGrow(t); markDirty(); refreshDerived();
  }
});
document.addEventListener('change', e => {   // normalise Arabic-Indic digits once the field is left
  const t = e.target;
  if (!S.draft) return;
  if (t.dataset.item && ['qty', 'unitPrice', 'rate'].includes(t.dataset.if)) {
    const it = findItem(t.dataset.item); const v = normDigits(t.value);
    if (v !== t.value) { t.value = v; if (t.dataset.if === 'rate') it.tax.rate = v; else it[t.dataset.if] = v; refreshDerived(); }
  }
  if (t.dataset.ms && t.dataset.mf === 'pct') { const v = normDigits(t.value); if (v !== t.value) { t.value = v; S.draft.paymentTerms.milestones.find(x => x.id === t.dataset.ms).pct = v; refreshDerived(); } }
  if (t.dataset.f === 'currency' || t.dataset.f === 'priceTaxBasis') renderItems(), refreshDerived();
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'new') return createDraft();
  if (act === 'open') return openDraft(id);
  if (act === 'save') return saveDraft();
  if (act === 'reload-latest') { if (confirm('Load the latest saved version? Your unsaved changes on this screen will be discarded.')) { S.dirty = false; return openDraft(S.draft.id, true); } return; }
  if (act === 'download-copy') return downloadCopy();
  if (act === 'retry-suppliers') return loadSuppliers();
  if (act === 'review-supplier') return reviewSupplier(id);
  if (act === 'cancel-review') { S.sup.review = null; S.sup.reviewStatus = 'idle'; return renderSupplier(); }
  if (act === 'confirm-supplier') return confirmSupplier();
  if (act === 'change-supplier') { S.sup.changing = true; return renderSupplier(); }
  if (act === 'keep-supplier') { S.sup.changing = false; S.sup.review = null; S.sup.reviewStatus = 'idle'; return renderSupplier(); }
  if (act === 'use-sup-currency') { S.draft.currency = S.draft.supplier.snapshot.defaultCurrency; markDirty(); renderTotals(); renderItems(); return refreshDerived(); }
  if (act === 'dims-confirm') { const it = findItem(id); if (it && it.dimensions) { it.dimensions.status = 'confirmed'; it.dimensions.origin = 'user'; markDirty(); renderItems(); refreshDerived(); toast('Dimensions confirmed for printing — press Save'); } return; }
  if (act === 'dims-add') { const it = findItem(id); if (it && !it.dimensions) { it.dimensions = { values: { W: '', D: '', H: '' }, unit: '', status: 'confirmed', origin: 'user', conflicts: [] }; markDirty(); renderItems(); refreshDerived(); } return; }
  if (act === 'confirm-tax') { const it = findItem(id); if (it) { it.tax.origin = 'user'; dropFlag(it, DEFAULT_TAX_FLAG); markDirty(); updateTaxOrigin(it); updateItemFlags(it); refreshDerived(); toast('VAT confirmed for this item'); } return; }
  if (await handlePhotoAction(act, b)) return;
  if (await handlePhase2Action(act, b, e)) return;
  if (act === 'add-item') { const it = newItem(); S.draft.items.push(it); markDirty(); renderItems(); refreshDerived(); const el = document.querySelector(`[data-item="${CSS.escape(it.id)}"][data-if="name"]`); if (el) el.focus(); return; }
  if (act === 'exclude') { e.preventDefault(); const it = findItem(id); if (it) { it.included = false; it.excludedAt = new Date().toISOString(); markDirty(); renderItems(); refreshDerived(); toast('Item excluded — kept in the draft'); } return; }
  if (act === 'restore') { const it = findItem(id); if (it) { it.included = true; it.excludedAt = ''; markDirty(); renderItems(); refreshDerived(); toast('Item restored'); } return; }
  if (act === 'acceptance-wording') { const pt = S.draft.paymentTerms; pt.text = ACCEPTANCE_PAYMENT_TEXT; pt.isDraftDefault = false; const bal = pt.milestones.find(m => m.id === 'ms_balance'); if (bal) bal.label = 'Balance — one calendar month after delivery and written acceptance'; markDirty(); renderPayment(); return refreshDerived(); }
  if (act === 'bulk-tax') {
    const treat = $('bulkTreat').value, rate = normDigits($('bulkRate').value);
    if (treat === 'taxable') { const r = parseDec(rate, 2); if (!r || isZero(r) || cmp(r, { n: 100n, d: 1n }) > 0) { toast('Enter a valid tax rate first'); return; } }
    const inc = S.draft.items.filter(i => i.included);
    if (!inc.length) { toast('No included items'); return; }
    if (!confirm(`Set tax treatment to "${TAX_LABELS[treat]}${treat === 'taxable' ? ' ' + rate + '%' : ''}" on ${inc.length} included item(s)?`)) return;
    inc.forEach(i => { i.tax.treatment = treat; i.tax.rate = treat === 'taxable' ? rate : ''; i.tax.origin = 'user'; dropFlag(i, DEFAULT_TAX_FLAG); });
    markDirty(); renderItems(); refreshDerived(); return;
  }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveDraft(); } });
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.spec) d.open ? S.specOpen.add(d.dataset.spec) : S.specOpen.delete(d.dataset.spec); }, true);
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
$('newDraftBtn').addEventListener('click', createDraft);

(async function init() {
  renderMain();
  const ok = await checkConnection();
  if (!ok) return;
  await loadDraftList();
  const want = qs.get('draft');
  if (want) await openDraft(want, true);
})();
