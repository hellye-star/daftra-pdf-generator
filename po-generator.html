<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PO Generator — Vista United</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<!-- Phase 2 (local reading of supplier quotations): the libraries are loaded from the CDN; documents are
     processed in this browser only. Tesseract downloads its eng/ara language models, never the document. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="po-extract.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --dark: #1C1C1A; --mid: #6B6B67; --light: #ADADAA;
    --rule: #D8D5CF; --cream: #FAF8F5; --white: #FFFFFF;
    --ok: #3A7D52; --ok-bg: #EAF4EE; --warn: #B06B1A; --warn-bg: #FEF3E7;
    --bad: #A33A2B; --bad-bg: #FBECE9; --info-bg: #F0F0EE;
  }
  body { font-family: 'Jost', 'Cairo', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; font-size: 13px; }
  button, input, select, textarea { font-family: inherit; font-size: 12.5px; color: var(--dark); }

  .topbar { background: var(--dark); padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
  .topbar svg { width: 24px; height: 24px; flex-shrink: 0; }
  .topbar-name { font-weight: 500; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #fff; }
  .topbar-sub { font-weight: 300; font-size: 6.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--light); margin-top: 2px; }
  .topbar-div { width: 1px; height: 24px; background: #444; margin: 0 8px; }
  .topbar-tool { font-weight: 300; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--light); }
  .topbar-nav { margin-left: auto; display: flex; gap: 18px; }
  .topbar-nav a { color: var(--light); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; }
  .topbar-nav a:hover { color: #fff; }

  .layout { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 52px); }
  .side { border-right: 1px solid var(--rule); background: var(--white); padding: 20px 16px; }
  .main { padding: 24px 32px 80px; max-width: 1180px; width: 100%; }

  .lbl { font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid); }
  .muted { color: var(--mid); }
  .small { font-size: 11px; }
  .btn { border: 1px solid var(--dark); background: var(--dark); color: #fff; padding: 7px 14px; cursor: pointer; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
  .btn:hover { background: #333; }
  .btn:disabled { background: var(--rule); border-color: var(--rule); color: var(--mid); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--dark); }
  .btn-ghost:hover { background: var(--info-bg); }
  .btn-sm { padding: 4px 9px; font-size: 9px; }
  .link { background: none; border: none; color: var(--dark); text-decoration: underline; cursor: pointer; padding: 0; font-size: 11px; }

  .side h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; margin-bottom: 12px; }
  .draft-list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .draft-row { text-align: left; border: 1px solid var(--rule); background: var(--cream); padding: 8px 10px; cursor: pointer; width: 100%; }
  .draft-row:hover { border-color: var(--dark); }
  .draft-row.active { border-color: var(--dark); background: var(--white); box-shadow: inset 3px 0 0 var(--dark); }
  .draft-row .t { font-weight: 500; font-size: 12px; overflow-wrap: anywhere; }
  .draft-row .s { font-size: 10.5px; color: var(--mid); margin-top: 2px; overflow-wrap: anywhere; }
  .conn { margin-top: 18px; font-size: 10.5px; padding: 6px 8px; }

  .pagehead { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .pagehead h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 34px; line-height: 1; }
  .savebar { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .savestate { font-size: 11px; color: var(--mid); }
  .savestate.dirty { color: var(--warn); font-weight: 500; }

  .card { background: var(--white); border: 1px solid var(--rule); margin-bottom: 16px; }
  .card-h { padding: 12px 18px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-h h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; }
  .card-h .step { font-size: 9px; letter-spacing: 0.2em; color: var(--light); }
  .card-b { padding: 14px 18px; }

  .chip { display: inline-block; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; white-space: nowrap; }
  .chip-ok { background: var(--ok-bg); color: var(--ok); }
  .chip-warn { background: var(--warn-bg); color: var(--warn); }
  .chip-bad { background: var(--bad-bg); color: var(--bad); }
  .chip-info { background: var(--info-bg); color: var(--mid); }

  .banner { padding: 10px 14px; margin-bottom: 14px; border: 1px solid; font-size: 12px; line-height: 1.5; }
  .banner-bad { background: var(--bad-bg); border-color: #E7B9B0; color: #6B241A; }
  .banner-warn { background: var(--warn-bg); border-color: #F0CF9E; color: #6E430F; }
  .banner-info { background: var(--info-bg); border-color: var(--rule); color: var(--dark); }
  .banner .acts { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .banner ul { margin: 6px 0 0 18px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .inp { border: 1px solid var(--rule); background: var(--cream); padding: 6px 8px; width: 100%; }
  .inp:focus { outline: none; border-color: var(--dark); background: #fff; }
  .inp.err { border-color: var(--bad); background: var(--bad-bg); }
  textarea.inp { resize: vertical; min-height: 34px; line-height: 1.45; }

  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 12px; font-size: 12px; }
  .kv dt { color: var(--mid); }
  .kv dd { overflow-wrap: anywhere; }

  .sup-results { max-height: 320px; overflow: auto; border: 1px solid var(--rule); margin-top: 10px; }
  .sup-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #EEECE8; align-items: center; }
  .sup-row:last-child { border-bottom: none; }
  .sup-row .n { font-weight: 500; overflow-wrap: anywhere; }
  .sup-row .m { font-size: 11px; color: var(--mid); overflow-wrap: anywhere; }
  .state { padding: 16px; text-align: center; color: var(--mid); font-size: 12px; }

  table.items { width: 100%; border-collapse: collapse; }
  table.items th { font-size: 9px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid); text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--rule); }
  table.items td { padding: 7px 6px; border-bottom: 1px solid #EEECE8; vertical-align: top; }
  table.items td.num, table.items th.num { text-align: right; }
  .item { border-bottom: 1px solid #EEECE8; padding: 12px 0; }
  .item:first-child { padding-top: 2px; }
  .item-top { display: grid; grid-template-columns: 20px 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .item-top input[type=checkbox] { margin-top: 9px; }
  .item-no { color: var(--mid); padding-top: 6px; font-size: 12px; }
  .item-desc textarea { min-height: 52px; }
  .item-body { padding-left: 58px; margin-top: 6px; }
  .item-body > .dims { margin-top: 0; margin-bottom: 8px; }
  .item-body .item-fields { margin: 0; }
  .item-body .spec { margin-top: 6px; }
  .item-body .phs { margin-top: 8px; }
  @media (max-width: 640px) { .item-body { padding-left: 0; } }
  .item-name { font-weight: 500; font-size: 13px; }
  .spec { margin-top: 5px; }
  .spec summary { font-size: 10.5px; color: var(--mid); cursor: pointer; }
  .spec textarea { margin-top: 4px; }
  .dims { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--rule); background: var(--cream); }
  .dims.conflict { border-color: var(--bad); background: var(--bad-bg); }
  .dims .chip { white-space: normal; }
  .dims-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 3px; }
  .dimf { display: flex; flex-direction: column; font-size: 10px; color: var(--mid); width: 74px; }
  .dimf.unit { width: 96px; }
  .dimf input { text-align: right; }
  .dimf.unit input { text-align: left; }
  .dims-des { margin-top: 6px; }
  .dimx { display: flex; flex-direction: column; font-size: 10px; color: var(--mid); margin-top: 4px; }
  .dims > .chip { margin-top: 6px; }
  .item-fields { display: grid; grid-template-columns: minmax(60px,.7fr) minmax(76px,.9fr) minmax(90px,1fr) minmax(140px,1.4fr) minmax(100px,1fr); gap: 8px 10px; margin: 8px 0 0 50px; align-items: start; }
  .ifield { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .ifield .inp { min-width: 0; }
  .inp:disabled { opacity: .45; }
  .amt { padding-top: 5px; text-align: right; font-size: 13px; }
  .item.excluded { background: #F7F6F3; color: var(--mid); padding: 10px 8px; }
  .item.excluded .desc-ro { text-decoration: line-through; white-space: pre-wrap; }
  .iss { color: var(--bad); font-size: 10.5px; margin-top: 3px; }
  .calc { font-variant-numeric: tabular-nums; }
  .src { font-size: 9px; color: var(--light); letter-spacing: 0.08em; text-transform: uppercase; }

  .totals { margin-left: auto; max-width: 420px; }
  .totals .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #EEECE8; font-size: 12.5px; }
  .totals .row.grand { font-weight: 600; font-size: 14px; border-bottom: 2px solid var(--dark); }
  .policy { font-size: 11px; color: var(--mid); line-height: 1.6; margin-top: 10px; }
  .policy summary { cursor: pointer; }

  /* ── Phase 2: supplier quotation upload / review ── */
  .drop { display: block; border: 1px dashed var(--light); background: var(--cream); padding: 16px; text-align: center; font-size: 12px; color: var(--mid); cursor: pointer; }
  .drop.over { border-color: var(--dark); background: #fff; color: var(--dark); }
  .src-row { border: 1px solid var(--rule); padding: 10px 12px; margin-top: 10px; background: #fff; }
  .src-row .n { font-weight: 500; overflow-wrap: anywhere; }
  .src-row .m { font-size: 11px; color: var(--mid); margin-top: 2px; overflow-wrap: anywhere; }
  .src-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .progress { height: 4px; background: var(--rule); margin-top: 8px; }
  .progress > div { height: 100%; background: var(--dark); width: 0; transition: width .2s; }
  .rv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 12px; align-items: start; }
  .rv-view { position: sticky; top: 8px; border: 1px solid var(--rule); background: #EDEBE7; }
  .rv-bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: #fff; border-bottom: 1px solid var(--rule); font-size: 11px; flex-wrap: wrap; }
  .rv-canvas { position: relative; overflow: auto; max-height: 78vh; }
  .rv-canvas canvas { display: block; margin: 0 auto; background: #fff; }
  .rv-hl { position: absolute; border: 2px solid #D9822B; background: rgba(217,130,43,.18); pointer-events: none; }
  .rv-data { min-width: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  .tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 7px 10px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mid); cursor: pointer; }
  .tabs button.on { color: var(--dark); border-bottom-color: var(--dark); }
  .fx { border-bottom: 1px solid #EEECE8; padding: 8px 0; display: grid; grid-template-columns: 22px 130px minmax(0,1fr); gap: 8px; font-size: 12px; align-items: start; }
  .fx .v { overflow-wrap: anywhere; white-space: pre-wrap; }
  .fx .raw { font-size: 10.5px; color: var(--mid); margin-top: 2px; overflow-wrap: anywhere; }
  .flag { display: inline-block; font-size: 9px; padding: 1px 5px; margin: 2px 3px 0 0; background: var(--warn-bg); color: var(--warn); letter-spacing: .04em; }
  .flag.bad { background: var(--bad-bg); color: var(--bad); }
  .flag.info { background: var(--info-bg); color: var(--mid); }
  .xrow { border: 1px solid var(--rule); padding: 8px 10px; margin-top: 8px; background: #fff; }
  .xrow.off { background: #F7F6F3; }
  .xrow .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 4px 10px; margin-top: 6px; font-size: 11.5px; }
  .xrow .grid .k { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--light); }
  .lowc { text-decoration: underline dotted var(--bad); }
  .applybar { position: sticky; bottom: 0; background: #fff; border: 1px solid var(--dark); padding: 10px 12px; margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  .origbox { font-size: 11px; margin-top: 4px; }
  .origbox table { border-collapse: collapse; width: 100%; }
  .origbox td { padding: 2px 6px 2px 0; vertical-align: top; overflow-wrap: anywhere; }
  .edited { color: var(--warn); font-weight: 500; white-space: nowrap; }
  .main, .rv-view, .rv-data { min-width: 0; }
  @media (max-width: 1100px) { .rv { grid-template-columns: minmax(0, 1fr); } .rv-view { position: static; } }
  .ms-list { margin-top: 14px; }
  .ms-row { display: grid; grid-template-columns: minmax(180px, 1fr) 76px 120px minmax(150px, 30%); gap: 10px; align-items: start; padding: 7px 0; border-bottom: 1px solid #EEECE8; }
  .ms-head { border-bottom-color: var(--rule); padding-bottom: 5px; }
  .ms-row textarea { resize: none; min-height: 32px; overflow: hidden; }
  .ms-r { text-align: right; }
  .ms-amt .calc { padding-top: 6px; }
  .ms-due { padding-top: 6px; line-height: 1.45; }
  .ms-mlbl { display: none; }
  .radio { display: flex; gap: 8px; align-items: flex-start; margin: 5px 0; font-size: 12px; cursor: pointer; }
  .blockers { list-style: none; }
  .blockers li { padding: 5px 0; border-bottom: 1px solid #EEECE8; font-size: 12px; display: flex; gap: 8px; align-items: baseline; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--dark); color: #fff; padding: 10px 16px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 380px; }
  .toast.show { opacity: 1; }
  .phase { border: 1px dashed var(--rule); padding: 12px 14px; color: var(--mid); font-size: 12px; }
  .phs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .ph { border: 1px solid var(--rule); background: #fff; padding: 4px; width: 158px; font-size: 10.5px; }
  .ph.unc { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .ph.conf { border-color: var(--ok); }
  .ph img { display: block; width: 100%; height: 96px; object-fit: contain; background: #F3F1EC; cursor: zoom-in; }
  .ph-m { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
  .ph-r { color: var(--mid); margin-top: 2px; overflow-wrap: anywhere; }
  .ph-pdf { display: flex; gap: 5px; align-items: center; margin-top: 4px; cursor: pointer; }
  .ph-a { display: flex; gap: 10px; margin-top: 3px; }
  .ph-mv { margin-top: 4px; font-size: 10.5px; padding: 3px 4px; }
  .phs.sm img { width: 64px; height: 44px; object-fit: contain; background: #F3F1EC; border: 1px solid var(--rule); cursor: pointer; }
  .phs.sm img.unc { border-color: var(--bad); }
  .item-btns { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .phm { position: fixed; inset: 0; background: rgba(28,28,26,.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .phm-b { background: #fff; width: min(960px, 100%); max-height: 92vh; overflow: auto; padding: 0 16px 16px; }
  .phm-b .card-h { padding-left: 0; padding-right: 0; }
  .phm-img { display: block; width: min(100%, 720px); height: auto; max-height: 62vh; object-fit: contain; margin: 12px auto 0; background: #F3F1EC; }
  .phm-crop { position: relative; overflow: auto; max-height: 66vh; background: #EDEBE7; margin-top: 8px; }
  .phm-crop canvas { display: block; margin: 0 auto; cursor: crosshair; touch-action: none; }
  .phm-sel { position: absolute; border: 2px solid #D9822B; background: rgba(217,130,43,.15); pointer-events: none; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { border-right: none; border-bottom: 1px solid var(--rule); }
    .main { padding: 18px 16px 60px; }
    .grid2 { grid-template-columns: 1fr; }
    .item-fields { margin-left: 0; grid-template-columns: 1fr 1fr; }
    .ms-head { display: none; }
    .ms-row { grid-template-columns: 1fr 1fr; padding: 10px 0; }
    .ms-label, .ms-due { grid-column: 1 / -1; }
    .ms-label, .ms-pct, .ms-amt, .ms-due { display: flex; flex-direction: column; gap: 3px; }
    .ms-mlbl { display: block; }
    .ms-amt .calc { text-align: left; }
    .ms-due { padding-top: 0; }
  }
</style>
</head>

<div class="topbar">

  <div>

  <nav class="topbar-nav">

<div class="layout">
  <aside class="side">
    <h2>Purchase orders</h2>
    <button class="btn" id="newDraftBtn" style="width:100%">+ New PO draft</button>
    <div class="draft-list" id="draftList"></div>
    <div class="conn chip-info" id="connState">Checking PO storage…</div>
  </aside>
  <main class="main" id="main"></main>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   PO Generator — Phase 1 (drafts only)
   Data never leaves this PC except Daftra supplier GETs through the local
   read-only proxy (/daftra/...). No credentials in this page, no browser
   storage. All server text is rendered through esc().
   Rounding policy mirrors po_model.py exactly (see "How totals are
   calculated" on the page).
   ══════════════════════════════════════════════════════════════════════════ */

const CURRENCIES = { SAR:2, USD:2, EUR:2, GBP:2, AED:2, QAR:2, EGP:2, CNY:2, INR:2, TRY:2, KWD:3, BHD:3, OMR:3, JOD:3, JPY:0 };
const TAX_LABELS = { unresolved:'Unresolved', taxable:'Taxable at rate', zero_rated:'Zero-rated (0%)', exempt:'Exempt', out_of_scope:'Out of scope' };
// Fallback only — the server's /api/po/status value (po_model.DEFAULT_ITEM_TAX) is used when available.
let DEFAULT_ITEM_TAX = { treatment: 'taxable', rate: '15', origin: 'default' };
const DEFAULT_PAYMENT_TEXT = '50% advance payment; remaining 50% one calendar month after delivery.';
const ACCEPTANCE_PAYMENT_TEXT = '50% advance payment; remaining 50% one calendar month after delivery and written acceptance.';
const qs = new URLSearchParams(location.search);
const SUPPLIER_PAGE_SIZE = Math.min(100, Math.max(1, parseInt(qs.get('supplierPageSize') || '100', 10) || 100));
const SUPPLIER_MAX_PAGES = 50;

const S = {
  drafts: [], draft: null, rev: null, dirty: false, saving: false,
  server: null,          // {computed, readiness, rev} from the last server response
  banner: null,          // {kind, html}
  fieldErrors: {},       // server validation errors keyed by path
  sup: { status: 'idle', list: [], error: '', query: '', page: 0, pageCount: 0, partial: false,
         review: null, reviewStatus: 'idle', reviewError: '', changing: false },
  // Phase 2 — supplier quotation documents
  src: { draftId: null, list: [], extractions: {}, status: 'idle', error: '' },
  job: null,             // running extraction {sourceId, stage, page, total, progress, cancel}
  rv: null,              // open review {ex, source, tab, page, zoom, highlight, selRows:Set, selOther:Set, headerKeys:Set, applyCurrency, applyTaxBasis}
  ph: { draftId: null, list: [], modal: null },   // stored item photos of this draft's documents; open photo dialog
  specOpen: new Set(),   // items whose internal specification is expanded
};

// ── utils ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"'`]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;', '`':'&#96;' }[c]));
}
function rid(prefix, n) {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const b = crypto.getRandomValues(new Uint8Array(n));
  return prefix + Array.from(b, x => a[x % a.length]).join('');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function fmtTime(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); }
const AR_DIGITS = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٫':'.' };
function normDigits(s) { return String(s == null ? '' : s).replace(/[٠-٩۰-۹٫]/g, c => AR_DIGITS[c]).trim(); }

// ── decimal (BigInt rationals; identical rules to po_model.py) ─────────────
function parseDec(s, maxDp) {
  s = normDigits(s);
  if (!/^\d{1,15}(\.\d{1,8})?$/.test(s)) return null;
  const [a, b = ''] = s.split('.');
  if (b.length > maxDp) return null;
  return { n: BigInt(a + b), d: 10n ** BigInt(b.length) };
}
const isZero = f => f.n === 0n;
const cmp = (f, g) => { const x = f.n * g.d, y = g.n * f.d; return x < y ? -1 : x > y ? 1 : 0; };

  if (dp > 0) { s = s.padStart(dp + 1, '0'); s = s.slice(0, -dp) + '.' + s.slice(-dp); }
  return (m < 0n ? '-' : '') + s;
}

  for (let dp = 0; dp < 20; dp++) { const sc = f.n * (10n ** BigInt(dp)); if (sc % f.d === 0n) return fmtMinor(sc / f.d, dp); }

}
function money(v, cur) {
  if (v == null) return '—';
  const [i, f] = String(v).split('.');
  return (cur ? cur + ' ' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f != null ? '.' + f : '');
}

// ── field validation (mirrors the server) ──────────────────────────────────
function checkNum(v, maxDp, allowZero, label) {
  v = normDigits(v);
  if (v === '') return null;
  const f = parseDec(v, maxDp);
  if (!f) return `${label}: plain number, max ${maxDp} decimals (digits and one dot)`;
  if (!allowZero && isZero(f)) return `${label} must be greater than zero`;
  return null;
}
function itemFieldErrors(it) {
  const e = {};
  const q = checkNum(it.qty, 3, false, 'Quantity'); if (q) e.qty = q;
  const p = checkNum(it.unitPrice, 4, true, 'Unit price'); if (p) e.unitPrice = p;
  if (it.tax.treatment === 'taxable' && it.tax.rate) {
    const r = parseDec(it.tax.rate, 2);
    if (!r || isZero(r) || cmp(r, { n: 100n, d: 1n }) > 0) e.rate = 'Rate: above 0, max 100, 2 decimals';
  }

}
function clientErrors() {
  const out = [];
  (S.draft.items || []).forEach((it, i) => Object.values(itemFieldErrors(it)).forEach(m => out.push(`Item ${i + 1}: ${m}`)));
  (S.draft.paymentTerms.milestones || []).forEach((m, i) => {
    if (m.pct) { const f = parseDec(m.pct, 2); if (!f || isZero(f) || cmp(f, { n: 100n, d: 1n }) > 0) out.push(`Payment milestone ${i + 1}: percentage above 0, max 100`); }
  });
  return out;
}

// ── calculation (mirror of po_model.compute) ───────────────────────────────
function compute(doc) {
  const cur = doc.currency || '', dp = CURRENCIES[cur], basis = doc.priceTaxBasis || 'unresolved';
  const lines = {}, invalid = [], taxUnres = [];
  let net = 0n, tax = 0n, gross = 0n; const groups = {};
  for (const it of doc.items) {
    const row = { exact: null, amount: null, net: null, tax: null, gross: null, issues: [] };
    const q = it.qty ? parseDec(it.qty, 3) : null;
    const p = it.unitPrice !== '' ? parseDec(it.unitPrice, 4) : null;
    if (!(it.name || '').trim() && !it.description.trim()) row.issues.push('item name missing');
    if (!it.unit.trim()) row.issues.push('unit missing');
    if (!q || isZero(q)) row.issues.push('quantity missing');
    if (!p) row.issues.push('unit price missing');
    if (q && p) row.exact = fmtExact(mul(q, p));
    const t = it.tax.treatment, rate = it.tax.rate ? parseDec(it.tax.rate, 2) : null;
    if (t === 'unresolved') row.issues.push('tax treatment unresolved');
    else if (t === 'taxable' && !rate) row.issues.push('tax rate missing');
    else if (t === 'taxable' && basis === 'unresolved') row.issues.push('price tax basis (inclusive/exclusive) unresolved');
    if (it.included) {
      if (row.issues.some(x => x.endsWith('missing') && !x.includes('tax'))) invalid.push(it.id);
      else if (row.issues.some(x => x.includes('tax'))) taxUnres.push(it.id);
    }
    if (dp != null && q && p) {
      const amount = roundHalfUp(mul(q, p), dp);
      row.amount = fmtMinor(amount, dp);
      const taxOk = ['zero_rated', 'exempt', 'out_of_scope'].includes(t) || (t === 'taxable' && rate && basis !== 'unresolved');
      if (taxOk) {
        const scale = 10n ** BigInt(dp); let n, x;
        if (t !== 'taxable') { n = amount; x = 0n; }
        else if (basis === 'exclusive') { n = amount; x = roundHalfUp({ n: amount * rate.n, d: scale * rate.d * 100n }, dp); }
        else { n = roundHalfUp({ n: amount * 100n * rate.d, d: scale * (100n * rate.d + rate.n) }, dp); x = amount - n; }
        row.net = fmtMinor(n, dp); row.tax = fmtMinor(x, dp); row.gross = fmtMinor(n + x, dp);
        if (it.included) {
          net += n; tax += x; gross += n + x;
          const key = t + (t === 'taxable' ? ':' + fmtExact(rate) : '');
          const g = groups[key] || (groups[key] = { treatment: t, rate: t === 'taxable' ? fmtExact(rate) : '', net: 0n, tax: 0n });
          g.net += n; g.tax += x;
        }
      }
    }
    lines[it.id] = row;
  }
  const included = doc.items.filter(i => i.included);
  const status = dp == null ? 'currency_unresolved' : !included.length ? 'no_items' : invalid.length ? 'incomplete' : taxUnres.length ? 'tax_unresolved' : 'complete';
  const complete = status === 'complete';
  const totals = { status, currency: cur, dp,
    net: complete ? fmtMinor(net, dp) : null, tax: complete ? fmtMinor(tax, dp) : null, gross: complete ? fmtMinor(gross, dp) : null,
    taxGroups: complete ? Object.values(groups).map(g => ({ treatment: g.treatment, rate: g.rate, net: fmtMinor(g.net, dp), tax: fmtMinor(g.tax, dp) })) : [],
    invalidItems: invalid, taxUnresolvedItems: taxUnres, includedCount: included.length, excludedCount: doc.items.length - included.length };
  // provisional: quotation discounts/charges not applied by this PO (mirrors po_model.ADJUSTMENT_FLAGS)
  totals.provisionalItems = included.filter(i => (i.reviewFlags || []).some(f => f === 'line_discount_present' || f === 'document_adjustments_unapplied')).map(i => i.id);
  totals.provisional = totals.provisionalItems.length > 0;
  const ms = doc.paymentTerms.milestones || [];
  const pcts = ms.map(m => m.pct ? parseDec(m.pct, 2) : null);
  let pctOk = ms.length > 0 && pcts.every(Boolean);
  if (pctOk) { const sum = pcts.reduce((a, f) => ({ n: a.n * f.d + f.n * a.d, d: a.d * f.d }), { n: 0n, d: 1n }); pctOk = cmp(sum, { n: 100n, d: 1n }) === 0; }
  let msOut;
  if (complete && pctOk) {
    let alloc = 0n; const scale = 10n ** BigInt(dp);
    msOut = ms.map((m, k) => { const a = k === ms.length - 1 ? gross - alloc : roundHalfUp({ n: gross * pcts[k].n, d: scale * pcts[k].d * 100n }, dp); alloc += a; return { id: m.id, pct: m.pct, amount: fmtMinor(a, dp) }; });
  } else msOut = ms.map(m => ({ id: m.id, pct: m.pct, amount: null }));
  return { lines, totals, milestones: msOut, milestonePctValid: pctOk };
}
function readiness(doc, c) {
  const b = [];
  const add = (code, message) => b.push({ code, message });
  add('issuance_not_available', 'Issuing POs is not available in Phase 1 (drafts only).');
  add('buyer_unconfirmed', 'Buyer company name, VAT number and address have not been confirmed.');
  add('po_number_format_unconfirmed', 'PO number format and starting number have not been confirmed.');
  if (!doc.supplier) add('supplier_missing', 'No Daftra supplier selected.');
  if (!doc.currency) add('currency_missing', 'Currency not selected.');
  const t = c.totals;
  if (!t.includedCount) add('no_included_items', 'No included items.');
  if (t.invalidItems.length) add('item_invalid', `${t.invalidItems.length} included item(s) missing name/description, unit, quantity or unit price.`);
  if (t.taxUnresolvedItems.length) add('tax_unresolved', `Tax treatment unresolved on ${t.taxUnresolvedItems.length} included item(s).`);
  // mirrors po_model.readiness (the server list is authoritative)
  if (t.provisional) add('adjustments_unapplied', `The quotation has discounts or charges affecting ${t.provisionalItems.length} included item(s) that this PO does not apply yet — PO totals are provisional and are not the quotation's payable total.`);
  const inc = doc.items.filter(i => i.included && (i.reviewFlags || []).includes('from_incomplete_extraction')).length;
  if (inc) add('incomplete_source_document', `${inc} included item(s) come from an extraction that did not read every page of the supplier document.`);
  const unrev = doc.items.filter(i => i.included && (i.reviewFlags || []).includes(DEFAULT_TAX_FLAG)).length;
  if (unrev) add('default_tax_unreviewed', `${unrev} imported item(s) use the default VAT 15% because the quotation states no tax treatment — review and confirm or change it.`);
  const dimsOpen = doc.items.filter(i => i.included && i.dimensions && i.dimensions.status === 'needs_confirmation').length;
  if (dimsOpen) add('dimensions_unconfirmed', `${dimsOpen} included item(s) have conflicting source dimensions — confirm the dimensions to print on the PO.`);
  const phOpen = (doc.photos || []).filter(a => a.status !== 'removed' && (a.status === 'uncertain' || (a.includeInPdf && !a.target))).length;
  if (phOpen) add('photos_unconfirmed', `${phOpen} item photo(s) have an uncertain or missing item association — confirm, reassign or remove them.`);
  if ((doc.paymentTerms.balanceTrigger || 'undecided') === 'undecided') add('payment_trigger_undecided', 'Balance payment trigger (delivery vs delivery + written acceptance) not decided.');
  if (!c.milestonePctValid) add('payment_pct_invalid', 'Payment milestone percentages must be filled in and add up to 100%.');
  return b;
}

// ── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body, rev) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (rev != null) headers['If-Match'] = String(rev);
  let r;
  try { r = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, cache: 'no-store' }); }
  catch (e) { return { status: 0, json: { ok: false, error: 'The local Vista server is not reachable. Nothing was saved.' } }; }
  let json = null;
  try { json = await r.json(); } catch (e) { json = { ok: false, error: r.status === 404 ? 'PO storage is not available on this server — restart the local Vista server (proxy.py) so it loads the PO routes.' : 'Unexpected response from the local server.' }; }
  return { status: r.status, json };
}

async function checkConnection() {
  const { status, json } = await api('GET', '/api/po/status');
  const el = $('connState');
  if (status === 200 && json.ok) {
    const dt = json.data.defaults && json.data.defaults.newItemTax;
    if (dt && TAX_LABELS[dt.treatment]) DEFAULT_ITEM_TAX = { treatment: dt.treatment, rate: String(dt.rate || ''), origin: 'default' };
    el.className = 'conn chip-ok'; el.textContent = `PO storage connected · ${json.data.counts.drafts} draft(s) · no issuance yet`; return true; }
  el.className = 'conn chip-bad'; el.textContent = json && json.error ? json.error : 'PO storage unavailable.';
  return false;
}
async function loadDraftList() {
  const { status, json } = await api('GET', '/api/po/drafts');
  if (status === 200 && json.ok) {
    S.drafts = json.data;
    const el = $('connState'); el.className = 'conn chip-ok';
    el.textContent = `PO storage connected · ${S.drafts.length} draft(s) · no issuance yet`;
  }
  renderDraftList();
}

function newDraftDoc() {
  const ts = new Date().toISOString();
  return {
    id: rid('po_', 20), schema: 1, status: 'draft', title: '', currency: '', priceTaxBasis: 'unresolved',
    supplier: null, items: [],
    paymentTerms: { text: DEFAULT_PAYMENT_TEXT, isDraftDefault: true, balanceTrigger: 'undecided',
      milestones: [ { id: 'ms_advance', pct: '50', label: 'Advance payment' },
                    { id: 'ms_balance', pct: '50', label: 'Balance — one calendar month after delivery' } ] },
    projectRef: '', deliveryLocation: '', notes: '', photos: [], createdAt: ts, updatedAt: ts,
  };
}
function newItem() {
  return { id: rid('it_', 12), name: '', description: '', dimensions: null, unit: '', qty: '', unitPrice: '', included: true,
           tax: { ...DEFAULT_ITEM_TAX }, source: 'manual', createdAt: new Date().toISOString(), excludedAt: '' };
}

async function createDraft() {
  if (!confirmDiscard()) return;
  const doc = newDraftDoc();
  const { status, json } = await api('POST', '/api/po/drafts', doc);
  if (status === 201 && json.ok) { applyServer(json.data, true); history.replaceState(null, '', '?draft=' + encodeURIComponent(doc.id)); await loadDraftList(); toast('New PO draft created'); }
  else showBanner('bad', esc(json.error || 'Could not create the draft.'));
}
async function openDraft(id, force) {
  if (!force && !confirmDiscard()) return;
  const { status, json } = await api('GET', '/api/po/drafts/' + encodeURIComponent(id));
  if (status === 200 && json.ok) {
    applyServer(json.data, true);
    history.replaceState(null, '', '?draft=' + encodeURIComponent(id));
  } else {
    S.draft = null; renderMain();
    showBanner('bad', esc(json.error || 'Could not open the draft.'));
  }
  renderDraftList();
}
function applyServer(d, replaceDoc) {
  if (replaceDoc) {
    S.draft = d.data; S.dirty = false; S.banner = null; S.fieldErrors = {}; S.sup.changing = false; S.sup.review = null;
    if (S.rv && S.rv.src.draftId !== S.draft.id) S.rv = null;           // a review belongs to one draft
    if (S.rv) S.rv.inDraft = alreadyInDraft(S.rv.ex, S.rv.id);
  }
  S.rev = d.rev; S.server = { computed: d.computed, readiness: d.readiness, rev: d.rev };
  renderMain();
}

async function saveDraft() {
  if (!S.draft || S.saving) return;
  const errs = clientErrors();
  if (errs.length) { showBanner('bad', 'Fix these values before saving (nothing was saved):<ul>' + errs.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>'); return; }
  S.saving = true; updateSaveState();
  const sent = JSON.stringify(S.draft);
  const { status, json } = await api('PUT', '/api/po/drafts/' + encodeURIComponent(S.draft.id), S.draft, S.rev);
  S.saving = false;
  if (status === 200 && json.ok) {
    const unchangedSince = JSON.stringify(S.draft) === sent;
    S.fieldErrors = {};
    if (unchangedSince) applyServer(json.data, true);
    else { S.rev = json.data.rev; S.server = { computed: json.data.computed, readiness: json.data.readiness, rev: json.data.rev }; renderMain(); }
    S.banner = null; renderBanner();
    await loadDraftList();
    toast('Draft saved · revision ' + json.data.rev);
  } else if (status === 409 && json.code === 'rev_conflict') {
    showBanner('bad', `<b>Not saved — this draft was changed in another tab or session.</b> The saved version is now revision ${esc(json.currentRev)}; this tab loaded revision ${esc(S.rev)}. Nothing was overwritten, and your unsaved changes are still on this screen.
      <div class="acts"><button class="btn btn-sm" data-act="reload-latest">Load latest saved version (discard my changes)</button>
      <button class="btn btn-sm btn-ghost" data-act="download-copy">Download my unsaved copy (JSON)</button></div>`);
    loadDraftList();
  } else if (status === 400 && json.code === 'invalid') {
    S.fieldErrors = {}; (json.errors || []).forEach(e => { S.fieldErrors[e.path] = e.message; });
    showBanner('bad', esc(json.error) + '<ul>' + (json.errors || []).map(e => `<li><code>${esc(e.path)}</code> — ${esc(e.message)}</li>`).join('') + '</ul>');
  } else {
    showBanner('bad', esc(json.error || 'Save failed. Nothing was saved.'));
  }
  updateSaveState();
}
function downloadCopy() {
  const blob = new Blob([JSON.stringify(S.draft, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = S.draft.id + '-unsaved.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function confirmDiscard() { return !S.dirty || confirm('This draft has unsaved changes. Discard them?'); }
function markDirty() { S.dirty = true; updateSaveState(); }

// ── Daftra suppliers (GET-only local proxy) ────────────────────────────────
function pickSupplier(x) {   // whitelist — never keep password / login / IP fields
  x = x || {};
  const name = (x.business_name || '').trim() || [x.first_name, x.last_name].filter(Boolean).join(' ').trim();
  return {
    id: String(x.id || ''), supplierNumber: String(x.supplier_number || ''), name,
    snapshot: {
      businessName: x.business_name || '', firstName: x.first_name || '', lastName: x.last_name || '',
      email: x.email || '', phone1: x.phone1 || '', phone2: x.phone2 || '',
      address1: x.address1 || '', address2: x.address2 || '', city: x.city || '', state: x.state || '',
      postalCode: x.postal_code || '', countryCode: x.country_code || '',
      vatNumber: x.bn1 || '', vatLabel: x.bn1_label || '', crNumber: x.bn2 || '', crLabel: x.bn2_label || '',
      defaultCurrency: x.default_currency_code || '',
    },
  };
}
function daftraError(status, json) {
  if (status === 0) return 'The local Vista server is not reachable.';
  if (status === 503) return 'Daftra is not configured on the local server (config.json).';
  if (status === 502) return 'The local server could not reach Daftra (network or Daftra outage).';
  if (status === 401 || status === 403) return 'Daftra refused the request — check the API key configured on the local server.';
  if (status === 404) return 'Daftra returned "not found".';
  return `Daftra returned an error (HTTP ${status}).`;
}
async function daftraGet(path) {
  let r;
  try { r = await fetch('/daftra' + path, { cache: 'no-store' }); } catch (e) { return { status: 0, json: null }; }
  let json = null; try { json = await r.json(); } catch (e) {}
  return { status: r.status, json };
}
async function loadSuppliers() {
  const s = S.sup;
  s.status = 'loading'; s.error = ''; s.list = []; s.page = 0; s.pageCount = 0; s.partial = false;
  renderSupplier();
  let page = 1, pageCount = 1;
  const list = [];
  while (page <= pageCount && page <= SUPPLIER_MAX_PAGES) {
    const { status, json } = await daftraGet(`/suppliers.json?limit=${SUPPLIER_PAGE_SIZE}&page=${page}`);
    if (status !== 200 || !json || !Array.isArray(json.data)) { s.status = 'error'; s.error = daftraError(status, json); renderSupplier(); return; }
    json.data.forEach(row => { const p = pickSupplier(row.Supplier || row); if (p.id) list.push(p); });
    pageCount = parseInt(json.pagination && json.pagination.page_count, 10) || 1;
    s.page = page; s.pageCount = pageCount; renderSupplier();
    page++;
  }
  s.partial = pageCount > SUPPLIER_MAX_PAGES;
  s.list = list; s.status = 'ready'; renderSupplier();
}
function normSearch(s) {
  return normDigits(s).toLowerCase().replace(/[ً-ٰٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
}
function supplierMatches(p, q) {
  if (!q) return true;
  const hay = normSearch([p.name, p.supplierNumber, p.id, p.snapshot.vatNumber, p.snapshot.crNumber, p.snapshot.email, p.snapshot.phone1, p.snapshot.phone2, p.snapshot.city].join(' '));
  return normSearch(q).split(' ').every(t => hay.includes(t));
}
async function reviewSupplier(id) {
  const s = S.sup;
  s.review = null; s.reviewStatus = 'loading'; s.reviewError = ''; s.reviewId = id; renderSupplier();
  const { status, json } = await daftraGet(`/suppliers/${encodeURIComponent(id)}.json`);
  if (s.reviewId !== id) return;
  if (status === 200 && json && json.data && json.data.Supplier) { s.review = pickSupplier(json.data.Supplier); s.reviewStatus = 'ready'; }
  else { s.reviewStatus = 'error'; s.reviewError = daftraError(status, json); }
  renderSupplier();
}
function confirmSupplier() {
  const r = S.sup.review; if (!r) return;
  if (S.draft.supplier && S.draft.supplier.daftraId !== r.id &&
      !confirm(`Replace the selected supplier "${S.draft.supplier.name}" with "${r.name}"?`)) return;
  S.draft.supplier = { daftraId: r.id, name: r.name, supplierNumber: r.supplierNumber, confirmedAt: new Date().toISOString(), snapshot: r.snapshot };
  S.sup.review = null; S.sup.reviewStatus = 'idle'; S.sup.changing = false;
  markDirty(); renderSupplier(); refreshDerived();
  toast('Supplier selected — save the draft to keep it');
}

// ── rendering ──────────────────────────────────────────────────────────────
function renderDraftList() {
  const el = $('draftList');
  if (!S.drafts.length) { el.innerHTML = '<div class="muted small" style="padding:8px 2px">No drafts yet.</div>'; return; }
  el.innerHTML = S.drafts.map(d => `<button class="draft-row ${S.draft && S.draft.id === d.id ? 'active' : ''}" data-act="open" data-id="${esc(d.id)}">
      <div class="t" dir="auto">${esc(d.title || '(untitled draft)')}</div>
      <div class="s" dir="auto">${esc(d.supplierName || 'No supplier')} · ${esc(d.itemCount)} item(s)${d.currency ? ' · ' + esc(d.currency) : ''}</div>
      <div class="s">Rev ${esc(d.rev)} · ${esc(fmtTime(d.updatedAt))}</div></button>`).join('');
}

function showBanner(kind, html) { S.banner = { kind, html }; renderBanner(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function renderBanner() {
  const el = $('bannerArea'); if (!el) return;
  el.innerHTML = S.banner ? `<div class="banner banner-${S.banner.kind}">${S.banner.html}</div>` : '';
}
function updateSaveState() {
  const el = $('saveState'); if (!el) return;
  if (S.saving) { el.className = 'savestate'; el.textContent = 'Saving…'; }
  else if (S.dirty) { el.className = 'savestate dirty'; el.textContent = 'Unsaved changes'; }
  else { el.className = 'savestate'; el.textContent = `Saved · revision ${S.rev}`; }
  const b = $('saveBtn'); if (b) b.disabled = S.saving || !S.dirty;

function kvSupplier(p) {

      : `<div class="state">No Daftra supplier matches “${esc(s.query)}”. Suppliers are not created or renamed from here — add or correct it in Daftra, then refresh.</div>`;

  else if (s.reviewStatus === 'error') review = `<div class="banner banner-bad" style="margin:10px 0 0">${esc(s.reviewError)}<div class="acts"><button class="btn btn-sm" data-act="review-supplier" data-id="${esc(s.reviewId)}">Retry</button></div></div>`;
  else if (s.reviewStatus === 'ready' && s.review) review = `<div class="card" style="margin:12px 0 0;border-color:var(--dark)"><div class="card-h"><span class="lbl">Confirm supplier details</span></div><div class="card-b">

  area.innerHTML = supplierHintsHtml() + `<div style="display:flex;gap:8px;align-items:center">

}

function taxCell(it) {

    <input class="inp" style="margin-top:4px" data-item="${esc(it.id)}" data-if="rate" inputmode="decimal" placeholder="rate %" value="${esc(it.tax.rate)}" ${it.tax.treatment === 'taxable' ? '' : 'disabled'}>
    <div class="src" id="taxorig-${esc(it.id)}">${esc(taxOriginLabel(it))}${hasFlag(it, DEFAULT_TAX_FLAG) ? ` <button class="link" data-act="confirm-tax" data-id="${esc(it.id)}">Confirm</button>` : ''}</div>`;
}
function taxOriginLabel(it) {
  if (hasFlag(it, DEFAULT_TAX_FLAG)) return 'Default VAT — quotation states none · review required';
  if (it.tax.origin === 'default') return 'Default VAT — editable';

}
function updateTaxOrigin(it) {

    ? ` <button class="link" data-act="confirm-tax" data-id="${esc(it.id)}">Confirm</button>` : '');

const DEFAULT_TAX_FLAG = 'default_tax_requires_review';
const hasFlag = (it, f) => Array.isArray(it.reviewFlags) && it.reviewFlags.includes(f);
function dropFlag(it, f) { if (hasFlag(it, f)) { it.reviewFlags = it.reviewFlags.filter(x => x !== f); if (!it.reviewFlags.length) delete it.reviewFlags; } }
const FLAG_TEXT = {
  default_tax_requires_review: 'Default VAT — review', low_confidence: 'Low OCR confidence', ambiguous_number: 'Ambiguous number',
  unreadable_number: 'Unreadable number', line_total_mismatch: 'Qty × price ≠ printed total', line_total_may_include_tax: 'Printed total may include VAT',

  multiline: 'Multi-line description', no_numbers: 'No quantity/price on this line', optional_selected: 'Optional item — selected by you',
  alternative_selected: 'Alternative item — selected by you', unit_from_quantity_cell: 'Unit taken from quantity cell',
  continues_next_page: 'Continues on next page', tax_amount_without_rate: 'Tax amount printed without a rate', line_discount_present: 'Line discount in quotation (not applied)',
  missing: 'Missing', heuristic_supplier_name: 'Name guessed from letterhead', ambiguous_date: 'Ambiguous date', hijri_not_converted: 'Hijri — not converted',
  month_first_format: 'Month-first date', two_digit_year: 'Two-digit year', conflicting_dates: 'Conflicting dates', calendar_unknown: 'Calendar unknown',
  currency_inferred_from_SR: 'Currency read from “SR”', currency_from_symbol_only: 'Currency from symbol only', multiple_currencies: 'Several currencies',
  not_saudi_vat_format: 'Not a Saudi VAT format', conflicting_tax_statements: 'Conflicting tax statements', negative: 'Negative amount',
  multiple_candidates: 'Several candidates', no_table_detected: 'No table detected',
  same_as_existing_item: 'Same values as another draft item', document_adjustments_unapplied: 'Quotation discounts/charges not applied — total provisional',
  from_incomplete_extraction: 'From an INCOMPLETE extraction',
  spec_dimension_conflict: 'Size in description ≠ dimension columns', dash_amount: 'Amount printed as “-”',
  no_amount: 'No quantity / amount printed — not selected', same_values_as_other_row: 'Same values as another numbered row (kept)',
  component_of_item: 'Component of a titled item', filename_date_differs: 'File-name date differs from the printed date (file name ignored)',
  from_total_line: 'Read from the unlabelled “Total” line', digits_spaced_in_source: 'Digits printed with spaces',
  name_from_website: 'Name taken from the website / e-mail domain', from_buyer_block: 'Read from the addressee block',
  value_on_next_line: 'Value read from the next line',
};
const flagChip = f => { const bad = /mismatch|ambiguous|unreadable|conflict|missing|low_confidence|default_tax|discount|adjustments|incomplete|filename_date|no_amount|dash_amount|name_from_website/.test(f);
  return `<span class="flag ${bad ? 'bad' : ''}" title="${esc(f)}">${esc(FLAG_TEXT[f] || f.replace(/_/g, ' '))}</span>`; };
function itemProvenance(it) {
  if (it.source !== 'extracted' || !it.orig) return '<div class="src">Manual entry</div>';
  // "edited" = changed by the user after import: numbers compare by value ("27,360.00" = "27360.00"),
  // the description compares with the text first proposed at import (parent title / dimensions added)
  const o = it.orig, num = v => { const t = String(v || '').replace(/,/g, '').trim(); return t !== '' && isFinite(t) ? Number(t) : null; };
  const ch = (k, cur) => {
    if (k === 'qty' || k === 'unitPrice') { const a = num(o[k]), c = num(cur); if (a != null || c != null) return a !== c; }
    const base = k === 'description' && o.proposedDescription ? o.proposedDescription : o[k];
    return String(base || '').trim() !== String(cur || '').trim();
  };
  const rows = [['Description', 'description', it.description], ['Unit', 'unit', it.unit], ['Quantity', 'qty', it.qty],
                ['Unit price', 'unitPrice', it.unitPrice], ['Line total (printed)', 'lineTotal', null], ['Discount (printed)', 'discount', null], ['Tax (printed)', 'tax', null],
                ['Parent item (printed)', 'parent', null], ['Dimensions (printed columns)', 'dimensions', it.dimensions ? dimsText({ values: it.dimensions.values, unit: '' }).replace(/\s+$/, '') : null]]
    .filter(([, k, cur]) => o[k] || cur);
  return `<div class="src">Imported from supplier quotation · row ${esc(it.sourceRef ? it.sourceRef.rowId : '')}
      <button class="link" style="font-size:10px" data-act="show-source-row" data-id="${esc(it.id)}">show in document</button></div>
    <div id="flags-${esc(it.id)}">${(it.reviewFlags || []).map(flagChip).join('')}</div>
    <details class="origbox"><summary class="small muted" style="cursor:pointer">Original extracted values (unchanged by edits)</summary><table>
      ${rows.map(([label, k, cur]) => `<tr><td class="muted" style="width:120px">${esc(label)}</td><td dir="auto" style="white-space:pre-wrap">${esc(o[k] || '—')}</td>
        <td>${cur !== null && ch(k, cur) ? '<span class="edited">edited in PO</span>' : ''}</td></tr>`).join('')}</table></details>`;
}
// ── item name + dimensions (what the PO prints) ────────────────────────────
// The PO prints the item NAME and its DIMENSIONS; the long description stays
// internal. Dimension labels and values are kept as printed (blank = blank),
// the unit only when printed or typed — never inferred. Conflicting source
// values must be confirmed before issuance.
const DIM_STATUS_TEXT = { as_printed: 'As printed in the quotation', needs_confirmation: 'Source conflict — confirm what to print', confirmed: 'Confirmed' };
const itemTitle = it => (it.name || '').trim() || String(it.description || '').split('\n')[0].trim() || '(no name)';
const dimsText = d => Object.entries(d.values).map(([k, v]) => k + ' ' + (v || '(blank)')).join(' × ') + (d.unit ? ' ' + d.unit : '');
function dimsHtml(it) {
  const d = it.dimensions;
  if (!d) return `<div class="dims"><button class="link" data-act="dims-add" data-id="${esc(it.id)}">Add dimensions</button></div>`;
  const conflict = d.status === 'needs_confirmation', hasConflict = (d.conflicts || []).length > 0;
  const des = d.described || { main: '', additional: [] };
  const desRow = (label, key, v) => `<label class="dimx"><span>${esc(label)}</span><input class="inp" dir="auto" data-dim="${esc(it.id)}" data-dl="${esc(key)}" maxlength="300" value="${esc(v)}" aria-label="${esc(label)}"></label>`;
  return `<div class="dims ${conflict ? 'conflict' : ''}" id="dims-${esc(it.id)}"><span class="lbl">Dimensions — printed on the PO</span>
    ${Object.keys(d.values).length ? `<div class="dims-row">${Object.entries(d.values).map(([k, v]) => `<label class="dimf"><span>${esc(k)}</span><input class="inp" inputmode="decimal" data-dim="${esc(it.id)}" data-dl="${esc(k)}" value="${esc(v)}" placeholder="blank" aria-label="${esc(k)}"></label>`).join('')}
      <label class="dimf unit"><span>Unit</span><input class="inp" data-dim="${esc(it.id)}" data-dl="unit" maxlength="20" value="${esc(d.unit)}" placeholder="not printed" aria-label="Dimension unit"></label></div>` : ''}
    ${des.main || des.additional.length ? `<div class="dims-des"><div class="small muted">Also printed in the supplier's description — kept word for word, with its own labels and units:</div>
      ${des.main ? desRow('Size as described', 'des:main', des.main) : ''}${des.additional.map((x, j) => desRow('Additional measurement', 'des:' + j, x)).join('')}</div>` : ''}
    <span class="chip ${conflict ? 'chip-bad' : d.status === 'confirmed' ? 'chip-ok' : 'chip-info'}" id="dimst-${esc(it.id)}">${esc(DIM_STATUS_TEXT[d.status])}</span>
    ${hasConflict ? `<div class="small" style="margin-top:4px">The quotation disagrees with itself: the dimension columns show <b>${esc(it.orig && it.orig.dimensions || dimsText({ values: d.values, unit: '' }))}</b>,
      the description says “${esc((des.main || String(it.orig && it.orig.description || it.description).split('\n').find(l => /size/i.test(l)) || d.conflicts.map(c => c.dim + ' ' + c.description).join(', ')).trim())}”. Nothing was corrected — set what to print, then confirm.
      <button class="btn btn-sm" data-act="dims-confirm" data-id="${esc(it.id)}" id="dimcf-${esc(it.id)}" ${conflict ? '' : 'hidden'}>Confirm these dimensions</button></div>` : ''}

          <textarea class="inp" dir="auto" rows="3" data-item="${esc(it.id)}" data-if="description" maxlength="5000" placeholder="Full description / material specification (kept with the draft and its source evidence)" aria-label="Specification (internal)">${esc(it.description)}</textarea></details>

// ══ Phase 2 — supplier quotation: upload, local extraction, review, apply ══
// The original is stored unchanged by the server (content-addressed, re-hashed
// on read). Reading happens here in the browser: pdf.js text layer first; only
// pages without usable text go through local Tesseract OCR (eng+ara). Results
// are stored as an immutable extraction; nothing reaches the PO draft until the
// user applies selected rows/fields, and applying never changes existing items.
const PDF_OK = typeof pdfjsLib !== 'undefined';
if (PDF_OK) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const OCR_OK = typeof Tesseract !== 'undefined';
const EXTRACT_OK = typeof POExtract !== 'undefined';
const UPLOAD_MAX = 25 * 1024 * 1024;
const UPLOAD_TYPES = { 'application/pdf': 'PDF', 'image/png': 'PNG', 'image/jpeg': 'JPEG' };
const MAX_PAGES = 60, SPARSE_TEXT = 25, OCR_SCALE = 2.2;
const ENGINE = 'po-extract-5 · pdf.js 3.11.174 · tesseract.js 5.1.1 (eng+ara)';
const HEADER_LABELS = {
  quotationRef: 'Quotation reference', quotationDate: 'Quotation date', validity: 'Validity', supplierName: 'Supplier name (as printed)',
  supplierVat: 'Supplier VAT no.', supplierCr: 'Supplier CR no.', supplierEmail: 'Supplier email', supplierPhone: 'Supplier phone',
  currency: 'Currency', taxBasis: 'Prices incl. / excl. VAT', paymentTerms: 'Supplier payment terms', delivery: 'Delivery / lead time',
  exclusions: 'Exclusions', notes: 'Notes', customerName: 'Addressed to (customer, as printed)', projectName: 'Project (as printed)',
};
const KIND_TEXT = { optional: 'Optional', alternative: 'Alternative', repeated_header: 'Repeated header', carried_forward: 'Carried / brought forward',
  subtotal: 'Subtotal', grand_total: 'Grand total', total: 'Total', vat: 'Tax line', discount: 'Discount', delivery: 'Delivery charge',
  installation: 'Installation charge', section_heading: 'Section heading', unclassified: 'Unclassified', unstructured: 'Unstructured line',
  end_marker: 'Table end marker', item_heading: 'Item heading (priced as components)' };
const srcCache = new Map();          // sourceId → { bytes, pdf, img }
let ocrWorker = null, viewerToken = 0;
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const lowc = ef => ef && (ef.flags || []).some(f => /low_confidence|ambiguous|unreadable/.test(f)) ? 'lowc' : '';

async function loadSources(force) {
  const d = S.draft; if (!d) return;
  if (!force && S.src.draftId === d.id && S.src.status === 'ready') return;
  S.src = { draftId: d.id, list: S.src.draftId === d.id ? S.src.list : [], extractions: S.src.draftId === d.id ? S.src.extractions : {}, status: 'loading', error: '' };
  renderSources();
  const { status, json } = await api('GET', '/api/po/sources?draftId=' + encodeURIComponent(d.id));
  if (!S.draft || S.draft.id !== d.id) return;
  if (status !== 200 || !json.ok) { S.src.status = 'error'; S.src.error = json.error || 'Could not load the documents.'; renderSources(); return; }
  const ex = {};
  for (const s of json.data) {
    const r = await api('GET', '/api/po/extractions?sourceId=' + encodeURIComponent(s.id));
    ex[s.id] = r.status === 200 && r.json.ok ? r.json.data : [];
  }
  if (!S.draft || S.draft.id !== d.id) return;
  S.src.list = json.data; S.src.extractions = ex; S.src.status = 'ready';
  renderSources();
  loadPhotos();
}

function renderSources() {
  const area = $('sourceArea'); if (!area || !S.draft) return;
  if (S.src.draftId !== S.draft.id) { loadSources(); return; }
  const missingLibs = [!PDF_OK && 'PDF reader', !OCR_OK && 'OCR', !EXTRACT_OK && 'extraction engine'].filter(Boolean);
  let html = `<label class="drop" id="dropZone"><input type="file" id="srcFile" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" hidden>
      <b>Upload a supplier quotation</b> — drop the file here or click to choose<br>
      <span class="small">PDF (text or scanned), PNG or JPEG · max 25 MB · the original is kept unchanged with its SHA-256 hash.<br>
      Reading happens on this PC (PDF text layer + local Arabic/English OCR). The document is not sent to any AI service.</span></label>`;
  if (missingLibs.length) html += `<div class="banner banner-warn" style="margin-top:10px">Not loaded: ${esc(missingLibs.join(', '))} (was the internet unavailable when the page opened?). Files can still be uploaded and kept; reload the page to extract.</div>`;
  if (S.src.status === 'loading' && !S.src.list.length) html += '<div class="state">Loading documents…</div>';
  if (S.src.status === 'error') html += `<div class="banner banner-bad" style="margin-top:10px">${esc(S.src.error)} <button class="link" data-act="src-reload">Retry</button></div>`;
  for (const s of S.src.list) {
    const exs = S.src.extractions[s.id] || [];
    const job = S.job && S.job.sourceId === s.id ? S.job : null;
    const canRun = !S.job && EXTRACT_OK && (s.mime === 'application/pdf' ? PDF_OK : OCR_OK);
    html += `<div class="src-row"><div class="n" dir="auto">${esc(s.name)}</div>
      <div class="m">${esc(UPLOAD_TYPES[s.mime] || s.mime)} · ${esc(fmtSize(s.size))} · SHA-256 ${esc(s.sha256.slice(0, 16))}… · uploaded ${esc(fmtTime(s.createdAt))}</div>
      <div class="m">${exs.length ? exs.map((x, i) => `Extraction ${i + 1} · ${esc(fmtTime(x.createdAt))} · ${esc(x.summary.rows)} item row(s), ${esc(x.summary.otherRows)} other · ${esc((x.summary.methods || []).join(' + '))}
          ${x.summary.complete === false ? `· <b style="color:var(--bad)">INCOMPLETE: ${esc(x.summary.pages)} of ${esc(x.summary.totalPages)} pages read</b>` : x.summary.totalPages ? `· ${esc(x.summary.totalPages)} page(s) read` : ''}
          ${/every page/.test(x.engine || '') ? '· OCR on every page' : ''}
          · <button class="link" data-act="rv-open" data-id="${esc(x.id)}" data-src="${esc(s.id)}">${S.rv && S.rv.id === x.id ? 'open below' : 'review'}</button>`).join('<br>') : 'Not extracted yet.'}</div>
      ${job ? `<div class="small" style="margin-top:6px" id="jobStage">${esc(job.stage)}</div><div class="progress"><div id="jobBar" style="width:${Math.round((job.progress || 0) * 100)}%"></div></div>` : ''}
      <div class="src-acts">
        ${job ? '<button class="btn btn-sm btn-ghost" data-act="job-cancel">Cancel extraction</button>'
              : `<button class="btn btn-sm" data-act="src-extract" data-id="${esc(s.id)}" ${canRun ? '' : 'disabled'}>${exs.length ? 'Re-run extraction' : 'Extract'}</button>
                 ${s.mime === 'application/pdf' ? `<button class="btn btn-sm btn-ghost" data-act="src-extract-ocr" data-id="${esc(s.id)}" ${canRun && OCR_OK ? '' : 'disabled'}
                    title="Also OCR every page — use when part of a page (e.g. a table) is an image the automatic check missed">Re-run with OCR on every page</button>` : ''}`}
        <a class="btn btn-sm btn-ghost" style="text-decoration:none" href="/api/po/sources/${encodeURIComponent(s.id)}/file" download>Download original</a>
      </div></div>`;
  }
  if (!S.src.list.length && S.src.status === 'ready') html += '<div class="small muted" style="margin-top:8px">No supplier document uploaded for this draft. Items can still be entered manually.</div>';
  html += '<div id="reviewArea"></div>';
  area.innerHTML = html;
  renderReview();
}
function setJob(stage, progress) {
  if (!S.job) return;
  if (stage != null) S.job.stage = stage;
  if (progress != null) S.job.progress = progress;
  const st = $('jobStage'), bar = $('jobBar');
  if (st && bar) { st.textContent = S.job.stage; bar.style.width = Math.round((S.job.progress || 0) * 100) + '%'; }
  else renderSources();
}

async function uploadFile(file) {
  if (!file || !S.draft) return;
  const byExt = /\.pdf$/i.test(file.name) ? 'application/pdf' : /\.png$/i.test(file.name) ? 'image/png' : /\.jpe?g$/i.test(file.name) ? 'image/jpeg' : '';
  const type = UPLOAD_TYPES[file.type] ? file.type : byExt;
  if (!UPLOAD_TYPES[type]) return showBanner('bad', 'Only PDF, PNG or JPEG files can be uploaded. Nothing was stored.');
  if (!file.size) return showBanner('bad', 'The file is empty. Nothing was stored.');
  if (file.size > UPLOAD_MAX) return showBanner('bad', `The file is ${esc(fmtSize(file.size))}; the limit is 25 MB. Nothing was stored.`);
  toast('Uploading the original…');
  let r;
  try {
    r = await fetch('/api/po/sources?draftId=' + encodeURIComponent(S.draft.id) + '&name=' + encodeURIComponent(file.name),
                    { method: 'POST', headers: { 'Content-Type': type }, body: file });
  } catch (e) { return showBanner('bad', 'The local Vista server is not reachable. Nothing was stored.'); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status !== 201 && r.status !== 200) return showBanner('bad', esc(j.error || ('Upload failed (HTTP ' + r.status + '). Nothing was stored.')));
  toast(r.status === 200 ? 'This exact file is already stored for this draft' : 'Original stored unchanged');
  await loadSources(true);
  if (r.status === 201) { const s = S.src.list.find(x => x.id === j.data.id); if (s && !S.job) runExtraction(s); }
}

async function sourceBytes(src) {
  const c = srcCache.get(src.id);
  if (c && c.bytes) return c.bytes;
  const r = await fetch('/api/po/sources/' + encodeURIComponent(src.id) + '/file', { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 500 ? 'the stored original failed its integrity check and was not served' : 'the stored original could not be read (HTTP ' + r.status + ')');
  const b = await r.arrayBuffer();
  const hex = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', b)), x => x.toString(16).padStart(2, '0')).join('');
  if (hex !== src.sha256) throw new Error('the downloaded original does not match its recorded SHA-256');
  srcCache.set(src.id, Object.assign(c || {}, { bytes: b }));
  return b;
}
async function sourceDoc(src) {
  const c = srcCache.get(src.id) || {};
  if (src.mime === 'application/pdf') {
    if (!c.pdf) {
      const b = await sourceBytes(src);
      c.pdf = await pdfjsLib.getDocument({ data: new Uint8Array(b.slice(0)), isEvalSupported: false }).promise;
      srcCache.set(src.id, Object.assign(srcCache.get(src.id) || {}, { pdf: c.pdf }));
    }
    return { pdf: c.pdf, pages: c.pdf.numPages };
  }
  if (!c.img) {
    const b = await sourceBytes(src);
    c.img = await createImageBitmap(new Blob([b], { type: src.mime }));
    srcCache.set(src.id, Object.assign(srcCache.get(src.id) || {}, { img: c.img }));
  }
  return { img: c.img, pages: 1 };
}
async function pdfTextItems(page) {
  const vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  const items = [];
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
    const h = Math.hypot(tx[2], tx[3]) || 10;
    items.push({ str: it.str, x: tx[4], y: tx[5] - h, w: Math.max(2, it.width * vp.scale), h });
  }
  return { vp, items };
}
let ocrStarting = null;
function withTimeout(p, ms, message) {
  let t;
  return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(new Error(message)), ms); })]).finally(() => clearTimeout(t));
}
async function getOcrWorker() {
  if (ocrWorker) return ocrWorker;
  if (!ocrStarting) {
    ocrStarting = (async () => {
      const w = await Tesseract.createWorker(['eng', 'ara'], 1, {
        logger: m => { if (S.job && m.status === 'recognizing text') setJob(null, S.job.base + m.progress * S.job.span); },
      });
      // Automatic page layout (PSM 3): the library default reads a page as one
      // block and loses bordered tables (verified on the scanned fixture).
      await w.setParameters({ tessedit_pageseg_mode: '3', preserve_interword_spaces: '1' });
      ocrWorker = w;
      return w;
    })().finally(() => { ocrStarting = null; });
  }
  return withTimeout(ocrStarting, 90000, 'the OCR engine did not start within 90 seconds (no internet to load its language models?)');
}
// Two OCR passes, merged: automatic layout (PSM 3) and single-column layout
// (PSM 4). Measured on the fixtures, each pass drops short tokens in narrow
// bordered columns that the other keeps ("#" vs "Qty"). A word from the second
// pass is added only where the first found nothing, and only at ≥ 50% confidence.
async function ocrCanvas(canvas, scale) {
  const worker = await getOcrWorker();
  const toWords = data => (data.words || []).filter(w => w.text && w.text.trim()).map(w => ({

// Embedded images on a page (in page units), from the operator list.
async function pageImageBoxes(page, vp) {
  const boxes = [];

    const ops = await page.getOperatorList();
    const OPS = pdfjsLib.OPS, stack = [];

        const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y]) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]);
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const x = Math.max(0, Math.min(...xs)), y = Math.max(0, Math.min(...ys));
        boxes.push({ x, y, w: Math.min(vp.width, Math.max(...xs)) - x, h: Math.min(vp.height, Math.max(...ys)) - y });

}
// Images large enough to hold a table and not already covered by text-layer words.
function imageRegionsNeedingOcr(boxes, items, vp) {
  const area = vp.width * vp.height;
  return boxes.filter(b => b.w * b.h >= area * 0.06 && b.w > 60 && b.h > 25).filter(b => {
    const inside = items.filter(i => i.x + i.w / 2 >= b.x && i.x + i.w / 2 <= b.x + b.w && i.y + i.h / 2 >= b.y && i.y + i.h / 2 <= b.y + b.h);

async function ocrPageRegions(page, regions) {
  const cvp = page.getViewport({ scale: OCR_SCALE });
  const full = document.createElement('canvas');
  full.width = Math.ceil(cvp.width); full.height = Math.ceil(cvp.height);
  // intent 'print': no requestAnimationFrame pacing, so rendering also completes
  // while the tab is in the background (display intent stalls in hidden tabs).
  await page.render({ canvasContext: full.getContext('2d'), viewport: cvp, intent: 'print' }).promise;

    const sw = Math.min(full.width - sx, Math.ceil((r.w + 2 * pad) * OCR_SCALE)), sh = Math.min(full.height - sy, Math.ceil((r.h + 2 * pad) * OCR_SCALE));

    crop.getContext('2d').drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);
    for (const w of await ocrCanvas(crop, OCR_SCALE)) words.push(Object.assign(w, { x: w.x + sx / OCR_SCALE, y: w.y + sy / OCR_SCALE }));

async function runExtraction(src, opts) {
  if (S.job) return;
  opts = opts || {};
  const job = S.job = { sourceId: src.id, stage: 'Opening the stored original…', progress: 0, cancel: false, base: 0, span: 1 };
  renderSources();
  const pages = [], extraWarn = [];
  let totalPages = 1;
  const alive = () => { if (S.job !== job || job.cancel) throw new Error('cancelled'); };
  try {
    const doc = await sourceDoc(src);
    alive();
    if (doc.pdf) {
      const total = doc.pdf.numPages, n = Math.min(total, MAX_PAGES);
      totalPages = total;
      for (let p = 1; p <= n; p++) {
        alive();
        S.job.base = (p - 1) / n; S.job.span = 1 / n;
        setJob(`Reading page ${p} of ${n}${total > n ? ` (document has ${total} pages; only ${n} will be read)` : ''} — text layer…`, S.job.base);
        const page = await doc.pdf.getPage(p);
        const { vp, items } = await pdfTextItems(page);
        items.forEach(i => { i.src = 'text'; });
        const images = await pageImageBoxes(page, vp);     // picture placements: item photos + image-only content
        const chars = items.reduce((s, i) => s + i.str.replace(/\s/g, '').length, 0);
        const sparse = chars < SPARSE_TEXT;
        // Pages with a text layer can still carry an image-only table: OCR those image regions
        // (or every page when explicitly requested) and add only non-overlapping OCR words.
        const regions = sparse || opts.ocrAll ? null : imageRegionsNeedingOcr(images, items, vp);
        const wantOcr = sparse || opts.ocrAll || (regions && regions.length);
        if (!wantOcr) { pages.push({ page: p, width: vp.width, height: vp.height, method: 'text', items, images }); continue; }
        if (!OCR_OK) {
          pages.push({ page: p, width: vp.width, height: vp.height, method: sparse ? 'none' : 'text', items, images });
          extraWarn.push({ code: 'ocr_unavailable', page: p, message: sparse ? `Page ${p} has no text layer and OCR is not loaded — it was not read.`
            : `Page ${p} contains image content that may hold text, but OCR is not loaded — only its text layer was read.` });
          continue;
        }
        setJob(sparse ? `Page ${p} of ${n} has no text layer — local OCR (Arabic + English)…`
          : opts.ocrAll ? `Page ${p} of ${n}: OCR on the whole page (requested)…` : `Page ${p} of ${n}: text layer + OCR of ${regions.length} image region(s)…`, S.job.base);
        const words = mergeOcrWords(items, (await ocrPageRegions(page, sparse || opts.ocrAll ? null : regions)).map(w => Object.assign(w, { src: 'ocr' })));
        alive();
        const merged = items.concat(words);
        pages.push({ page: p, width: vp.width, height: vp.height, items: merged, images,
                     method: !merged.length ? 'none' : !items.length ? 'ocr' : words.length ? 'mixed' : 'text',
                     ocrRegions: regions ? regions.map(r => ({ x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) })) : 'page' });
        if (words.length && items.length) extraWarn.push({ code: 'mixed_page', page: p,
          message: `Page ${p}: text layer plus ${words.length} OCR word(s) from image content — OCR values are marked as such.` });
      }
    } else {
      if (!OCR_OK) throw new Error('OCR is not loaded, so an image cannot be read');
      setJob('Local OCR on the image (Arabic + English)…', 0);
      const img = doc.img;
      // Native resolution: upscaling a raster made Tesseract lose bordered tables
      // (measured on the scanned fixture: ×1 read all rows, ×1.5 and ×2 read none).
      const up = Math.min(1, 3500 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * up); canvas.height = Math.round(img.height * up);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const words = (await ocrCanvas(canvas, up)).map(w => Object.assign(w, { src: 'ocr' }));
      alive();
      pages.push({ page: 1, width: img.width, height: img.height, method: words.length ? 'ocr' : 'none', items: words });
    }
    alive();
    setJob('Structuring the text into fields and rows…', 1);
    const result = POExtract.extract({ pages, document: { totalPages, fileName: src.name } });
    result.warnings = result.warnings.concat(extraWarn);
    result.options = { ocrAll: !!opts.ocrAll };
    result.pages.forEach(pm => { const pg = pages.find(x => x.page === pm.page); if (pg && pg.ocrRegions) pm.ocrRegions = pg.ocrRegions; });
    const { status, json } = await api('POST', '/api/po/extractions', { sourceId: src.id, engine: ENGINE + (opts.ocrAll ? ' · OCR on every page' : ''), result });
    if (status !== 201) throw new Error(json.error || 'the extraction could not be stored');
    let photoNote = '';
    if ((result.photos || []).some(x => x.status === 'candidate')) {
      setJob('Keeping the item pictures as photos (the original is not changed)…', 1);
      try { const n = await storeExtractionPhotos(src, result, json.data.id); photoNote = n ? ` · ${n} item photo(s) stored` : ''; }
      catch (err) { showBanner('warn', 'The extraction was stored, but its item photos could not be stored: ' + esc(err && err.message || err) + '. Re-run to try again.'); }
    }
    S.job = null;
    await loadSources(true);
    toast('Extraction stored' + photoNote + ' — review it before applying anything');
    openReview(json.data.id, src.id);
  } catch (err) {
    if (S.job !== job || job.cancel) return;          // cancelled: the cancel action already reported it
    S.job = null;
    renderSources();
    showBanner('bad', 'Extraction failed: ' + esc(err && err.message || err) + '. The original document is kept unchanged — retry, or enter the items manually.');
  }
}
async function cancelJob() {
  if (!S.job) return;
  S.job.cancel = true;
  S.job = null;                                        // abandoned at once; late results are ignored
  renderSources();
  showBanner('info', 'Extraction cancelled. The original document is kept; you can run it again.');
  if (ocrWorker) { const w = ocrWorker; ocrWorker = null; try { await w.terminate(); } catch (e) {} }

function draftSig(desc, qty, price) { return [POExtract.normText(desc || ''), qty || '', price || ''].join('|'); }

  const bySource = new Set(S.draft.items.filter(i => i.sourceRef).map(i => i.sourceRef.extractionId + ':' + i.sourceRef.rowId));
  for (const r of ex.rows) if (POExtract.alreadyImportedReason(ex, r, S.draft.items, exId, srcId)) out.add(r.id);

  return new Set(ex.rows.filter(r => !inDraft.has(r.id) && r.fields.description.value &&
    sigs.has(draftSig(r.fields.description.value, r.fields.qty.value || '', r.fields.unitPrice.value || ''))).map(r => r.id));

async function openReview(exId, srcId, highlightRowId) {

  const { status, json } = await api('GET', '/api/po/extractions/' + encodeURIComponent(exId));
  if (status !== 200 || !json.ok) return showBanner('bad', esc(json.error || 'Could not open the extraction.'));

    !(ex.header[k].flags || []).some(f => /ambiguous|conflicting|heuristic|multiple|low_confidence/.test(f)) &&
    ex.header[k].method !== 'ocr' && ex.header[k].method !== 'mixed');

  const hasTotals = tk.length > 0 && !tk.some(k => ex.totals[k].method === 'ocr' || ex.totals[k].method === 'mixed');
  S.rv = { id: exId, ex, src, createdAt: json.data.createdAt, tab: 'items', page: 1, zoom: 1, scale: 1, highlight: null, confirm: null,
    selRows: new Set(ex.rows.filter(r => r.selectedByDefault && !inDraft.has(r.id)).map(r => r.id)), selOther: new Set(),
    headerKeys: new Set(cleanHeader.concat(hasTotals ? ['totals'] : [])), applyCurrency: false, applyTaxBasis: false, inDraft,
    similar: similarToDraft(ex, inDraft), ackIncomplete: false };

function regionFor(id) {

  if (r) return { page: r.page, region: r.region };
  const [kind, key, sub] = String(id).split(':');
  if (kind === 'h' && ex.header[key]) return { page: ex.header[key].page, region: ex.header[key].region };
  if (kind === 't' && ex.totals[key]) return { page: ex.totals[key].page, region: ex.totals[key].region };
